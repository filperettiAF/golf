      '<div style="display:flex; justify-content:space-between; align-items:baseline">'+
      '<span style="font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--grigio)">'+esc(s.nome)+'</span>'+
      '<span style="font-size:11px; font-weight:700; font-variant-numeric:tabular-nums; color:'+(ult>=0?'var(--verde-testo)':'var(--rosso)')+'">'+sgn(ult,1)+'</span></div>'+
      '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" style="overflow:visible; display:block; margin-top:4px">'+
      '<line x1="0" y1="'+y(0).toFixed(1)+'" x2="'+W+'" y2="'+y(0).toFixed(1)+'" stroke="var(--rif)" stroke-width="1"></line>'+
      '<polyline points="'+s.vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')+
      '" fill="none" stroke="'+(ult>=0?'var(--verde-testo)':'var(--rosso)')+'" stroke-width="1.4" stroke-linejoin="round"></polyline>'+
      '</svg></div>';
  }).join('')+'</div>';
}

/* ── ellisse di dispersione del drive ─────────────────────────────────────
   RICOSTRUZIONE dichiarata: l'app registra lato e settore, non coordinate.
   Gli assi sono lo scarto tipo longitudinale e laterale misurati.           */
function grafEllisse(sdLungo, sdLato, rifLungo, rifLato, nota){
  const sx=v=>Math.max(6, Math.min(130, v*3.2));
  const sy=v=>Math.max(4, Math.min(70, v*3.2));
  const rx=sx(sdLato), ry=sy(sdLungo);
  return '<svg viewBox="0 0 300 180" width="100%" height="180" style="display:block; overflow:visible" role="img" aria-label="dispersione del drive">'+
    '<line x1="150" y1="6" x2="150" y2="174" stroke="var(--asse)" stroke-width="1"></line>'+
    '<line x1="14" y1="150" x2="286" y2="150" stroke="var(--asse)" stroke-width="1"></line>'+
    '<ellipse cx="150" cy="150" rx="'+sx(rifLato).toFixed(1)+'" ry="'+sy(rifLungo).toFixed(1)+
      '" fill="var(--rif)" opacity="0.3" stroke="var(--tenue)" stroke-width="1" stroke-dasharray="3 3"></ellipse>'+
    '<ellipse cx="150" cy="150" rx="'+rx.toFixed(1)+'" ry="'+ry.toFixed(1)+
      '" fill="var(--dv-red)" opacity="0.16" stroke="var(--dv-red)" stroke-width="1.4"></ellipse>'+
    '<ellipse cx="150" cy="150" rx="'+Math.min(140,rx*1.12).toFixed(1)+'" ry="'+Math.min(76,ry*1.19).toFixed(1)+
      '" fill="none" stroke="var(--dv-red)" stroke-width="1" stroke-dasharray="2 4"></ellipse>'+
    '<circle cx="150" cy="150" r="3" fill="var(--testo)"></circle></svg>'+
    '<div class="leg2"><span class="it"><span class="sw" style="background:var(--dv-red)"></span>la tua dispersione</span>'+
    '<span class="it"><span class="sw" style="background:var(--rif)"></span>riferimento</span></div>'+
    '<div class="nt">'+esc(nota||'')+'</div>';
}

/* ── dot plot: scala dei bastoni, ordine di sacca ─────────────────────────*/
function grafDot(righe, min, max){
  const pos=v=>((v-min)/((max-min)||1)*100);
  return righe.map(r=>'<div class="dotrow"><div class="l">'+esc(r.nome)+'</div>'+
    '<div class="dottrack">'+
    (r.p10!==null && r.p90!==null?'<div style="position:absolute; top:4.5px; height:3px; border-radius:2px; background:var(--dv-track); left:'+
      pos(r.p10).toFixed(1)+'%; width:'+Math.max(1,(pos(r.p90)-pos(r.p10))).toFixed(1)+'%"></div>':'')+
    '<div style="position:absolute; top:2px; width:8px; height:8px; border-radius:50%; background:var(--dv-neutral); left:'+
      pos(r.med).toFixed(1)+'%; margin-left:-4px"></div></div>'+
    '<div class="n">'+Math.round(r.med)+' m</div></div>').join('')+
    '<div style="display:flex; justify-content:space-between; font-size:9.5px; color:var(--tenue); margin-top:2px">'+
    '<span>'+min+' m</span><span>'+max+' m</span></div>';
}

/* ── curva di Pareto dei colpi persi ─────────────────────────────────────*/
function grafPareto(persi){
  const d=persi.slice().sort((a,b)=>a-b).map(Math.abs);
  const tot=d.reduce((a,b)=>a+b,0)||1;
  const W=320,H=100,PT=6;
  let cum=0; const pts=[];
  d.forEach((v,i)=>{ cum+=v; pts.push([(i+1)/d.length*W, PT+(1-cum/tot)*(H-PT*2)]); });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" style="display:block; overflow:visible" role="img" aria-label="curva di Pareto dei colpi persi">'+
    '<line x1="0" y1="'+(H-PT)+'" x2="'+W+'" y2="'+(H-PT)+'" stroke="var(--asse)" stroke-width="1"></line>'+
    '<polyline points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+
    '" fill="none" stroke="var(--rosso)" stroke-width="1.8" stroke-linejoin="round"></polyline></svg>'+
    '<div style="display:flex; justify-content:space-between; font-size:9.5px; color:var(--tenue); margin-top:4px">'+
    '<span>il colpo peggiore</span><span>cumulata dei colpi persi</span><span>tutti</span></div>';
}

/* ── bersaglio a cerchi concentrici ──────────────────────────────────────*/
function grafBersaglio(fasce){
  if(!fasce.length) return '';
  const max=Math.max.apply(null,fasce.map(f=>f.v))||1;
  return '<div style="display:flex; justify-content:center">'+
    '<svg viewBox="0 0 200 176" width="100%" height="176" style="display:block; max-width:280px" role="img" aria-label="prossimita per fascia">'+
    fasce.map((f,i)=>{
      const r=10+f.v/max*72;
      return '<circle cx="100" cy="88" r="'+r.toFixed(1)+'" fill="none" stroke="'+
        (i===0?'var(--verde-testo)':(i===fasce.length-1?'var(--rosso)':'var(--dv-neutral)'))+
        '" stroke-width="1.4" stroke-dasharray="'+(i===0?'none':'3 3')+'"></circle>';
    }).join('')+
    fasce.map(f=>{
      const r=10+f.v/max*72;
      return '<text x="100" y="'+(88-r-3).toFixed(1)+'" text-anchor="middle" font-size="8" fill="var(--grigio)">'+esc(f.nome)+'</text>';
    }).join('')+
    '<circle cx="100" cy="88" r="3" fill="var(--testo)"></circle></svg></div>';
}

/* ── scatter partenza / residuo, con la retta della prossimita' normalizzata */
function grafScatter(punti, frl){
  const xMax=200, yMax=20;
  return '<svg viewBox="0 0 300 150" width="100%" height="150" style="display:block; overflow:visible" role="img" aria-label="partenza e residuo">'+
    '<line x1="0" y1="140" x2="300" y2="140" stroke="var(--asse)" stroke-width="1"></line>'+
    '<line x1="0" y1="0" x2="0" y2="140" stroke="var(--asse)" stroke-width="1"></line>'+
    '<line x1="0" y1="140" x2="300" y2="'+(140-(xMax*frl/100)/yMax*140).toFixed(1)+
      '" stroke="var(--tenue)" stroke-width="1" stroke-dasharray="3 3"></line>'+
    punti.map(p=>'<circle cx="'+Math.min(300,p.x/xMax*300).toFixed(1)+'" cy="'+
      Math.max(0,140-Math.min(yMax,p.y)/yMax*140).toFixed(1)+'" r="3.2" fill="'+
      ((p.x>0 && p.y/p.x<=frl/100)?'var(--verde-testo)':'var(--rosso)')+'" opacity="0.75"></circle>').join('')+
    '</svg><div style="display:flex; justify-content:space-between; font-size:9.5px; color:var(--tenue); margin-top:4px">'+
    '<span>0 m</span><span>distanza di partenza</span><span>'+xMax+' m</span></div>';
}

/* ── barre bullet: la tua barra, il Tour come barretta grigia ─────────────*/
function grafBullet(righe){
  return righe.map(r=>{
    const buono = r.suMeglio ? (r.mio>=r.rif) : (r.mio<=r.rif);
    const col = buono?'var(--verde-testo)':'var(--rosso)';
    return '<div class="bulrow"><div style="display:flex; justify-content:space-between; align-items:baseline">'+
      '<span style="font-size:12px">'+esc(r.nome)+'</span>'+
      '<span style="font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; color:'+col+'">'+
      r.testoMio+' <span style="color:var(--grigio); font-weight:400">\u00b7 Tour '+r.testoRif+'</span></span></div>'+
      '<div class="bultrack">'+
      '<div style="position:absolute; top:0; bottom:0; left:0; width:'+Math.min(100,100*r.mio/r.max).toFixed(1)+'%; border-radius:4px; background:'+col+'"></div>'+
      '<div style="position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--grigio); left:'+Math.min(100,100*r.rif/r.max).toFixed(1)+'%"></div>'+
      '</div></div>';
  }).join('')+'<div class="leg2"><span class="it">la barretta verticale e\u2019 il riferimento Tour</span></div>';
}

/* ── colonne per le 18 buche ─────────────────────────────────────────────*/
function grafBuche(vals, pars){
  const max=Math.max.apply(null,vals.map(Math.abs).concat([0.5]));
  return '<div class="holecols">'+vals.map((v,i)=>{
    const h=Math.abs(v)/max*44;
    const par=pars[i]||4;
    return '<div class="holecol">'+
      '<div style="position:absolute; '+(v>=0?'bottom:50%':'top:50%')+'; left:15%; width:70%; height:'+h.toFixed(1)+
      'px; border-radius:2px; background:'+(v>=0?'var(--rosso)':'var(--verde-testo)')+'"></div>'+
      '<div style="position:absolute; bottom:-2px; left:0; right:0; text-align:center; font-size:8px; font-variant-numeric:tabular-nums; color:'+
      (par===3?'var(--par3)':(par===5?'var(--par5)':'var(--tenue)'))+'">'+(i+1)+'</div></div>';
  }).join('')+'</div>'+
  '<div class="leg2"><span class="it"><span class="sw" style="background:var(--par3)"></span>par 3</span>'+
  '<span class="it"><span class="sw" style="background:var(--tenue)"></span>par 4</span>'+
  '<span class="it"><span class="sw" style="background:var(--par5)"></span>par 5</span></div>';
}

/* ── calendario: un riquadro per mese ────────────────────────────────────*/
function grafCalendario(mesi){
  const vals=mesi.map(m=>m.punteggio);
  const min=Math.min.apply(null,vals), max=Math.max.apply(null,vals), span=(max-min)||1;
  return '<div class="calrow">'+mesi.map(m=>{
    const k=1-(m.punteggio-min)/span;
    return '<div class="calcell" style="background:rgba(78,207,146,'+(0.08+0.44*k).toFixed(2)+'); color:'+
      (k>0.6?'var(--su-colore)':'var(--testo)')+'">'+
      '<div class="m">'+esc(m.nome)+'</div><div class="v">'+m.punteggio.toFixed(1).replace('.',',')+'</div>'+
      '<div class="s">'+m.giri+(m.giri===1?' giro':' giri')+'</div></div>';
  }).join('')+'</div>';
}

/* ── barre di copertura ─────────────────────────────────────────────────*/
function grafCopertura(righe){
  return righe.map(r=>{
    const col = r.pct>=80?'var(--verde-testo)':(r.pct>=60?'var(--dv-neutral)':'var(--rosso)');
    return '<div class="covrow"><div style="display:flex; justify-content:space-between; align-items:baseline">'+
      '<span style="font-size:12.5px">'+esc(r.nome)+'</span>'+
      '<span style="font-size:12px; font-weight:700; font-variant-numeric:tabular-nums">'+Math.round(r.pct)+'%</span></div>'+
      (r.nota?'<div style="font-size:11px; color:var(--grigio); margin-top:2px">'+esc(r.nota)+'</div>':'')+
      '<div class="covtrack"><div style="height:100%; width:'+Math.min(100,r.pct).toFixed(0)+'%; border-radius:3px; background:'+col+'"></div></div>'+
      '</div>';
  }).join('');
}

/* ── griglia dei nove settori in lettura ────────────────────────────────
   Scala fissa dichiarata: casella piena = 40% dei colpi.                  */
function grafSettori(conte, tot){
  if(!tot) return '';
  return '<div class="setgrid">'+ESITI.map(e=>{
    const v=100*(conte[e.k]||0)/tot;
    const k=Math.min(1,v/40);
    const scuro = k>0.5;
    return '<div class="setcell" style="background:rgba(78,207,146,'+(0.06+0.5*k).toFixed(2)+'); color:'+
      (scuro?'var(--su-colore)':'var(--testo)')+'">'+
      '<div class="p">'+v.toFixed(0)+'%</div><span class="l">'+e.n.replace('<br>',' ')+'</span></div>';
  }).join('')+'</div>'+
  '<div style="font-size:9.5px; color:var(--tenue); margin-top:6px">Scala fissa: casella piena = 40% dei colpi, '+
  'cosi\u2019 due periodi si confrontano a colpo d\u2019occhio.</div>';
}

/* ── scorecard a due file da nove ───────────────────────────────────────*/
function grafScorecard(buche){
  const col=d=>d<=-2?'var(--eagle)':(d===-1?'var(--verde-testo)':(d===0?'var(--cella-par)':'var(--rosso)'));
  const fila=arr=>{
    if(!arr.length) return '';
    return '<div class="scrow">'+arr.map(h=>
      '<div class="sccell" style="background:'+col(h.diff)+'; color:'+(h.diff===0?'var(--testo)':'var(--su-colore)')+'">'+
      '<span class="b">'+h.buca+'</span><span class="c">'+h.score+'</span></div>').join('')+
      '<div class="sctot"><span class="b">'+(arr[0].buca===1?'out':'in')+'</span>'+
      '<span class="c">'+arr.reduce((s,h)=>s+h.score,0)+'</span></div></div>';
  };
  return fila(buche.slice(0,9))+fila(buche.slice(9,18))+
    '<div class="leg2">'+
    '<span class="it"><span class="sw" style="background:var(--eagle)"></span>eagle</span>'+
    '<span class="it"><span class="sw" style="background:var(--verde-testo)"></span>birdie</span>'+
    '<span class="it"><span class="sw" style="background:var(--cella-par)"></span>par</span>'+
    '<span class="it"><span class="sw" style="background:var(--rosso)"></span>bogey o peggio</span></div>';
}

/* ── pannello: titolo, verdetto, nota, tabella richiudibile, grafico ─────
   Regola del handoff: dove c'e' sia tabella sia grafico, la tabella sta
   sopra CHIUSA dietro il toggle, il grafico sotto sempre visibile.         */
let _pnlSeq=0;
function pannello(o){
  const id='tb'+(++_pnlSeq);
  let h='<div class="pnl"><div class="t">'+esc(o.titolo)+'</div>';
  if(o.verdetto) h+='<div class="vd">'+o.verdetto+'</div>';
  if(o.nota) h+='<div class="nt">'+o.nota+'</div>';
  if(o.tabella) h+='<button class="tgl" data-tgl="'+id+'">Mostra tabella</button>'+
    '<div data-tblbox="'+id+'" style="display:none">'+o.tabella+'</div>';
  if(o.grafico) h+='<div style="margin-top:14px">'+o.grafico+'</div>';
  if(o.chiusura) h+='<div class="ch">'+o.chiusura+'</div>';
  return h+'</div>';
}

/* ==========================================================
   GRAFICI A LINEA (SVG inline, nessuna libreria)
   ========================================================== */
function svgLinea(vals, o){
  o=o||{};
  const W=340, H=o.h||86, PL=8, PR=8, PT=16, PB=o.xlab===false?8:17;
  const n=vals.length; if(!n) return '';
  const ys=vals.map(v=>v.y);
  let min=(o.min!==undefined)?o.min:Math.min(...ys);
  let max=(o.max!==undefined)?o.max:Math.max(...ys);
  if(o.banda){ min=Math.min(min, ...vals.map(v=>v.y-(v.se||0)*2)); max=Math.max(max, ...vals.map(v=>v.y+(v.se||0)*2)); }
  if(o.zero){ min=Math.min(min,0); max=Math.max(max,0); }
  if(Math.abs(max-min)<1e-9){ max+=1; min-=1; }
  const pad=(max-min)*0.15; min-=pad; max+=pad;
  const X=i=> n===1 ? (PL+(W-PL-PR)/2) : PL + i*(W-PL-PR)/(n-1);
  const Y=v=> PT + (max-v)/(max-min)*(H-PT-PB);
  const col=o.colore||'var(--dv-blue)';
  let sv='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'andamento')+'">';
  if(o.banda && n>1){
    const su=vals.map((v,i)=>X(i).toFixed(1)+','+Y(v.y+(v.se||0)*2).toFixed(1)).join(' ');
    const giu=vals.map((v,i)=>X(i).toFixed(1)+','+Y(v.y-(v.se||0)*2).toFixed(1)).reverse().join(' ');
    sv+='<polygon class="band" points="'+su+' '+giu+'" style="fill:'+col+'"/>';
  }
  if(o.zero && min<0 && max>0) sv+='<line class="zero" x1="'+PL+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(0).toFixed(1)+'"/>';
  sv+='<polyline class="lin" style="stroke:'+col+'" points="'+vals.map((v,i)=>X(i).toFixed(1)+','+Y(v.y).toFixed(1)).join(' ')+'"/>';
  vals.forEach((v,i)=>{ sv+='<circle class="pt" cx="'+X(i).toFixed(1)+'" cy="'+Y(v.y).toFixed(1)+'" r="'+(o.r||3.2)+'" style="fill:'+col+'"/>'; });
  const f=o.fmt||(v=>v.toFixed(1));
  const posY=i=>{
    if(n===1) return Math.max(10, Y(vals[i].y)-7);
    const nb = i===0 ? 1 : n-2;
    const sale = vals[nb].y > vals[i].y;
    const y = sale ? Y(vals[i].y)+11 : Y(vals[i].y)-7;
    return Math.min(H-PB-1, Math.max(10, y));
  };
  [[0,'start'],[n-1,'end']].forEach(pair=>{
    const i=pair[0]; let anc=pair[1];
    if(n===1) anc='middle';
    sv+='<text class="val" x="'+X(i).toFixed(1)+'" y="'+posY(i).toFixed(1)+'" text-anchor="'+anc+'">'+f(vals[i].y)+'</text>';
  });
  if(o.xlab!==false && n>1){
    sv+='<text x="'+PL+'" y="'+(H-3)+'" text-anchor="start">'+esc(vals[0].x)+'</text>';
    sv+='<text x="'+(W-PR)+'" y="'+(H-3)+'" text-anchor="end">'+esc(vals[n-1].x)+'</text>';
  }
  return sv+'</svg>';
}
function svgBarreDiv(vals, o){
  o=o||{};
  const W=340, H=o.h||128, PL=4, PR=4, PT=15, PB=19;
  const n=vals.length; if(!n) return '';
  const ys=vals.map(v=>v.y);
  let min=Math.min(0,...ys), max=Math.max(0,...ys);
  if(o.banda){ min=Math.min(min,...vals.map(v=>v.y-(v.se||0)*2)); max=Math.max(max,...vals.map(v=>v.y+(v.se||0)*2)); }
  const rng=(max-min)||1;
  const Y=v=> PT + (max-v)/rng*(H-PT-PB);
  const y0=Y(0);
  const passo=(W-PL-PR)/n, bw=Math.max(6, passo-8);
  const f=o.fmt||(v=>sgn(v,1));
  let sv='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'confronto')+'">';
  sv+='<line class="zero" x1="'+PL+'" y1="'+y0.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y0.toFixed(1)+'"/>';
  vals.forEach((v,i)=>{
    const cx=PL+passo*i+passo/2, yv=Y(v.y);
    const alto=Math.max(1.5, Math.abs(yv-y0));
    const col = v.y>0 ? (o.colPos||'var(--dv-red)') : v.y<0 ? (o.colNeg||'var(--dv-blue)') : 'var(--dv-neutral)';
    { // angoli arrotondati solo dal lato del dato, squadrati alla linea dello zero
      const x1=(cx-bw/2), yTop=(v.y>=0?yv:y0), r3=Math.min(3, alto/2, bw/2);
      if(v.y>=0)
        sv+='<path d="M '+x1.toFixed(1)+' '+(yTop+alto).toFixed(1)+' V '+(yTop+r3).toFixed(1)+' Q '+x1.toFixed(1)+' '+yTop.toFixed(1)+' '+(x1+r3).toFixed(1)+' '+yTop.toFixed(1)+' H '+(x1+bw-r3).toFixed(1)+' Q '+(x1+bw).toFixed(1)+' '+yTop.toFixed(1)+' '+(x1+bw).toFixed(1)+' '+(yTop+r3).toFixed(1)+' V '+(yTop+alto).toFixed(1)+' Z" style="fill:'+col+'"/>';
      else
        sv+='<path d="M '+x1.toFixed(1)+' '+yTop.toFixed(1)+' V '+(yTop+alto-r3).toFixed(1)+' Q '+x1.toFixed(1)+' '+(yTop+alto).toFixed(1)+' '+(x1+r3).toFixed(1)+' '+(yTop+alto).toFixed(1)+' H '+(x1+bw-r3).toFixed(1)+' Q '+(x1+bw).toFixed(1)+' '+(yTop+alto).toFixed(1)+' '+(x1+bw).toFixed(1)+' '+(yTop+alto-r3).toFixed(1)+' V '+yTop.toFixed(1)+' Z" style="fill:'+col+'"/>';
    }
    if(o.banda && v.se){
      const a=Y(v.y+v.se*2), b=Y(v.y-v.se*2);
      sv+='<line x1="'+cx.toFixed(1)+'" y1="'+a.toFixed(1)+'" x2="'+cx.toFixed(1)+'" y2="'+b.toFixed(1)+'" style="stroke:var(--grigio);stroke-width:1.2"/>';
      sv+='<line x1="'+(cx-3).toFixed(1)+'" y1="'+a.toFixed(1)+'" x2="'+(cx+3).toFixed(1)+'" y2="'+a.toFixed(1)+'" style="stroke:var(--grigio);stroke-width:1.2"/>';
      sv+='<line x1="'+(cx-3).toFixed(1)+'" y1="'+b.toFixed(1)+'" x2="'+(cx+3).toFixed(1)+'" y2="'+b.toFixed(1)+'" style="stroke:var(--grigio);stroke-width:1.2"/>';
    }
    const ly = v.y>=0 ? Math.max(9, yv-4) : Math.min(H-PB-1, yv+10);
    sv+='<text class="val" x="'+cx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle">'+f(v.y)+'</text>';
    sv+='<text x="'+cx.toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle">'+esc(v.x)+'</text>';
  });
  return sv+'</svg>';
}
/* Andamento con enfasi sulla media mobile (finestra 10): i singoli giri sono
   punti nel grigio di de-enfasi, la linea e' la media mobile con la banda ±2SE.
   Tocco su un punto: callout con data e valore (G8). */
function trendMediaEl(vals, o){
  o=o||{};
  const W=340, H=o.h||118, PL=10, PR=10, PT=16, PB=17, FIN=Math.min(10, vals.length);
  const roll=vals.map((_,i)=> i<FIN-1 ? null :
    vals.slice(i-FIN+1,i+1).reduce((a,b)=>a+b.y,0)/FIN);
  const se=o.se||0;
  let ys=vals.map(v=>v.y);
  roll.forEach(r=>{ if(r!==null){ ys.push(r+2*se); ys.push(r-2*se); } });
  let min=Math.min(0,...ys), max=Math.max(0,...ys);
  const pad=(max-min)*0.12||1; min-=pad; max+=pad;
  const X=i=> vals.length===1 ? (PL+(W-PL-PR)/2) : PL+i*(W-PL-PR)/(vals.length-1);
  const Y=v=> PT+(max-v)/(max-min)*(H-PT-PB);
  const seg=roll.map((r,i)=>({r:r,i:i})).filter(p=>p.r!==null);
  let sv='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'andamento')+'">';
  if(min<0 && max>0) sv+='<line class="zero" x1="'+PL+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(0).toFixed(1)+'"/>';
  if(se && seg.length>1){
    const su=seg.map(p=>X(p.i).toFixed(1)+','+Y(p.r+2*se).toFixed(1)).join(' ');
    const giu=seg.map(p=>X(p.i).toFixed(1)+','+Y(p.r-2*se).toFixed(1)).reverse().join(' ');
    sv+='<polygon class="band" points="'+su+' '+giu+'" style="fill:var(--dv-blue)"/>';
  }
  vals.forEach((v,i)=>{
    sv+='<circle class="pt" data-i="'+i+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(v.y).toFixed(1)+'" r="3.6" style="fill:var(--dv-neutral)"/>';
  });
  if(seg.length>1){
    sv+='<polyline class="lin" style="stroke:var(--dv-blue)" points="'+seg.map(p=>X(p.i).toFixed(1)+','+Y(p.r).toFixed(1)).join(' ')+'"/>';
    const u=seg[seg.length-1];
    sv+='<circle class="pt" cx="'+X(u.i).toFixed(1)+'" cy="'+Y(u.r).toFixed(1)+'" r="4.2" style="fill:var(--dv-blue)"/>';
    sv+='<text class="val" x="'+(W-PR)+'" y="'+Math.max(10,Y(u.r)-8).toFixed(1)+'" text-anchor="end">media '+sgn(u.r,1)+'</text>';
  }
  sv+='<text x="'+PL+'" y="'+(H-3)+'" text-anchor="start">'+esc(vals[0].x)+'</text>';
  sv+='<text x="'+(W-PR)+'" y="'+(H-3)+'" text-anchor="end">'+esc(vals[vals.length-1].x)+'</text>';
  sv+='</svg>';
  const wrap=el('<div class="chartwrap">'+sv+'</div>');
  wrap.addEventListener('click', ev=>{
    const vecchio=wrap.querySelector('.callout'); if(vecchio) vecchio.remove();
    const r=wrap.getBoundingClientRect();
    const xr=(ev.clientX-r.left)/r.width*W;
    let best=0, bd=1e9;
    vals.forEach((v,i)=>{ const d=Math.abs(X(i)-xr); if(d<bd){bd=d; best=i;} });
    if(bd>18) return;
    const c=el('<div class="callout">'+esc(vals[best].x)+' · '+sgn(vals[best].y,1)+'</div>');
    c.style.left=(X(best)/W*100)+'%';
    c.style.top=(Y(vals[best].y)/H*100)+'%';
    wrap.appendChild(c);
    setTimeout(()=>{ if(c.parentNode) c.remove(); }, 2600);
  });
  return wrap;
}
function boxTrend(titolo, vals, colore, o){

/* Ellisse di dispersione: componente longitudinale e laterale per un bastone.
   Esiste solo quando la griglia di esito ha raccolto abbastanza colpi. */
function svgEllisse(sdLungo, sdLato, media){
  const W=300, H=170, cx=W/2, cy=H/2;
  const maxR=Math.max(sdLungo, sdLato, 5)*2.2;
  const sc=(Math.min(W,H)/2-22)/maxR;
  let sv='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="dispersione">';
  sv+='<line class="zero" x1="'+cx+'" y1="10" x2="'+cx+'" y2="'+(H-10)+'"/>';
  sv+='<line class="zero" x1="20" y1="'+cy+'" x2="'+(W-20)+'" y2="'+cy+'"/>';
  [2,1].forEach(k=>{
    sv+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(sdLato*k*sc).toFixed(1)+'" ry="'+(sdLungo*k*sc).toFixed(1)+
        '" style="fill:var(--dv-blue);opacity:'+(k===2?0.10:0.22)+';stroke:var(--dv-blue);stroke-width:1"/>';
  });
  sv+='<circle cx="'+cx+'" cy="'+cy+'" r="3.5" style="fill:var(--dv-blue)"/>';
  sv+='<text x="'+cx+'" y="9" text-anchor="middle">lunga</text>';
  sv+='<text x="'+cx+'" y="'+(H-2)+'" text-anchor="middle">corta</text>';
  sv+='<text x="14" y="'+(cy+3)+'" text-anchor="start">sx</text>';
  sv+='<text x="'+(W-14)+'" y="'+(cy+3)+'" text-anchor="end">dx</text>';
  // scala metrica: senza numeri l'ellisse e' una figura, con i numeri e' una misura
  sv+='<text class="val" x="'+(cx+5)+'" y="'+(cy-sdLungo*sc-3).toFixed(1)+'" text-anchor="start">\u03c3 '+(+sdLungo).toFixed(0)+' m</text>';
  sv+='<text x="'+(cx+5)+'" y="'+(cy-2*sdLungo*sc-3).toFixed(1)+'" text-anchor="start">2\u03c3 '+(2*sdLungo).toFixed(0)+' m</text>';
  sv+='<text class="val" x="'+(cx+sdLato*sc+4).toFixed(1)+'" y="'+(cy+13)+'" text-anchor="start">\u03c3 '+(+sdLato).toFixed(0)+' m</text>';
  return sv+'</svg>';
}

/* ==========================================================
   SINCRONIZZAZIONE CON IL REPOSITORY PRIVATO
   ==========================================================
   Le sei condizioni non negoziabili, dal piano del 15/08/2026.
   1. la sincronizzazione AGGIUNGE, non cancella mai
   2. nessuna sovrascrittura silenziosa (ogni scrittura porta lo sha atteso)
   3. stato sempre visibile, fallimento sempre annunciato
   4. il backup su file resta la via di scorta
   5. repository dati privato, token limitato
   6. collaudo su archivio finto prima dei dati veri                            */
const GH_API = 'https://api.github.com';
const SYNC_DEF = {attiva:false, utente:'', repo:'golf-dati', token:'', dispositivo:'',
                  giri:{}, ultimoOk:null, ultimoErrore:null, privato:null, api:null};

function S(){ return Object.assign({}, SYNC_DEF, LS.get('hcp_sync',{})||{}); }
function Sset(patch){ LS.set('hcp_sync', Object.assign(S(), patch)); }

function b64enc(str){
  const b=new TextEncoder().encode(str); let s='';
  for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
  return btoa(s);
}
function b64dec(b64){
  const bin=atob(String(b64).replace(/\s/g,'')); const b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}

async function ghFetch(percorso, opz){
  const s=S();
  if(!s.token) throw Object.assign(new Error('Token non impostato.'),{stato:0});
  opz=opz||{};
  const h={'Authorization':'Bearer '+s.token,
           'Accept':'application/vnd.github+json',
           'X-GitHub-Api-Version':'2022-11-28'};
  if(opz.body) h['Content-Type']='application/json';
  let r;
  try{
    r=await fetch((s.api||GH_API)+percorso, {method:opz.method||'GET', headers:h, body:opz.body});
  }catch(e){
    throw Object.assign(new Error('Non sono riuscito a raggiungere GitHub. Connessione assente o instabile.'),{stato:0});
  }
  if(r.status===204) return null;
  let d=null; try{ d=await r.json(); }catch(e){}
  if(r.ok) return d;
  const msg=(d&&d.message)||'';
  let testo;
  if(r.status===401) testo='Il token non e’ valido, e’ scaduto o e’ stato revocato. Generane uno nuovo su GitHub e reincollalo qui.';
  else if(r.status===403 && /rate limit/i.test(msg)) testo='GitHub ha messo in pausa le richieste per qualche minuto. Riprova fra poco: non si e’ perso niente.';
  else if(r.status===403) testo='Il token non ha il permesso di scrivere in questo repository. Controlla che sia impostato su "Contents: Read and write" e che includa proprio golf-dati.';
  else if(r.status===404) testo='Non trovo il repository. Controlla il nome utente e il nome del repository, e che il token comprenda proprio quel repository.';
  else if(r.status===409) testo='Il file e’ cambiato su GitHub dopo l’ultima volta che questo telefono l’ha visto.';
  else if(r.status===422) testo='GitHub ha rifiutato la scrittura: '+(msg||'richiesta non valida')+'.';
  else testo='GitHub ha risposto con un errore ('+r.status+'). '+msg;
  throw Object.assign(new Error(testo),{stato:r.status, github:msg});
}
function ghPath(sotto){
  const s=S();
  return '/repos/'+encodeURIComponent(s.utente)+'/'+encodeURIComponent(s.repo)+'/contents/'+sotto;
}
function slug(t){
  return String(t||'campo').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,32) || 'campo';
}
function nomeFileGiro(g){
  if(g.file) return g.file;
  const coda=String(g.id||'').slice(-4) || Math.random().toString(36).slice(2,6);
  return (g.data||'0000-00-00')+'-'+slug(g.circolo)+'-'+coda+'.json';
}
function nomeDispositivoIniziale(){
  const ua=navigator.userAgent||'';
  const base = /iPhone/i.test(ua) ? 'iPhone' : /iPad/i.test(ua) ? 'iPad'
             : /Macintosh|Mac OS/i.test(ua) ? 'Mac' : /Android/i.test(ua) ? 'Android' : 'dispositivo';
  return base+'-'+Math.random().toString(36).slice(2,5);
}
function marcaModifica(g){
  if(!g) return g;
  if(!g.file) g.file=nomeFileGiro(g);
  g.schema=SCHEMA_VERSION;
  g.modificatoIl=new Date().toISOString();
  g.modificatoDa=S().dispositivo||'dispositivo';
  return g;
}

let _sy={inCorso:false, promessa:null, conflitti:[], snapFatto:false, ultimoEsito:null};

function giriDaSincronizzare(){
  const s=S(), giri=LS.get('hcp_giri',[]);
  return giri.filter(g=>{
    const st=s.giri[g.id];
    if(!st) return true;
    return st.modificatoIl !== (g.modificatoIl||null);
  });
}
function cancellatiDaSpostare(){
  return LS.get('hcp_giri_cancellati',[]).filter(c=>!c.spostato);
}
function syncInSospeso(){ return giriDaSincronizzare().length + cancellatiDaSpostare().length; }
function syncConfigurata(){ const s=S(); return !!(s.attiva && s.token && s.utente && s.repo); }

async function snapUnaVolta(){
  if(_sy.snapFatto) return;
  _sy.snapFatto=true;
  await snapshotSalva('prima di una sincronizzazione');
}
function registraConflitto(id, locale, remoto, sha, file){
  if(_sy.conflitti.some(c=>c.id===id)) return;
  _sy.conflitti.push({id:id, locale:locale, remoto:remoto, sha:sha, file:file});
}
async function syncVerifica(){
  const s=S();
  if(!s.utente) throw new Error('Manca il nome utente GitHub.');
  if(!s.repo)   throw new Error('Manca il nome del repository.');
  if(!s.token)  throw new Error('Manca il token.');
  const r=await ghFetch('/repos/'+encodeURIComponent(s.utente)+'/'+encodeURIComponent(s.repo));
  const privato = r && r.private===true;
  Sset({privato:privato});
  return {privato:privato, nome:(r&&r.full_name)||''};
}
async function syncCaricaGiro(g){
  if(!g.modificatoIl || !g.file){ marcaModifica(g); salvaGiro(g, true); }
  const s=S(), st=s.giri[g.id]||{}, path=ghPath('giri/'+encodeURIComponent(g.file));
  const corpo={message:'giro '+(g.data||'')+' '+(g.circolo||'')+' — '+(s.dispositivo||''),
               content:b64enc(JSON.stringify(g,null,1))};
  if(st.sha) corpo.sha=st.sha;
  let r;
  try{
    r=await ghFetch(path,{method:'PUT', body:JSON.stringify(corpo)});
  }catch(e){
    if(e.stato===409 || e.stato===422) return await syncRisolviSalita(g, path);
    throw e;
  }
  const s2=S(); s2.giri[g.id]={sha:r.content.sha, modificatoIl:g.modificatoIl, file:g.file};
  Sset({giri:s2.giri});
  return 'caricato';
}
async function syncRisolviSalita(g, path){
  const remotoRaw=await ghFetch(path);
  let remoto=null;
  try{ remoto=JSON.parse(b64dec(remotoRaw.content)); }catch(e){}
  const s=S(), st=s.giri[g.id]||{};
  if(remoto && remoto.modificatoIl===g.modificatoIl){
    const s2=S(); s2.giri[g.id]={sha:remotoRaw.sha, modificatoIl:g.modificatoIl, file:g.file};
    Sset({giri:s2.giri}); return 'allineato';
  }
  if(remoto && st.modificatoIl && remoto.modificatoIl===st.modificatoIl){
    const corpo={message:'correzione giro '+(g.data||'')+' — '+(s.dispositivo||''),
                 content:b64enc(JSON.stringify(g,null,1)), sha:remotoRaw.sha};
    const r2=await ghFetch(path,{method:'PUT', body:JSON.stringify(corpo)});
    const s2=S(); s2.giri[g.id]={sha:r2.content.sha, modificatoIl:g.modificatoIl, file:g.file};
    Sset({giri:s2.giri}); return 'caricato';
  }
  registraConflitto(g.id, g, remoto, remotoRaw.sha, g.file);
  return 'conflitto';
}
async function syncCaricaTutti(){
  const daFare=giriDaSincronizzare();
  let n=0;
  for(const g of daFare){
    const esito=await syncCaricaGiro(g);
    if(esito==='caricato') n++;
  }
  return n;
}
async function syncScarica(){
  let elencoCanc=[];
  try{ elencoCanc=await ghFetch(ghPath('cancellati'))||[]; }
  catch(e){ if(e.stato!==404) throw e; }
  const nomiCanc=new Set((Array.isArray(elencoCanc)?elencoCanc:[]).filter(x=>x.type==='file').map(x=>x.name));
  if(nomiCanc.size){
    const giri=LS.get('hcp_giri',[]);
    const daNascondere=giri.filter(g=>g.file && nomiCanc.has(g.file));
    if(daNascondere.length){
      await snapUnaVolta();
      const canc=LS.get('hcp_giri_cancellati',[]);
      daNascondere.forEach(g=>{
        if(!canc.some(c=>c.id===g.id)) canc.push({id:g.id, file:g.file, giro:g, spostato:true, quando:Date.now()});
      });
      LS.set('hcp_giri_cancellati', canc);
      LS.set('hcp_giri', giri.filter(g=>!(g.file && nomiCanc.has(g.file))));
    }
  }
  const nascostiQui=new Set(LS.get('hcp_giri_cancellati',[]).map(c=>c.file).filter(Boolean));
  let elenco=[];
  try{ elenco=await ghFetch(ghPath('giri'))||[]; }
  catch(e){ if(e.stato===404) elenco=[]; else throw e; }
  if(!Array.isArray(elenco)) elenco=[];
  let nuovi=0, aggiornati=0;
  for(const it of elenco){
    if(it.type!=='file' || !/\.json$/i.test(it.name)) continue;
    if(nomiCanc.has(it.name) || nascostiQui.has(it.name)) continue;
    const giri=LS.get('hcp_giri',[]);
    const locale=giri.find(g=>g.file===it.name) || null;
    const st=locale ? (S().giri[locale.id]||{}) : {};
    if(locale && st.sha===it.sha) continue;
    let d=null;
    const r=await ghFetch(ghPath('giri/'+encodeURIComponent(it.name)));
    try{ d=JSON.parse(b64dec(r.content)); }catch(e){ continue; }
    if(!d || !d.id || !Array.isArray(d.buche)) continue;
    if(!d.file) d.file=it.name;
    migraGiroInArrivo(d);
    const perId=giri.find(g=>g.id===d.id) || locale;
    if(!perId){
      await snapUnaVolta();
      giri.push(d); LS.set('hcp_giri', giri);
      const s2=S(); s2.giri[d.id]={sha:r.sha, modificatoIl:d.modificatoIl||null, file:d.file};
      Sset({giri:s2.giri}); nuovi++; continue;
    }
    if((d.modificatoIl||null)===(perId.modificatoIl||null)){
      const s2=S(); s2.giri[perId.id]={sha:r.sha, modificatoIl:perId.modificatoIl||null, file:perId.file||it.name};
      Sset({giri:s2.giri}); continue;
    }
    const stId=S().giri[perId.id]||{};
    const localeIntatto = stId.modificatoIl===(perId.modificatoIl||null);
    if(localeIntatto){
      await snapUnaVolta();
      const i=giri.findIndex(g=>g.id===perId.id);
      giri[i]=d; LS.set('hcp_giri', giri);
      const s2=S(); s2.giri[d.id]={sha:r.sha, modificatoIl:d.modificatoIl||null, file:d.file};
      Sset({giri:s2.giri}); aggiornati++; continue;
    }
    registraConflitto(perId.id, perId, d, r.sha, perId.file||it.name);
  }
  idbFlush();
  bastCacheReset();
  return {nuovi:nuovi, aggiornati:aggiornati};
}
/* Un giro che arriva da un dispositivo con schema piu' vecchio va portato allo schema corrente (v9)
   prima di entrare nell'archivio. Additivo: non tocca nessun colpo. */
function migraGiroInArrivo(g){
  if(g.condizioni===undefined) g.condizioni=null;
  if(g.gara===undefined) g.gara=null;
  if(g.annotato===undefined) g.annotato=null;
  (g.buche||[]).forEach(b=>{
    if(b.completata===undefined) b.completata=true;
    (b.colpi||[]).forEach(c=>{
      if(c.esito===undefined) c.esito=null;
      if(c.penalita && c.penTipo===undefined) c.penTipo='altro';
    });
    const c0=(b.colpi||[])[0];
    if(c0 && c0.lie==='tee' && c0.latoTee===undefined) c0.latoTee=null;
    if(b.posizionePin===undefined) b.posizionePin=null;
    (b.colpi||[]).forEach(c=>{
      if(c.ostacolo===undefined) c.ostacolo=null;
      if(c.lieCorto===undefined) c.lieCorto=null;
    });
  });
  return g;
}
async function syncSpostaCancellati(){
  const canc=LS.get('hcp_giri_cancellati',[]);
  let mosso=0;
  for(const c of canc){
    if(c.spostato || !c.file) continue;
    const pNuovo=ghPath('cancellati/'+encodeURIComponent(c.file));
    const pVecchio=ghPath('giri/'+encodeURIComponent(c.file));
    let shaEsistente=null;
    try{ const e=await ghFetch(pNuovo); shaEsistente=e.sha; }
    catch(e){ if(e.stato!==404) throw e; }
    const corpo={message:'giro rimosso dal telefono '+(S().dispositivo||''),
                 content:b64enc(JSON.stringify(c.giro,null,1))};
    if(shaEsistente) corpo.sha=shaEsistente;
    await ghFetch(pNuovo,{method:'PUT', body:JSON.stringify(corpo)});
    try{
      const v=await ghFetch(pVecchio);
      await ghFetch(pVecchio,{method:'DELETE',
        body:JSON.stringify({message:'spostato in cancellati/', sha:v.sha})});
    }catch(e){ if(e.stato!==404) throw e; }
    c.spostato=true; mosso++;
    const s2=S(); delete s2.giri[c.id]; Sset({giri:s2.giri});
  }
  if(mosso) LS.set('hcp_giri_cancellati', canc);
  return mosso;
}
function syncEsegui(){
  if(!syncConfigurata()) return Promise.resolve({esito:'spenta'});
  if(_sy.inCorso && _sy.promessa) return _sy.promessa;
  if(navigator.onLine===false){
    Sset({ultimoErrore:'Nessuna connessione. I giri restano nel telefono e salgono da soli appena torna la rete.'});
    return Promise.resolve({esito:'offline'});
  }
  _sy.inCorso=true; _sy.snapFatto=false; _sy.conflitti=[];
  _sy.promessa=_syncEseguiOra();
  return _sy.promessa;
}
async function _syncEseguiOra(){
  try{
    const mossi=await syncSpostaCancellati();
    const giu=await syncScarica();
    const su=await syncCaricaTutti();
    Sset({ultimoOk:Date.now(), ultimoErrore:null});
    _sy.ultimoEsito={caricati:su, nuovi:giu.nuovi, aggiornati:giu.aggiornati, rimossi:mossi,
                     conflitti:_sy.conflitti.length};
    return Object.assign({esito:'ok'}, _sy.ultimoEsito);
  }catch(e){
    const m=e&&e.message||String(e);
    Sset({ultimoErrore:m});
    return {esito:'errore', messaggio:m};
  }finally{ _sy.inCorso=false; _sy.promessa=null; }
}
function syncAuto(){
  if(!syncConfigurata()) return;
  syncEsegui().then(r=>{
    if(!r || r.esito==='spenta' || r.esito==='gia_in_corso') return;
    const v=nav[nav.length-1].view;
    if(v==='home' || v==='sincronizza') render();
  });
}
function eliminaGiroLocale(g){
  const giri=LS.get('hcp_giri',[]);
  const i=giri.findIndex(x=>x.id===g.id);
  if(i<0) return;
  snapshotSalva('prima di eliminare un giro');
  const canc=LS.get('hcp_giri_cancellati',[]);
  if(!canc.some(c=>c.id===g.id)){
    canc.push({id:g.id, file:g.file||nomeFileGiro(g), giro:g,
               spostato: !S().giri[g.id], quando:Date.now()});
    LS.set('hcp_giri_cancellati', canc);
  }
  giri.splice(i,1); LS.set('hcp_giri', giri); idbFlush(); bastCacheReset();
  syncAuto();
}
function risolviConflitto(id, scelta){
  const c=_sy.conflitti.find(x=>x.id===id); if(!c) return;
  const giri=LS.get('hcp_giri',[]); const i=giri.findIndex(g=>g.id===id);
  snapshotSalva('prima di risolvere un conflitto');
  if(scelta==='locale'){
    const g=giri[i]; if(g){ marcaModifica(g); giri[i]=g; LS.set('hcp_giri',giri); }
    const s2=S(); s2.giri[id]={sha:c.sha, modificatoIl:null, file:c.file}; Sset({giri:s2.giri});
  }else{
    if(i>=0 && c.remoto){ giri[i]=c.remoto; LS.set('hcp_giri',giri); }
    else if(c.remoto){ giri.push(c.remoto); LS.set('hcp_giri',giri); }
    const s2=S(); s2.giri[id]={sha:c.sha, modificatoIl:(c.remoto&&c.remoto.modificatoIl)||null, file:c.file};
    Sset({giri:s2.giri});
  }
  _sy.conflitti=_sy.conflitti.filter(x=>x.id!==id);
  idbFlush(); bastCacheReset();
  syncAuto(); render();
}
function quandoTesto(ts){
  if(!ts) return 'mai';
  const d=new Date(ts), ora=Date.now(), diff=(ora-ts)/1000;
  if(diff<90) return 'poco fa';
  if(diff<3600) return Math.round(diff/60)+' minuti fa';
  const oggi=new Date().toDateString()===d.toDateString();
  const hh=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  return oggi ? 'oggi alle '+hh : d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})+' alle '+hh;
}
function rigaStatoSync(){
  const s=S(), sosp=syncInSospeso();
  let col, testo;
  if(!s.attiva){
    col='var(--grigio)';
    testo='<b>Sincronizzazione spenta.</b> I giri vivono solo in questo telefono. Tocca per attivarla.';
  } else if(s.ultimoErrore){
    col='var(--rosso)';
    testo='<b>Sincronizzazione ferma.</b> '+esc(String(s.ultimoErrore).slice(0,90))+(String(s.ultimoErrore).length>90?'…':'');
  } else if(_sy.conflitti.length){
    col='var(--ambra)';
    testo='<b>'+_sy.conflitti.length+' giro/i da decidere.</b> Due versioni diverse dello stesso giro: tocca per scegliere.';
  } else if(sosp>0){
    col='var(--ambra)';
    testo='<b>'+sosp+(sosp===1?' giro non ancora al sicuro.':' giri non ancora al sicuro.')+'</b> Salgono da soli appena c’e’ rete.';
  } else {
    // successo silenzioso: un pannello di stato sempre acceso diventa invisibile
    // per assuefazione. Quando tutto va bene, una riga piccola in fondo basta.
    const q=el('<div class="syncquiet">\u2713 ultimo giro al sicuro \u00b7 '+esc(quandoTesto(s.ultimoOk))+'</div>');
    q.onclick=()=>push('sincronizza');
    return q;
  }
  const r=el('<div class="syncline"><span class="pallino" style="background:'+col+'"></span><span>'+testo+'</span><span class="frecc">›</span></div>');
  r.onclick=()=>push('sincronizza');
  return r;
}

        '<label>Nome della gara <span style="font-weight:400">(facoltativo)</span></label>'+
        '<input type="text" id="f_gara" placeholder="es. Trofeo di primavera">'+
        '<div class="hint tight">Serve a ritrovare questo giro nello storico federale quando i due archivi verranno uniti.</div>'+
      '</div>'+
      '<label style="margin-top:10px;">Circolo</label>'+
      '<input type="search" id="f_cerca" placeholder="Cerca fra '+circoli.length+' campi: nome o provincia" '+
        'autocapitalize="off" autocorrect="off" spellcheck="false" style="margin-bottom:6px;">'+
      '<select id="f_circolo"></select>'+
      '<div id="f_nota"></div>'+
      '<div id="altroWrap" style="display:none;margin-top:8px;">'+
        '<input type="text" id="f_altro" placeholder="Nome circolo">'+
        '<div class="hint">Par e distanza andranno inseriti a mano buca per buca.</div></div>'+
      '<div class="row" style="margin-top:10px;">'+
        '<div><label>Tee</label><select id="f_tee"></select></div>'+
        '<div><label>Buche</label><select id="f_nb"><option value="18">18</option><option value="9">9</option></select></div>'+
      '</div>'+
    '</div>'+
    '<div class="card"><h2>Condizioni</h2>'+
      '<div class="hint">Tre tocchi, una volta sola. Servono a non confondere la forma col meteo quando '+
        'confronterai due periodi. Le scale sono definite su un criterio osservabile, non su un aggettivo.</div>'+
      '<label>Vento</label><div class="grid3" id="c_vento">'+
        VENTO_OPZ.map(v=>'<div class="chip small'+(v.v===0?' selected':'')+'" data-v="'+v.v+'">'+v.n+
          '<br><span style="font-size:10px;opacity:.75">'+v.d+'</span></div>').join('')+'</div>'+
      '<label style="margin-top:12px;">Terreno</label><div class="grid3" id="c_meteo">'+
        METEO_OPZ.map(v=>'<div class="chip small'+(v.v===0?' selected':'')+'" data-v="'+v.v+'">'+v.n+
          '<br><span style="font-size:10px;opacity:.75">'+v.d+'</span></div>').join('')+'</div>'+
      '<label style="margin-top:12px;">Green</label><div class="grid3" id="c_green">'+
        GREEN_OPZ.map(v=>'<div class="chip small'+(v.v===1?' selected':'')+'" data-v="'+v.v+'">'+v.n+
          '<br><span style="font-size:10px;opacity:.75">'+v.d+'</span></div>').join('')+'</div>'+
      '<label style="margin-top:12px;">Distanze annotate in campo sulla carta?</label>'+
      '<div class="grid2" id="c_ann">'+
        '<div class="chip small'+(imp.annotatoDefault!==false?' selected':'')+'" data-v="si">Si\u2019, carta annotata<br><span style="font-size:10px;opacity:.75">telemetro, al momento del colpo</span></div>'+
        '<div class="chip small'+(imp.annotatoDefault===false?' selected':'')+'" data-v="no">No, a memoria<br><span style="font-size:10px;opacity:.75">dato di classe inferiore</span></div>'+
      '</div>'+
      '<div class="hint tight" style="margin-top:6px">Una distanza ricostruita a memoria a fine giro non e\u2019 una misura: '+
        'e\u2019 il ricordo della misura, riscritto dall\u2019esito del colpo. Il campo resta scritto nel giro e nelle esportazioni.</div>'+
    '</div>'+
    '<button class="btn big" id="go">Inizia il giro →</button></div>');

  const selC=body.querySelector('#f_circolo'), selT=body.querySelector('#f_tee'), selTipo=body.querySelector('#f_tipo');
  const cerca=body.querySelector('#f_cerca'), boxNota=body.querySelector('#f_nota');

  /* Con 105 campi in elenco, scorrere non e' piu' un modo di scegliere.
     La ricerca guarda nome e provincia; i circoli dove hai gia' giocato salgono
     in cima, perche' sono quelli che ti servono davvero. */
  const gia=[...new Set(LS.get('hcp_giri',[]).map(g=>g.circolo))].filter(c=>arch[c]);
  const senzaAcc = t => String(t===null||t===undefined?'':t).toLowerCase()
                          .normalize('NFD').replace(/[\u0300-\u036f]/g,'');

  function riempiElenco(){
    const q=senzaAcc(cerca.value.trim());
    const passa = c => !q || senzaAcc(c).indexOf(q)>=0 || senzaAcc(arch[c].luogo||'').indexOf(q)>=0;
    const recenti=gia.filter(passa), altri=circoli.filter(c=>passa(c) && gia.indexOf(c)<0);
    const opt = c => '<option value="'+esc(c)+'">'+esc(c)+'</option>';
    let h='';
    if(recenti.length) h+='<optgroup label="Dove hai gia giocato">'+recenti.map(opt).join('')+'</optgroup>';
    if(altri.length)   h+=(recenti.length?'<optgroup label="Tutti i campi">':'')+altri.map(opt).join('')+
                          (recenti.length?'</optgroup>':'');
    if(!recenti.length && !altri.length) h+='<option value="" disabled selected>Nessun campo trovato</option>';
    h+='<option value="__altro__">Altro (non in archivio)…</option>';
    selC.innerHTML=h;
    aggiornaTee();
  }
  function aggiornaTee(){
    const c=selC.value;
    boxNota.innerHTML='';
    if(c==='__altro__' || !arch[c]){ selT.innerHTML='<option>Bianco</option><option>Giallo</option>'; return; }
    const a=arch[c];
    selT.innerHTML=Object.keys(a.tees).map(t=>'<option>'+esc(t)+'</option>').join('');
    let n='';
    if(a.luogo) n+='<div class="hint tight" style="margin:6px 0 0 0">'+esc(a.luogo)+
                   ' \u00b7 par '+a.par.reduce((x,y)=>x+y,0)+'</div>';
    if(a.nota)  n+='<div class="installtip" style="margin:6px 0 0 0;color:var(--ambra)">\u26a0\ufe0e '+esc(a.nota)+'</div>';
    boxNota.innerHTML=n;
  }
  riempiElenco();
  cerca.oninput=riempiElenco;
  selC.onchange=()=>{ body.querySelector('#altroWrap').style.display = selC.value==='__altro__'?'block':'none'; aggiornaTee(); };
  function aggiornaGara(){ body.querySelector('#garaWrap').style.display = /Gara|Coppa/i.test(selTipo.value)?'block':'none'; }
  aggiornaGara(); selTipo.onchange=aggiornaGara;

  const cond={vento:0, meteo:0, green:1};
  let annSel = imp.annotatoDefault!==false;
  const boxAnn=body.querySelector('#c_ann');
  boxAnn.onclick=e=>{
    const c=e.target.closest('.chip'); if(!c) return;
    boxAnn.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); annSel = c.dataset.v==='si';
  };
  [['#c_vento','vento'],['#c_meteo','meteo'],['#c_green','green']].forEach(pair=>{
    const box=body.querySelector(pair[0]);
    box.onclick=e=>{
      const c=e.target.closest('.chip'); if(!c) return;
      box.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));
      c.classList.add('selected'); cond[pair[1]]=parseInt(c.dataset.v,10);
    };
  });

  body.querySelector('#go').onclick=()=>{
    const data=body.querySelector('#f_data').value;
    const tipo=selTipo.value;
    const tee=selT.value, nb=parseInt(body.querySelector('#f_nb').value,10);
    const gara=(body.querySelector('#f_gara').value||'').trim()||null;
    let nome=selC.value, buche;
    if(nome==='__altro__' || !arch[nome]){
      nome=(body.querySelector('#f_altro').value||'').trim()||'Circolo non specificato';
      buche=Array.from({length:nb},()=>({par:4,distanza:null,colpi:[],chiusa:false,completata:true,fase:'lungo'}));
    } else {
      const a=arch[nome], t=a.tees[tee];
      buche=Array.from({length:nb},(_,i)=>({par:a.par[i],distanza:t.d[i],si:a.si?a.si[i]:null,
        colpi:[],chiusa:false,completata:true,fase:'lungo'}));
    }
    IMPset({annotatoDefault:annSel});
    bozza={id:uid(),data,tipo,circolo:nome,tee,numBuche:nb,gara:gara,annotato:annSel,
           condizioni:{vento:cond.vento, meteo:cond.meteo, green:cond.green},
           stato:'in_corso',bucaCorrente:0,buche};
    salvaBozza(); push('buca');
  };
  return {header:'Nuovo giro', body};
};

/* ==========================================================
   BUCA — compilazione a fine giro, dalla carta segnapunti
   ==========================================================
   Ridisegnata il 15/08/2026 sul modo in cui i dati vengono raccolti davvero:
   in campo si annotano lie e distanza sulla carta, l'app si compila a giro
   finito. Quindi:
   1. prima si dichiara il RISULTATO della buca (colpi totali e putt), e le
      schede dei colpi compaiono da sole, nel numero giusto;
   2. il primo colpo e' sempre dal tee: la scelta del lie non viene chiesta;
   3. l'esito a nove settori del colpo N sta DENTRO la scheda del colpo N,
      e compare quando la posizione d'arrivo e' nota: subito per l'ultimo
      colpo lungo (la palla e' in green) e per i putt non imbucati, appena
      inserita la distanza del colpo successivo per gli altri (entro 40 m);
   4. la penalita' si segna sul colpo stesso: a fine giro non c'e' piu' la
      contraddizione del "prima di tirare", e ogni penalita' toglie da sola
      una scheda, perche' il colpo di penalita' non e' un colpo giocato.   */

/* L2: barra inferiore — le quattro destinazioni a portata di pollice.
   Il chevron in alto resta per la profondita' dentro ogni destinazione. */
function vaiRadice(v){ nav=[{view:v}]; render(); }
function barraInferiore(attiva){
  const inCorso = bozza && bozza.stato==='in_corso';
  /* v12: icone SVG stroke 2px 17x17, come da handoff. Le emoji rendevano
     diverse su ogni sistema e non si potevano colorare. */
  const sv=d=>'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="2" stroke-linecap="round">'+d+'</svg>';
  const ICO={
    giri: sv('<path d="M6 22V3"></path><path d="M6 4h11l-2.5 4L17 12H6"></path>'),
    registra: sv('<path d="M12 5v14"></path><path d="M5 12h14"></path>'),
    stat: sv('<path d="M4 20V11"></path><path d="M10 20V5"></path><path d="M16 20v-6"></path><path d="M22 20V8"></path>'),
    altro:'<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">'+
      '<circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>'
  };
  const b=el('<div class="bottombar">'+
    '<button class="bb'+(attiva==='home'?' on':'')+'" data-v="home"><span class="ic">'+ICO.giri+'</span>Giri</button>'+
    '<button class="bb'+(attiva==='registra'?' on':'')+'" data-v="registra"><span class="ic">'+ICO.registra+'</span>'+(inCorso?'Riprendi':'Registra')+'</button>'+
    '<button class="bb'+(attiva==='statistiche'?' on':'')+'" data-v="statistiche"><span class="ic">'+ICO.stat+'</span>Statistiche</button>'+
    '<button class="bb'+(attiva==='altro'?' on':'')+'" data-v="altro"><span class="ic">'+ICO.altro+'</span>Altro</button>'+
  '</div>');
  b.onclick=e=>{
    const x=e.target.closest('.bb'); if(!x) return;
    const v=x.dataset.v;
    if(v==='registra'){ nav=[{view:'home'}]; push((bozza&&bozza.stato==='in_corso')?'buca':'nuovoGiro'); }
    else vaiRadice(v);
  };
  return b;
}

function rerenderFermo(){
  const m=document.querySelector('main');
  _scrollDa = m? m.scrollTop : 0;
  render();
}

VIEWS.buca = function(){
  if(!bozza){ nav=[{view:'home'}]; return VIEWS.home(); }
  const idx=bozza.bucaCorrente, b=bozza.buche[idx];
  const bastoni=LS.get('hcp_bastoni_v2',BASTONI_DEFAULT);
  const body=el('<div></div>');

  /* --- v10: lordo progressivo contro il par ---
     Si legge dalla carta mentre si compila: quante buche gia' dichiarate, lordo
     cumulato e segno contro il par di QUELLE buche (non di tutto il campo: il
     confronto onesto e' col par giocato fin qui). */
  let progN=0, progScore=0, progPar=0;
  bozza.buche.forEach(bb=>{
    if(bb.dich && bb.dich.colpi>0){ progN++; progScore+=bb.dich.colpi; progPar+=(bb.par||4); }
  });

  /* --- intestazione della buca --- */
  body.appendChild(el('<div class="holeprog">'+
    '<div><div class="n">Buca '+(idx+1)+'<span style="font-size:15px;color:var(--grigio)">/'+bozza.numBuche+'</span></div>'+
      (progN>0?'<div style="font-size:12.5px;color:var(--grigio);margin-top:3px">Lordo dopo '+progN+
        (progN===1?' buca':' buche')+': <b style="color:var(--verde-testo)">'+progScore+'</b> '+
        '<b style="color:'+(progScore-progPar>0?'var(--rosso)':'var(--verde-testo)')+'">('+
        (progScore-progPar===0?'pari':sgn(progScore-progPar,0))+')</b></div>':'')+'</div>'+
    '<div class="par">Par <select id="parSel" style="width:56px;display:inline-block;padding:3px;">'+
        [3,4,5,6].map(p=>'<option'+(p===b.par?' selected':'')+'>'+p+'</option>').join('')+'</select><br>'+
      '<input type="number" id="distSel" value="'+(b.distanza===null||b.distanza===undefined?'':b.distanza)+'" placeholder="metri" style="width:76px;margin-top:4px;padding:3px;font-size:13px;"> m</div>'+
  '</div>'));
  body.querySelector('#parSel').onchange=e=>{ b.par=parseInt(e.target.value,10); salvaBozza(); rerenderFermo(); };
  body.querySelector('#distSel').onchange=e=>{ b.distanza=e.target.value?parseFloat(e.target.value):null; salvaBozza(); rerenderFermo(); };

  /* ============ PASSO 1 — il risultato della buca ============ */
  if(!b.dich){
    const NOMI={'-2':'Eagle','-1':'Birdie','0':'Par','1':'Bogey','2':'Doppio','3':'Triplo'};
    const scelte=[]; for(let d=-2; d<=6; d++){ const v=b.par+d; if(v>=1) scelte.push({v:v, d:d}); }
    const card=el('<div class="card"><h2>Risultato della buca</h2>'+
      '<div class="hint">Si compila a fine giro, dalla carta: prima il totale della buca, '+
        'poi i colpi uno per uno. Le schede compaiono da sole, nel numero giusto.</div>'+
      '<label>Colpi totali (penalita’ comprese)</label>'+
      '<div class="grid3" id="scGrid">'+scelte.map(x=>'<div class="chip" data-v="'+x.v+'">'+x.v+
        '<br><span style="font-size:10px;opacity:.75">'+(NOMI[String(x.d)]||'+'+x.d)+'</span></div>').join('')+'</div>'+
      '<label style="margin-top:12px;">Di cui putt (colpi sul green)</label>'+
      '<div class="grid3" id="ptGrid">'+[0,1,2,3,4,5].map(v=>'<div class="chip" data-v="'+v+'">'+v+'</div>').join('')+'</div>'+
      '<div class="hint tight" id="p1err" style="margin-top:8px"></div>'+
      '<button class="btn big" id="prep" disabled style="margin-top:10px">Prepara le schede dei colpi</button>'+
    '</div>');
    let scSel=null, ptSel=null;
    const btn=card.querySelector('#prep'), errBox=card.querySelector('#p1err');
    function aggiorna(){
      let err='';
      if(scSel!==null && ptSel!==null){
        if(scSel-ptSel<1) err='Con '+scSel+' colpi totali e '+ptSel+' putt non resta nemmeno il colpo dal tee: controlla i numeri.';
      }
      errBox.textContent=err;
      btn.disabled = !(scSel!==null && ptSel!==null && !err);
      if(!btn.disabled) btn.textContent='Prepara le schede: '+(scSel-ptSel)+' colpi + '+ptSel+' putt';
    }
    card.querySelector('#scGrid').onclick=e=>{
      const c=e.target.closest('.chip'); if(!c) return;
      card.querySelectorAll('#scGrid .chip').forEach(x=>x.classList.remove('selected'));
      c.classList.add('selected'); scSel=parseInt(c.dataset.v,10); aggiorna();
    };
    card.querySelector('#ptGrid').onclick=e=>{
      const c=e.target.closest('.chip'); if(!c) return;
      card.querySelectorAll('#ptGrid .chip').forEach(x=>x.classList.remove('selected'));
      c.classList.add('selected'); ptSel=parseInt(c.dataset.v,10); aggiorna();
    };
    btn.onclick=()=>{
      b.dich={colpi:scSel, putt:ptSel};
      b.colpi=[];
      const nL=scSel-ptSel;   // le penalita' si segnano dopo, sulle schede
      for(let i2=0;i2<nL;i2++) b.colpi.push({lie:i2===0?'tee':null,
        distM:(i2===0 && b.distanza)?b.distanza:null,
        bastone:null, penalita:false, penTipo:null, esito:null, ostacolo:null, lieCorto:null});
      for(let p2=0;p2<ptSel;p2++) b.colpi.push({lie:'green', distM:null,
        bastone:'Putter', penalita:false, penTipo:null, esito:null, ostacolo:null, lieCorto:null});
      salvaBozza(); render();
    };
    body.appendChild(card);
    return {header:bozza.circolo, body};
  }

  /* ============ PASSO 2 — le schede dei colpi ============ */
  const colpi=b.colpi;
  const nPen=colpi.reduce((s,c)=>s+(c.penalita?1:0),0);
  const totale=colpi.length+nPen;
  const quadra = totale===b.dich.colpi;

  body.appendChild(el('<div class="puttbar">'+
    '<div><div class="lab">Schede</div><div class="big">'+colpi.length+'</div></div>'+
    '<div><div class="lab">Penalita’</div><div class="big">'+nPen+'</div></div>'+
    '<div style="margin-left:auto;text-align:right"><div class="lab">Totale buca</div>'+
      '<div class="big" style="color:'+(quadra?'inherit':'var(--rosso)')+'">'+totale+' / '+b.dich.colpi+'</div></div>'+
  '</div>'));
  if(!quadra) body.appendChild(el('<div class="hint tight" style="color:var(--rosso);margin:-6px 0 10px 0">'+
    'Le schede piu’ le penalita’ non tornano col totale dichiarato. Aggiusta le schede o tocca '+
    '"Cambia risultato" in fondo.</div>'));

  /* v9 — POSIZIONE DELLA BANDIERA. Un tocco per buca, facoltativo, dalla pin sheet.
     Sta dietro una riga sola per non allungare il flusso: la griglia si apre a
     richiesta e si chiude appena scelta. Senza questo campo il pattern di errore
     dice dove finisce la palla rispetto alla bandiera, ma non se quel lato era il
     lato punibile: e' la differenza fra un miss e uno short-side. */
  {
    const pinCorr = b.posizionePin && PIN_NOME[b.posizionePin] ? PIN_NOME[b.posizionePin] : null;
    const riga=el('<div class="card" style="padding:12px 14px">'+
      '<div style="display:flex;align-items:center;gap:10px">'+
        '<div style="flex:1"><div style="font-size:12px;color:var(--grigio);text-transform:uppercase;letter-spacing:.04em">Bandiera</div>'+
        '<div style="font-size:15px;font-weight:600">'+(pinCorr?esc(pinCorr):'non registrata')+
          '<span style="font-weight:400;font-size:12px;color:var(--grigio)"> (facoltativa)</span></div></div>'+
        '<button class="btn ghost" id="pinTog" style="width:auto;margin:0;padding:7px 12px;font-size:13px">'+
          (PIN_APERTO?'Chiudi':(pinCorr?'Cambia':'Segna'))+'</button>'+
      '</div>'+
      (PIN_APERTO?'<div class="esitowrap" style="margin-top:10px">'+
        '<div class="hint tight">Dove era la bandiera sul green, dalla pin sheet o a occhio. '+
        'Da qui nasce lo short-side: se manchi il green dalla parte della bandiera non hai green su cui lavorare.</div>'+
        '<div class="esitogrid" id="pinGrid">'+ESITI.map(x=>'<div class="esitocell'+(x.k==='P'?' centro':'')+
          (b.posizionePin===x.k?' selected':'')+'" data-v="'+x.k+'">'+
          (x.k==='P'?'<span class="fl">\u26f3</span>':'')+'<span>'+PIN_ETI[x.k]+'</span></div>').join('')+'</div></div>':'')+
    '</div>');
    riga.querySelector('#pinTog').onclick=()=>{ PIN_APERTO=!PIN_APERTO; rerenderFermo(); };
    const pg=riga.querySelector('#pinGrid');
    if(pg) pg.onclick=e=>{
      const ch=e.target.closest('.esitocell'); if(!ch) return;
      b.posizionePin = b.posizionePin===ch.dataset.v ? null : ch.dataset.v;
      PIN_APERTO=false; salvaBozza(); rerenderFermo();
    };
    body.appendChild(riga);
  }

  const lieOpz = LIE_OPZ.filter(l=>l.k!=='green');
  colpi.forEach((c,i)=>{
    const isPutt = c.lie==='green';
    const next = colpi[i+1]||null;
    const ultimo = i===colpi.length-1;
    const nPutt = colpi.slice(0,i+1).filter(x=>x.lie==='green').length;
    const titolo = isPutt ? ('Putt '+nPutt+(ultimo?' — imbucato':'')) :
                   ('Colpo '+(i+1)+(i===0?' — dal tee':''));
    const card=el('<div class="card scheda"><h2>'+titolo+'</h2></div>');

    if(!isPutt){
      if(i===0){
        card.appendChild(el('<div class="hint tight" style="margin-bottom:8px">Partenza dal tee. '+
          'La distanza e’ precompilata dalla carta del percorso: correggila se il tee era spostato.</div>'));
        if(b.par>=4){
          const lt=el('<div><label>Dove e’ finito il drive? <span style="font-weight:400">(facoltativo)</span></label>'+
            '<div class="grid3">'+[['S','Sinistra'],['C','Centro'],['D','Destra']].map(x=>
              '<div class="chip small'+(c.latoTee===x[0]?' selected':'')+'" data-v="'+x[0]+'">'+x[1]+'</div>').join('')+'</div>'+
            '<div class="hint tight" style="margin-top:6px">Il lato del colpo dal tee: e’ il dato che costruira’ '+
              'la dispersione del driver. Tocca di nuovo per togliere.</div></div>');
          lt.querySelector('.grid3').onclick=e=>{
            const ch=e.target.closest('.chip'); if(!ch) return;
            c.latoTee = c.latoTee===ch.dataset.v ? null : ch.dataset.v;
            salvaBozza(); rerenderFermo();
          };
          card.appendChild(lt);
        }
      } else {
        const lg=el('<div><label>Lie</label><div class="grid3">'+
          lieOpz.map(l=>'<div class="chip'+(l.k===c.lie?' selected':'')+'" data-v="'+l.k+'">'+l.n+'</div>').join('')+
          '</div><div class="hint tight" style="margin-top:6px">'+
          (c.lie?esc(LIE_AIUTO[c.lie]||''):'Tocca il lie per vederne la definizione.')+'</div></div>');
        lg.querySelector('.grid3').onclick=e=>{
          const ch=e.target.closest('.chip'); if(!ch) return;
          c.lie=ch.dataset.v; salvaBozza(); rerenderFermo();
        };
        card.appendChild(lg);
      }
      const di=el('<div><label style="margin-top:10px;">Distanza dalla buca (metri)</label>'+
        '<input type="number" inputmode="decimal" step="0.1" value="'+(c.distM===null||c.distM===undefined?'':c.distM)+'" placeholder="es. 145"></div>');
      di.querySelector('input').onchange=e=>{
        c.distM=e.target.value===''?null:parseFloat(e.target.value);
        salvaBozza(); rerenderFermo();
      };
      card.appendChild(di);
      const bg=el('<div><label style="margin-top:10px;">Bastone</label><div class="grid3">'+
        bastoni.filter(x=>x!=='Putter').map(x=>'<div class="chip'+(x===c.bastone?' selected':'')+'" data-v="'+esc(x)+'">'+esc(x)+'</div>').join('')+
        '<div class="chip'+(c.bastone==='Putter'?' selected':'')+'" data-v="Putter">Putter</div></div></div>');
      bg.querySelector('.grid3').onclick=e=>{
        const ch=e.target.closest('.chip'); if(!ch) return;
        c.bastone=ch.dataset.v; salvaBozza(); rerenderFermo();
      };
      card.appendChild(bg);
      const pg=el('<div><label style="margin-top:10px;">Penalita’ su questo colpo?</label>'+
        '<div class="grid3">'+PENALITA_OPZ.map(p=>'<div class="chip small'+((c.penalita?c.penTipo:'')===p.k||(!c.penalita&&p.k==='')?' selected':'')+'" data-v="'+p.k+'">'+p.n+
          (p.d?'<br><span style="font-size:10px;opacity:.75">'+p.d+'</span>':'')+'</div>').join('')+'</div>'+
        '<div class="hint tight" style="margin-top:6px">Il colpo di penalita’ conta nel totale ma non e’ un colpo giocato: '+
          'segnandolo, una scheda vuota si toglie da sola.</div></div>');
      pg.querySelector('.grid3').onclick=e=>{
        const ch=e.target.closest('.chip'); if(!ch) return;
        const nuovo=ch.dataset.v;
        const prima=c.penalita;
        if(nuovo===''){ c.penalita=false; c.penTipo=null; }
        else { c.penalita=true; c.penTipo=nuovo; c.esito=null; }
        // il totale resta quello dichiarato: la penalita' prende il posto di una scheda
        if(!prima && c.penalita){
          for(let k=colpi.length-1;k>=1;k--){
            const x=colpi[k];
            if(x.lie!=='green' && !x.bastone && (x.distM===null||x.distM===undefined) && (x.lie===null||x.lie===undefined) && k!==i){
              colpi.splice(k,1); break;
            }
          }
        } else if(prima && !c.penalita){
          let insP=colpi.length; for(let k2=0;k2<colpi.length;k2++){ if(colpi[k2].lie==='green'){ insP=k2; break; } }
          colpi.splice(insP,0,{lie:null,distM:null,bastone:null,penalita:false,penTipo:null,
            esito:null,ostacolo:null,lieCorto:null});
        }
        salvaBozza(); rerenderFermo();
      };
      card.appendChild(pg);
    } else {
      const di=el('<div><label>Distanza del putt (metri)</label>'+
        '<input type="number" inputmode="decimal" step="0.1" value="'+(c.distM===null||c.distM===undefined?'':c.distM)+'" placeholder="es. 2,4">'+
        '<div class="distchips">'+[0.5,1,1.5,2,3,5,8,12].map(v=>'<div class="chip'+(c.distM===v?' selected':'')+'" data-v="'+v+'">'+String(v).replace('.',',')+' m</div>').join('')+'</div>'+
        (ultimo?'<div class="hint tight" style="margin-top:6px">La distanza da cui e’ partito il putt imbucato.</div>':'')+
      '</div>');
      di.querySelector('input').onchange=e=>{
        c.distM=e.target.value===''?null:parseFloat(e.target.value);
        salvaBozza(); rerenderFermo();
      };
      di.querySelector('.distchips').onclick=e=>{
        const ch=e.target.closest('.chip'); if(!ch) return;
        c.distM=parseFloat(ch.dataset.v); salvaBozza(); rerenderFermo();
      };
      card.appendChild(di);
    }

    /* --- v9: i due bit di difficolta' del colpo corto, entro i 30 yd ---
       Entro quella distanza il lie domina la difficolta', e "rough" mette insieme
       un pelato e un soffice che sono due colpi diversi. Facoltativi entrambi:
       circa 7 colpi a giro, un tocco ciascuno, si toccano di nuovo per togliere. */
    if(!isPutt && i>0 && !c.penalita && c.distM>0 && c.distM*M_TO_YD<=30){
      const dc=el('<div style="margin-top:12px">'+
        '<label>Il colpo corto <span style="font-weight:400">(facoltativo)</span></label>'+
        '<div class="hint tight" style="margin-bottom:6px">Da qui il gioco corto si legge per difficolta\u2019 '+
          'e non solo per lie: e\u2019 quello che distingue un chip comodo da uno che non si poteva salvare.</div>'+
        '<div class="grid2" id="ostG">'+
          '<div class="chip small'+(c.ostacolo===true?' selected':'')+'" data-v="si">Ostacolo da superare</div>'+
          '<div class="chip small'+(c.ostacolo===false?' selected':'')+'" data-v="no">Via libera</div>'+
        '</div>'+
        '<div class="grid3" id="lcG" style="margin-top:6px">'+LIECORTO_OPZ.map(x=>
          '<div class="chip small'+(c.lieCorto===x.k?' selected':'')+'" data-v="'+x.k+'">'+x.n+'</div>').join('')+'</div>'+
      '</div>');
      dc.querySelector('#ostG').onclick=e=>{
        const ch=e.target.closest('.chip'); if(!ch) return;
        const v = ch.dataset.v==='si';
        c.ostacolo = c.ostacolo===v ? null : v;
        salvaBozza(); rerenderFermo();
      };
      dc.querySelector('#lcG').onclick=e=>{
        const ch=e.target.closest('.chip'); if(!ch) return;
        c.lieCorto = c.lieCorto===ch.dataset.v ? null : ch.dataset.v;
        salvaBozza(); rerenderFermo();
      };
      card.appendChild(dc);
    }

    /* --- griglia di atterraggio: dentro la scheda del colpo di cui parla --- */
    if(IMP().esitoAttivo && !ultimo && !c.penalita){
      const raggioNoto = next && next.distM>0;
      const serve = serveEsito(colpi, i, b.par);
      const attesa = next && next.lie!=='green' && !raggioNoto;
      if(serve){
        const eg=el('<div class="esitowrap" style="margin-top:12px">'+
          '<label>Dov’e’ finita la palla, rispetto alla bandiera?</label>'+
          '<div class="hint tight">'+(next.lie==='green'
            ? 'E’ arrivata in green: il raggio e’ la distanza del putt successivo.'
            : 'E’ finita a '+next.distM+' m dalla buca (la distanza della scheda dopo): il settore aggiunge la direzione.'+
              (next.distM>ESITO_SOGLIA_M ? ' Oltre i '+ESITO_SOGLIA_M+' m il settore serve al pattern di errore e non alla misura: '+
               'il verso conta, la magnitudine no.' : ''))+'</div>'+
          '<div class="esitogrid">'+ESITI.map(x=>'<div class="esitocell'+(x.k==='P'?' centro':'')+(c.esito===x.k?' selected':'')+'" data-v="'+x.k+'">'+
            (x.k==='P'?'<span class="fl">⛳</span>':'')+'<span>'+x.n+'</span></div>').join('')+'</div></div>');
        eg.querySelector('.esitogrid').onclick=e=>{
          const ch=e.target.closest('.esitocell'); if(!ch) return;
          c.esito = c.esito===ch.dataset.v ? null : ch.dataset.v;
          salvaBozza(); rerenderFermo();
        };
        card.appendChild(eg);
      } else if(attesa){
        card.appendChild(el('<div class="hint tight" style="margin-top:10px;opacity:.7">La griglia di atterraggio '+
          'compare qui appena la scheda successiva dira’ dove e’ finita la palla.</div>'));
      }
    }
    body.appendChild(card);
  });

  /* --- salvataggio --- */
  const isUlt = idx===bozza.numBuche-1;
  const save=el('<button class="btn big">Salva la buca'+(isUlt?' · termina giro':' →')+'</button>');
  save.onclick=()=>salvaBucaBatch(b, idx, true);
  body.appendChild(save);
  const racc=el('<button class="btn ghost">Buca non completata (raccolta o concessa)</button>');
  racc.onclick=()=>{
    if(!confirm('Segnare la buca come non completata?\n\nIl punteggio resta quello dei colpi registrati, ma la buca viene marcata e resta fuori dai calcoli che richiedono una buca chiusa.')) return;
    salvaBucaBatch(b, idx, false);
  };
  body.appendChild(racc);
  const cambia=el('<button class="btn ghost" style="opacity:.85">↺ Cambia risultato (rifa’ le schede)</button>');
  cambia.onclick=()=>{
    if(!confirm('Rifare le schede di questa buca? Quello che hai inserito qui andra’ perso.')) return;
    b.dich=null; b.colpi=[]; salvaBozza(); render();
  };
  body.appendChild(cambia);

  return {header:bozza.circolo, body};
};

/* --- validazione e salvataggio della buca compilata a schede --- */
function salvaBucaBatch(b, idx, completata){
  const colpi=b.colpi;
  // 1. completezza, scheda per scheda
  const manca=[];
  colpi.forEach((c,i)=>{
    const n=i+1, putt=c.lie==='green';
    const nome = putt ? ('putt '+colpi.slice(0,i+1).filter(x=>x.lie==='green').length) : ('colpo '+n);
    if(!putt && !c.lie) manca.push(nome+': manca il lie');
    if(c.distM===null || c.distM===undefined || isNaN(c.distM)) manca.push(nome+': manca la distanza');
    if(!putt && !c.bastone) manca.push(nome+': manca il bastone');
  });
  if(manca.length){
    alert('Prima di salvare completa le schede:\n\n• '+manca.join('\n• '));
    return;
  }
  // 2. controlli di plausibilita', colpo per colpo, come nell'inserimento uno a uno
  let avvisi=[], blocchi=[];
  colpi.forEach((c,i)=>{
    const av=controlliColpo({lie:c.lie, distM:c.distM, bastone:c.bastone, par:b.par,
      colpi:colpi.slice(0,i), distanzaBuca:b.distanza});
    av.forEach(a=>{
      const riga={liv:a.liv, txt:'Colpo '+(i+1)+' — '+a.txt};
      if(a.liv==='blocco') blocchi.push(riga); else avvisi.push(riga);
    });
  });
  if(blocchi.length){
    alert('Ci sono dati impossibili da salvare cosi’:\n\n• '+blocchi.map(x=>x.txt).join('\n• '));
    return;
  }
  // 3. settori mancanti dove servivano — una domanda sola, non una per colpo
  if(IMP().esitoAttivo){
    const senza=[];
    colpi.forEach((c,i)=>{
      if(c.esito) return;
      if(serveEsito(colpi, i, b.par)) senza.push(i+1);
    });
    if(senza.length){
      if(!confirm('Manca la griglia di atterraggio su '+(senza.length===1?'una scheda':senza.length+' schede')+
        ' (colpo '+senza.join(', ')+').\n\nEntro i 40 m il settore corregge la distanza per bastone, che senza di lui sottostima le palle finite oltre la bandiera o di lato. Oltre i 40 m serve al pattern di errore: sono i colpi che costano il punteggio, ed erano gli unici senza direzione.\n\nSalvare lo stesso?')) return;
    }
  }
  // 4. i controlli sulla buca intera, e poi la strada gia' collaudata
  const conf=testoConferma(avvisi);
  if(conf && !confirm(conf)) return;
  chiudiBuca(b, idx, completata);
}

/* --- chiusura della buca --- */
function chiudiBuca(b, idx, completata){
  // l'esito del colpo precedente e' noto anche adesso: la palla e' in buca,
  // quindi il raggio residuo e' zero e non serve nessun settore.
  const av=controlliBuca(b, b.colpi);
  if(haBlocchi(av)){ alert(av.filter(a=>a.liv==='blocco').map(a=>a.txt).join('\n\n')); return; }
  const conf=testoConferma(av);
  if(conf && !confirm(conf)) return;
  b.chiusa=true; b.completata=!!completata;
  const isUlt = idx===bozza.numBuche-1;
  if(isUlt) chiudiGiro();
  else { bozza.bucaCorrente++; salvaBozza(); render(); }
}

function chiudiGiro(){
  const av=controlliGiro(bozza);
  const conf=testoConferma(av);
  if(conf && !confirm(conf+'\n\n(Il giro viene salvato comunque: puoi correggerlo dopo dal riepilogo.)')){
    // l'utente ha detto no: si resta sulla buca, niente e' perduto
    return;
  }
  bozza.stato='completato';
  bozza.salvatoIl = Date.now();
  bozza.misura = IMP().misura;
  bozza.slope = IMP().slope;
  marcaModifica(bozza);
  const giri=LS.get('hcp_giri',[]); giri.push(bozza); LS.set('hcp_giri',giri);
  snapshotSalva();
  bastCacheReset();
  const id=bozza.id; LS.set('hcp_bozza_v3',null); bozza=null;
  replaceTop('riepilogoGiro',{id});
  syncAuto();
}
/* ==========================================================
   STATISTICHE — cinque pannelli
   ==========================================================
   Regola nuova, applicata ovunque: accanto a ogni numero c'e' su quante
   osservazioni e' calcolato, e nessun commento automatico scatta su una soglia
   fissa. Le soglie sono due errori standard, calcolati sui dati reali.        */
VIEWS.statistiche = function(){
  const tutti=LS.get('hcp_giri',[]).filter(g=>g.buche&&g.buche.length);
  const body=el('<div></div>');
  if(!tutti.length){
    body.appendChild(el('<div class="card"><h2>Ancora nessun dato</h2>'+
      '<div class="hint">Le statistiche compaiono qui appena completi il primo giro.</div></div>'));
    const b=el('<button class="btn">+ Registra il primo giro</button>');
    b.onclick=()=>push('nuovoGiro'); body.appendChild(b);
    return {header:'Statistiche', body};
  }

  const circoli=[...new Set(tutti.map(g=>g.circolo))], tees=[...new Set(tutti.map(g=>g.tee))];
  const f=el('<div class="filters">'+
    '<div class="full"><label>Circolo</label><select id="fC"><option value="__tutti__">Tutti i circoli</option>'+
      circoli.map(c=>'<option value="'+esc(c)+'"'+(STAT_F.circolo===c?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div>'+
    '<div><label>Tee</label><select id="fT"><option value="__tutti__">Tutti</option>'+
      tees.map(t=>'<option value="'+esc(t)+'"'+(STAT_F.tee===t?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select></div>'+
    '<div><label>Periodo</label><select id="fP">'+
      '<option value="tutti"'+(STAT_F.periodo==='tutti'?' selected':'')+'>Tutti i giri</option>'+
      '<option value="5"'+(STAT_F.periodo==='5'?' selected':'')+'>Ultimi 5</option>'+
      '<option value="10"'+(STAT_F.periodo==='10'?' selected':'')+'>Ultimi 10</option>'+
      '<option value="20"'+(STAT_F.periodo==='20'?' selected':'')+'>Ultimi 20</option></select></div>'+
    '<div class="full"><label>Confronto strokes gained</label><select id="fB">'+
      '<option value="tour"'+(STAT_F.baseline!=='media'?' selected':'')+'>PGA Tour (dato pubblicato)</option>'+
      '<option value="media"'+(STAT_F.baseline==='media'?' selected':'')+'>La tua media (ultimi 20 giri)</option></select></div>'+
  '</div>');
  /* v10: rerenderFermo invece di render, cosi' cambiare un filtro non riporta
     la pagina in cima. L'intestazione e' fissa, la posizione va conservata.  */
  f.querySelector('#fC').onchange=e=>{STAT_F.circolo=e.target.value; rerenderFermo();};
  f.querySelector('#fT').onchange=e=>{STAT_F.tee=e.target.value; rerenderFermo();};
  f.querySelector('#fP').onchange=e=>{STAT_F.periodo=e.target.value; rerenderFermo();};
  f.querySelector('#fB').onchange=e=>{STAT_F.baseline=e.target.value; rerenderFermo();};
  // L3: i filtri stanno dietro un riassunto sempre visibile, che dichiara
  // accanto a ogni numero il perimetro da cui e' calcolato.
  const riassF=(STAT_F.periodo==='tutti'?'Tutti i giri':'Ultimi '+STAT_F.periodo+' giri')+
    ' · '+(STAT_F.circolo==='__tutti__'?'tutti i circoli':STAT_F.circolo)+
    ' · vs '+(STAT_F.baseline==='media'?'la tua media':'Tour');
  /* v12 — striscia di filtri del handoff: quattro chip scrollabili, ognuno con
     etichetta maiuscola, valore e caret. Tocco = apre i selettori sotto, che
     sono quelli veri collegati a STAT_F. */
  const chipTesto={
    periodo: STAT_F.periodo==='tutti'?'tutti':('ultimi '+STAT_F.periodo),
    circolo: STAT_F.circolo==='__tutti__'?'tutti':circoloBreve(STAT_F.circolo),
    tee: STAT_F.tee==='__tutti__'?'tutti':String(STAT_F.tee).toLowerCase(),
    baseline: STAT_F.baseline==='media'?'la tua media':'Tour'
  };
  const striscia=el('<div class="filtri">'+
    [['periodo','Periodo'],['circolo','Circolo'],['tee','Tee'],['baseline','Baseline']].map(x=>
      '<button class="filtro" data-f="'+x[0]+'"><span class="fl">'+x[1]+'</span>'+
      '<span class="fv">'+esc(chipTesto[x[0]])+'</span><span class="fc">\u25be</span></button>').join('')+
    '</div>');
  striscia.onclick=e=>{ if(e.target.closest('.filtro')){ STAT_F.filtri=!STAT_F.filtri; rerenderFermo(); } };
  body.appendChild(striscia);
  if(STAT_F.filtri) body.appendChild(f);

  let sel=tutti.slice().sort((a,b)=>(a.data||'')<(b.data||'')?-1:1);
  if(STAT_F.circolo!=='__tutti__') sel=sel.filter(g=>g.circolo===STAT_F.circolo);
  if(STAT_F.tee!=='__tutti__') sel=sel.filter(g=>g.tee===STAT_F.tee);
  if(STAT_F.periodo!=='tutti') sel=sel.slice(-parseInt(STAT_F.periodo,10));
  if(!sel.length){
    body.appendChild(el('<div class="card"><h2>Nessun giro</h2><div class="hint">Nessun giro corrisponde ai filtri. Allarga la selezione.</div></div>'));
    return {header:'Statistiche', body};
  }

  // v10: la baseline scratch e' dismessa. Era una RICOSTRUZIONE dichiarata, non
  // una tabella pubblicata: restano il PGA Tour (dato pubblicato, Broadie 2012)
  // e la propria media storica (finestra stabile di 20 giri).
  if(STAT_F.baseline==='scratch') STAT_F.baseline='tour';
  const baseCalc = 'tour';
  const A=sel.map(g=>analizzaGiro(g, baseCalc));
  const completi=A.filter(g=>g.completo);
  const nG=A.length, totB=A.reduce((s,g)=>s+g.calc.nBuche,0);
  const sum=k=>A.reduce((s,g)=>s+g.calc[k],0);
  const scoreMedio=sum('score')/nG, diffMedia=(sum('score')-sum('par'))/nG;
  const girPct=Math.round(100*sum('gir')/totB), puttB=sum('putt')/totB;
  const scrOpp=sum('scrOpp'), scrOk=sum('scrOk');
  const scrPct=scrOpp>0?Math.round(100*scrOk/scrOpp):null;
  const etichetta = 'al PGA Tour';
  const MS = STAT_F.baseline==='media' ? mediaStabile(baseCalc) : null;

  /* v12 — card hero: la metrica che apre la schermata, con la sparkline del
     periodo accanto. Metrica predefinita: strokes gained per giro. */
  if(completi.length){
    const serieSG=completi.map(g=>g.calc.sgTot);
    const mSG=media(serieSG);
    body.appendChild(el('<div class="hero"><div class="lab">Strokes gained per giro</div>'+
      '<div class="riga"><div><div class="big" style="color:'+(mSG>=0?'var(--verde-testo)':'var(--rosso)')+'">'+
      sgnIt(mSG,1)+'</div><div class="sub">media su '+completi.length+' giri, rispetto al Tour</div></div>'+
      grafSpark(serieSG)+'</div></div>'));
  } else {
    body.appendChild(el('<div class="hero"><div class="lab">Punteggio medio</div>'+
      '<div class="riga"><div><div class="big">'+scoreMedio.toFixed(1)+'</div>'+
      '<div class="sub">'+sgn(diffMedia,1)+' sul par, su '+nG+' giri</div></div>'+
      grafSpark(A.map(g=>-(g.calc.score-g.calc.par)))+'</div></div>'));
  }
  // R3+L3: KPI a striscia compatta, con delta vs la finestra precedente di pari
  // lunghezza (stessi filtri). Colore di stato solo sul testo, mai da solo: il segno c'e' sempre.
  let prev=null;
  if(STAT_F.periodo!=='tutti'){
    let pool=tutti.slice().sort((a,b)=>(a.data||'')<(b.data||'')?-1:1);
    if(STAT_F.circolo!=='__tutti__') pool=pool.filter(g=>g.circolo===STAT_F.circolo);
    if(STAT_F.tee!=='__tutti__') pool=pool.filter(g=>g.tee===STAT_F.tee);
    const N=parseInt(STAT_F.periodo,10);
    if(pool.length>=N+3){
      const pA=pool.slice(Math.max(0,pool.length-2*N), pool.length-N).map(g=>analizzaGiro(g, baseCalc));
      if(pA.length>=3){
        const ps=k=>pA.reduce((t,g)=>t+g.calc[k],0);
        const pB=pA.reduce((t,g)=>t+g.calc.nBuche,0);
        prev={score:ps('score')/pA.length, gir:100*ps('gir')/pB, putt:ps('putt')/pB,
              scr:ps('scrOpp')>0?100*ps('scrOk')/ps('scrOpp'):null, n:pA.length};
      }
    }
  }
  function s4(lab,v,delta,buonoSuGiu,fmt){
    let d='<div class="d eq">'+(prev?'\u2248':'\u00a0')+'</div>';
    if(prev && delta!==null && Math.abs(delta)>=(fmt.soglia||0.005)){
      const buono = buonoSuGiu==='giu' ? delta<0 : delta>0;
      d='<div class="d '+(buono?'up':'dn')+'">'+sgn(delta,fmt.dec)+(fmt.u||'')+'</div>';
    }
    return '<div class="s4"><div class="lab">'+lab+'</div><div class="v">'+v+'</div>'+d+'</div>';
  }
