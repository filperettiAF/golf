<style>
  :root{
    --verde:#0f5132; --verde-chiaro:#1a7a4a; --verde-testo:#0f5132;
    --bg:#f4f6f5; --card:#ffffff;
    --testo:#1c2621; --grigio:#6b7a72; --bordo:#dfe6e2; --rosso:#b3261e; --ambra:#8a6d00;
    --safe-top:env(safe-area-inset-top); --safe-bottom:env(safe-area-inset-bottom);
    --dv-blue:#2a78d6; --dv-orange:#eb6834; --dv-aqua:#1baf7a;
    --dv-red:#e34948; --dv-neutral:#b8b7ae; --dv-track:#e6e9e7; --dv-good:#0a7d3c;
  }

      --verde:#1a7a4a; --verde-chiaro:#25a163; --verde-testo:#4ecf92;
      --bg:#0d0d0d; --card:#1a1a19;
      --testo:#ffffff; --grigio:#9c9c94; --bordo:#2c2c2a; --rosso:#ff8a80; --ambra:#e0b53a;
      --dv-blue:#3987e5; --dv-orange:#d95926; --dv-aqua:#199e70;
      --dv-red:#e66767; --dv-neutral:#4a4a46; --dv-track:#262625; --dv-good:#0ca30c;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg); color:var(--testo);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; overscroll-behavior:none;}
  body{padding-top:var(--safe-top); padding-bottom:var(--safe-bottom); user-select:none;}
  #app{min-height:100%; display:flex; flex-direction:column;}
  header.topbar{position:sticky; top:0; z-index:20; background:var(--verde); color:#fff;
    display:flex; align-items:center; gap:8px; padding:14px 12px; padding-top:calc(14px + var(--safe-top)); margin-top:calc(-1 * var(--safe-top));}
  header.topbar h1{font-size:17px; margin:0; flex:1; font-weight:600; text-align:center; padding-right:34px;}
  .backbtn{background:none; border:none; color:#fff; font-size:22px; padding:4px 8px; line-height:1;}

  .card{background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); border:1px solid var(--bordo);}
  .card h2{font-size:15px; margin:0 0 10px 0; color:var(--verde-testo); text-transform:uppercase; letter-spacing:.03em;}
  .row{display:flex; gap:10px; margin-bottom:10px;}

  label{display:block; font-size:13px; color:var(--grigio); margin-bottom:4px; font-weight:600;}

    width:100%; padding:12px 10px; font-size:16px; border-radius:10px; border:1.5px solid var(--bordo);
    background:#fff; color:var(--testo);}
  input:focus, select:focus{outline:2px solid var(--verde-chiaro); border-color:var(--verde-chiaro);}
  .btn{display:block; width:100%; padding:16px; font-size:16px; font-weight:700; border:none; border-radius:14px;
    background:var(--verde); color:#fff; margin-bottom:10px; cursor:pointer;}
  .btn:active{background:var(--verde-chiaro);}
  .btn.secondary{background:#e9efec; color:var(--verde-testo);}
  .btn.ghost{background:transparent; color:var(--verde-testo); border:1.5px solid var(--verde); padding:12px;}
  .btn.danger{background:#fbe9e7; color:var(--rosso);}
  .btn.big{padding:18px; font-size:17px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  .chip{padding:14px 6px; font-size:14px; font-weight:600; text-align:center; border-radius:12px;
    background:#eef2f0; color:var(--testo); border:1.5px solid transparent;}
  .chip.selected{background:var(--verde); color:#fff; border-color:var(--verde);}
  .toggle2{display:flex; border-radius:12px; overflow:hidden; border:1.5px solid var(--verde);}
  .toggle2 button{flex:1; padding:14px; border:none; background:#fff; color:var(--verde-testo); font-weight:700; font-size:15px;}
  .toggle2 button.on{background:var(--verde); color:#fff;}
  .hint{font-size:12px; color:var(--grigio); margin-top:-4px; margin-bottom:10px; line-height:1.45;}
  .listitem{display:flex; justify-content:space-between; align-items:center; padding:14px 4px; border-bottom:1px solid var(--bordo);}
  .listitem:last-child{border-bottom:none;}
  .listitem .meta{font-size:12px; color:var(--grigio);}
  .badge{font-size:11px; font-weight:700; padding:3px 8px; border-radius:8px; background:#e9efec; color:var(--verde-testo);}
  .badge.warn{background:#fff4cc; color:var(--ambra);}
  .badge.bozza{background:#fde8e8; color:var(--rosso);}
  .holeprog{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;}
  .holeprog .n{font-size:32px; font-weight:800; color:var(--verde-testo); line-height:1;}
  .holeprog .par{font-size:13px; color:var(--grigio); text-align:right; line-height:1.5;}
  .shot{font-size:12.5px; padding:9px 10px; background:#eef2f0; border-radius:10px; margin-bottom:6px;
    display:flex; justify-content:space-between; gap:8px; align-items:center;}
  .shot .sgv{font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .empty{text-align:center; color:var(--grigio); padding:30px 10px; font-size:14px;}
  .installtip{font-size:12.5px; color:var(--grigio); background:#eef2f0; border-radius:12px; padding:12px; margin-bottom:14px; line-height:1.5;}
  .filters{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;}
  .filters .full{grid-column:1 / -1;}
  .filters select{padding:10px 8px; font-size:14px;}
  .filters label{font-size:11px;}
  .kpigrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .kpi{background:var(--card); border:1px solid var(--bordo); border-radius:14px; padding:12px;}
  .kpi .lab{font-size:10.5px; color:var(--grigio); text-transform:uppercase; letter-spacing:.03em; margin-bottom:5px; line-height:1.3; min-height:26px;}
  .kpi .v{font-size:25px; font-weight:800; color:var(--testo); line-height:1.1;}
  .kpi .u{font-size:12px; font-weight:600; color:var(--grigio);}
  .kpi .sub{font-size:11px; color:var(--grigio); margin-top:3px; line-height:1.3;}

  .dvrow .d{font-size:11.5px; color:var(--grigio);}

    .shot{background:#232322;}
    .installtip{background:#232322;}
    .syncline{background:#232322;}
    .metodo code{background:#232322;}
  }

function interp(table, x){
  const keys = Object.keys(table).map(Number).sort((a,b)=>a-b);
  if(x <= keys[0]) return table[keys[0]];
  if(x >= keys[keys.length-1]) return table[keys[keys.length-1]];
  for(let i=0;i<keys.length-1;i++){
    if(x >= keys[i] && x <= keys[i+1]){
      const t=(x-keys[i])/(keys[i+1]-keys[i]);
      return table[keys[i]] + t*(table[keys[i+1]]-table[keys[i]]);
    }
  }
  return table[keys[keys.length-1]];
}
function scratchPutt(ft){
  if(ft<=0) return 0;
  const p3 = ft<=14 ? 0 : 0.00636*(ft-14);
  return Math.max(1.0, 2 - interp(SCRATCH_MAKE, ft) + p3);
}
function longExtrap(tbl, yd){
  if(yd>=10) return interp(tbl, yd);
  return 2.0 + (tbl[10]-2.0)*(yd/10);
}
function colpiAttesi(lie, distM, baseline){
  if(distM<=0) return 0;
  if(lie==='green'){
    const ft = distM*M_TO_FT;
    return baseline==='scratch' ? scratchPutt(ft) : interp(TOUR_PUTT, ft);
  }
  const yd = distM*M_TO_YD;
  let tbl;
  if(lie==='tee') tbl = yd>=100 ? TOUR_LONG.tee : TOUR_LONG.fairway;
  else tbl = TOUR_LONG[lie] || TOUR_LONG.fairway;
  const tour = longExtrap(tbl, yd);
  return baseline==='scratch' ? 2 + K_SCRATCH*(tour-2) : tour;
}
function categoriaColpo(lie, distM, par){
  if(lie==='green') return 'putting';
  if(lie==='tee' && par>=4) return 'tee';
  if(distM*M_TO_YD <= 30) return 'corto';
  return 'approccio';
}
const CAT_NOME = {tee:'Colpo dal tee', approccio:'Approccio', corto:'Gioco corto', putting:'Putting'};

/* ==========================================================
   STORAGE
   ========================================================== */
/* Archiviazione a strati:
   1. memoria      — tutte le viste leggono da qui, in modo sincrono
   2. localStorage — scrittura immediata, sopravvive alla chiusura dell'app
   3. IndexedDB    — copia più capiente e resistente, scritta con un ritardo di 400 ms
   4. snapshot     — le ultime 8 versioni complete dell'archivio, per recuperare
                     da una cancellazione accidentale o da una scrittura corrotta
   Nessuno di questi strati protegge dalla perdita del telefono: per quello
   serve il backup su file (scheda "Backup e ripristino"). */
const SCHEMA_VERSION = 5;
const CHIAVI = ['hcp_archivio_v3','hcp_bastoni_v2','hcp_giri','hcp_giri_archiviati','hcp_bozza_v3','hcp_meta','hcp_impostazioni','hcp_sync','hcp_giri_cancellati'];
let _mem = {}, _idb = null, _idbTimer = null, _idbPending = {};

function idbOpen(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error('IndexedDB non disponibile'));
    const rq = indexedDB.open('hcpstat', 1);
    rq.onupgradeneeded = ()=>{ const db=rq.result; if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); };
    rq.onsuccess = ()=>res(rq.result);
    rq.onerror = ()=>rej(rq.error);
  });
}
function idbGet(db,k){
  return new Promise(res=>{ try{ const r=db.transaction('kv','readonly').objectStore('kv').get(k);
    r.onsuccess=()=>res(r.result); r.onerror=()=>res(undefined); }catch(e){ res(undefined); } });
}
function idbPut(db,k,v){
  return new Promise(res=>{ try{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k);
    t.oncomplete=()=>res(true); t.onerror=()=>res(false); }catch(e){ res(false); } });
}
function idbFlush(){
  if(!_idb) return;
  const da = _idbPending; _idbPending = {};
  Object.keys(da).forEach(k=>idbPut(_idb, k, da[k]));
}
const LS = {
  get(k,d){ return (k in _mem && _mem[k]!==undefined && _mem[k]!==null) ? _mem[k] : (k in _mem ? _mem[k] : d); },
  set(k,v){
    _mem[k]=v;
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ /* quota piena: resta IndexedDB */ }
    _idbPending[k]=v;
    clearTimeout(_idbTimer); _idbTimer=setTimeout(idbFlush, 400);
  }
};

async function snapshotSalva(etichetta){
  if(!_idb) return;
  try{
    const snaps = (await idbGet(_idb,'snapshots')) || [];
    snaps.push({ts:Date.now(), etichetta:etichetta||null, giri:_mem['hcp_giri']||[]});
    while(snaps.length>8) snaps.shift();
    await idbPut(_idb,'snapshots',snaps);
  }catch(e){}
}
async function snapshotElenco(){
  if(!_idb) return [];
  try{ return (await idbGet(_idb,'snapshots'))||[]; }catch(e){ return []; }
}

async function initStore(){
  // 1. localStorage
  CHIAVI.forEach(k=>{ try{ const v=localStorage.getItem(k); if(v!=null) _mem[k]=JSON.parse(v); }catch(e){} });
  // 2. IndexedDB: vince se contiene più giri (localStorage può essere stato sfoltito da iOS)
  try{
    _idb = await idbOpen();
    for(const k of CHIAVI){
      const v = await idbGet(_idb,k);
      if(v===undefined) continue;
      if(k==='hcp_giri'){
        const nLoc=(_mem[k]||[]).length, nIdb=(v||[]).length;
        if(nIdb>nLoc) _mem[k]=v;
      } else if(!(k in _mem)) _mem[k]=v;
    }
  }catch(e){ _idb=null; }
  // 3. valori di partenza
  if(!_mem['hcp_archivio_v3']) _mem['hcp_archivio_v3']=ARCHIVIO_DEFAULT;
  if(!_mem['hcp_bastoni_v2'])  _mem['hcp_bastoni_v2']=BASTONI_DEFAULT;
  if(!Array.isArray(_mem['hcp_giri'])) _mem['hcp_giri']=[];
  if(!_mem['hcp_impostazioni']) _mem['hcp_impostazioni']={misura:'bandiera'};
  if(!Array.isArray(_mem['hcp_giri_cancellati'])) _mem['hcp_giri_cancellati']=[];
  if(!_mem['hcp_sync'] || typeof _mem['hcp_sync']!=='object') _mem['hcp_sync']={};
  if(!_mem['hcp_sync'].giri || typeof _mem['hcp_sync'].giri!=='object') _mem['hcp_sync'].giri={};
  if(!_mem['hcp_sync'].repo) _mem['hcp_sync'].repo='golf-dati';
  const meta = _mem['hcp_meta'] || {schema:0, ultimoBackup:null, avvisoLegacy:0};
  if(!Array.isArray(_mem['hcp_giri_archiviati'])) _mem['hcp_giri_archiviati']=[];

  // 4. migrazioni di schema.
  // Regola ferrea: prima di toccare qualunque cosa si salva una copia completa,
  // e nessuna migrazione elimina dati — al massimo li mette da parte.
  if((meta.schema||0) < SCHEMA_VERSION && (_mem['hcp_giri']||[]).length){
    await snapshotSalva('prima dell\u2019aggiornamento a v'+SCHEMA_VERSION);
  }
  if((meta.schema||0) < 4){
    const vecchi=_mem['hcp_giri'].filter(g=>!(g.buche && g.buche[0] && Array.isArray(g.buche[0].colpi)));
    if(vecchi.length){
      _mem['hcp_giri_archiviati']=_mem['hcp_giri_archiviati'].concat(vecchi);
      _mem['hcp_giri']=_mem['hcp_giri'].filter(g=>g.buche && g.buche[0] && Array.isArray(g.buche[0].colpi));
      meta.rimossiLegacy=(meta.rimossiLegacy||0)+vecchi.length;
    }
    meta.schema=4;
  }
  if((meta.schema||0) < 5){
    // archivio campi rifatto sulle carte ufficiali GES Golf (tutti i tee, CR e Slope)
    _mem['hcp_archivio_v3']=ARCHIVIO_DEFAULT;
    meta.archivioRifatto=1;
    meta.schema=SCHEMA_VERSION;
  }
  _mem['hcp_meta']=meta;
  // 5. riscrivi tutto su entrambi gli strati
  CHIAVI.forEach(k=>{ if(k in _mem) LS.set(k,_mem[k]); });
  idbFlush();
  // 6. chiedi a iOS di non sfrattare i dati
  try{ if(navigator.storage && navigator.storage.persist){
    const gia = await navigator.storage.persisted();
    if(!gia) await navigator.storage.persist();
  } }catch(e){}
}

/* ==========================================================
   ANALISI GIRO
   ========================================================== */
function formatoCompleto(g){ return !!(g.buche && g.buche[0] && Array.isArray(g.buche[0].colpi)); }

function analizzaGiro(g, baseline){
  baseline = baseline || 'tour';
  if(!formatoCompleto(g)) return analizzaGiroLegacy(g);
  let score=0,par=0,putt=0,pen=0,gir=0,scrOpp=0,scrOk=0;
  const sgCat = {tee:0, approccio:0, corto:0, putting:0};
  const nCat  = {tee:0, approccio:0, corto:0, putting:0};
  const buche = g.buche.map((b,i)=>{
    const colpi = b.colpi||[];
    const penB = colpi.reduce((s,c)=>s+(c.penalita?1:0),0);
    const nPutt = colpi.filter(c=>c.lie==='green').length;
    const sc = colpi.length + penB;
    const perGreen = colpi.length - nPutt + penB;
    const girHit = colpi.length>0 && perGreen <= (b.par-2);
    let sgB = 0;
    const dettaglio = colpi.map((c,ci)=>{
      const next = colpi[ci+1] || null;
      const e0 = colpiAttesi(c.lie, c.distM, baseline);
      const e1 = next ? colpiAttesi(next.lie, next.distM, baseline) : 0;
      const sg = e0 - e1 - 1 - (c.penalita?1:0);
      const cat = categoriaColpo(c.lie, c.distM, b.par);
      sgCat[cat]+=sg; nCat[cat]++; sgB+=sg;
      return {...c, sg, cat, e0, e1};
    });
    score+=sc; par+=b.par; putt+=nPutt; pen+=penB;
    if(girHit){ gir++; } else { scrOpp++; if(sc<=b.par) scrOk++; }
    return {buca:i+1, par:b.par, distanza:b.distanza, score:sc, putt:nPutt, girHit,
            diff:sc-b.par, sg:sgB, colpi:dettaglio};
  });
  const sgTot = sgCat.tee+sgCat.approccio+sgCat.corto+sgCat.putting;
  return {...g, completo:true, calc:{score,par,putt,pen,gir,scrOpp,scrOk,nBuche:buche.length,
          sgCat, nCat, sgTot}, bucheCalc:buche};
}

// Giri registrati con la versione precedente dell'app: niente strokes gained
function analizzaGiroLegacy(g){
  let score=0,par=0,putt=0,corto=0,lunghi=0,pen=0,gir=0,scrOpp=0,scrOk=0;
  const buche=(g.buche||[]).map((b,i)=>{
    const p=(b.colpiLunghi||[]).filter(c=>c.penalita).length;
    const perGreen=(b.colpiLunghi||[]).length+(b.colpiCorto||0)+p;
    const sc=(b.totaleColpi!=null&&b.totaleColpi>0)?b.totaleColpi:(perGreen+(b.putt||0));
    const girHit=perGreen<=(b.par-2);
    score+=sc; par+=b.par; putt+=(b.putt||0); corto+=(b.colpiCorto||0);
    lunghi+=(b.colpiLunghi||[]).length; pen+=p;
    if(girHit) gir++; else { scrOpp++; if(sc<=b.par) scrOk++; }
    return {buca:i+1,par:b.par,score:sc,putt:(b.putt||0),girHit,diff:sc-b.par,sg:null,colpi:[]};
  });
  return {...g, completo:false, calc:{score,par,putt,pen,gir,scrOpp,scrOk,nBuche:buche.length,
          sgCat:null,nCat:null,sgTot:null}, bucheCalc:buche};
}

function statBastoni(giri){
  const m={};
  giri.forEach(g=>(g.buche||[]).forEach(b=>{
    const colpi = b.colpi || null;
    if(!colpi) return;
    colpi.forEach((c,ci)=>{
      const k=c.bastone; if(!k) return;
      if(!m[k]) m[k]={bastone:k,usi:0,distTot:0,distN:0,dist:[]};
      m[k].usi++;
      const next=colpi[ci+1];
      const fine = next ? next.distM : 0;
      const perc = c.distM - fine;
      if(perc>0 && c.lie!=='green'){ m[k].distTot+=perc; m[k].distN++; m[k].dist.push(perc); }
    });
  }));
  return Object.values(m).map(x=>{
    const d=x.dist.slice().sort((a,b)=>a-b);
    const q=f=> d.length? d[Math.min(d.length-1, Math.floor(f*(d.length-1)))] : null;
    const mu = x.distN? x.distTot/x.distN : 0;
    const sd = d.length>=3 ? Math.sqrt(d.reduce((s2,v)=>s2+(v-mu)*(v-mu),0)/(d.length-1)) : null;
    return {bastone:x.bastone, usi:x.usi,
      distMedia: x.distN?Math.round(x.distTot/x.distN):null,
      disp: sd!==null?Math.round(sd):null,
      p10: d.length>=5?Math.round(q(0.10)):null, p90: d.length>=5?Math.round(q(0.90)):null,
      dMin: d.length?Math.round(d[0]):null, dMax: d.length?Math.round(d[d.length-1]):null};
  }).sort((a,b)=>b.usi-a.usi);
}

function statPerBuca(A){
  const m={};
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    if(!m[b.buca]) m[b.buca]={buca:b.buca,par:b.par,diffTot:0,n:0};
    m[b.buca].diffTot+=b.diff; m[b.buca].n++;
  }));
  return Object.values(m).map(x=>({...x,diffMedia:x.diffTot/x.n})).sort((a,b)=>b.diffMedia-a.diffMedia);
}

function statMiglioriPeggiori(completi){
  if(completi.length<4) return null;
  const ord=completi.slice().sort((a,b)=>(a.calc.score-a.calc.par)-(b.calc.score-b.calc.par));
  const k=Math.floor(ord.length/2);
  const best=ord.slice(0,k), worst=ord.slice(ord.length-k);
  const cats=['tee','approccio','corto','putting'];
  const md=(arr,c)=>arr.reduce((s,g)=>s+g.calc.sgCat[c],0)/arr.length;
  const par=arr=>arr.reduce((s,g)=>s+(g.calc.score-g.calc.par),0)/arr.length;
  return {k, parBest:par(best), parWorst:par(worst),
    best:cats.reduce((o,c)=>(o[c]=md(best,c),o),{}),
    worst:cats.reduce((o,c)=>(o[c]=md(worst,c),o),{})};
}
function statDaTee(completi){
  const m={};
  completi.forEach(g=>g.bucheCalc.forEach(b=>{
    if(b.par<4 || b.colpi.length<2 || b.colpi[0].lie!=='tee') return;
    const l=b.colpi[1].lie;
    if(!m[l]) m[l]={lie:l,n:0,sopraPar:0,gir:0,sg:0};
    m[l].n++; m[l].sopraPar+=b.diff; if(b.girHit)m[l].gir++; m[l].sg+=b.sg;
  }));
  return Object.values(m).map(x=>({...x, media:x.sopraPar/x.n, girPct:100*x.gir/x.n, sgB:x.sg/x.n}))
    .sort((a,b)=>b.n-a.n);
}
function statPerPar(A){
  const m={};
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    if(!m[b.par]) m[b.par]={par:b.par,n:0,sopraPar:0,gir:0,putt:0};
    m[b.par].n++; m[b.par].sopraPar+=b.diff; if(b.girHit)m[b.par].gir++; m[b.par].putt+=b.putt;
  }));
  return Object.values(m).sort((a,b)=>a.par-b.par)
    .map(x=>({...x, media:x.sopraPar/x.n, girPct:100*x.gir/x.n, puttB:x.putt/x.n}));
}
function statBlocchi(A){
  const b=[0,1,2,3,4,5].map(i=>({i, nome:`${i*3+1}–${i*3+3}`, n:0, sopraPar:0, gir:0, putt:0, sg:0}));
  let nGiri=0;
  A.forEach(g=>{
    if(g.calc.nBuche<18) return;
    nGiri++;
    g.bucheCalc.forEach(h=>{
      const k=Math.floor((h.buca-1)/3); if(k<0||k>5) return;
      const z=b[k];
      z.n++; z.sopraPar+=h.diff; if(h.girHit)z.gir++; z.putt+=h.putt;
      if(h.sg!==null) z.sg+=h.sg;
    });
  });
  return {nGiri, blocchi: nGiri? b.map(x=>({...x,
    parGiro:x.sopraPar/nGiri, girPct:100*x.gir/x.n, puttB:x.putt/x.n, sgGiro:x.sg/nGiri})) : []};
}
function statNove(A){
  const t=[{nome:'Prima nove',n:0,sopraPar:0,gir:0,putt:0},{nome:'Seconda nove',n:0,sopraPar:0,gir:0,putt:0}];
  A.forEach(g=>{ if(g.calc.nBuche<18) return;
    g.bucheCalc.forEach(b=>{ const z=t[b.buca<=9?0:1];
      z.n++; z.sopraPar+=b.diff; if(b.girHit)z.gir++; z.putt+=b.putt; }); });
  return t.filter(x=>x.n>0).map(x=>({...x, media:x.sopraPar/x.n, girPct:100*x.gir/x.n, puttB:x.putt/x.n}));
}

const FASCE_APP=[[0,100,'fino a 100 m'],[100,125,'100–125 m'],[125,150,'125–150 m'],
  [150,175,'150–175 m'],[175,200,'175–200 m'],[200,9999,'oltre 200 m']];
const FASCE_PUTT=[[0,1,'meno di 1 m'],[1,2,'1–2 m'],[2,3,'2–3 m'],[3,5,'3–5 m'],
  [5,8,'5–8 m'],[8,12,'8–12 m'],[12,999,'oltre 12 m']];

function statFasce(A){
  const out=FASCE_APP.map(f=>({label:f[2],lo:f[0],hi:f[1],n:0,sg:0,prox:0,nProx:0,green:0}));
  A.forEach(g=>g.bucheCalc.forEach(b=>b.colpi.forEach((c,i)=>{
    if(c.cat!=='approccio') return;
    const f=out.find(x=>c.distM>=x.lo && c.distM<x.hi); if(!f) return;
    f.n++; f.sg+=c.sg;
    const nx=b.colpi[i+1];
    if(!nx){ f.green++; f.nProx++; }
    else if(nx.lie==='green'){ f.green++; f.prox+=nx.distM; f.nProx++; }
  })));
  return out.filter(x=>x.n>0);
}
function statPutting(A){
  const out=FASCE_PUTT.map(f=>({label:f[2],lo:f[0],hi:f[1],n:0,imbucati:0,sg:0}));
  let bucheConPutt=0, treputt=0;
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    const pt=b.colpi.filter(c=>c.lie==='green');
    if(pt.length){ bucheConPutt++; if(pt.length>=3) treputt++; }
    b.colpi.forEach((c,i)=>{
      if(c.lie!=='green') return;
      const f=out.find(x=>c.distM>=x.lo && c.distM<x.hi); if(!f) return;
      f.n++; f.sg+=c.sg; if(!b.colpi[i+1]) f.imbucati++;
    });
  }));
  return {fasce:out.filter(x=>x.n>0), bucheConPutt, treputt};
}
function statFairway(A){
  let tot=0,presi=0;
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    if(b.par<4 || b.colpi.length<2 || b.colpi[0].lie!=='tee') return;
    tot++; const l=b.colpi[1].lie; if(l==='fairway'||l==='green') presi++;
  }));
  return {tot,presi};
}
function statSand(A){
  let opp=0,ok=0;
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    if(!b.colpi.some(c=>c.lie==='sabbia' && c.distM*M_TO_YD<=30)) return;
    opp++; if(b.score<=b.par) ok++;
  }));
  return {opp,ok};
}
function statPerTipo(A){
  const m={};
  A.forEach(g=>{const t=g.tipo||'—';
    if(!m[t]) m[t]={tipo:t,n:0,sopraPar:0,sg:0,completi:0};
    m[t].n++; m[t].sopraPar+=g.calc.score-g.calc.par;
    if(g.completo){ m[t].sg+=g.calc.sgTot; m[t].completi++; }});
  return Object.values(m).map(x=>({...x, mediaPar:x.sopraPar/x.n,
    mediaSg:x.completi?x.sg/x.completi:null})).sort((a,b)=>b.n-a.n);
}

/* ==========================================================
   GRAFICI A LINEA (SVG inline, nessuna libreria)
   ========================================================== */
function svgLinea(vals, o){
  o=o||{};
  const W=300, H=o.h||86, PL=8, PR=8, PT=16, PB=o.xlab===false?8:17;
  const n=vals.length; if(!n) return '';
  const ys=vals.map(v=>v.y);
  let min=(o.min!==undefined)?o.min:Math.min(...ys);
  let max=(o.max!==undefined)?o.max:Math.max(...ys);
  if(o.zero){ min=Math.min(min,0); max=Math.max(max,0); }
  if(Math.abs(max-min)<1e-9){ max+=1; min-=1; }
  const pad=(max-min)*0.15; min-=pad; max+=pad;
  const X=i=> n===1 ? (PL+(W-PL-PR)/2) : PL + i*(W-PL-PR)/(n-1);
  const Y=v=> PT + (max-v)/(max-min)*(H-PT-PB);
  const col=o.colore||'var(--dv-blue)';
  let sv=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(o.aria||'andamento')}">`;
  if(o.zero && min<0 && max>0) sv+=`<line class="zero" x1="${PL}" y1="${Y(0).toFixed(1)}" x2="${W-PR}" y2="${Y(0).toFixed(1)}"/>`;
  sv+=`<polyline class="lin" style="stroke:${col}" points="${vals.map((v,i)=>X(i).toFixed(1)+','+Y(v.y).toFixed(1)).join(' ')}"/>`;
  vals.forEach((v,i)=>{ sv+=`<circle class="pt" cx="${X(i).toFixed(1)}" cy="${Y(v.y).toFixed(1)}" r="${o.r||3.2}" style="fill:${col}"/>`; });
  const f=o.fmt||(v=>v.toFixed(1));
  // l'etichetta va dalla parte opposta a dove prosegue la linea, per non coprirla
  const posY=i=>{
    if(n===1) return Math.max(10, Y(vals[i].y)-7);
    const nb = i===0 ? 1 : n-2;
    const sale = vals[nb].y > vals[i].y;
    const y = sale ? Y(vals[i].y)+11 : Y(vals[i].y)-7;
    return Math.min(H-PB-1, Math.max(10, y));
  };
  [[0,'start'],[n-1,'end']].forEach(([i,anc])=>{
    if(n===1) anc='middle';
    sv+=`<text class="val" x="${X(i).toFixed(1)}" y="${posY(i).toFixed(1)}" text-anchor="${anc}" style="fill:${col}">${f(vals[i].y)}</text>`;
  });
  if(o.xlab!==false && n>1){
    sv+=`<text x="${PL}" y="${H-3}" text-anchor="start">${esc(vals[0].x)}</text>`;
    sv+=`<text x="${W-PR}" y="${H-3}" text-anchor="end">${esc(vals[n-1].x)}</text>`;
  }
  return sv+'</svg>';
}
function svgBarreDiv(vals, o){
  o=o||{};
  const W=300, H=o.h||128, PL=4, PR=4, PT=15, PB=19;
  const n=vals.length; if(!n) return '';
  const ys=vals.map(v=>v.y);
  const min=Math.min(0,...ys), max=Math.max(0,...ys);
  const rng=(max-min)||1;
  const Y=v=> PT + (max-v)/rng*(H-PT-PB);
  const y0=Y(0);
  const passo=(W-PL-PR)/n, bw=Math.max(6, passo-8);
  const f=o.fmt||(v=>sgn(v,1));
  let sv=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(o.aria||'confronto')}">`;
  sv+=`<line class="zero" x1="${PL}" y1="${y0.toFixed(1)}" x2="${W-PR}" y2="${y0.toFixed(1)}"/>`;
  vals.forEach((v,i)=>{
    const cx=PL+passo*i+passo/2, yv=Y(v.y);
    const alto=Math.max(1.5, Math.abs(yv-y0));
    const col = v.y>0 ? (o.colPos||'var(--dv-red)') : v.y<0 ? (o.colNeg||'var(--dv-blue)') : 'var(--dv-neutral)';
    sv+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${(v.y>=0?yv:y0).toFixed(1)}" width="${bw.toFixed(1)}" height="${alto.toFixed(1)}" rx="3" style="fill:${col}"/>`;
    const ly = v.y>=0 ? Math.max(9, yv-4) : Math.min(H-PB-1, yv+10);
    sv+=`<text class="val" x="${cx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" style="fill:${col}">${f(v.y)}</text>`;
    sv+=`<text x="${cx.toFixed(1)}" y="${H-4}" text-anchor="middle">${esc(v.x)}</text>`;
  });
  return sv+'</svg>';
}
function boxTrend(titolo, vals, colore, o){
  o=Object.assign({h:70, xlab:false, zero:true, colore:colore}, o||{});
  return `<div class="smbox"><div class="t">${esc(titolo)}</div>${svgLinea(vals,o)}</div>`;
}


/* ==========================================================
   SINCRONIZZAZIONE CON IL REPOSITORY PRIVATO
   ==========================================================
   Le sei condizioni non negoziabili, dal piano del 15/08/2026.
   Ogni riga di questo blocco esiste per rispettarne una:

   1. la sincronizzazione AGGIUNGE, non cancella mai
      → nessuna DELETE se non dopo che la copia in cancellati/ è stata scritta
        con successo, e nessun giro sparisce dal telefono senza finire prima
        in hcp_giri_cancellati
   2. nessuna sovrascrittura silenziosa
      → ogni scrittura porta con sé lo sha della versione che ci si aspetta di
        trovare; se non corrisponde, GitHub rifiuta e l'app chiede a te
   3. stato sempre visibile, fallimento sempre annunciato
      → riga di stato in home, scheda Sincronizzazione, nessun errore ingoiato
   4. il backup su file resta la via di scorta
      → la scheda Backup non è stata toccata
   5. repository dati privato, token limitato
      → all'attivazione l'app verifica che il repository sia davvero privato
   6. collaudo su archivio finto prima dei dati veri
      → il campo "api" permette di puntare a un server di prova
*/
const GH_API = 'https://api.github.com';
const SYNC_DEF = {attiva:false, utente:'', repo:'golf-dati', token:'', dispositivo:'',
                  giri:{}, ultimoOk:null, ultimoErrore:null, privato:null, api:null};

function S(){ return Object.assign({}, SYNC_DEF, LS.get('hcp_sync',{})||{}); }
function Sset(patch){ LS.set('hcp_sync', Object.assign(S(), patch)); }

/* --- base64 che regge gli accenti (i nomi dei circoli ne sono pieni) --- */
function b64enc(str){
  const b=new TextEncoder().encode(str); let s='';
  for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
  return btoa(s);
}
function b64dec(b64){
  const bin=atob(String(b64).replace(/\s/g,'')); const b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}

/* --- una sola porta verso GitHub, così gli errori si traducono in un posto solo --- */
async function ghFetch(percorso, opz){
  const s=S();
  if(!s.token) throw Object.assign(new Error('Token non impostato.'),{stato:0});
  opz=opz||{};
  const h={'Authorization':'Bearer '+s.token,
           'Accept':'application/vnd.github+json',
           'X-GitHub-Api-Version':'2022-11-28'};
  if(opz.body) h['Content-Type']='application/json';
  let r;
  try{
    r=await fetch((s.api||GH_API)+percorso, {method:opz.method||'GET', headers:h, body:opz.body});
  }catch(e){
    throw Object.assign(new Error('Non sono riuscito a raggiungere GitHub. Connessione assente o instabile.'),{stato:0});
  }
  if(r.status===204) return null;
  let d=null; try{ d=await r.json(); }catch(e){}
  if(r.ok) return d;
  const msg=(d&&d.message)||'';
  let testo;
  if(r.status===401) testo='Il token non è valido, è scaduto o è stato revocato. Generane uno nuovo su GitHub e reincollalo qui.';
  else if(r.status===403 && /rate limit/i.test(msg)) testo='GitHub ha messo in pausa le richieste per qualche minuto. Riprova fra poco: non si è perso niente.';
  else if(r.status===403) testo='Il token non ha il permesso di scrivere in questo repository. Controlla che sia impostato su "Contents: Read and write" e che includa proprio golf-dati.';
  else if(r.status===404) testo='Non trovo il repository. Controlla il nome utente e il nome del repository, e che il token comprenda proprio quel repository.';
  else if(r.status===409) testo='Il file è cambiato su GitHub dopo l’ultima volta che questo telefono l’ha visto.';
  else if(r.status===422) testo='GitHub ha rifiutato la scrittura: '+(msg||'richiesta non valida')+'.';
  else testo='GitHub ha risposto con un errore ('+r.status+'). '+msg;
  throw Object.assign(new Error(testo),{stato:r.status, github:msg});
}
function ghPath(sotto){
  const s=S();
  return '/repos/'+encodeURIComponent(s.utente)+'/'+encodeURIComponent(s.repo)+'/contents/'+sotto;
}

/* --- nome del file di un giro: deciso una volta sola e poi mai più cambiato,
       così tutti i dispositivi lo chiamano allo stesso modo per sempre --- */
function slug(t){
  return String(t||'campo').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,32) || 'campo';
}
function nomeFileGiro(g){
  if(g.file) return g.file;
  const coda=String(g.id||'').slice(-4) || Math.random().toString(36).slice(2,6);
  return (g.data||'0000-00-00')+'-'+slug(g.circolo)+'-'+coda+'.json';
}
function nomeDispositivoIniziale(){
  const ua=navigator.userAgent||'';
  const base = /iPhone/i.test(ua) ? 'iPhone' : /iPad/i.test(ua) ? 'iPad'
             : /Macintosh|Mac OS/i.test(ua) ? 'Mac' : /Android/i.test(ua) ? 'Android' : 'dispositivo';
  return base+'-'+Math.random().toString(36).slice(2,5);
}
/* Marca un giro come modificato adesso. Questi tre campi sono l'unica aggiunta
   al formato dei giri: servono a riconoscere i duplicati e a vedere i conflitti. */
function marcaModifica(g){
  if(!g) return g;
  if(!g.file) g.file=nomeFileGiro(g);
  g.schema=SCHEMA_VERSION;
  g.modificatoIl=new Date().toISOString();
  g.modificatoDa=S().dispositivo||'dispositivo';
  return g;
}

/* --- stato della sessione corrente (non serve conservarlo: si ricostruisce da solo) --- */
let _sy={inCorso:false, promessa:null, conflitti:[], snapFatto:false, ultimoEsito:null};

function giriDaSincronizzare(){
  const s=S(), giri=LS.get('hcp_giri',[]);
  return giri.filter(g=>{
    const st=s.giri[g.id];
    if(!st) return true;
    return st.modificatoIl !== (g.modificatoIl||null);
  });
}
function cancellatiDaSpostare(){
  return LS.get('hcp_giri_cancellati',[]).filter(c=>!c.spostato);
}
function syncInSospeso(){ return giriDaSincronizzare().length + cancellatiDaSpostare().length; }
function syncConfigurata(){ const s=S(); return !!(s.attiva && s.token && s.utente && s.repo); }

async function snapUnaVolta(){
  if(_sy.snapFatto) return;
  _sy.snapFatto=true;
  await snapshotSalva('prima di una sincronizzazione');
}
function registraConflitto(id, locale, remoto, sha, file){
  if(_sy.conflitti.some(c=>c.id===id)) return;
  _sy.conflitti.push({id:id, locale:locale, remoto:remoto, sha:sha, file:file});
}

/* --- verifica delle impostazioni: legge e basta, non scrive niente --- */
async function syncVerifica(){
  const s=S();
  if(!s.utente) throw new Error('Manca il nome utente GitHub.');
  if(!s.repo)   throw new Error('Manca il nome del repository.');
  if(!s.token)  throw new Error('Manca il token.');
  const r=await ghFetch('/repos/'+encodeURIComponent(s.utente)+'/'+encodeURIComponent(s.repo));
  const privato = r && r.private===true;
  Sset({privato:privato});
  return {privato:privato, nome:(r&&r.full_name)||''};
}

/* --- SALITA: un giro alla volta, ognuno con lo sha che ci si aspetta di trovare --- */
async function syncCaricaGiro(g){
  if(!g.modificatoIl || !g.file){ marcaModifica(g); salvaGiro(g, true); }
  const s=S(), st=s.giri[g.id]||{}, path=ghPath('giri/'+encodeURIComponent(g.file));
  const corpo={message:'giro '+(g.data||'')+' '+(g.circolo||'')+' — '+(s.dispositivo||''),
               content:b64enc(JSON.stringify(g,null,1))};
  if(st.sha) corpo.sha=st.sha;
  let r;
  try{
    r=await ghFetch(path,{method:'PUT', body:JSON.stringify(corpo)});
  }catch(e){
    // 409 = qualcuno ha toccato il file dopo di noi. 422 = il file esiste già e noi
    // non lo sapevamo. In entrambi i casi si guarda cosa c'è davvero prima di scrivere.
    if(e.stato===409 || e.stato===422) return await syncRisolviSalita(g, path);
    throw e;
  }
  const s2=S(); s2.giri[g.id]={sha:r.content.sha, modificatoIl:g.modificatoIl, file:g.file};
  Sset({giri:s2.giri});
  return 'caricato';
}

async function syncRisolviSalita(g, path){
  const remotoRaw=await ghFetch(path);
  let remoto=null;
  try{ remoto=JSON.parse(b64dec(remotoRaw.content)); }catch(e){}
  const s=S(), st=s.giri[g.id]||{};

  // caso A — sul repository c'è già esattamente la nostra versione: nulla da fare
  if(remoto && remoto.modificatoIl===g.modificatoIl){
    const s2=S(); s2.giri[g.id]={sha:remotoRaw.sha, modificatoIl:g.modificatoIl, file:g.file};
    Sset({giri:s2.giri}); return 'allineato';
  }
  // caso B — sul repository c'è la versione che questo telefono aveva caricato,
  // e la nostra discende da quella: non è un conflitto, è un aggiornamento normale
  if(remoto && st.modificatoIl && remoto.modificatoIl===st.modificatoIl){
    const corpo={message:'correzione giro '+(g.data||'')+' — '+(s.dispositivo||''),
                 content:b64enc(JSON.stringify(g,null,1)), sha:remotoRaw.sha};
    const r2=await ghFetch(path,{method:'PUT', body:JSON.stringify(corpo)});
    const s2=S(); s2.giri[g.id]={sha:r2.content.sha, modificatoIl:g.modificatoIl, file:g.file};
    Sset({giri:s2.giri}); return 'caricato';
  }
  // caso C — due versioni diverse, nessuna delle due discende dall'altra:
  // qui l'app si ferma e chiede. Non scrive niente.
  registraConflitto(g.id, g, remoto, remotoRaw.sha, g.file);
  return 'conflitto';
}

async function syncCaricaTutti(){
  const daFare=giriDaSincronizzare();
  let n=0;
  for(const g of daFare){
    const esito=await syncCaricaGiro(g);
    if(esito==='caricato') n++;
  }
  return n;
}

/* --- DISCESA: quello che c'è sul repository e non c'è qui viene aggiunto --- */
async function syncScarica(){
  const s=S();

  // 1. i giri cancellati altrove: si nascondono qui, senza distruggere niente
  let elencoCanc=[];
  try{ elencoCanc=await ghFetch(ghPath('cancellati'))||[]; }
  catch(e){ if(e.stato!==404) throw e; }
  const nomiCanc=new Set((Array.isArray(elencoCanc)?elencoCanc:[]).filter(x=>x.type==='file').map(x=>x.name));
  if(nomiCanc.size){
    const giri=LS.get('hcp_giri',[]);
    const daNascondere=giri.filter(g=>g.file && nomiCanc.has(g.file));
    if(daNascondere.length){
      await snapUnaVolta();
      const canc=LS.get('hcp_giri_cancellati',[]);
      daNascondere.forEach(g=>{
        if(!canc.some(c=>c.id===g.id)) canc.push({id:g.id, file:g.file, giro:g, spostato:true, quando:Date.now()});
      });
      LS.set('hcp_giri_cancellati', canc);
      LS.set('hcp_giri', giri.filter(g=>!(g.file && nomiCanc.has(g.file))));
    }
  }
  const nascostiQui=new Set(LS.get('hcp_giri_cancellati',[]).map(c=>c.file).filter(Boolean));

  // 2. l'elenco dei giri. Non c'è nessun file indice: l'elenco è la cartella stessa.
  let elenco=[];
  try{ elenco=await ghFetch(ghPath('giri'))||[]; }
  catch(e){ if(e.stato===404) elenco=[]; else throw e; }
  if(!Array.isArray(elenco)) elenco=[];

  let nuovi=0, aggiornati=0;
  for(const it of elenco){
    if(it.type!=='file' || !/\.json$/i.test(it.name)) continue;
    if(nomiCanc.has(it.name) || nascostiQui.has(it.name)) continue;

    const giri=LS.get('hcp_giri',[]);
    const locale=giri.find(g=>g.file===it.name) || null;
    const st=locale ? (S().giri[locale.id]||{}) : {};
    if(locale && st.sha===it.sha) continue;      // già identico: non si scarica

    let d=null;
    const r=await ghFetch(ghPath('giri/'+encodeURIComponent(it.name)));
    try{ d=JSON.parse(b64dec(r.content)); }catch(e){ continue; }
    if(!d || !d.id || !Array.isArray(d.buche)) continue;
    if(!d.file) d.file=it.name;

    const perId=giri.find(g=>g.id===d.id) || locale;

    if(!perId){                                   // giro nuovo: si aggiunge, punto
      await snapUnaVolta();
      giri.push(d); LS.set('hcp_giri', giri);
      const s2=S(); s2.giri[d.id]={sha:r.sha, modificatoIl:d.modificatoIl||null, file:d.file};
      Sset({giri:s2.giri}); nuovi++; continue;
    }
    if((d.modificatoIl||null)===(perId.modificatoIl||null)){   // stessa versione
      const s2=S(); s2.giri[perId.id]={sha:r.sha, modificatoIl:perId.modificatoIl||null, file:perId.file||it.name};
      Sset({giri:s2.giri}); continue;
    }
    const stId=S().giri[perId.id]||{};
    const localeIntatto = stId.modificatoIl===(perId.modificatoIl||null);
    if(localeIntatto){                            // qui non è stato toccato: si accetta
      await snapUnaVolta();
      const i=giri.findIndex(g=>g.id===perId.id);
      giri[i]=d; LS.set('hcp_giri', giri);
      const s2=S(); s2.giri[d.id]={sha:r.sha, modificatoIl:d.modificatoIl||null, file:d.file};
      Sset({giri:s2.giri}); aggiornati++; continue;
    }
    // toccato in tutti e due i posti: si chiede, non si sceglie da soli
    registraConflitto(perId.id, perId, d, r.sha, perId.file||it.name);
  }
  idbFlush();
  return {nuovi:nuovi, aggiornati:aggiornati};
}

/* --- CANCELLAZIONE: spostamento, mai distruzione --- */
async function syncSpostaCancellati(){
  const canc=LS.get('hcp_giri_cancellati',[]);
  let mosso=0;
  for(const c of canc){
    if(c.spostato || !c.file) continue;
    const pNuovo=ghPath('cancellati/'+encodeURIComponent(c.file));
    const pVecchio=ghPath('giri/'+encodeURIComponent(c.file));
    // 1. prima la copia di sicurezza in cancellati/
    let shaEsistente=null;
    try{ const e=await ghFetch(pNuovo); shaEsistente=e.sha; }
    catch(e){ if(e.stato!==404) throw e; }
    const corpo={message:'giro rimosso dal telefono '+(S().dispositivo||''),
                 content:b64enc(JSON.stringify(c.giro,null,1))};
    if(shaEsistente) corpo.sha=shaEsistente;
    await ghFetch(pNuovo,{method:'PUT', body:JSON.stringify(corpo)});
    // 2. solo adesso, e solo perché la copia esiste, il file esce da giri/
    try{
      const v=await ghFetch(pVecchio);
      await ghFetch(pVecchio,{method:'DELETE',
        body:JSON.stringify({message:'spostato in cancellati/', sha:v.sha})});
    }catch(e){ if(e.stato!==404) throw e; }
    c.spostato=true; mosso++;
    const s2=S(); delete s2.giri[c.id]; Sset({giri:s2.giri});
  }
  if(mosso) LS.set('hcp_giri_cancellati', canc);
  return mosso;
}

/* --- il giro di sincronizzazione completo --- */
function syncEsegui(){
  if(!syncConfigurata()) return Promise.resolve({esito:'spenta'});
  // Se una sincronizzazione è già in corso — per esempio quella automatica
  // dell'apertura — chi arriva dopo non viene respinto: aspetta quella.
  if(_sy.inCorso && _sy.promessa) return _sy.promessa;
  if(navigator.onLine===false){
    Sset({ultimoErrore:'Nessuna connessione. I giri restano nel telefono e salgono da soli appena torna la rete.'});
    return Promise.resolve({esito:'offline'});
  }
  _sy.inCorso=true; _sy.snapFatto=false; _sy.conflitti=[];
  _sy.promessa=_syncEseguiOra();
  return _sy.promessa;
}
async function _syncEseguiOra(){
  try{
    const mossi=await syncSpostaCancellati();
    const giu=await syncScarica();
    const su=await syncCaricaTutti();
    Sset({ultimoOk:Date.now(), ultimoErrore:null});
    _sy.ultimoEsito={caricati:su, nuovi:giu.nuovi, aggiornati:giu.aggiornati, rimossi:mossi,
                     conflitti:_sy.conflitti.length};
    return Object.assign({esito:'ok'}, _sy.ultimoEsito);
  }catch(e){
    const m=e&&e.message||String(e);
    Sset({ultimoErrore:m});
    return {esito:'errore', messaggio:m};
  }finally{ _sy.inCorso=false; _sy.promessa=null; }
}

/* Sincronizzazione di sfondo: non blocca mai l'uso dell'app e, se va male,
   lascia il segno nella riga di stato invece di sparire in silenzio. */
function syncAuto(){
  if(!syncConfigurata()) return;
  syncEsegui().then(r=>{
    if(!r || r.esito==='spenta' || r.esito==='gia_in_corso') return;
    const v=nav[nav.length-1].view;
    if(v==='home' || v==='sincronizza') render();
  });
}

/* --- cancellazione di un giro dal telefono --- */
function eliminaGiroLocale(g){
  const giri=LS.get('hcp_giri',[]);
  const i=giri.findIndex(x=>x.id===g.id);
  if(i<0) return;
  snapshotSalva('prima di eliminare un giro');
  const canc=LS.get('hcp_giri_cancellati',[]);
  if(!canc.some(c=>c.id===g.id)){
    canc.push({id:g.id, file:g.file||nomeFileGiro(g), giro:g,
               spostato: !S().giri[g.id], quando:Date.now()});
    LS.set('hcp_giri_cancellati', canc);
  }
  giri.splice(i,1); LS.set('hcp_giri', giri); idbFlush();
  syncAuto();
}

/* --- risoluzione di un conflitto, decisa da te --- */
function risolviConflitto(id, scelta){
  const c=_sy.conflitti.find(x=>x.id===id); if(!c) return;
  const giri=LS.get('hcp_giri',[]); const i=giri.findIndex(g=>g.id===id);
  snapshotSalva('prima di risolvere un conflitto');
  if(scelta==='locale'){
    // si tiene la versione del telefono: le si dà l'ora di adesso e si allinea
    // lo sha a quello che c'è ora sul repository, così la prossima salita passa
    const g=giri[i]; if(g){ marcaModifica(g); giri[i]=g; LS.set('hcp_giri',giri); }
    const s2=S(); s2.giri[id]={sha:c.sha, modificatoIl:null, file:c.file}; Sset({giri:s2.giri});
  }else{
    // si tiene la versione del repository
    if(i>=0 && c.remoto){ giri[i]=c.remoto; LS.set('hcp_giri',giri); }
    else if(c.remoto){ giri.push(c.remoto); LS.set('hcp_giri',giri); }
    const s2=S(); s2.giri[id]={sha:c.sha, modificatoIl:(c.remoto&&c.remoto.modificatoIl)||null, file:c.file};
    Sset({giri:s2.giri});
  }
  _sy.conflitti=_sy.conflitti.filter(x=>x.id!==id);
  idbFlush();
  syncAuto(); render();
}

/* La riga di stato in home. Esiste per la condizione 3: lo stato della
   sincronizzazione deve essere visibile senza doverlo andare a cercare. */
function rigaStatoSync(){
  const s=S(), sosp=syncInSospeso();
  let col, testo;
  if(!s.attiva){
    col='var(--grigio)';
    testo='<b>Sincronizzazione spenta.</b> I giri vivono solo in questo telefono. Tocca per attivarla.';
  } else if(s.ultimoErrore){
    col='var(--rosso)';
    testo='<b>Sincronizzazione ferma.</b> '+esc(String(s.ultimoErrore).slice(0,90))+(String(s.ultimoErrore).length>90?'…':'');
  } else if(_sy.conflitti.length){
    col='var(--ambra)';
    testo='<b>'+_sy.conflitti.length+' giro/i da decidere.</b> Due versioni diverse dello stesso giro: tocca per scegliere.';
  } else if(sosp>0){
    col='var(--ambra)';
    testo='<b>'+sosp+(sosp===1?' giro non ancora al sicuro.':' giri non ancora al sicuro.')+'</b> Salgono da soli appena c\u2019\u00e8 rete.';
  } else {
    col='var(--dv-good)';
    testo='<b>Tutto al sicuro.</b> Ultimo invio '+esc(quandoTesto(s.ultimoOk))+'.';
  }
  const r=el('<div class="syncline"><span class="pallino" style="background:'+col+'"></span><span>'+testo+'</span><span class="frecc">\u203A</span></div>');
  r.onclick=()=>push('sincronizza');
  return r;
}

function quandoTesto(ts){
  if(!ts) return 'mai';
  const d=new Date(ts), ora=Date.now(), diff=(ora-ts)/1000;
  if(diff<90) return 'poco fa';
  if(diff<3600) return Math.round(diff/60)+' minuti fa';
  const oggi=new Date().toDateString()===d.toDateString();
  const hh=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  return oggi ? 'oggi alle '+hh : d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})+' alle '+hh;
}

  selC.onchange=()=>{ body.querySelector('#altroWrap').style.display = selC.value==='__altro__'?'block':'none'; aggiornaTee(); };

  body.querySelector('#go').onclick=()=>{

/* ---------------- BUCA: registrazione colpo per colpo ---------------- */
VIEWS.buca = function(){
  if(!bozza){ nav=[{view:'home'}]; return VIEWS.home(); }
  const idx=bozza.bucaCorrente, b=bozza.buche[idx];
  const bastoni=LS.get('hcp_bastoni_v2',BASTONI_DEFAULT);
  const body=el('<div></div>');

  body.appendChild(el(`<div class="holeprog">
    <div><div class="n">Buca ${idx+1}<span style="font-size:15px;color:var(--grigio)">/${bozza.numBuche}</span></div></div>
    <div class="par">Par <select id="parSel" style="width:56px;display:inline-block;padding:3px;">
        ${[3,4,5,6].map(p=>`<option ${p===b.par?'selected':''}>${p}</option>`).join('')}</select><br>
      <input type="number" id="distSel" value="${b.distanza??''}" placeholder="metri" style="width:76px;margin-top:4px;padding:3px;font-size:13px;"> m</div>
  </div>`));
  body.querySelector('#parSel').onchange=e=>{ b.par=parseInt(e.target.value,10); salvaBozza(); render(); };
  body.querySelector('#distSel').onchange=e=>{ b.distanza=e.target.value?parseFloat(e.target.value):null; salvaBozza(); render(); };

  // colpi già inseriti, con SG provvisorio
  if(b.colpi.length){
    const c=el('<div class="card"><h2>Colpi di questa buca</h2></div>');
    b.colpi.forEach((s,i)=>{
      const next=b.colpi[i+1]||null;
      const e0=colpiAttesi(s.lie,s.distM,'tour');
      const e1=next?colpiAttesi(next.lie,next.distM,'tour'):null;
      const sg = e1===null ? null : (e0-e1-1-(s.penalita?1:0));
      c.appendChild(el(`<div class="shot">
        <span>${i+1}. ${LIE_NOME[s.lie]} ${s.distM} m · ${esc(s.bastone)}${s.penalita?' · +1 pen.':''}</span>
        <span class="sgv ${sg===null?'':(sg>=0?'pos':'neg')}">${sg===null?'—':sgn(sg)}</span></div>`));
    });
    const del=el('<button class="btn ghost" style="margin-top:8px">↩︎ Annulla ultimo colpo</button>');
    del.onclick=()=>{ b.colpi.pop(); salvaBozza(); render(); };
    c.appendChild(del);
    body.appendChild(c);
  }

  // form nuovo colpo
  const nShot=b.colpi.length+1;
  const lieDefault = nShot===1 ? 'tee' : null;
  const distDefault = nShot===1 && b.distanza ? b.distanza : '';
  const form=el(`<div class="card"><h2>Colpo ${nShot}</h2>
    <div class="hint">Inserisci <b>prima di tirare</b>: dove si trova la palla, quanto manca alla buca, che bastone usi.</div>
    <label>Lie</label>
    <div class="grid3" id="lieGrid">${LIE_OPZ.map(l=>`<div class="chip${l.k===lieDefault?' selected':''}" data-v="${l.k}">${l.n}</div>`).join('')}</div>
    <label style="margin-top:12px;">Distanza dalla buca (metri)</label>
    <input type="number" inputmode="decimal" step="0.1" id="dist" value="${distDefault}" placeholder="es. 145">
    <div id="bastWrap">
      <label style="margin-top:12px;">Bastone</label>
      <div class="grid3" id="bastGrid">${bastoni.map(x=>`<div class="chip" data-v="${esc(x)}">${esc(x)}</div>`).join('')}</div>
    </div>
    <label style="margin-top:12px;">Penalità su questo colpo?</label>
    <div class="toggle2" id="pen"><button data-v="0" class="on">No</button><button data-v="1">Sì (+1)</button></div>
    <button class="btn" style="margin-top:14px;" id="add">Aggiungi colpo</button>
  </div>`);
  let lieSel=lieDefault, bastSel=null, penSel=0;
  function syncBast(){
    const w=form.querySelector('#bastWrap');
    if(lieSel==='green'){ w.style.display='none'; bastSel='Putter'; }
    else w.style.display='block';
  }
  syncBast();
  form.querySelector('#lieGrid').onclick=e=>{
    const c=e.target.closest('.chip'); if(!c) return;
    form.querySelectorAll('#lieGrid .chip').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); lieSel=c.dataset.v; syncBast();
  };
  form.querySelector('#bastGrid').onclick=e=>{
    const c=e.target.closest('.chip'); if(!c) return;
    form.querySelectorAll('#bastGrid .chip').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); bastSel=c.dataset.v;
  };
  form.querySelector('#pen').onclick=e=>{
    const btn=e.target.closest('button'); if(!btn) return;
    form.querySelectorAll('#pen button').forEach(x=>x.classList.remove('on'));
    btn.classList.add('on'); penSel=parseInt(btn.dataset.v,10);
  };
  form.querySelector('#add').onclick=()=>{
    const d=form.querySelector('#dist').value;
    if(!lieSel){ alert('Scegli il lie.'); return; }
    if(d===''||isNaN(parseFloat(d))){ alert('Inserisci la distanza dalla buca in metri.'); return; }
    if(!bastSel){ alert('Scegli il bastone.'); return; }
    b.colpi.push({lie:lieSel, distM:parseFloat(d), bastone:bastSel, penalita:!!penSel});
    salvaBozza(); render();
  };
  body.appendChild(form);

  if(b.colpi.length){
    const pen=b.colpi.reduce((s,c)=>s+(c.penalita?1:0),0);
    const tot=b.colpi.length+pen;
    const isUlt = idx===bozza.numBuche-1;
    const chiudi=el(`<button class="btn big">⛳ Palla in buca — ${tot} colpi${isUlt?' · termina giro':''}</button>`);
    chiudi.onclick=()=>{
      b.chiusa=true;
      if(isUlt){
        bozza.stato='completato';
        bozza.salvatoIl = Date.now();
        bozza.misura = (LS.get('hcp_impostazioni',{})||{}).misura || 'bandiera';
        marcaModifica(bozza);
        const giri=LS.get('hcp_giri',[]); giri.push(bozza); LS.set('hcp_giri',giri);
        snapshotSalva();
        const id=bozza.id; LS.set('hcp_bozza_v3',null); bozza=null;
        replaceTop('riepilogoGiro',{id});
        syncAuto();   // il giro appena chiuso parte subito, se c'e' rete
      } else { bozza.bucaCorrente++; salvaBozza(); render(); }
    };
    body.appendChild(chiudi);
  }
  return {header:bozza.circolo, body};
};

/* ---------------- RIEPILOGO GIRO ---------------- */
VIEWS.riepilogoGiro = function(p){
  const giri=LS.get('hcp_giri',[]);
  const g=giri.find(x=>x.id===p.id);
  const body=el('<div></div>');
  if(!g){ body.appendChild(el('<div class="empty">Giro non trovato.</div>')); return {header:'Riepilogo',body}; }
  const A=analizzaGiro(g, STAT_F.baseline);
  const c=A.calc, d=c.score-c.par;
  body.appendChild(el(`<div class="card"><h2>${esc(g.circolo)}</h2>
    <div class="hint">${fmtData(g.data)} · ${esc(g.tipo)} · Tee ${esc(g.tee)} · ${c.nBuche} buche</div>
    <div style="font-size:36px;font-weight:800;color:var(--verde-testo);margin-top:6px;">${c.score}
      <span style="font-size:16px;color:var(--grigio);">(par ${c.par}, ${sgn(d,0)})</span></div>
    ${A.completo?`<div class="hint" style="margin-top:8px">Strokes gained totale
      <b class="${c.sgTot>=0?'pos':'neg'}">${sgn(c.sgTot)}</b> rispetto ${STAT_F.baseline==='scratch'?'a un giocatore scratch (stima)':'al PGA Tour'}</div>`:''}
  </div>`));

  if(A.completo){
    const cats=['tee','approccio','corto','putting'];
    const maxA=Math.max(0.5,...cats.map(k=>Math.abs(c.sgCat[k])));
    const card=el('<div class="card"><h2>Strokes gained per categoria</h2></div>');
    cats.forEach(k=>{
      const v=c.sgCat[k], w=Math.abs(v)/maxA*50;
      const st = v>0?`left:50%;width:${w}%;background:var(--dv-blue);`
              : v<0?`right:50%;width:${w}%;background:var(--dv-red);`
              : `left:calc(50% - 2px);width:4px;background:var(--dv-neutral);`;
      card.appendChild(el(`<div class="dvrow"><div class="d">${CAT_NOME[k]}</div>
        <div class="dvtrack"><div class="zero"></div><div class="dvbar" style="${st}"></div></div>
        <div class="n ${v>=0?'pos':'neg'}">${sgn(v,1)}</div></div>`));
    });
    body.appendChild(card);
  }

  const list=el('<div class="card"><h2>Buca per buca</h2></div>');
  A.bucheCalc.forEach(b=>{
    list.appendChild(el(`<div class="listitem">
      <div>Buca ${b.buca} · par ${b.par}${b.distanza?` · ${b.distanza} m`:''}
        <div class="meta">${b.putt} putt${b.girHit?' · green in regulation':''}</div></div>
      <div style="text-align:right"><span class="badge">${b.score}</span>
        ${b.sg!==null?`<div class="meta ${b.sg>=0?'pos':'neg'}" style="margin-top:3px">${sgn(b.sg,1)}</div>`:''}</div></div>`));
  });
  body.appendChild(list);

  const mod=el('<button class="btn secondary">✏️ Correggi questo giro</button>');
  mod.onclick=()=>push('modificaGiro',{id:g.id});
  body.appendChild(mod);

  const del=el('<button class="btn danger">Elimina questo giro</button>');
  del.onclick=()=>{ if(confirm('Eliminare questo giro?\n\nNon viene distrutto: resta nelle copie automatiche e, sul repository, il file viene spostato fra i cancellati.')){
    eliminaGiroLocale(g); nav=[{view:'home'}]; render(); } };
  body.appendChild(del);
  return {header:'Riepilogo giro', body};
};

/* ---------------- CORREZIONE DI UN GIRO SALVATO ---------------- */
function trovaGiro(id){ return LS.get('hcp_giri',[]).find(g=>g.id===id); }
function salvaGiro(g, senzaMarca){
  if(!senzaMarca) marcaModifica(g);
  const giri=LS.get('hcp_giri',[]); const i=giri.findIndex(x=>x.id===g.id);
  if(i>=0){ giri[i]=g; LS.set('hcp_giri',giri); idbFlush(); }
}

  if(!g){ body.appendChild(el('<div class="empty">Giro non trovato.</div>')); return {header:'Correggi',body}; }

  const bastoni=LS.get('hcp_bastoni_v2',BASTONI_DEFAULT);
  const optLie=v=>LIE_OPZ.map(l=>`<option value="${l.k}" ${l.k===v?'selected':''}>${l.n}</option>`).join('');
  const optBast=v=>bastoni.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');

  body.appendChild(el(`<div class="card"><h2>Buca ${p.i+1}</h2>
    <div class="row"><div><label>Par</label>
      <select id="mPar">${[3,4,5,6].map(x=>`<option ${x===b.par?'selected':''}>${x}</option>`).join('')}</select></div>
