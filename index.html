  const lista=el('<div class="card"><h2>Colpi</h2></div>');
  function ridisegna(){
    lista.querySelectorAll('.colpoRow').forEach(x=>x.remove());
    b.colpi.forEach((c,i)=>{
      const row=el(`<div class="colpoRow" style="border-bottom:1px solid var(--bordo);padding:10px 0;">
        <div style="font-size:12px;color:var(--grigio);margin-bottom:6px;font-weight:600;">Colpo ${i+1}</div>
        <div class="row" style="margin-bottom:6px;">
          <div><select class="cLie">${optLie(c.lie)}</select></div>
          <div><input type="number" step="0.1" class="cDist" value="${c.distM}" placeholder="m"></div>
        </div>
        <div class="row" style="margin-bottom:0;">
          <div><select class="cBast">${optBast(c.bastone)}</select></div>
          <div style="display:flex;gap:6px;">
            <button class="btn small cPen ${c.penalita?'':'secondary'}" style="margin:0;padding:10px;font-size:13px;background:${c.penalita?'var(--rosso)':''};color:${c.penalita?'#fff':''}">${c.penalita?'+1 pen.':'no pen.'}</button>
            <button class="btn small cDel secondary" style="margin:0;padding:10px;font-size:13px;">Elimina</button>
          </div>
        </div></div>`);
      row.querySelector('.cLie').onchange=e=>{ c.lie=e.target.value; };
      row.querySelector('.cDist').onchange=e=>{ c.distM=parseFloat(e.target.value)||0; };
      row.querySelector('.cBast').onchange=e=>{ c.bastone=e.target.value; };
      row.querySelector('.cPen').onclick=()=>{ c.penalita=!c.penalita; ridisegna(); };
      row.querySelector('.cDel').onclick=()=>{ if(confirm(`Eliminare il colpo ${i+1}?`)){ b.colpi.splice(i,1); ridisegna(); } };
      lista.appendChild(row);
    });
    const pen=b.colpi.reduce((s,c)=>s+(c.penalita?1:0),0);
    tot.textContent=`Totale buca: ${b.colpi.length+pen} colpi`;
  }
  const tot=el('<div class="hint" style="margin-top:12px;font-weight:700;color:var(--testo)"></div>');
  const add=el('<button class="btn ghost" style="margin-top:10px">+ Aggiungi un colpo in fondo</button>');
  add.onclick=()=>{ const u=b.colpi[b.colpi.length-1];
    b.colpi.push({lie:u?u.lie:'fairway', distM:u?Math.max(0,Math.round(u.distM/2)):50,
                  bastone:u?u.bastone:'PW', penalita:false}); ridisegna(); };
  body.appendChild(lista); lista.appendChild(tot); lista.appendChild(add);
  ridisegna();

  const save=el('<button class="btn big">Salva le correzioni</button>');
  save.onclick=async()=>{
    b.par=parseInt(body.querySelector('#mPar').value,10);
    const d=body.querySelector('#mDist').value;
    b.distanza = d===''?null:parseFloat(d);
    if(b.colpi.some(c=>!(c.distM>=0))){ alert('Una distanza non è valida.'); return; }
    await snapshotSalva();
    salvaGiro(g); back();
  };
  body.appendChild(save);
  return {header:`Buca ${p.i+1}`, body};
};

/* ---------------- STATISTICHE ---------------- */
VIEWS.statistiche = function(){
  const tutti=LS.get('hcp_giri',[]).filter(g=>g.buche&&g.buche.length);
  const body=el('<div></div>');
  if(!tutti.length){
    body.appendChild(el(`<div class="card"><h2>Ancora nessun dato</h2>
      <div class="hint">Le statistiche compaiono qui appena completi il primo giro.</div></div>`));
    const b=el('<button class="btn">+ Registra il primo giro</button>');
    b.onclick=()=>push('nuovoGiro'); body.appendChild(b);
    return {header:'Statistiche', body};
  }

  /* ---- filtri ---- */
  const circoli=[...new Set(tutti.map(g=>g.circolo))], tees=[...new Set(tutti.map(g=>g.tee))];
  const f=el(`<div class="filters">
    <div class="full"><label>Circolo</label><select id="fC"><option value="__tutti__">Tutti i circoli</option>
      ${circoli.map(c=>`<option value="${esc(c)}" ${STAT_F.circolo===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div><label>Tee</label><select id="fT"><option value="__tutti__">Tutti</option>
      ${tees.map(t=>`<option value="${esc(t)}" ${STAT_F.tee===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
    <div><label>Periodo</label><select id="fP">
      <option value="tutti" ${STAT_F.periodo==='tutti'?'selected':''}>Tutti i giri</option>
      <option value="5" ${STAT_F.periodo==='5'?'selected':''}>Ultimi 5</option>
      <option value="10" ${STAT_F.periodo==='10'?'selected':''}>Ultimi 10</option></select></div>
    <div class="full"><label>Confronto strokes gained</label><select id="fB">
      <option value="tour" ${STAT_F.baseline==='tour'?'selected':''}>PGA Tour (dato pubblicato)</option>
      <option value="scratch" ${STAT_F.baseline==='scratch'?'selected':''}>Giocatore scratch (stima)</option>
      <option value="media" ${STAT_F.baseline==='media'?'selected':''}>La tua media</option></select></div>
  </div>`);
  f.querySelector('#fC').onchange=e=>{STAT_F.circolo=e.target.value; render();};
  f.querySelector('#fT').onchange=e=>{STAT_F.tee=e.target.value; render();};
  f.querySelector('#fP').onchange=e=>{STAT_F.periodo=e.target.value; render();};
  f.querySelector('#fB').onchange=e=>{STAT_F.baseline=e.target.value; render();};
  body.appendChild(f);

  let sel=tutti.slice().sort((a,b)=>(a.data||'')<(b.data||'')?-1:1);
  if(STAT_F.circolo!=='__tutti__') sel=sel.filter(g=>g.circolo===STAT_F.circolo);
  if(STAT_F.tee!=='__tutti__') sel=sel.filter(g=>g.tee===STAT_F.tee);
  if(STAT_F.periodo!=='tutti') sel=sel.slice(-parseInt(STAT_F.periodo,10));
  if(!sel.length){
    body.appendChild(el('<div class="card"><h2>Nessun giro</h2><div class="hint">Nessun giro corrisponde ai filtri. Allarga la selezione.</div></div>'));
    return {header:'Statistiche', body};
  }

  const baseCalc = STAT_F.baseline==='scratch' ? 'scratch' : 'tour';
  const A=sel.map(g=>analizzaGiro(g, baseCalc));
  const completi=A.filter(g=>g.completo);
  const nG=A.length, totB=A.reduce((s,g)=>s+g.calc.nBuche,0);
  const sum=k=>A.reduce((s,g)=>s+g.calc[k],0);
  const scoreMedio=sum('score')/nG, diffMedia=(sum('score')-sum('par'))/nG;
  const girPct=Math.round(100*sum('gir')/totB), puttB=sum('putt')/totB;
  const scrOpp=sum('scrOpp'), scrOk=sum('scrOk');
  const scrPct=scrOpp>0?Math.round(100*scrOk/scrOpp):null;
  const etichetta = STAT_F.baseline==='scratch' ? 'a un giocatore scratch (stima)' : 'al PGA Tour';

  /* ---- 4 indicatori, fermi sopra i tre pannelli ---- */
  body.appendChild(el(`<div class="hint" style="margin-top:-4px;">${nG} giri · ${totB} buche${completi.length<nG?` · ${completi.length} con dettaglio colpo per colpo`:''}</div>`));
  body.appendChild(el(`<div class="kpigrid">
    <div class="kpi"><div class="lab">Punteggio medio</div><div class="v">${scoreMedio.toFixed(1)}</div>
      <div class="sub">${sgn(diffMedia,1)} dal par</div></div>
    <div class="kpi"><div class="lab">Green in regulation</div><div class="v">${girPct}<span class="u">%</span></div>
      <div class="sub">${sum('gir')} su ${totB} buche</div></div>
    <div class="kpi"><div class="lab">Putt per buca</div><div class="v">${puttB.toFixed(2)}</div>
      <div class="sub">≈ ${(puttB*18).toFixed(0)} su 18 buche</div></div>
    <div class="kpi"><div class="lab">Scrambling</div><div class="v">${scrPct===null?'—':scrPct+'%'}</div>
      <div class="sub">${scrOpp===0?'sempre in green':`${scrOk} par salvati su ${scrOpp}`}</div></div>
  </div>`));

  /* ---- barre di navigazione ---- */
  const TABS=[{k:'sg',n:'Strokes<br>gained'},{k:'par',n:'Punteggio<br>e base'},
              {k:'club',n:'Bastoni'},{k:'x',n:'Incroci'}];
  if(!STAT_F.tab) STAT_F.tab='sg';
  const bar=el(`<div class="tabbar">${TABS.map(t=>`<button data-k="${t.k}" class="${STAT_F.tab===t.k?'on':''}">${t.n}</button>`).join('')}</div>`);
  const pager=el('<div class="pager"></div>');
  body.appendChild(bar); body.appendChild(pager);

  const dvRow=(lab,v,maxA,dec)=>{
    const w=Math.abs(v)/maxA*50;
    const st=v>0?`left:50%;width:${w}%;background:var(--dv-blue);`
           :v<0?`right:50%;width:${w}%;background:var(--dv-red);`
           :`left:calc(50% - 2px);width:4px;background:var(--dv-neutral);`;
    return `<div class="dvrow"><div class="d">${lab}</div>
      <div class="dvtrack"><div class="zero"></div><div class="dvbar" style="${st}"></div></div>
      <div class="n ${v>=0?'pos':'neg'}">${sgn(v,dec===undefined?1:dec)}</div></div>`;
  };
  const etichette = A.map(g=>fmtDataBreve(g.data));

  /* ================= PANNELLO 1: STROKES GAINED ================= */
  const p1=el('<div class="pane"></div>');
  if(!completi.length){
    p1.appendChild(el(`<div class="card"><h2>Strokes gained</h2>
      <div class="hint">Nessuno dei giri selezionati ha il dettaglio colpo per colpo.</div></div>`));
  } else {
    const cats=['tee','approccio','corto','putting'];
    const nC=completi.length;
    const perGiro=cats.reduce((o,k)=>(o[k]=completi.reduce((s,g)=>s+g.calc.sgCat[k],0)/nC,o),{});
    const mediaTot=cats.reduce((s,k)=>s+perGiro[k],0);
    const etC=completi.map(g=>fmtDataBreve(g.data));

    if(STAT_F.baseline==='media'){
      const vals=completi.map((g,i)=>({x:etC[i], y:g.calc.sgTot-mediaTot}));
      const c=el(`<div class="card"><h2>Ogni giro rispetto alla tua media</h2>
        <div class="hint">La media dei giri è zero per costruzione: conta lo scarto del singolo giro.</div>
        ${svgLinea(vals,{h:110, zero:true, colore:'var(--dv-blue)', fmt:v=>sgn(v,1), aria:'scarto dalla media per giro'})}</div>`);
      completi.forEach((g,i)=>c.appendChild(el(dvRow(etC[i], g.calc.sgTot-mediaTot, Math.max(0.5,...completi.map(x=>Math.abs(x.calc.sgTot-mediaTot)))))));
      p1.appendChild(c);
    } else {
      const maxA=Math.max(0.5,...cats.map(k=>Math.abs(perGiro[k])));
      const c=el(`<div class="card"><h2>Strokes gained per categoria</h2>
        <div class="hint">Media per giro rispetto ${etichetta}. Sopra lo zero guadagni colpi, sotto li perdi.</div>
        <div class="legend"><span class="it"><span class="sw" style="background:var(--dv-blue)"></span>Guadagni</span>
          <span class="it"><span class="sw" style="background:var(--dv-red)"></span>Perdi</span></div>
        ${cats.map(k=>dvRow(CAT_NOME[k], perGiro[k], maxA)).join('')}
        <div class="stcap" style="margin-top:10px">Totale per giro:
          <b class="${mediaTot>=0?'pos':'neg'}">${sgn(mediaTot,1)}</b> colpi rispetto ${etichetta}.</div>
        ${STAT_F.baseline==='scratch'?`<div class="hint" style="margin-top:8px">⚠️ La baseline scratch è una <b>ricostruzione</b>. Vedi "Metodo e fonti".</div>`:''}</div>`);
      p1.appendChild(c);

      p1.appendChild(el(`<div class="card"><h2>Andamento nel tempo</h2>
        <div class="hint">Strokes gained totale, giro per giro.</div>
        ${svgLinea(completi.map((g,i)=>({x:etC[i], y:g.calc.sgTot})),
          {h:112, zero:true, colore:'var(--dv-blue)', fmt:v=>sgn(v,1), aria:'strokes gained totale nel tempo'})}</div>`));

      const tuttiV=cats.flatMap(k=>completi.map(g=>g.calc.sgCat[k]));
      const mn=Math.min(0,...tuttiV), mx=Math.max(0,...tuttiV);
      p1.appendChild(el(`<div class="card"><h2>Andamento per categoria</h2>
        <div class="hint">Stessa scala su tutti e quattro, così si vede subito quale pesa di più.</div>
        <div class="smgrid">${cats.map((k,idx)=>boxTrend(CAT_NOME[k],
          completi.map((g,i)=>({x:etC[i], y:g.calc.sgCat[k]})),
          ['var(--dv-blue)','var(--dv-orange)','var(--dv-aqua)','var(--dv-red)'][idx],
          {min:mn, max:mx, fmt:v=>sgn(v,1)})).join('')}</div>
        <div class="stcap">Le etichette mostrano primo e ultimo giro del periodo.</div></div>`));
    }

    const fasce=statFasce(completi);
    if(fasce.length) p1.appendChild(el(`<div class="card"><h2>Approcci per fascia di distanza</h2>
      <div class="hint">Da dove parte il colpo, quanti green prendi da lì, quanto lasci alla buca.</div>
      <table class="stat"><thead><tr><th>Da</th><th class="n">Colpi</th><th class="n">Green</th>
        <th class="n">Lascia</th><th class="n">SG</th></tr></thead><tbody>
        ${fasce.map(x=>`<tr><td>${x.label}</td><td class="n">${x.n}</td>
          <td class="n">${Math.round(100*x.green/x.n)}%</td>
          <td class="n">${x.nProx?(x.prox/x.nProx).toFixed(1)+' m':'—'}</td>
          <td class="n ${x.sg>=0?'pos':'neg'}">${sgn(x.sg/nC,2)}</td></tr>`).join('')}
      </tbody></table><div class="stcap">SG per giro. "Lascia" vale solo quando il green viene preso.</div></div>`));

    const P=statPutting(completi);
    if(P.fasce.length){
      const tp=P.bucheConPutt?100*P.treputt/P.bucheConPutt:0;
      p1.appendChild(el(`<div class="card"><h2>Putting per distanza</h2>
        <div class="hint">Tre putt sul <b>${tp.toFixed(1)}%</b> delle buche (${P.treputt} su ${P.bucheConPutt}).</div>
        <table class="stat"><thead><tr><th>Distanza</th><th class="n">Putt</th>
          <th class="n">Imbucati</th><th class="n">SG</th></tr></thead><tbody>
          ${P.fasce.map(x=>`<tr><td>${x.label}</td><td class="n">${x.n}</td>
            <td class="n">${Math.round(100*x.imbucati/x.n)}%</td>
            <td class="n ${x.sg>=0?'pos':'neg'}">${sgn(x.sg/nC,2)}</td></tr>`).join('')}
        </tbody></table></div>`));
    }
  }

  /* ================= PANNELLO 2: PUNTEGGIO E BASE ================= */
  const p2=el('<div class="pane"></div>');
  const diffs=A.map(g=>g.calc.score-g.calc.par);
  p2.appendChild(el(`<div class="card"><h2>Andamento del punteggio</h2>
    <div class="hint">Colpi sopra o sotto il par, giro per giro. Più la linea scende, meglio è.</div>
    ${svgLinea(A.map((g,i)=>({x:etichette[i], y:diffs[i]})),
      {h:112, zero:true, colore:'var(--dv-blue)', fmt:v=>sgn(v,0), aria:'punteggio sul par nel tempo'})}</div>`));

  const maxAbs=Math.max(1,...diffs.map(Math.abs));
  const cd=el(`<div class="card"><h2>Punteggio rispetto al par</h2>
    <div class="hint">Un giro per riga, dal più vecchio al più recente.</div></div>`);
  A.forEach((g,i)=>{
    const d=diffs[i], w=Math.abs(d)/maxAbs*50;
    const st=d>0?`left:50%;width:${w}%;background:var(--dv-red);`:d<0?`right:50%;width:${w}%;background:var(--dv-blue);`:`left:calc(50% - 2px);width:4px;background:var(--dv-neutral);`;
    cd.appendChild(el(`<div class="dvrow"><div class="d">${etichette[i]}</div>
      <div class="dvtrack"><div class="zero"></div><div class="dvbar" style="${st}"></div></div>
      <div class="n">${d===0?'PAR':sgn(d,0)}</div></div>`));
  });
  p2.appendChild(cd);

  p2.appendChild(el(`<div class="card"><h2>Andamento di green e putt</h2>
    <div class="smgrid">
      ${boxTrend('Green in regulation', A.map((g,i)=>({x:etichette[i], y:100*g.calc.gir/g.calc.nBuche})),
        'var(--dv-aqua)', {zero:false, fmt:v=>Math.round(v)+'%'})}
      ${boxTrend('Putt per buca', A.map((g,i)=>({x:etichette[i], y:g.calc.putt/g.calc.nBuche})),
        'var(--dv-orange)', {zero:false, fmt:v=>v.toFixed(2)})}
    </div></div>`));

  let eagle=0,birdie=0,parc=0,bogey=0,doppio=0;
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    if(b.diff<=-2)eagle++; else if(b.diff===-1)birdie++; else if(b.diff===0)parc++;
    else if(b.diff===1)bogey++; else doppio++;}));
  const sotto=eagle+birdie, sopra=bogey+doppio, pc=v=>v/totB*100;
  p2.appendChild(el(`<div class="card"><h2>Come si chiudono le buche</h2>
    <div class="hint">Su ${totB} buche giocate.</div>
    <div class="legend"><span class="it"><span class="sw" style="background:var(--dv-blue)"></span>Sotto par</span>
      <span class="it"><span class="sw" style="background:var(--dv-neutral)"></span>Par</span>
      <span class="it"><span class="sw" style="background:var(--dv-red)"></span>Sopra par</span></div>
    <div class="strack">
      ${sotto>0?`<div class="sseg" style="width:${pc(sotto)}%;background:var(--dv-blue)"></div>`:''}
      ${parc>0?`<div class="sseg" style="width:${pc(parc)}%;background:var(--dv-neutral)"></div>`:''}
      ${sopra>0?`<div class="sseg" style="width:${pc(sopra)}%;background:var(--dv-red)"></div>`:''}</div>
    <table class="stat" style="margin-top:12px;">
      <thead><tr><th>Risultato</th><th class="n">Buche</th><th class="n">%</th></tr></thead><tbody>
      <tr><td>Eagle o meglio</td><td class="n">${eagle}</td><td class="n">${pc(eagle).toFixed(1)}%</td></tr>
      <tr><td>Birdie</td><td class="n">${birdie}</td><td class="n">${pc(birdie).toFixed(1)}%</td></tr>
      <tr><td>Par</td><td class="n">${parc}</td><td class="n">${pc(parc).toFixed(1)}%</td></tr>
      <tr><td>Bogey</td><td class="n">${bogey}</td><td class="n">${pc(bogey).toFixed(1)}%</td></tr>
      <tr><td>Doppio o peggio</td><td class="n">${doppio}</td><td class="n">${pc(doppio).toFixed(1)}%</td></tr>
      </tbody></table></div>`));

  if(completi.length){
    const F=statFairway(completi), S=statSand(completi);
    p2.appendChild(el(`<div class="card"><h2>Precisione dal tee e bunker</h2>
      <table class="stat"><tbody>
        <tr><td>Fairway presi</td><td class="n">${F.tot?Math.round(100*F.presi/F.tot)+'%':'—'}</td>
          <td class="n" style="color:var(--grigio)">${F.presi} su ${F.tot}</td></tr>
        <tr><td>Sand save</td><td class="n">${S.opp?Math.round(100*S.ok/S.opp)+'%':'—'}</td>
          <td class="n" style="color:var(--grigio)">${S.ok} su ${S.opp}</td></tr>
      </tbody></table>
      <div class="stcap">Fairway sui par 4 e 5. Sand save: buche con un colpo dalla sabbia entro i 30 yard, chiuse in par o meglio.</div></div>`));
  }

  const perTipo=statPerTipo(A);
  if(perTipo.length>1) p2.appendChild(el(`<div class="card"><h2>Per tipo di giro</h2>
    <div class="hint">Se il numero in gara è peggiore dell'allenamento, il problema non è tecnico.</div>
    <table class="stat"><thead><tr><th>Tipo</th><th class="n">Giri</th>
      <th class="n">Sul par</th><th class="n">SG medio</th></tr></thead><tbody>
      ${perTipo.map(t=>`<tr><td>${esc(t.tipo)}</td><td class="n">${t.n}</td>
        <td class="n">${sgn(t.mediaPar,1)}</td>
        <td class="n ${t.mediaSg===null?'':(t.mediaSg>=0?'pos':'neg')}">${t.mediaSg===null?'—':sgn(t.mediaSg,1)}</td></tr>`).join('')}
    </tbody></table></div>`));

  const cSel=[...new Set(sel.map(g=>g.circolo))];
  if(cSel.length===1){
    const pb=statPerBuca(A).filter(x=>x.diffMedia>0).slice(0,6);
    const cb=el(`<div class="card"><h2>Buche che costano di più</h2>
      <div class="hint">Media dei colpi sopra il par su ${esc(cSel[0])}.</div></div>`);
    if(!pb.length) cb.appendChild(el('<div class="hint">Nessuna buca sopra il par in media.</div>'));
    else { const mx=Math.max(...pb.map(x=>x.diffMedia));
      pb.forEach(x=>cb.appendChild(el(`<div class="hbrow wide">
        <div class="l">Buca ${x.buca} <span style="opacity:.7">· par ${x.par}</span></div>
        <div class="hbtrack"><div class="hbfill" style="width:${x.diffMedia/mx*100}%;background:var(--dv-red)"></div></div>
        <div class="n">+${x.diffMedia.toFixed(1)}</div></div>`))); }
    p2.appendChild(cb);
  } else {
    p2.appendChild(el(`<div class="card"><h2>Buche che costano di più</h2>
      <div class="hint">Seleziona un singolo circolo: confrontare la "buca 7" di campi diversi non avrebbe senso.</div></div>`));
  }

  /* ================= PANNELLO 3: BASTONI ================= */
  const p3=el('<div class="pane"></div>');
  const bast=statBastoni(sel);
  if(!bast.length){
    p3.appendChild(el('<div class="card"><h2>Bastoni</h2><div class="hint">Nessun colpo registrato.</div></div>'));
  } else {
    const mx=Math.max(...bast.map(b=>b.usi));
    const cbs=el(`<div class="card"><h2>Quanto usi ogni bastone</h2>
      <div class="hint">Numero di colpi nel periodo selezionato.</div></div>`);
    bast.forEach(b=>cbs.appendChild(el(`<div class="hbrow">
      <div class="l">${esc(b.bastone)}</div>
      <div class="hbtrack"><div class="hbfill" style="width:${b.usi/mx*100}%"></div></div>
      <div class="n">${b.usi}</div></div>`)));
    p3.appendChild(cbs);

    const conD=bast.filter(b=>b.distMedia!==null && b.bastone!=='Putter');
    if(conD.length){
      const maxD=Math.max(...conD.map(b=>b.dMax||0));
      const cr=el(`<div class="card"><h2>Distanza e dispersione</h2>
        <div class="hint">Il punto è la media, la barra chiara va dal 10° al 90° percentile: più è larga,
          meno il bastone è prevedibile. È la lettura che conta per scegliere in campo.</div></div>`);
      conD.forEach(b=>{
        const lo=(b.p10!==null?b.p10:b.dMin)||0, hi=(b.p90!==null?b.p90:b.dMax)||0;
        cr.appendChild(el(`<div class="rngrow">
          <div class="l">${esc(b.bastone)}</div>
          <div class="rngtrack">
            <div class="rngline" style="left:0;right:0"></div>
            <div class="rngspan" style="left:${lo/maxD*100}%;width:${Math.max(1,(hi-lo)/maxD*100)}%"></div>
            <div class="rngdot" style="left:${b.distMedia/maxD*100}%"></div>
          </div>
          <div class="n">${b.distMedia} m</div></div>`));
      });
      cr.appendChild(el(`<table class="stat" style="margin-top:10px">
        <thead><tr><th>Bastone</th><th class="n">Colpi</th><th class="n">Media</th>
          <th class="n">Dispersione</th><th class="n">10°–90°</th></tr></thead><tbody>
        ${conD.map(b=>`<tr><td>${esc(b.bastone)}</td><td class="n">${b.usi}</td>
          <td class="n">${b.distMedia} m</td>
          <td class="n">${b.disp!==null?'± '+b.disp+' m':'—'}</td>
          <td class="n">${b.p10!==null?b.p10+'–'+b.p90:'—'}</td></tr>`).join('')}
        </tbody></table>
        <div class="stcap">La dispersione è lo scarto tipo delle distanze: due terzi dei colpi cadono
          entro quel margine dalla media. Compare da 3 colpi in su, i percentili da 5.</div>`));
      p3.appendChild(cr);
    }

    // andamento della distanza del driver
    const serieDrv=sel.map(g=>{
      let t=0,n=0;
      (g.buche||[]).forEach(b=>(b.colpi||[]).forEach((c,i)=>{
        if(c.bastone!=='Driver') return;
        const fine=b.colpi[i+1]?b.colpi[i+1].distM:0;
        if(c.distM-fine>0){ t+=c.distM-fine; n++; }
      }));
      return {data:g.data, media:n?t/n:null};
    }).filter(x=>x.media!==null);
    if(serieDrv.length>=3){
      p3.appendChild(el(`<div class="card"><h2>Andamento del driver</h2>
        <div class="hint">Distanza media percorsa dal drive, giro per giro.</div>
        ${svgLinea(serieDrv.map(x=>({x:fmtDataBreve(x.data), y:x.media})),
          {h:112, zero:false, colore:'var(--dv-blue)', fmt:v=>Math.round(v)+' m', aria:'distanza media del driver nel tempo'})}</div>`));
    }
  }

  /* ================= PANNELLO 4: INCROCI ================= */
  const p4=el('<div class="pane"></div>');
  const CATN={tee:'Colpo dal tee',approccio:'Approccio',corto:'Gioco corto',putting:'Putting'};

  const MP = completi.length ? statMiglioriPeggiori(completi) : null;
  if(!MP){
    p4.appendChild(el(`<div class="card"><h2>Cosa cambia nei giri buoni</h2>
      <div class="hint">Servono almeno 4 giri con il dettaglio colpo per colpo per dividerli in metà
        migliore e metà peggiore. Al momento ne hai ${completi.length}.</div></div>`));
  } else {
    const cats=['tee','approccio','corto','putting'];
    const delta=cats.map(c=>({c, v:MP.best[c]-MP.worst[c]}));
    const mx=Math.max(0.3,...delta.map(d=>Math.abs(d.v)));
    const top=delta.slice().sort((a,b)=>b.v-a.v)[0];
    p4.appendChild(el(`<div class="card"><h2>Cosa cambia nei giri buoni</h2>
      <div class="hint">Confronto fra i tuoi <b>${MP.k} giri migliori</b> (media ${sgn(MP.parBest,1)} sul par)
        e i <b>${MP.k} peggiori</b> (${sgn(MP.parWorst,1)}). La barra mostra quanti colpi guadagni in più
        nei giri buoni, categoria per categoria: la più lunga è ciò che davvero fa la differenza.</div>
      ${delta.map(d=>{
        const w=Math.abs(d.v)/mx*50;
        const st=d.v>0?`left:50%;width:${w}%;background:var(--dv-blue);`
              :d.v<0?`right:50%;width:${w}%;background:var(--dv-red);`
              :`left:calc(50% - 2px);width:4px;background:var(--dv-neutral);`;
        return `<div class="dvrow"><div class="d">${CATN[d.c]}</div>
          <div class="dvtrack"><div class="zero"></div><div class="dvbar" style="${st}"></div></div>
          <div class="n ${d.v>=0?'pos':'neg'}">${sgn(d.v,1)}</div></div>`;}).join('')}
      <table class="stat" style="margin-top:12px">
        <thead><tr><th>Categoria</th><th class="n">Giri buoni</th><th class="n">Giri brutti</th></tr></thead>
        <tbody>${cats.map(c=>`<tr><td>${CATN[c]}</td>
          <td class="n ${MP.best[c]>=0?'pos':'neg'}">${sgn(MP.best[c],1)}</td>
          <td class="n ${MP.worst[c]>=0?'pos':'neg'}">${sgn(MP.worst[c],1)}</td></tr>`).join('')}</tbody></table>
      <div class="stcap">Quando giochi bene, il grosso del vantaggio arriva da: <b>${CATN[top.c]}</b>
        (${sgn(top.v,1)} colpi). È lì che vale la pena capire cosa fai di diverso.</div></div>`));
  }

  if(completi.length){
    const DT=statDaTee(completi);
    if(DT.length){
      const mxA=Math.max(...DT.map(x=>Math.abs(x.media)),0.3);
      p4.appendChild(el(`<div class="card"><h2>Quanto costa mancare il fairway</h2>
        <div class="hint">Par 4 e 5, raggruppati per dove finisce il colpo dal tee. Mette un numero
          sulla differenza fra tenere il fairway e non tenerlo.</div>
        ${DT.map(x=>{
          const w=Math.abs(x.media)/mxA*50;
          const st=x.media>0?`left:50%;width:${w}%;background:var(--dv-red);`
                :x.media<0?`right:50%;width:${w}%;background:var(--dv-blue);`
                :`left:calc(50% - 2px);width:4px;background:var(--dv-neutral);`;
          return `<div class="dvrow"><div class="d">${LIE_NOME[x.lie]||x.lie}</div>
            <div class="dvtrack"><div class="zero"></div><div class="dvbar" style="${st}"></div></div>
            <div class="n">${sgn(x.media,2)}</div></div>`;}).join('')}
        <table class="stat" style="margin-top:12px">
          <thead><tr><th>Dove arriva</th><th class="n">Buche</th><th class="n">Sul par</th>
            <th class="n">Green</th></tr></thead><tbody>
          ${DT.map(x=>`<tr><td>${LIE_NOME[x.lie]||x.lie}</td><td class="n">${x.n}</td>
            <td class="n">${sgn(x.media,2)}</td><td class="n">${Math.round(x.girPct)}%</td></tr>`).join('')}
        </tbody></table></div>`));
    }
  }

  const PP=statPerPar(A);
  if(PP.length){
    p4.appendChild(el(`<div class="card"><h2>Rendimento per tipo di buca</h2>
      <div class="hint">I par 5 sono occasioni, i par 3 no: separarli dice dove stai lasciando colpi.</div>
      <table class="stat"><thead><tr><th>Buca</th><th class="n">Giocate</th><th class="n">Sul par</th>
        <th class="n">Green</th><th class="n">Putt</th></tr></thead><tbody>
        ${PP.map(x=>`<tr><td>Par ${x.par}</td><td class="n">${x.n}</td>
          <td class="n ${x.media<=0?'pos':'neg'}">${sgn(x.media,2)}</td>
          <td class="n">${Math.round(x.girPct)}%</td><td class="n">${x.puttB.toFixed(2)}</td></tr>`).join('')}
      </tbody></table></div>`));
  }

  const BL=statBlocchi(A);
  if(BL.nGiri>0){
    const b=BL.blocchi;
    const peggio=b.slice().sort((x,y)=>y.parGiro-x.parGiro)[0];
    const meglio=b.slice().sort((x,y)=>x.parGiro-y.parGiro)[0];
    const uguali=Math.abs(peggio.parGiro-meglio.parGiro)<0.25;
    p4.appendChild(el(`<div class="card"><h2>Il giro in sei blocchi da tre buche</h2>
      <div class="hint">Colpi sopra il par per giro in ciascun blocco, su ${BL.nGiri} giri da 18 buche.
        Serve a vedere se il giro si rompe sempre nello stesso punto: partenza fredda, calo dopo la
        pausa alla nona, o cedimento finale.</div>
      ${svgBarreDiv(b.map(x=>({x:x.nome, y:x.parGiro})), {h:132, fmt:v=>sgn(v,1), aria:'colpi sopra il par per blocco di tre buche'})}
      <table class="stat" style="margin-top:10px">
        <thead><tr><th>Buche</th><th class="n">Sul par</th><th class="n">Green</th>
          <th class="n">Putt</th>${completi.length?'<th class="n">SG</th>':''}</tr></thead><tbody>
        ${b.map(x=>`<tr><td>${x.nome}</td>
          <td class="n ${x.parGiro<=0?'pos':'neg'}">${sgn(x.parGiro,1)}</td>
          <td class="n">${Math.round(x.girPct)}%</td>
          <td class="n">${x.puttB.toFixed(2)}</td>
          ${completi.length?`<td class="n ${x.sgGiro>=0?'pos':'neg'}">${sgn(x.sgGiro,1)}</td>`:''}</tr>`).join('')}
      </tbody></table>
      <div class="stcap">${uguali
        ? 'Nessun blocco spicca: il giro resta uniforme, senza un punto debole ricorrente.'
        : `Il tratto più costoso è <b>${peggio.nome}</b> (${sgn(peggio.parGiro,1)} per giro), il migliore è <b>${meglio.nome}</b> (${sgn(meglio.parGiro,1)}).`}
        Valori per giro, non per buca.</div></div>`));
  }

  const NV=statNove(A);
  if(NV.length===2){
    const d=NV[1].media-NV[0].media;
    p4.appendChild(el(`<div class="card"><h2>Prima nove contro seconda nove</h2>
      <div class="hint">${Math.abs(d)<0.03 ? 'Le due metà si equivalgono.' :
        (d>0 ? `Sulla seconda nove giochi in media <b>${d.toFixed(2)} colpi a buca in più</b>: vale la pena chiedersi se è il campo o se è concentrazione.`
             : `Sulla seconda nove giochi in media <b>${Math.abs(d).toFixed(2)} colpi a buca in meno</b>: parti lento e ti sciogli strada facendo.`)}</div>
      <table class="stat"><thead><tr><th></th><th class="n">Buche</th><th class="n">Sul par</th>
        <th class="n">Green</th><th class="n">Putt</th></tr></thead><tbody>
        ${NV.map(x=>`<tr><td>${x.nome}</td><td class="n">${x.n}</td>
          <td class="n ${x.media<=0?'pos':'neg'}">${sgn(x.media,2)}</td>
          <td class="n">${Math.round(x.girPct)}%</td><td class="n">${x.puttB.toFixed(2)}</td></tr>`).join('')}
      </tbody></table>
      <div class="stcap">Solo giri da 18 buche.</div></div>`));
  }

  /* ---- montaggio e scorrimento ---- */
  [p1,p2,p3,p4].forEach(x=>pager.appendChild(x));
  const panes={sg:p1, par:p2, club:p3, x:p4};
  function adatta(){ pager.style.height = (panes[STAT_F.tab].scrollHeight+6)+'px'; }
  function vaiA(k, scorri){
    STAT_F.tab=k;
    bar.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.k===k));
    if(scorri!==false){ const i=TABS.findIndex(t=>t.k===k); pager.scrollTo({left:i*pager.clientWidth, behavior:'smooth'}); }
    adatta();
  }
  bar.onclick=e=>{ const b=e.target.closest('button'); if(b) vaiA(b.dataset.k, true); };
  let tmr=null;
  pager.onscroll=()=>{ clearTimeout(tmr); tmr=setTimeout(()=>{
    const i=Math.round(pager.scrollLeft/Math.max(1,pager.clientWidth));
    const k=(TABS[i]||TABS[0]).k;
    if(k!==STAT_F.tab) vaiA(k, false);
  }, 90); };
  requestAnimationFrame(()=>{
    const i=TABS.findIndex(t=>t.k===STAT_F.tab);
    pager.scrollLeft = i*pager.clientWidth;
    adatta();
    setTimeout(adatta, 120);
  });
  window.addEventListener('resize', adatta, {once:true});

  return {header:'Statistiche', body};
};

};

/* ---------------- METODO E FONTI ---------------- */
VIEWS.metodo = function(){
  const body=el(`<div>
    <div class="card"><h2>Come si calcola</h2><div class="metodo">
      Lo <b>strokes gained</b> di un colpo è: colpi attesi da dove parte la palla, meno colpi attesi da dove
      arriva, meno 1 (il colpo giocato), meno le eventuali penalità. Se il valore è positivo hai guadagnato
      terreno rispetto al riferimento, se è negativo l'hai perso.<br><br>
      Le quattro categorie seguono la convenzione standard: <b>colpo dal tee</b> sui par 4 e 5,
      <b>approccio</b> oltre i 30 yard fuori dal green, <b>gioco corto</b> entro i 30 yard fuori dal green,
      <b>putting</b> sul green. Il colpo dal tee di un par 3 conta come approccio.
    </div></div>

    <div class="card"><h2>Baseline PGA Tour — dato pubblicato</h2><div class="metodo">
      Tabella dei colpi attesi per distanza e lie da <b>Broadie, M., "Assessing Golfer Performance on the
      PGA TOUR", Interfaces 42(2):146–165, 2012</b>, Tabella B.1, costruita su oltre 8 milioni di colpi
      rilevati da ShotLink fra il 2003 e il 2010. Il putting viene da <b>Broadie, "Putts Gained: Measuring
      Putting on the PGA TOUR", 2011</b>, Figura 1.<br><br>
      Le tabelle sono in <b>yard</b> (gioco lungo) e <b>piedi</b> (putting); l'app converte dai metri che
      inserisci tu. Fra un punto e l'altro della tabella interpola linearmente.<br><br>
      <b>Limite dichiarato:</b> Broadie non pubblica valori sotto i 10 yard fuori dal green. I chip da meno
      di 9 metri usano quindi un raccordo lineare fra 2,0 colpi a distanza zero e il valore pubblicato a
      10 yard. È un'estrapolazione, non un dato.
    </div></div>

    <div class="card"><h2>Baseline scratch — ricostruzione</h2><div class="metodo">
      <b>Non esiste una tabella scratch pubblicata liberamente.</b> Le tabelle per livello di handicap sono
      nel libro <i>Every Shot Counts</i> di Broadie, protetto da copyright, e quello che circola online è
      o una copia non citata del libro o materiale sbagliato (un repository open source molto diffuso
      attribuisce allo scratch un putting <i>migliore</i> del PGA Tour a ogni distanza sopra i 5 piedi).<br><br>
      Quella usata qui è quindi una <b>mia ricostruzione dichiarata</b>, costruita così:<br><br>
      <b>Gioco lungo:</b> <code>scratch = 2 + K · (tour − 2)</code>. Il divario cresce dove la situazione è
      più difficile, invece di essere una costante piatta. <code>K = 1,1478</code> è calibrato su un vincolo
      verificabile e non su opinione: il giro atteso su un campo di Course Rating noto deve corrispondere
      alla definizione di giocatore scratch. Su Colline del Gavi Champion dal tee Bianco (CR 74,2, par 73),
      imponendo una media scratch di CR + 1,8 si ottiene un giro atteso di 76,0.<br><br>
      <b>Controllo di coerenza superato:</b> il profilo che ne esce dà par 4 fra +0,23 e +0,52 sul par,
      par 3 fra +0,15 e +0,26, par 5 fra −0,33 e +0,08 — cioè la firma tipica di uno scratch, sotto par
      sui par 5 e sopra sui par 4.<br><br>
      <b>Scarto noto:</b> sugli unici due ancoraggi scratch liberi (Broadie, <i>Assessing Golfer Performance
      Using Golfmetrics</i>, 2008: tee da 140 yard = 3,2 colpi e da 200 yard = 3,5) il modello è ottimista
      di 0,09 e 0,21 colpi. Calibrare su quegli ancoraggi darebbe K ≈ 1,28 e un giro atteso di 80,7, cioè
      +7,7 sul par: incompatibile con un giocatore scratch. Per questo ho scelto il vincolo del Course Rating.<br><br>
      <b>Putting scratch:</b> ricostruito da dati reali, non riscalato. <code>E[putt] = 2 − P(imbuca) + P(3 putt)</code>,
      con le percentuali di imbucato per handicap 0 rilevate da Shot Scope, e la probabilità di tre putt
      calibrata su due ancoraggi di Broadie (putt da 14 piedi = 1,8 colpi attesi; distanza media del
      "due putt" attorno ai 25 piedi).<br><br>
      Trattala come un ordine di grandezza, non come un dato ufficiale.
    </div></div>

    <div class="card"><h2>La tua media</h2><div class="metodo">
      Terzo confronto, e l'unico che non dipende da nessuna fonte esterna: ogni giro viene misurato
      rispetto alla <b>tua</b> prestazione media sui giri registrati. Serve a rispondere a "questo giro è
      andato meglio o peggio del mio normale", che è la domanda più utile per capire se stai migliorando.
      Diventa affidabile man mano che i giri si accumulano.
    </div></div>

    <div class="card"><h2>Dati dei campi</h2><div class="metodo">
      <b>Colline del Gavi (Champion):</b> carta ufficiale del circolo sul sistema GES Golf, con il totale
      confermato da FederGolf Piemonte (6380 m dal bianco, par 73).<br><br>
      <b>Des Iles Borromées:</b> pagina "Misure del campo" del circolo, con la riga del tee giallo
      confermata in modo indipendente da Hole19. Tutte le somme per nove e totali tornano.
      CR e Slope non sono pubblicati dal circolo e restano non verificati.
    </div></div>
  </div>`);
  return {header:'Metodo e fonti', body};
};

/* ---------------- BACKUP E RIPRISTINO ---------------- */
function payloadBackup(){
  return {app:'HCP+Stat Registra Giro', schema:SCHEMA_VERSION, esportato:new Date().toISOString(),
          giri:LS.get('hcp_giri',[]), archivio:LS.get('hcp_archivio_v3'),
          impostazioni:LS.get('hcp_impostazioni')};
}
async function eseguiBackup(){
  const txt=JSON.stringify(payloadBackup());
  const nome=`giri-golf-${new Date().toISOString().slice(0,10)}.json`;
  try{
    const file=new File([txt],nome,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Backup giri'});
      metaSet({ultimoBackup:Date.now()}); return 'ok';
    }
  }catch(e){ if(e && e.name==='AbortError') return 'annullato'; }
  try{
    const b=new Blob([txt],{type:'application/json'}), u=URL.createObjectURL(b);
    const a=document.createElement('a'); a.href=u; a.download=nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    metaSet({ultimoBackup:Date.now()}); return 'ok';
  }catch(e){ return 'errore'; }
}

VIEWS.backup = function(){
  const giri=LS.get('hcp_giri',[]);
  const m=LS.get('hcp_meta',{})||{};
  const daSalvare=giriDaBackup();
  const quando = m.ultimoBackup ? new Date(m.ultimoBackup).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}) : null;
  const body=el(`<div>
    <div class="card"><h2>Stato del backup</h2>
      <div class="hint">${quando ? `Ultimo backup: <b>${quando}</b>.` : 'Non hai mai fatto un backup.'}
        ${daSalvare>0 ? ` Da allora ci sono <b>${daSalvare} giri</b> non ancora salvati fuori dal telefono.` : ' Tutti i giri sono al sicuro.'}</div>
      <div class="hint">Il backup è un unico file che contiene tutti i giri, colpo per colpo. Salvalo su iCloud
        Drive quando iOS te lo chiede: da lì lo ritrovi anche se cambi telefono.</div>
      <button class="btn big" id="bk">💾 Salva backup su File / iCloud</button>
    </div>
    <div class="card"><h2>Ripristina</h2>
      <div class="hint">Scegli un file di backup salvato in precedenza.</div>
      <input type="file" accept=".json,application/json" id="imp">
      <div id="impEsito"></div>
    </div>
    <div class="card"><h2>Copie automatiche nel telefono</h2>
      <div class="hint">L'app conserva da sola le ultime 8 versioni complete dell'archivio. Servono a
        recuperare da una cancellazione per sbaglio, non da un telefono perso.</div>
      <div id="snapList"><div class="hint">Caricamento…</div></div>
    </div>
    <div class="card" id="cardArch" style="display:none"><h2>Giri messi da parte</h2>
      <div class="hint" id="archTesto"></div>
      <button class="btn secondary" id="archExp">Esporta questi giri (JSON)</button>
    </div>
    <div class="card"><h2>Esporta per analisi</h2>
      <div class="hint">CSV da aprire in Excel o Numbers. Non sono backup: non si possono reimportare.</div>
      <button class="btn secondary" id="e1">Riepilogo giri</button>
      <button class="btn secondary" id="e2">Riepilogo buche</button>
      <button class="btn secondary" id="e3">Dettaglio colpi + SG</button>
    </div>
  </div>`);

  body.querySelector('#bk').onclick=async()=>{
    const r=await eseguiBackup();
    if(r==='ok') render();
    else if(r==='errore') alert('Non è stato possibile creare il file di backup.');
  };

  body.querySelector('#imp').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      let d;
      try{ d=JSON.parse(rd.result); }catch(err){ alert('File non leggibile: non sembra un backup.'); return; }
      if(!d || !Array.isArray(d.giri)){ alert('File non valido: non contiene giri.'); return; }
      const attuali=LS.get('hcp_giri',[]);
      const ids=new Set(attuali.map(g=>g.id));
      const nuovi=d.giri.filter(g=>!ids.has(g.id));
      const scelta=confirm(`Il file contiene ${d.giri.length} giri, di cui ${nuovi.length} non presenti nell'archivio.\n\nOK = aggiunge solo i ${nuovi.length} mancanti (consigliato)\nAnnulla = sostituisce tutto con i ${d.giri.length} del file`);
      snapshotSalva();
      if(scelta){ LS.set('hcp_giri', attuali.concat(nuovi)); }
      else { if(!confirm(`Confermi la sostituzione? I ${attuali.length} giri attuali verranno rimpiazzati. Una copia resta nelle copie automatiche.`)) return;
             LS.set('hcp_giri', d.giri); }
      if(d.impostazioni) LS.set('hcp_impostazioni', d.impostazioni);
      idbFlush(); render();
    };
    rd.readAsText(f);
  };

  snapshotElenco().then(sn=>{
    const box=body.querySelector('#snapList');
    if(!sn.length){ box.innerHTML='<div class="hint">Nessuna copia ancora: se ne crea una a ogni giro completato.</div>'; return; }
    box.innerHTML='';
    sn.slice().reverse().forEach(s=>{
      const it=el(`<div class="listitem"><div>${new Date(s.ts).toLocaleString('it-IT')}
        <div class="meta">${s.giri.length} giri${s.etichetta?' · '+esc(s.etichetta):''}</div></div>
        <span class="badge">Ripristina</span></div>`);
      it.onclick=()=>{ if(confirm(`Riportare l'archivio a questa copia (${s.giri.length} giri)? I giri attuali verranno sostituiti.`)){
        snapshotSalva(); LS.set('hcp_giri', s.giri); idbFlush(); nav=[{view:'home'}]; render(); } };
      box.appendChild(it);
    });
  });

  const arch=LS.get('hcp_giri_archiviati',[]);
  if(arch.length){
    body.querySelector('#cardArch').style.display='block';
    body.querySelector('#archTesto').innerHTML=`Ci sono <b>${arch.length} giri</b> registrati con una
      versione precedente dell'app, messi da parte durante un aggiornamento. Non entrano nelle statistiche
      perché il loro formato non permette di calcolare gli strokes gained, ma <b>non sono stati cancellati</b>
      e puoi portarteli via quando vuoi.`;
    body.querySelector('#archExp').onclick=()=>{
      const txt=JSON.stringify({app:'HCP+Stat', tipo:'giri-archiviati', giri:arch}, null, 1);
      const bl=new Blob([txt],{type:'application/json'}), u=URL.createObjectURL(bl);
      const a=document.createElement('a'); a.href=u; a.download='giri-messi-da-parte.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
    };
  }

  const giriTutti=LS.get('hcp_giri',[]);
  const bl = STAT_F.baseline==='scratch'?'scratch':'tour';
  body.querySelector('#e1').onclick=()=>{
    const r=[['giro_id','data','tipo','circolo','tee','buche','punteggio','par','sul_par','putt','gir','sg_tee','sg_approccio','sg_corto','sg_putting','sg_totale','baseline']];
    giriTutti.forEach(g=>{const A=analizzaGiro(g,bl), c=A.calc;
      r.push([g.id,g.data,g.tipo,g.circolo,g.tee,c.nBuche,c.score,c.par,c.score-c.par,c.putt,c.gir,
        c.sgCat.tee.toFixed(2),c.sgCat.approccio.toFixed(2),c.sgCat.corto.toFixed(2),
        c.sgCat.putting.toFixed(2),c.sgTot.toFixed(2),bl]);});
    download('giri-riepilogo.csv', r.map(x=>x.map(escCsv).join(';')).join('\n'));
  };
  body.querySelector('#e2').onclick=()=>{
    const r=[['giro_id','data','circolo','tee','buca','par','distanza_m','punteggio','sul_par','putt','gir','sg_buca']];
    giriTutti.forEach(g=>{const A=analizzaGiro(g,bl);
      A.bucheCalc.forEach(b=>r.push([g.id,g.data,g.circolo,g.tee,b.buca,b.par,b.distanza??'',b.score,b.diff,b.putt,b.girHit?'si':'no',b.sg!==null?b.sg.toFixed(2):'']));});
    download('buche-riepilogo.csv', r.map(x=>x.map(escCsv).join(';')).join('\n'));
  };
  body.querySelector('#e3').onclick=()=>{
    const r=[['giro_id','data','circolo','tee','buca','par','colpo','lie','distanza_m','bastone','penalita','categoria','attesi_partenza','attesi_arrivo','strokes_gained']];
    giriTutti.forEach(g=>{const A=analizzaGiro(g,bl);
      A.bucheCalc.forEach(b=>b.colpi.forEach((c,i)=>r.push([g.id,g.data,g.circolo,g.tee,b.buca,b.par,i+1,
        LIE_NOME[c.lie],c.distM,c.bastone,c.penalita?'si':'no',CAT_NOME[c.cat],
        c.e0.toFixed(3),c.e1.toFixed(3),c.sg.toFixed(3)])));});
    download('colpi-dettaglio-sg.csv', r.map(x=>x.map(escCsv).join(';')).join('\n'));
  };
  return {header:'Backup e ripristino', body};
};

/* ---------------- IMPOSTAZIONI ---------------- */
VIEWS.impostazioni = function(){
  const imp=LS.get('hcp_impostazioni',{misura:'bandiera'});
  const body=el(`<div><div class="card"><h2>Come misuri le distanze</h2>
    <div class="hint">Impostato su <b>bandiera</b>: usi il telemetro, quindi tutte le distanze registrate
      sono alla bandiera. Lascialo così. Cambialo solo se un giorno ti trovassi a registrare un giro col
      GPS, che dà il centro del green: mescolare le due misure sposta di qualche metro, sempre nella
      stessa direzione, le statistiche di prossimità e le distanze per bastone.</div>
    <div class="grid3" id="mis">
      <div class="chip${imp.misura==='bandiera'?' selected':''}" data-v="bandiera">Bandiera<br><span style="font-size:11px;opacity:.75">telemetro</span></div>
      <div class="chip${imp.misura==='centro'?' selected':''}" data-v="centro">Centro green<br><span style="font-size:11px;opacity:.75">GPS</span></div>
      <div class="chip${imp.misura==='misto'?' selected':''}" data-v="misto">Misto<br><span style="font-size:11px;opacity:.75">entrambi</span></div>
    </div></div></div>`);
  body.querySelector('#mis').onclick=e=>{
    const c=e.target.closest('.chip'); if(!c) return;
    body.querySelectorAll('#mis .chip').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); LS.set('hcp_impostazioni',{...imp, misura:c.dataset.v});
  };
  return {header:'Impostazioni', body};
};


/* ---------------- SINCRONIZZAZIONE (schermata) ---------------- */
VIEWS.sincronizza = function(){
  const s=S();
  const sosp=syncInSospeso();
  const body=el('<div></div>');

  /* --- stato, sempre in cima e sempre esplicito --- */
  let statoTesto, statoCol;
  if(!s.attiva){ statoTesto='Spenta. I giri restano solo dentro questo telefono.'; statoCol='var(--grigio)'; }
  else if(s.ultimoErrore){ statoTesto='Ultimo tentativo non riuscito.'; statoCol='var(--rosso)'; }
  else if(sosp>0){ statoTesto=sosp+(sosp===1?' giro non ancora':' giri non ancora')+' al sicuro.'; statoCol='var(--ambra)'; }
  else { statoTesto='Tutto al sicuro.'; statoCol='var(--dv-good)'; }

  const cStato=el(`<div class="card"><h2>Stato</h2>
    <div style="font-size:16px;font-weight:700;color:${statoCol};margin-bottom:6px;">${esc(statoTesto)}</div>
    <div class="hint">Ultima sincronizzazione riuscita: <b>${esc(quandoTesto(s.ultimoOk))}</b>.
      ${s.privato===false?'<br><b style="color:var(--rosso)">Attenzione: il repository risulta pubblico.</b> I tuoi punteggi sarebbero visibili a chiunque: rendilo privato dalle impostazioni del repository su GitHub.':''}
      ${s.privato===true?'<br>Repository verificato <b>privato</b>.':''}</div>
    ${s.ultimoErrore?`<div class="installtip" style="color:var(--rosso)">${esc(s.ultimoErrore)}</div>`:''}
  </div>`);
  body.appendChild(cStato);

  if(s.attiva){
    const bSync=el(`<button class="btn big" id="sy">${_sy.inCorso?'Sincronizzazione in corso…':'☁︎ Sincronizza adesso'}</button>`);
    bSync.disabled=_sy.inCorso;
    bSync.onclick=async()=>{
      bSync.disabled=true; bSync.textContent='Sincronizzazione in corso…';
      const r=await syncEsegui();
      render();
      if(r.esito==='ok'){
        const p=[];
        if(r.caricati) p.push(r.caricati+' messi al sicuro');
        if(r.nuovi) p.push(r.nuovi+' arrivati da un altro dispositivo');
        if(r.aggiornati) p.push(r.aggiornati+' aggiornati');
        if(r.rimossi) p.push(r.rimossi+' spostati fra i cancellati');
        if(r.conflitti) p.push(r.conflitti+' da decidere');
        alert(p.length?('Fatto: '+p.join(', ')+'.'):'Fatto. Era già tutto allineato.');
      } else if(r.esito==='errore'){ alert('Non è andata a buon fine.\n\n'+r.messaggio+'\n\nNessun dato è andato perso: i giri sono nel telefono e il prossimo tentativo riparte da qui.'); }
      else if(r.esito==='offline'){ alert('Nessuna connessione. Riprovo da solo appena torna la rete.'); }
    };
    body.appendChild(bSync);
  }

  /* --- conflitti: la sola cosa che l'app non decide da sola --- */
  if(_sy.conflitti.length){
    const cc=el(`<div class="card" style="border-color:var(--ambra)">
      <h2 style="color:var(--ambra)">Da decidere tu</h2>
      <div class="hint">Questi giri risultano modificati in due posti diversi. L'app non sceglie al posto
        tuo e non ha sovrascritto niente: dimmi quale versione tenere.</div></div>`);
    _sy.conflitti.forEach(c=>{
      const L=c.locale, R=c.remoto;
      const descr=g=>{
        if(!g) return 'versione non leggibile';
        const nb=(g.buche||[]).length;
        const q=g.modificatoIl?new Date(g.modificatoIl).toLocaleString('it-IT'):'data sconosciuta';
        return `${nb} buche · modificata il ${q}${g.modificatoDa?' da '+esc(g.modificatoDa):''}`;
      };
      const box=el(`<div style="border-top:1px solid var(--bordo);padding-top:12px;margin-top:12px;">
        <b>${esc((L&&L.circolo)||(R&&R.circolo)||'Giro')}</b>
        <div class="meta" style="margin-bottom:8px;">${fmtData((L&&L.data)||(R&&R.data))}</div>
        <div class="hint"><b>Su questo telefono:</b> ${descr(L)}</div>
        <div class="hint"><b>Sul repository:</b> ${descr(R)}</div>
        <div class="grid2">
          <button class="btn secondary" style="margin:0">Tieni quella del telefono</button>
          <button class="btn secondary" style="margin:0">Tieni quella del repository</button>
        </div></div>`);
      box.querySelectorAll('button')[0].onclick=()=>{ if(confirm('Tenere la versione di questo telefono? Quella sul repository verrà sostituita, ma resta nella cronologia di GitHub.')) risolviConflitto(c.id,'locale'); };
      box.querySelectorAll('button')[1].onclick=()=>{ if(confirm('Tenere la versione del repository? Quella di questo telefono verrà sostituita. Una copia resta nelle copie automatiche.')) risolviConflitto(c.id,'remoto'); };
      cc.appendChild(box);
    });
    body.appendChild(cc);
  }

  /* --- impostazioni --- */
  const cImp=el(`<div class="card"><h2>Collegamento a GitHub</h2>
    <div class="hint">Serve una volta per dispositivo. Il token si genera su GitHub e vale solo per il
      repository dei dati: non dà accesso a nient'altro.</div>
    <label>Nome utente GitHub</label>
    <input type="text" id="sy_u" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(s.utente)}" placeholder="il tuo nome utente">
    <label style="margin-top:10px;">Repository dei dati</label>
    <input type="text" id="sy_r" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(s.repo)}" placeholder="golf-dati">
    <label style="margin-top:10px;">Token</label>
    <input type="password" id="sy_t" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(s.token)}" placeholder="github_pat_…">
    <div class="hint" style="margin-top:6px;">Il token resta dentro questo telefono. Non finisce nei backup,
      non viene mai mostrato per intero e non esce di qui.</div>
    <label style="margin-top:10px;">Nome di questo dispositivo</label>
    <input type="text" id="sy_d" value="${esc(s.dispositivo)}" placeholder="iPhone">
    <div class="hint">Compare accanto a ogni giro caricato: serve a capire, in caso di conflitto, quale
      dispositivo ha fatto cosa.</div>
    <button class="btn secondary" id="sy_v">Verifica il collegamento</button>
    <div id="sy_esito"></div>
  </div>`);

  const leggi=()=>({
    utente:cImp.querySelector('#sy_u').value.trim(),
    repo:cImp.querySelector('#sy_r').value.trim(),
    token:cImp.querySelector('#sy_t').value.trim(),
    dispositivo:cImp.querySelector('#sy_d').value.trim()||nomeDispositivoIniziale()
  });
  cImp.querySelector('#sy_v').onclick=async()=>{
    Sset(leggi());
    const box=cImp.querySelector('#sy_esito');
    box.innerHTML='<div class="hint">Verifico…</div>';
    try{
      const r=await syncVerifica();
      box.innerHTML=`<div class="installtip">Collegamento riuscito con <b>${esc(r.nome)}</b>.<br>
        ${r.privato?'Il repository è <b>privato</b>, come deve essere.'
                   :'<b style="color:var(--rosso)">Il repository è PUBBLICO.</b> Rendilo privato su GitHub prima di attivare: i tuoi punteggi sarebbero visibili a chiunque.'}</div>`;
      render_stato_bottone();
    }catch(e){
      box.innerHTML=`<div class="installtip" style="color:var(--rosso)">${esc(e.message||String(e))}</div>`;
    }
  };
  body.appendChild(cImp);

  /* --- interruttore --- */
  const cSw=el(`<div class="card"><h2>Interruttore</h2>
    <div class="hint">Finché è spenta, l'app si comporta esattamente come prima: i dati restano nel
      telefono e non esce niente. Accendila solo dopo che la verifica qui sopra è riuscita.</div></div>`);
  const bSw=el(`<button class="btn ${s.attiva?'danger':''}" style="margin:0">${s.attiva?'Spegni la sincronizzazione':'Accendi la sincronizzazione'}</button>`);
  bSw.onclick=async()=>{
    if(s.attiva){ Sset({attiva:false}); render(); return; }
    Sset(leggi());
    try{
      const r=await syncVerifica();
      if(!r.privato && !confirm('Il repository risulta PUBBLICO: i tuoi giri sarebbero visibili a chiunque.\n\nAccendere lo stesso? (sconsigliato)')) return;
      Sset({attiva:true});
      render();
      syncAuto();
    }catch(e){ alert('Non posso accendere la sincronizzazione:\n\n'+(e.message||String(e))); }
  };
  cSw.appendChild(bSw);
  body.appendChild(cSw);
  function render_stato_bottone(){}

  /* --- giri nascosti --- */
  const canc=LS.get('hcp_giri_cancellati',[]);
  if(canc.length){
    const cN=el(`<div class="card"><h2>Giri eliminati</h2>
      <div class="hint">Eliminare un giro dal telefono non lo distrugge: la copia resta qui e, sul
        repository, il file viene spostato in <code>cancellati/</code> invece che rimosso.
        ${canc.filter(c=>!c.spostato).length?'<br><b>'+canc.filter(c=>!c.spostato).length+'</b> in attesa di essere spostati sul repository.':''}</div></div>`);
    canc.slice().reverse().forEach(c=>{
      const g=c.giro||{};
      const it=el(`<div class="listitem"><div><b>${esc(g.circolo||'giro')}</b>
        <div class="meta">${fmtData(g.data)}${c.spostato?'':' · da spostare'}</div></div>
        <span class="badge">Ripristina</span></div>`);
      it.onclick=()=>{
        if(!confirm('Rimettere questo giro fra i giri salvati?')) return;
        const giri=LS.get('hcp_giri',[]);
        if(!giri.some(x=>x.id===c.id)){ marcaModifica(c.giro); giri.push(c.giro); LS.set('hcp_giri',giri); }
        LS.set('hcp_giri_cancellati', LS.get('hcp_giri_cancellati',[]).filter(x=>x.id!==c.id));
        idbFlush(); render(); syncAuto();
      };
      cN.appendChild(it);
    });
    body.appendChild(cN);
  }

  body.appendChild(el(`<div class="card"><h2>Come funziona</h2><div class="metodo">
    <b>Cosa sale.</b> Un file per ogni giro, dentro la cartella <code>giri/</code> del repository privato.
    Non c'è un archivio unico: due telefoni che registrano giri diversi non si pestano i piedi.<br><br>
    <b>Cosa scende.</b> All'apertura dell'app, i giri presenti sul repository e assenti qui vengono
    aggiunti. La sincronizzazione aggiunge: non cancella mai un giro da sola.<br><br>
    <b>Se due dispositivi correggono lo stesso giro.</b> L'app se ne accorge, non sovrascrive niente e
    ti mostra le due versioni chiedendo quale tenere.<br><br>
    <b>Il backup su file resta.</b> È la via di scorta per il caso in cui GitHub non sia raggiungibile
    o l'account non sia disponibile. Continua a usarlo quando l'app te lo consiglia.<br><br>
    <b>Se perdi il telefono.</b> Su GitHub, Settings → Developer settings → Fine-grained tokens →
    Revoke accanto al token. Dieci secondi e quel telefono non tocca più l'archivio.
  </div></div>`));

  return {header:'Sincronizzazione', body};
};

initStore().then(()=>{
  bozza = LS.get('hcp_bozza_v3', null);
  render();
  const m=LS.get('hcp_meta',{})||{};
  if(m.rimossiLegacy && !m.avvisoLegacy){
    metaSet({avvisoLegacy:1});
    setTimeout(()=>alert(`Aggiornamento archivio: ${m.rimossiLegacy} giri registrati con una versione precedente sono stati messi da parte, non cancellati.\n\nAvevano punteggi non affidabili e non producevano strokes gained, quindi sono esclusi dalle statistiche. Li trovi in Backup, sezione "Giri messi da parte", e da lì puoi esportarli.`), 400);
  }
  if(!S().dispositivo) Sset({dispositivo:nomeDispositivoIniziale()});
  syncAuto();                                  // all'apertura, se e' accesa e c'e' rete
  window.addEventListener('online', syncAuto); // e appena la rete torna
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncAuto(); });
}).catch(e=>{
  document.getElementById('app').innerHTML =
    '<main><div class="card"><h2>Errore di avvio</h2><div class="hint">'+String(e && e.message || e)+'</div></div></main>';
});
</script>
