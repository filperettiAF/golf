    /* ── putting: le letture che separano ── */
    {
      const PA=statPuttAvanzato(completi);
      if(PA.girN>0 || PA.nPrimo>0) p1.appendChild(el('<div class="card"><h2>Putting: le letture che separano</h2>'+
        '<div class="hint">Putt per giro peggiora sia se putti male sia se arrivi lontano. Queste due separano le '+
        'due cose: i putt sulle sole buche in regulation, e quanto lontano arrivi.</div>'+
        '<div class="kpigrid">'+
          '<div class="kpi"'+(PA.girN>=N_MIN_FASCIA?'':' style="opacity:.55"')+'><div class="lab">Putt per GIR</div>'+
            '<div class="v">'+(PA.puttGir!==null?PA.puttGir.toFixed(2).replace('.',','):'\u2014')+'</div>'+
            '<div class="sub">'+PA.girN+' buche in regulation</div></div>'+
          '<div class="kpi"><div class="lab">Primo putt, in GIR</div>'+
            '<div class="v">'+(PA.primoGir!==null?PA.primoGir.toFixed(1).replace('.',',')+'<span class="u">m</span>':'\u2014')+'</div>'+
            '<div class="sub">'+PA.nPrimoGir+' buche</div></div>'+
          '<div class="kpi"><div class="lab">Primo putt, tutte</div>'+
            '<div class="v">'+(PA.primo!==null?PA.primo.toFixed(1).replace('.',',')+'<span class="u">m</span>':'\u2014')+'</div>'+
            '<div class="sub">rif. amatoriale ~4,6 m</div></div>'+
          '<div class="kpi"><div class="lab">Corti mancati</div>'+
            '<div class="v">'+(PA.cortiMancatiGiro!==null?PA.cortiMancatiGiro.toFixed(1).replace('.',','):'\u2014')+'</div>'+
            '<div class="sub">entro 5 ft, per giro</div></div>'+
        '</div>'+
        '<table class="stat" style="margin-top:10px"><tbody>'+
          '<tr><td>Imbucati entro i 5 ft</td><td class="n"><b>'+(PA.cortiPct!==null?Math.round(PA.cortiPct)+'%':'\u2014')+
            '</b></td><td class="n dim" style="font-size:11px">'+(PA.corti-PA.cortiMancati)+' su '+PA.corti+'</td></tr>'+
          '<tr><td>Metri di putt imbucati per giro</td><td class="n"><b>'+
            (PA.footageGiro!==null?PA.footageGiro.toFixed(1).replace('.',','):'\u2014')+' m</b></td>'+
            '<td class="n dim" style="font-size:11px">Shot Scope: total footage</td></tr>'+
        '</tbody></table>'+
        '<div class="stcap"><b>Putt per GIR</b> e\u2019 il putting al netto della qualita\u2019 '+
        'dell\u2019approccio \u2014 il Tour la chiama GIR Putting Average. Nessun riferimento numerico pubblicato '+
        'ha superato la verifica, quindi qui il confronto e\u2019 solo con te stesso nel tempo.<br><br>'+
        '<b>Primo putt</b>: la versione "in GIR" e\u2019 quella pulita, perche\u2019 esclude le buche in cui sei '+
        'arrivato col chip. Riferimento amatoriale ~15 ft (4,6 m); la prossimita\u2019 media d\u2019approccio dello '+
        'scratch e\u2019 41,7 ft (12,7 m) contro 68 ft dell\u2019handicap 15 \u2014 grandezza affine, non la stessa '+
        'cosa.<br><br><b>Corti mancati</b>: riferimento Shot Scope per fascia di punteggio, 4,6 nei giri in 100 fino '+
        'a 1,6 in quelli in 60. E l\u201984% dei putt mancati oltre i 5 ft finisce corto: la griglia dei settori '+
        'nella scheda Putt ti dice se e\u2019 il tuo caso.</div></div>'));
    }
    /* ── stroke index ── */
    {
      const SI=statPerSI(completi);
      if(SI.fasce.length) p1.appendChild(el('<div class="card"><h2>Rendimento per fascia di stroke index</h2>'+
        '<div class="hint">Lo stroke index sta in ogni buca da sempre, copiato dall\u2019archivio campi, e non era '+
        'mai entrato in nessuna analisi. <b>Nessuna app di gioco lo espone</b>: questa lettura non l\u2019abbiamo '+
        'copiata da nessuno.</div>'+
        '<table class="stat"><thead><tr><th>Fascia</th><th class="n">Buche</th><th class="n">Sul par</th>'+
          '<th class="n">Green</th><th class="n">Bogey+</th><th class="n">SG</th></tr></thead><tbody>'+
        SI.fasce.map(x=>'<tr'+(x.solido?'':' style="opacity:.5"')+'><td>'+x.nome+'</td>'+
          '<td class="n">'+x.n+'</td>'+
          '<td class="n '+(x.media<=0?'pos':'neg')+'">'+sgn(x.media,2)+'</td>'+
          '<td class="n">'+Math.round(x.girPct)+'%</td>'+
          '<td class="n">'+Math.round(x.bogeyPct)+'%</td>'+
          '<td class="n '+((x.sgB||0)>=0?'pos':'neg')+'">'+(x.sgB!==null?sgn(x.sgB,2):'\u2014')+'</td></tr>').join('')+
        '</tbody></table>'+
        '<div class="stcap">Lo stroke index viene dalla carta del percorso e dice quanto una buca e\u2019 '+
        'considerata difficile. La domanda a cui risponde: <b>perdi colpi dove e\u2019 previsto perderli, o dove '+
        'non dovresti?</b> Se il rendimento sulle sei facili e\u2019 vicino a quello sulle sei difficili, il '+
        'problema non e\u2019 la difficolta\u2019 della buca.'+
        (SI.senzaSI?' '+SI.senzaSI+' buche non hanno lo stroke index e sono escluse.':'')+
        '<br><br>E\u2019 anche il ponte piu\u2019 promettente verso lo storico federale: le 386 gare hanno CR e '+
        'slope, e lo stroke index e\u2019 la grandezza che parla la stessa lingua.</div></div>'));
    }
    /* ── il livello, reparto per reparto ── */
    {
      const LV=statLivelli(A);
      if(LV){
        const cats=['tee','approccio','corto','putting'];
        const best=cats.slice().sort((a,b)=>(LV.cat[b].guadagno||0)-(LV.cat[a].guadagno||0))[0];
        p1.appendChild(el('<div class="card"><h2>Il tuo livello, reparto per reparto</h2>'+
          '<div class="verd">Sul punteggio sei intorno a un <b>handicap '+
          (LV.livello!==null?LV.livello.toFixed(1).replace('.',','):'\u2014')+'</b> '+
          '('+sgnIt(LV.vsPar,1)+' sul par, '+LV.n+' giri)</div>'+
          '<div class="legg">portando un reparto al livello Tour, il livello che ne uscirebbe</div>'+
          '<table class="stat" style="margin-top:8px"><thead><tr><th>Se portassi al Tour</th>'+
            '<th class="n">Sul par</th><th class="n">Livello</th><th class="n">Guadagno</th></tr></thead><tbody>'+
          cats.map(k=>{
            const c=LV.cat[k];
            return '<tr'+(k===best?' style="font-weight:600"':'')+'><td>'+CAT_NOME[k]+'</td>'+
              '<td class="n">'+sgn(c.vsPar,1)+'</td>'+
              '<td class="n"><b>'+(c.livello!==null?c.livello.toFixed(1).replace('.',','):'\u2014')+'</b></td>'+
              '<td class="n '+((c.guadagno||0)>0?'pos':'')+'">'+(c.guadagno!==null?'\u2212'+c.guadagno.toFixed(1).replace('.',','):'\u2014')+'</td></tr>';
          }).join('')+
          '</tbody></table>'+
          '<div class="stcap"><b>Perche\u2019 questa tabella esiste:</b> "putting \u22120,8 colpi/giro" e\u2019 '+
          'corretto e astratto. Broadie in Golfmetrics esprime ogni reparto come un handicap, e Clippd fa la stessa '+
          'mossa con una scala 0-200 di cui non pubblica la formula. Qui la formula e\u2019 in chiaro, in due '+
          'passi: la scala colpi-sul-par \u2192 handicap e\u2019 quella pubblicata da Shot Scope (hcp 0 +0,8 \u00b7 '+
          '5 +6,3 \u00b7 10 +10,9 \u00b7 15 +17,4 \u00b7 20 +21,7 \u00b7 25 +29,0), interpolata; poi per ogni '+
          'reparto si calcola il controfattuale, cioe\u2019 che punteggio faresti se quel reparto fosse a zero '+
          'strokes gained lasciando gli altri come sono.<br><br><b>Due limiti dichiarati.</b> La scala e\u2019 sul '+
          'punteggio rispetto al <i>par</i>, non al CR: su un campo dove il CR supera il par (Colline del Gavi: CR '+
          '74,2 su par 73) il livello esce pessimistico di circa un colpo. E <b>non e\u2019 un indice WHS</b>: '+
          'quello vero sta nella Dashboard, sulle 386 gare. Classe del riferimento: dato divulgato senza '+
          'numerosita\u2019.</div></div>'));
      }
    }
  }

  /* ══ v12 — LE VISUALIZZAZIONI DEL HANDOFF ════════════════════════════════
     Ognuna sta accanto ai numeri che l'app calcolava gia': il handoff chiede di
     aggiungere grafici, non di cambiare output.                              */
  if(completi.length){
    /* heatmap reparti x giri, in Sintesi */
    if(completi.length>=4){
      const cats=['tee','approccio','corto','putting'];
      p1.appendChild(el(pannello({titolo:'Dove si perde, giro per giro',
        nota:'Una riga per reparto, una colonna per giro. Piu\u2019 intenso il colore, piu\u2019 grande lo scarto: '+
          'verde guadagni, rosso perdite. Serve a vedere se un reparto perde <b>sempre</b> o solo in certe giornate.',
        grafico: grafHeat(cats.map(k=>({nome:CAT_NOME[k], vals:completi.map(g=>g.calc.sgCat[k])})),
          fmtDataBreve(completi[0].data), fmtDataBreve(completi[completi.length-1].data))})));
    }
    /* small multiples per reparto */
    if(completi.length>=8){
      const cats=['tee','approccio','corto','putting'];
      p1.appendChild(el(pannello({titolo:'Andamento per reparto',
        nota:'Quattro grafici sulla <b>stessa scala</b>, cosi\u2019 si vede subito quale reparto pesa di piu\u2019.',
        grafico: grafMini(cats.map(k=>({nome:CAT_NOME[k], vals:completi.map(g=>g.calc.sgCat[k])})))})));
    }
    /* ellisse del drive */
    {
      const BS=statBastoni(sel).filter(b=>b.bastone!=='Putter' && b.latDisp!==null && b.disp!==null);
      const dr=BS.find(b=>b.bastone==='Driver') || BS[0];
      if(dr) p1.appendChild(el(pannello({titolo:'Dispersione del drive',
        nota:'Scarto tipo longitudinale <b>'+dr.disp+' m</b> e laterale <b>'+dr.latDisp+' m</b> su '+dr.nLat+
          ' colpi con settore, per '+esc(dr.bastone)+'.',
        grafico: grafEllisse(dr.disp, dr.latDisp, 18, 12,
          'RICOSTRUZIONE dichiarata: l\u2019app registra il lato e il settore, non le coordinate. Gli assi sono i due '+
          'scarti tipo misurati, e la componente laterale dei settori diagonali e\u2019 approssimata a 45 gradi. '+
          'L\u2019ellisse grigia e\u2019 un riferimento indicativo, non un dato pubblicato per fascia.')})));
    }
    /* dot plot della sacca */
    {
      const BS=statBastoni(sel).filter(b=>b.bastone!=='Putter' && b.distMedia!==null)
        .slice().sort((a,b)=>(b.distMedia||0)-(a.distMedia||0));
      if(BS.length>=3) p1.appendChild(el(pannello({titolo:'Scala dei bastoni',
        nota:'Il pallino e\u2019 la media, il segmento va dal 10\u00b0 al 90\u00b0 percentile delle distanze '+
          'percorse. In ordine di sacca, putter escluso.',
        grafico: grafDot(BS.map(b=>({nome:b.bastone, med:b.distMedia, p10:b.p10, p90:b.p90})), 60, 285),
        chiusura:'La distanza e\u2019 quella <b>percorsa</b>, corretta col settore, non il carry. Per scegliere il '+
          'bastone la colonna che conta e\u2019 il 70\u00b0 percentile, nella tabella qui sotto.'})));
    }
    /* Pareto delle code */
    {
      const persi=[];
      completi.forEach(g=>g.bucheCalc.forEach(b=>b.colpi.forEach(x=>{ if(x.lie!=='green' && x.sg<0) persi.push(x.sg); })));
      if(persi.length>=30) p1.appendChild(el(pannello({titolo:'La curva dei colpi persi',
        nota:'Cumulata dei colpi persi, dal colpo peggiore in avanti. Quanto piu\u2019 la curva sale a sinistra, '+
          'tanto piu\u2019 le perdite stanno in pochi colpi.',
        grafico: grafPareto(persi)})));
    }
    /* bersaglio della prossimita' */
    {
      const FA=statFasce(completi).filter(x=>x.nProx>0);
      if(FA.length>=3) p1.appendChild(el(pannello({titolo:'Prossimita\u2019: dove lasci la palla',
        nota:'Un cerchio per fascia: il raggio e\u2019 la distanza media a cui lasci la palla quando prendi il green.',
        grafico: grafBersaglio(FA.map(x=>({nome:x.label.replace(' m',''), v:x.prox/x.nProx}))),
        chiusura:'I numeri per fascia, con green presi e strokes gained, stanno nella tabella degli approcci.'})));
    }
    /* scatter partenza / residuo */
    {
      const pts=[];
      completi.forEach(g=>g.bucheCalc.forEach(b=>b.colpi.forEach((x,i)=>{
        if(x.cat!=='approccio' || x.penalita || !(x.distM>0)) return;
        const nx=b.colpi[i+1];
        pts.push({x:x.distM, y: nx? (nx.distM||0) : 0});
      })));
      if(pts.length>=20){
        const FR=statFRL(completi);
        const frl=FR.globale.med||7;
        p1.appendChild(el(pannello({titolo:'Partenza e residuo, colpo per colpo',
          nota:'Un punto per approccio: in orizzontale da dove parti, in verticale quanto lasci. La retta '+
            'tratteggiata e\u2019 la tua prossimita\u2019 normalizzata ('+frl.toFixed(1).replace('.',',')+
            '%): i punti sopra sono i colpi peggiori della tua media, quelli sotto i migliori.',
          grafico: grafScatter(pts, frl)})));
      }
    }
    /* bullet: tu contro il Tour */
    {
      const SB=statBase(A);
      if(SB){
        const righe=[];
        if(SB.fir) righe.push({nome:'FIR', mio:SB.fir.pct, rif:RIF_SCRATCH.fir, max:100,
          testoMio:Math.round(SB.fir.pct)+'%', testoRif:RIF_SCRATCH.fir+'%', suMeglio:true});
        righe.push({nome:'GIR', mio:SB.gir.pct, rif:RIF_SCRATCH.gir, max:100,
          testoMio:Math.round(SB.gir.pct)+'%', testoRif:RIF_SCRATCH.gir+'%', suMeglio:true});
        if(SB.scr) righe.push({nome:'Scrambling', mio:SB.scr.pct, rif:RIF_SCRATCH.scr, max:100,
          testoMio:Math.round(SB.scr.pct)+'%', testoRif:RIF_SCRATCH.scr+'%', suMeglio:true});
        if(SB.sand) righe.push({nome:'Sand save', mio:SB.sand.pct, rif:RIF_SCRATCH.sand, max:100,
          testoMio:Math.round(SB.sand.pct)+'%', testoRif:RIF_SCRATCH.sand+'%', suMeglio:true});
        righe.push({nome:'Putt per buca', mio:SB.puttBuca, rif:RIF_SCRATCH.puttGiro/18, max:2.5,
          testoMio:SB.puttBuca.toFixed(2).replace('.',','), testoRif:(RIF_SCRATCH.puttGiro/18).toFixed(2).replace('.',','),
          suMeglio:false});
        p1.appendChild(el(pannello({titolo:'Tu contro il riferimento',
          nota:'Cinque metriche, ognuna sulla propria scala. Verde se stai meglio del riferimento, rosso se peggio: '+
            'attenzione che sui <b>putt per buca meno e\u2019 meglio</b>.',
          grafico: grafBullet(righe),
          chiusura:'Il riferimento e\u2019 il giocatore scratch di Shot Scope, tranne i doppi che vengono dal Tour. '+
            'Classe: dato divulgato, numerosita\u2019 non dichiarata dalla fonte.'})));
      }
    }
    /* calendario mensile */
    {
      const perMese={};
      A.forEach(g=>{ const k=(g.data||'').slice(0,7); if(!k) return;
        if(!perMese[k]) perMese[k]={n:0, s:0}; perMese[k].n++; perMese[k].s+=g.calc.score-g.calc.par; });
      const chiavi=Object.keys(perMese).sort();
      if(chiavi.length>=2) p1.appendChild(el(pannello({titolo:'Stagione, mese per mese',
        nota:'Punteggio medio sul par per mese: il verde e\u2019 tanto piu\u2019 intenso quanto piu\u2019 basso il punteggio.',
        grafico: grafCalendario(chiavi.map(k=>({nome:(MESI_IT[parseInt(k.slice(5,7),10)-1]||k).slice(0,3),
          punteggio:perMese[k].s/perMese[k].n, giri:perMese[k].n})))})));
    }
    /* curva di realizzazione dei putt sull'area del Tour */
    {
      const PU=statPutting(A);
      const voci=PU.fasce.filter(f=>f.n>0).map(f=>{
        const centro=f.hi>=999 ? f.lo+3 : (f.lo+f.hi)/2;
        return {nome:f.label, breve:f.hi>=999?'12+':(f.lo===0?'<1':f.lo+'\u2013'+f.hi),
          v:f.imbucati/f.n*100, rif:tourMakePct(centro), n:f.n};
      });
      if(voci.length>=4){
        p1.appendChild(el(pannello({titolo:'Realizzazione dei putt',
          nota:'La tua percentuale di imbucata per fascia, sopra l\u2019<b>area grigia del Tour</b>. '+
            'Il riferimento del Tour e\u2019 preso al <b>centro della fascia</b>: dentro una fascia larga '+
            'la percentuale cambia molto, quindi l\u2019area va letta come ordine di grandezza.',
          grafico: grafCurvaRif(voci, {aria:'percentuale di putt imbucati per fascia contro il Tour'}),
          chiusura:'Le barre bullet della stessa grandezza non sono state aggiunte sotto la tabella '+
            '\u201cPutting per distanza\u201d: sarebbero lo stesso numero due volte, e la regola '+
            '\u201cprofondita\u2019 senza duplicazioni\u201d vale piu\u2019 della lettera del handoff.'})));
      }
    }
    /* colonne per buca, sul singolo circolo */
    {
      const cS=[...new Set(sel.map(g=>g.circolo))];
      if(cS.length===1){
        const pb=statPerBuca(A);
        if(pb.length>=9){
          const vals=[], pars=[];
          pb.slice().sort((a,b)=>a.buca-b.buca).forEach(x=>{ vals.push(x.contratta); pars.push(x.par); });
          p1.appendChild(el(pannello({titolo:'Buche che costano di piu\u2019, in ordine di gioco',
            nota:'Una colonna per buca, dalla 1 alla 18 su '+esc(circoloBreve(cS[0]))+'. Verso l\u2019alto in rosso '+
              'le buche che costano, verso il basso in verde quelle che rendono. Il numero della buca e\u2019 '+
              'colorato per par.',
            grafico: grafBuche(vals, pars),
            chiusura:'I valori sono <b>contratti verso la media</b>: ordinare per media grezza selezionerebbe le '+
              'buche piu\u2019 rumorose, non le piu\u2019 difficili.'})));
        }
      }
    }
  }

  /* ══ v11 — I PANNELLI DEL CATALOGO PGA TOUR ══════════════════════════════ */
  if(completi.length){
    const pct1=v=>v===null||v===undefined?'\u2014':v.toFixed(1)+'%';
    const m1=v=>v===null||v===undefined?'\u2014':v.toFixed(1).replace('.',',')+' m';

    /* ── dove finisce quando manca il fairway ── */
    {
      const MF=statMissFairway(completi);
      if(MF.tot>0){
        const bar=(nome,v,pct,col)=>'<div class="hbrow wide"><div class="l">'+nome+'</div>'+
          '<div class="hbtrack"><div class="hbfill" style="width:'+(pct===null?0:Math.min(100,pct))+'%;background:'+col+'"></div></div>'+
          '<div class="n">'+pct1(pct)+' <span class="dim" style="font-size:10px">('+v+')</span></div></div>';
        p1.appendChild(el('<div class="card"><h2>Dove finisce il tee shot</h2>'+
          '<div class="hint">Le quattro voci del Tour che sommano a 100%: fairway centrato, rough, '+
          'bunker di fairway, e tutto il resto. Su '+MF.tot+' colpi dal tee di par 4 e 5.</div>'+
          bar('Fairway', MF.fw, MF.fwPct, 'var(--dv-blue)')+
          bar('Rough', MF.rough, MF.roughPct, 'var(--dv-orange)')+
          bar('Bunker di fairway', MF.bunker, MF.bunkerPct, 'var(--dv-orange)')+
          bar('Recupero o altro', MF.altro, MF.altroPct, 'var(--dv-red)')+
          bar('Penalita\u2019', MF.pen, MF.penPct, 'var(--dv-red)')+
          (MF.conLato>=8?'<table class="stat" style="margin-top:10px"><thead><tr>'+
            '<th>Rough, da che lato</th><th class="n">N</th><th class="n">%</th></tr></thead><tbody>'+
            '<tr><td>A sinistra</td><td class="n">'+MF.roughSx+'</td><td class="n">'+
              pct1(MF.rough?100*MF.roughSx/MF.rough:null)+'</td></tr>'+
            '<tr><td>A destra</td><td class="n">'+MF.roughDx+'</td><td class="n">'+
              pct1(MF.rough?100*MF.roughDx/MF.rough:null)+'</td></tr>'+
            '<tr><td>Lato non dichiarato</td><td class="n">'+MF.roughNd+'</td><td class="n">'+
              pct1(MF.rough?100*MF.roughNd/MF.rough:null)+'</td></tr>'+
            '</tbody></table>':'')+
          '<div class="stcap">Sono <i>Driving Accuracy</i>, <i>Rough Tendency</i>, <i>Fairway Bunker '+
          'Tendency</i> e <i>Missed Fairway Percent \u2014 Other</i>: sul Tour le quattro sommano a cento. '+
          'Il lato del rough viene dal campo che segni sulla scheda del tee, quindi la ripartizione '+
          'sinistra/destra vale solo sui drive in cui l\u2019hai messo.<br><br>Il Tour ha anche <i>Distance '+
          'from Edge of Fairway</i> e <i>Left/Right Tendency</i>: richiedono le coordinate laterali del campo '+
          'e non sono calcolabili qui.</div></div>'));
      }
    }

    /* ── quanta buca copre il tee shot ── */
    {
      const YD=statYardage(completi);
      if(YD.n>=5) p1.appendChild(el('<div class="card"><h2>Quanta buca copre il tee shot</h2>'+
        '<div class="hint">La statistica <i>% of Yardage covered by Tee Shots</i>: quanta parte della buca '+
        'ti metti alle spalle col primo colpo.</div>'+
        '<div class="kpigrid">'+
          '<div class="kpi"><div class="lab">Par 4 e 5</div><div class="v">'+
            (YD.tot!==null?YD.tot.toFixed(1)+'<span class="u">%</span>':'\u2014')+'</div>'+
            '<div class="sub">'+YD.n+' buche</div></div>'+
          '<div class="kpi"><div class="lab">Solo par 4</div><div class="v">'+
            (YD.p4.m!==null?YD.p4.m.toFixed(1)+'<span class="u">%</span>':'\u2014')+'</div>'+
            '<div class="sub">'+YD.p4.n+' buche</div></div>'+
          '<div class="kpi"><div class="lab">Solo par 5</div><div class="v">'+
            (YD.p5.m!==null?YD.p5.m.toFixed(1)+'<span class="u">%</span>':'\u2014')+'</div>'+
            '<div class="sub">'+YD.p5.n+' buche</div></div>'+
          '<div class="kpi"><div class="lab">Drive piu\u2019 lungo</div><div class="v">'+
            (YD.dMax!==null?Math.round(YD.dMax)+'<span class="u">m</span>':'\u2014')+'</div>'+
            '<div class="sub">distanza percorsa</div></div>'+
        '</div>'+
        '<div class="stcap">Distanza percorsa dal colpo dal tee diviso la lunghezza della buca dal tuo tee. '+
        'Usa la correzione col settore, quindi non sottostima le palle finite oltre o di lato. I drive con '+
        'penalita\u2019 sono esclusi. Sul Tour esiste nelle tre varianti totale / par 4 / par 5, ma non pubblica '+
        'un valore di riferimento utilizzabile qui, perche\u2019 dipende dalla lunghezza dei campi.</div></div>'));
    }

    /* ── GIR per lie e sopra/sotto i 91 m ── */
    {
      const AL=statApproccioLie(completi);
      const righe=[['fairway','Dal fairway'],['rough','Dal rough'],['sabbia','Dal bunker'],['recupero','Dal recupero']]
        .filter(r=>AL.per[r[0]].n>0);
      if(righe.length) p1.appendChild(el('<div class="card"><h2>Approcci: green e prossimita\u2019 per lie</h2>'+
        '<div class="hint">Le tre statistiche del Tour <i>GIR from Fairway</i>, <i>from Fairway Bunker</i> e '+
        '<i>from Other than Fairway</i>, piu\u2019 la prossimita\u2019 da ciascun lie.</div>'+
        '<table class="stat"><thead><tr><th>Da</th><th class="n">Colpi</th><th class="n">Green</th>'+
          '<th class="n">Lascia</th></tr></thead><tbody>'+
        righe.map(r=>{ const o=AL.per[r[0]];
          return '<tr'+(o.solido?'':' style="opacity:.5"')+'><td>'+r[1]+'</td><td class="n">'+o.n+'</td>'+
            '<td class="n"><b>'+pct1(o.greenPct)+'</b></td><td class="n">'+m1(o.prox)+'</td></tr>';}).join('')+
        '<tr><td colspan="4" style="padding:3px 0;border-bottom:1px solid var(--bordo)"></td></tr>'+
        '<tr'+(AL.sopra.solido?'':' style="opacity:.5"')+'><td>Oltre i 91 m <span class="dim" style="font-size:10px">(100 yd)</span></td>'+
          '<td class="n">'+AL.sopra.n+'</td><td class="n">'+pct1(AL.sopra.greenPct)+'</td>'+
          '<td class="n"><b>'+m1(AL.sopra.prox)+'</b></td></tr>'+
        '<tr'+(AL.sotto.solido?'':' style="opacity:.5"')+'><td>Entro i 91 m</td>'+
          '<td class="n">'+AL.sotto.n+'</td><td class="n">'+pct1(AL.sotto.greenPct)+'</td>'+
          '<td class="n"><b>'+m1(AL.sotto.prox)+'</b></td></tr>'+
        '</tbody></table>'+
        '<div class="stcap">Le due righe in fondo sono <i>Approaches from \u003e 100 yards</i> e <i>inside 100 '+
        'yards</i>, che sul Tour misurano la <b>prossimita\u2019</b> e non il green preso: 91,44 m sono 100 '+
        'yard. Questa e\u2019 la lettura per <i>lie di partenza</i>; quella per fascia di distanza sta nella '+
        'tabella degli approcci.</div></div>'));
    }

    /* ── da che distanza nascono birdie e bogey ── */
    {
      const AE=statApproccioEsito(completi);
      if(AE.birdie.n+AE.par.n+AE.bogey.n>=10) p1.appendChild(el('<div class="card">'+
        '<h2>Da che distanza nascono birdie e bogey</h2>'+
        '<div class="hint">Le tre statistiche <i>Average Approach Distance</i> del Tour, divise per come '+
        'e\u2019 finita la buca. Non e\u2019 causalita\u2019: e\u2019 la fotografia di dove si vincono e si '+
        'perdono le buche.</div>'+
        '<table class="stat"><thead><tr><th>Buca chiusa in</th><th class="n">Buche</th>'+
          '<th class="n">Distanza media dell\u2019approccio</th></tr></thead><tbody>'+
        [['Birdie o meglio',AE.birdie],['Par',AE.par],['Bogey o peggio',AE.bogey]].map(r=>
          '<tr'+(r[1].solido?'':' style="opacity:.5"')+'><td>'+r[0]+'</td><td class="n">'+r[1].n+'</td>'+
          '<td class="n"><b>'+m1(r[1].m)+'</b></td></tr>').join('')+
        '</tbody></table>'+
        '<div class="stcap">Si prende l\u2019<b>ultimo</b> approccio della buca, cioe\u2019 quello da cui hai '+
        'davvero attaccato il green. Se la distanza dei bogey e\u2019 vicina a quella dei par, il problema non '+
        'e\u2019 da dove attacchi.</div></div>'));
    }

    /* ── birdie e punteggio per fascia (RTP) ── */
    {
      const RT=statRTPFasce(completi);
      if(RT.length) p1.appendChild(el('<div class="card"><h2>Come finisce la buca, per fascia d\u2019approccio</h2>'+
        '<div class="hint">Le stesse fasce della tabella degli approcci, domanda diversa: non quanto e\u2019 '+
        'buono il colpo, ma <b>come finisce la buca</b>. E\u2019 la famiglia <i>RTP Score</i> e <i>Birdie or '+
        'Better Percentage</i> del Tour.</div>'+
        '<table class="stat"><thead><tr><th>Approccio da</th><th class="n">Buche</th>'+
          '<th class="n">Birdie+</th><th class="n">Bogey+</th><th class="n">Sul par</th></tr></thead><tbody>'+
        RT.map(x=>'<tr'+(x.solido?'':' style="opacity:.5"')+'><td>'+x.label+'</td><td class="n">'+x.n+'</td>'+
          '<td class="n pos">'+Math.round(x.birdiePct)+'%</td>'+
          '<td class="n neg">'+Math.round(x.bogeyPct)+'%</td>'+
          '<td class="n '+(x.rtp<=0?'pos':'neg')+'"><b>'+sgn(x.rtp,2)+'</b></td></tr>').join('')+
        '</tbody></table>'+
        '<div class="stcap">"Sul par" e\u2019 il punteggio medio della buca meno il par, condizionato alla '+
        'fascia da cui hai giocato l\u2019ultimo approccio: sul Tour si chiama <i>RTP Score</i>. E\u2019 la '+
        'traduzione in punteggio di quello che lo strokes gained dice in colpi.</div></div>'));
    }

    /* ── holeouts ── */
    {
      const HO=statHoleouts(completi);
      if(HO.n>0) p1.appendChild(el('<div class="card"><h2>Colpi imbucati da fuori dal green</h2>'+
        '<div class="verd" style="font-size:14px">'+HO.n+(HO.n===1?' holeout':' holeout')+
        ' \u00b7 il piu\u2019 lungo da <b>'+Math.round(HO.max)+' m</b></div>'+
        '<div class="legg">'+(HO.perGiro!==null?HO.perGiro.toFixed(2).replace('.',','):'\u2014')+
        ' per giro \u00b7 distanza media '+m1(HO.media)+'</div>'+
        '<div class="stcap">Sono <i>Total Hole Outs</i> e <i>Longest Hole Out</i>. Conta la palla in buca da un '+
        'colpo giocato fuori dal green \u2014 approccio, chip, bunker, o il tee di un par 3. I putt non '+
        'contano.</div></div>'));
    }

    /* ── scrambling nella definizione ShotLink ── */
    {
      const ST=statScramblingTour(completi);
      if(ST.n>0) p1.appendChild(el('<div class="card"><h2>Scrambling: lo standard ShotLink</h2>'+
        '<div class="hint">Percentuale delle buche in cui, <b>mancato il green in regulation</b>, chiudi in par '+
        'o meglio. Non e\u2019 l\u2019up and down: un chip perfetto seguito da un bogey e\u2019 up and down '+
        'riuscito e scrambling mancato.</div>'+
        '<div class="kpigrid">'+
          '<div class="kpi"'+(ST.n>=N_MIN_FASCIA?'':' style="opacity:.55"')+'><div class="lab">Scrambling</div>'+
            '<div class="v">'+(ST.pct!==null?ST.pct.toFixed(0)+'<span class="u">%</span>':'\u2014')+'</div>'+
            '<div class="sub">'+ST.ok+' su '+ST.n+' green mancati</div></div>'+
          '<div class="kpi"><div class="lab">Distanza del tentativo</div>'+
            '<div class="v">'+(ST.dist!==null?ST.dist.toFixed(1).replace('.',',')+'<span class="u">m</span>':'\u2014')+'</div>'+
            '<div class="sub">media da cui recuperi</div></div>'+
          '<div class="kpi"><div class="lab">Lascia alla buca</div>'+
            '<div class="v">'+(ST.leave!==null?ST.leave.toFixed(1).replace('.',',')+'<span class="u">m</span>':'\u2014')+'</div>'+
            '<div class="sub">Scrambling Avg Distance</div></div>'+
        '</div>'+
        '<table class="stat" style="margin-top:10px"><thead><tr><th>Da</th><th class="n">Buche</th>'+
          '<th class="n">Par o meglio</th></tr></thead><tbody>'+
        ST.fasce.map(x=>'<tr'+(x.solido?'':' style="opacity:.5"')+'><td>'+x.label+'</td>'+
          '<td class="n">'+x.n+'</td><td class="n"><b>'+Math.round(x.pct)+'%</b></td></tr>').join('')+
        '</tbody></table>'+
        (function(){
          const L=[['rough','Dal rough'],['sabbia','Dalla sabbia'],['altro','Da altre posizioni']]
            .filter(l=>ST.perLie[l[0]].n>0);
          if(!L.length) return '';
          return '<table class="stat" style="margin-top:8px"><thead><tr><th>Per lie</th><th class="n">Buche</th>'+
            '<th class="n">Par o meglio</th></tr></thead><tbody>'+
            L.map(l=>{const o=ST.perLie[l[0]];
              return '<tr'+(o.n>=N_MIN_FASCIA?'':' style="opacity:.5"')+'><td>'+l[1]+'</td>'+
                '<td class="n">'+o.n+'</td><td class="n"><b>'+Math.round(100*o.ok/o.n)+'%</b></td></tr>';}).join('')+
            '</tbody></table>';
        })()+
        '<div class="stcap">Fasce ShotLink (\u003c10, 10\u201320, 20\u201330, \u003e30 yard) convertite in metri, e '+
        'lie del colpo di recupero come fa il Tour con <i>Scrambling from the Rough / Sand / Other</i>. '+
        'La fascia e\u2019 la distanza del primo colpo giocato da fuori dal green dopo che il green e\u2019 '+
        'stato mancato in regulation.<br><br><b>Una differenza da dichiarare:</b> il Tour misura quelle distanze '+
        'dal <i>centro del green</i>, noi dalla bandiera. Lo scarto e\u2019 di qualche metro e sempre nello '+
        'stesso verso, quindi i confronti nel tempo restano validi.<br><br>Il Tour pubblica anche i sand save per '+
        'fascia: servirebbero volumi che un giocatore singolo non raggiunge, e non li abbiamo messi.</div></div>'));
    }

    /* ── putting: i numeri del Tour ── */
    {
      const PN=statPuttNumeri(completi);
      p1.appendChild(el('<div class="card"><h2>Putt: i numeri del Tour</h2>'+
        '<div class="hint">Le statistiche di conteggio della sezione Putting, per giro.</div>'+
        '<table class="stat"><thead><tr><th>Per giro</th><th class="n">Buche</th>'+
          '<th class="n">Totale</th></tr></thead><tbody>'+
        [['Un putt',PN.p1,PN.n1],['Due putt',PN.p2,PN.n2],['Tre putt',PN.p3,PN.n3],
         ['Quattro putt o piu\u2019',PN.p4,PN.n4]].map(r=>
          '<tr><td>'+r[0]+'</td><td class="n"><b>'+(r[1]!==null?r[1].toFixed(2).replace('.',','):'\u2014')+
          '</b></td><td class="n dim">'+r[2]+'</td></tr>').join('')+
        '</tbody></table>'+
        '<table class="stat" style="margin-top:8px"><tbody>'+
        '<tr><td>Imbucati entro i 3 m <span class="dim" style="font-size:10px">(10 ft)</span></td>'+
          '<td class="n"><b>'+pct1(PN.dentroPct)+'</b></td><td class="n dim" style="font-size:11px">su '+PN.dentro+' putt</td></tr>'+
        '<tr><td>Imbucati oltre i 3 m, per giro</td><td class="n"><b>'+
          (PN.over10!==null?PN.over10.toFixed(2).replace('.',','):'\u2014')+'</b></td><td></td></tr>'+
        '<tr><td>Imbucati oltre i 6 m, per giro</td><td class="n"><b>'+
          (PN.over20!==null?PN.over20.toFixed(2).replace('.',','):'\u2014')+'</b></td><td></td></tr>'+
        '<tr><td>Distanza media dei putt imbucati</td><td class="n"><b>'+m1(PN.mediaMade)+'</b></td><td></td></tr>'+
        '<tr><td>Putt imbucato piu\u2019 lungo</td><td class="n"><b>'+m1(PN.maxMade)+'</b></td><td></td></tr>'+
        '<tr><td>Residua dopo il primo putt oltre 7,6 m</td><td class="n"><b>'+m1(PN.lag)+'</b></td>'+
          '<td class="n dim" style="font-size:11px">'+PN.nLag+' putt</td></tr>'+
        '</tbody></table>'+
        '<div class="stcap">Nell\u2019ordine: <i>1/2/3/3+ Putts per Round</i>, <i>Putting Inside 10\u2019</i>, '+
        '<i>Putts Made Over 10\u2019</i> e <i>Over 20\u2019</i>, <i>Average Distance of Putts Made</i>, '+
        '<i>Longest Putt</i>, <i>Approach Putt Performance</i> \u2014 quest\u2019ultima e\u2019 la residua dopo '+
        'il primo putt da oltre 25 piedi, cioe\u2019 la misura del lag. La <i>Putting Average</i> del Tour, che '+
        'sono i putt per green in regulation, sta nella scheda "Le letture che separano".</div></div>'));
    }

    /* ── scoring: i numeri del Tour ── */
    {
      const SN=statScoringNumeri(completi);
      p1.appendChild(el('<div class="card"><h2>Scoring: i numeri del Tour</h2>'+
        '<table class="stat"><tbody>'+
        '<tr><td>Bogey per giro <span class="dim" style="font-size:10px">(solo bogey)</span></td>'+
          '<td class="n"><b>'+(SN.bogeyGiro!==null?SN.bogeyGiro.toFixed(2).replace('.',','):'\u2014')+'</b></td></tr>'+
        '<tr><td>Doppi o peggio per giro</td><td class="n"><b>'+
          (SN.doppiGiro!==null?SN.doppiGiro.toFixed(2).replace('.',','):'\u2014')+'</b></td></tr>'+
        '<tr><td>Birdie o meglio per giro</td><td class="n"><b>'+
          (SN.birdieGiro!==null?SN.birdieGiro.toFixed(2).replace('.',','):'\u2014')+'</b></td></tr>'+
        '<tr><td>Eagle</td><td class="n"><b>'+SN.eagle+'</b>'+
          (SN.buchePerEagle?' <span class="dim" style="font-size:10px">(una ogni '+Math.round(SN.buchePerEagle)+' buche)</span>':'')+'</td></tr>'+
        '<tr><td>Giro migliore</td><td class="n"><b>'+(SN.best!==null?sgn(SN.best,0):'\u2014')+'</b></td></tr>'+
        '</tbody></table>'+
        '<table class="stat" style="margin-top:8px"><thead><tr><th>Distribuzione dei giri</th>'+
          '<th class="n">Giri</th><th class="n">%</th></tr></thead><tbody>'+
        SN.fasce.map(x=>'<tr><td>'+x.label+'</td><td class="n">'+x.n+'</td>'+
          '<td class="n">'+Math.round(100*x.n/SN.nGiri)+'%</td></tr>').join('')+
        '</tbody></table>'+
        '<div class="stcap"><i>Bogey Average</i> conta i soli bogey, mentre <i>Bogey Avoidance</i> \u2014 nella '+
        'scheda Base \u2014 conta bogey o peggio: sono due statistiche diverse del Tour e qui ci sono entrambe. '+
        'La distribuzione dei giri e\u2019 l\u2019equivalente locale di <i>Rounds in the 60s</i>, che fuori dal '+
        'Tour non vuol dire niente: qui le fasce sono rispetto al par.<br><br><i>Scoring Average (Adjusted)</i> e '+
        '<i>Sub-Par Rounds</i> richiedono il campo dei concorrenti e non sono calcolabili.</div></div>'));
    }

    /* ── serie ── */
    {
      const SR=statSerie(completi);
      if(SR.nBuche>=18) p1.appendChild(el('<div class="card"><h2>Serie</h2>'+
        '<div class="hint">La categoria <i>Streaks</i> del Tour, meno tutto quello che dipende dal taglio del '+
        'torneo. Le serie attraversano il confine fra giri consecutivi, come sul Tour.</div>'+
        '<table class="stat"><thead><tr><th>Serie</th><th class="n">Record</th>'+
          '<th class="n">In corso</th></tr></thead><tbody>'+
        [['Buche senza bogey',SR.senzaBogey],['Buche senza tre putt',SR.senzaTrePutt],
         ['Green in regulation',SR.gir],['Fairway centrati',SR.fairway],
         ['Birdie consecutivi',SR.birdie],['Sand save',SR.sand],
         ['Giri in par o meglio',SR.giriPar]].map(r=>
          '<tr><td>'+r[0]+'</td><td class="n"><b>'+r[1].best+'</b></td>'+
          '<td class="n dim">'+r[1].cur+'</td></tr>').join('')+
        '</tbody></table>'+
        '<div class="stcap">Valore analitico basso e dichiarato: e\u2019 una lettura di costanza, non una '+
        'diagnosi. Le serie del Tour che dipendono dal taglio (<i>Consecutive Cuts</i>) o dagli orari di '+
        'partenza non hanno senso qui.</div></div>'));
    }
  }

  /* ---- v10: ricollocazione per titolo nelle sette schede ---- */
  const paneNew={}; TABS.forEach(t=>paneNew[t.k]=el('<div class="pane"></div>'));
  const MAPPA=[
    ['Dove stanno i colpi che perdi','sintesi'],['Cosa allenare','sintesi'],['Sintesi','sintesi'],
    ['Il tuo livello, reparto per reparto','sintesi'],
    ['Dove si perde, giro per giro','sintesi'],['Andamento per reparto','sintesi'],
    ['Dispersione del drive','tee'],['Scala dei bastoni','tee'],
    ['La curva dei colpi persi','appr'],['Prossimita\u2019: dove lasci la palla','appr'],
    ['Partenza e residuo','appr'],
    ['Tu contro il riferimento','base'],['Stagione, mese per mese','base'],
    ['Buche che costano di piu\u2019, in ordine di gioco','incroci'],
    ['Dal tee: good drive','tee'],['Quanto rende ogni bastone','appr'],['Gapping','tee'],
    ['Dove finisce il tee shot','tee'],['Quanta buca copre il tee shot','tee'],
    ['Approcci: green e prossimita','appr'],['Da che distanza nascono birdie','appr'],
    ['Come finisce la buca, per fascia','appr'],['Colpi imbucati da fuori dal green','appr'],
    ['Scrambling: lo standard ShotLink','corto'],
    ['Realizzazione dei putt','putt'],
    ['Putt: i numeri del Tour','putt'],
    ['Scoring: i numeri del Tour','base'],['Serie','base'],
    ['Bunker: greenside contro fairway','corto'],['Chip multipli','corto'],
    ['Putting: le letture che separano','putt'],
    ['Rendimento per fascia di stroke index','incroci'],
    ['Quanto pesa ogni reparto','sintesi'],['Sto cambiando','sintesi'],
    ['Strokes gained','sintesi'],['Ogni giro rispetto alla tua media','sintesi'],['La tua media','sintesi'],
    ['Andamento nel tempo','sintesi'],['Andamento del punteggio','sintesi'],
    ['Andamento per categoria','extra'],['Andamento di green e putt','extra'],
    ['Approcci per fascia','appr'],['Prossimit','appr'],['Errore di distanza','appr'],
    ['Le code','appr'],['Colpi verso il green','appr'],['Dove finisce la palla','appr'],
    ['Dove finisce il drive','tee'],['Par 5','appr'],
    ['Come si legge questo pannello','tee'],['Quanto usi ogni bastone','tee'],
    ['Distanza percorsa e dispersione','tee'],['Ellisse di arrivo','tee'],
    ['Andamento del driver','tee'],['Bastoni','tee'],
    ['Gioco corto','corto'],['Difficolt','corto'],['Short-side','corto'],
    ['Putting per distanza','putt'],['Tre-putt','putt'],['Putt non imbucati','putt'],
    ['Punteggio rispetto al par','base'],['Come si chiudono le buche','base'],['Conversioni','base'],
    ['Per tipo di giro','incroci'],['Per condizioni di vento','incroci'],['Buche che costano','incroci'],
    ['Quanto costa mancare il fairway','incroci'],['Rendimento per tipo di buca','incroci'],
    ['Il giro in sei blocchi','incroci'],['Prima nove contro seconda nove','incroci']
  ];
  const tabPerTitolo=t=>{ for(const m of MAPPA) if(t.indexOf(m[0])===0) return m[1]; return 'extra'; };
  [p0,p1,p2,p3].forEach(px=>{
    Array.from(px.children).forEach(ch=>{
      /* le card classiche hanno un <h2>, i pannelli del handoff un <div class="t">:
         leggere solo l'h2 mandava tutti i pannelli nuovi nella scheda Consigli. */
      const h=ch.querySelector ? (ch.querySelector('h2') || ch.querySelector('.t')) : null;
      paneNew[tabPerTitolo(h?h.textContent:'')].appendChild(ch);
    });
  });

  /* ---- scheda BASE: le classiche, contro la finestra stabile ---- */
  {
    const SB=statBase(A);
    const RIF=statBaseStabile();
    if(SB) paneNew.base.insertBefore(el(cardStatBase(SB, RIF, 'Statistiche base',
      'La colonna \u201cMedia 20\u201d e\u2019 la tua finestra stabile: gli ultimi 20 giri completi, '+
      'indipendente dai filtri \u2014 lo stesso riferimento di \u201cla tua media\u201d.')),
      paneNew.base.firstChild);
  }

  /* ---- scheda CONSIGLI: le analisi che i dati sostengono adesso ---- */
  {
    const cons=[];
    if(completi.length>=3){
      const catsR=['tee','approccio','corto','putting'];
      const mR={}; catsR.forEach(k=>mR[k]=media(completi.map(g=>g.calc.sgCat[k])));
      const w=catsR.slice().sort((a,b)=>mR[a]-mR[b])[0];
      if(mR[w]<-0.3) cons.push(['Priorita\u2019 di allenamento',
        CAT_NOME[w]+': '+sgn(mR[w],1)+' colpi/giro verso il Tour, il reparto piu\u2019 costoso del periodo.']);
      const FA=statFasce(completi).filter(x=>x.solido);
      if(FA.length){
        const wf=FA.slice().sort((a,b)=>a.sgColpo-b.sgColpo)[0];
        if(wf.sgColpo<-0.05) cons.push(['Fascia di approccio da lavorare',
          wf.label+': '+sgn(wf.sgColpo,3)+' per colpo su '+wf.n+' colpi. In campo pratica, e\u2019 la distanza da cui battere piu\u2019 palline.']);
      }
      const PD=statPuttDerivato(completi);
      const fp=PD.fasce.filter(x=>x.buche>=N_MIN_FASCIA && x.lo>=5);
      if(fp.length){
        const wp=fp.slice().sort((a,b)=>(b.tre/b.buche)-(a.tre/a.buche))[0];
        if(wp && wp.tre/wp.buche>0.15) cons.push(['Lag putt',
          Math.round(100*wp.tre/wp.buche)+'% di tre putt quando il primo parte da '+wp.label+' ('+wp.buche+' buche). Protocollo P3.']);
      }
      const GCc=statGiocoCorto(completi);
      if(GCc.n>=N_MIN_FASCIA && GCc.pct!==null && GCc.pct<45) cons.push(['Gioco corto',
        'Up and down al '+Math.round(GCc.pct)+'% su '+GCc.n+' tentativi (scratch: 63% sotto le 25 yd). '+
        'Il campo pratica e\u2019 il canale giusto: in gara sono ~7 occasioni a giro.']);
      const LTc=statLatoTee(sel);
      if(LTc.tot>=20){
        const dom=['S','C','D'].sort((a,b)=>LTc.conte[b]-LTc.conte[a])[0];
        if(dom!=='C' && LTc.conte[dom]/LTc.tot>=0.45) cons.push(['Linea dal tee',
          'Il drive manca soprattutto a '+(dom==='S'?'sinistra':'destra')+' ('+Math.round(100*LTc.conte[dom]/LTc.tot)+
          '%): finche\u2019 il pattern e\u2019 questo, mira dal lato opposto della dispersione (metodo DECADE).']);
      }
      const CDc=statCode(completi);
      if(CDc.nColpi>=100 && CDc.quotaPeggiori!==null && CDc.quotaPeggiori>40) cons.push(['Le code',
        'Il tuo 8% peggiore porta il '+CDc.quotaPeggiori.toFixed(0)+'% dei colpi persi (rif. Broadie ~35%): '+
        'prima di limare la media, togli il colpo disastro \u2014 scelte piu\u2019 conservative dove nasce.']);
    }
    // letture che si sbloccano con la copertura
    const sb=[];
    {
      let bTot=0,bPin=0,cCorto=0,cOst=0,ann=0;
      sel.forEach(g=>{ if(g.annotato===true)ann++;
        (g.buche||[]).forEach(b=>{ bTot++; if(b.posizionePin)bPin++;
          (b.colpi||[]).forEach(c=>{ if(c.lie&&c.lie!=='green'&&c.distM>0&&c.distM*M_TO_YD<=30){cCorto++; if(c.ostacolo!==null&&c.ostacolo!==undefined)cOst++;} });
        });});
      if(bTot && bPin/bTot<0.5) sb.push('lo <b>short-side</b> si sblocca segnando la bandiera (oggi '+Math.round(100*bPin/Math.max(1,bTot))+'% delle buche)');
      if(cCorto && cOst/cCorto<0.5) sb.push('la <b>difficolta\u2019 del colpo corto</b> si sblocca coi due tocchi su ostacolo e lie (oggi '+Math.round(100*cOst/Math.max(1,cCorto))+'%)');
      if(sel.length && ann/sel.length<0.7) sb.push('la qualita\u2019 delle distanze migliora annotando in campo (oggi '+Math.round(100*ann/sel.length)+'% dei giri)');
    }
    const cC=el('<div class="card"><h2>Analisi consigliate</h2>'+
      '<div class="hint">Quello che i tuoi dati sostengono adesso, in ordine di resa. Ogni voce cita il numero '+
      'da cui nasce: niente consigli senza un dato dietro.</div>'+
      (cons.length?cons.map(c=>'<div style="margin:10px 0"><div style="font-weight:700;font-size:13px">'+c[0]+'</div>'+
        '<div class="hint tight">'+c[1]+'</div></div>').join(''):
        '<div class="hint">Con questi filtri non emerge nessuna priorita\u2019 leggibile: o i dati sono pochi, o non c\u2019e\u2019 un reparto che domina.</div>')+
      (sb.length?'<div class="stcap"><b>Letture che si sbloccano:</b> '+sb.join('; ')+'.</div>':'')+
      '</div>');
    paneNew.extra.insertBefore(cC, paneNew.extra.firstChild);

    /* v10 — «Cosa non e' ancora leggibile»: il handoff lo chiede nella scheda
       Consigli. Non e' un duplicato delle righe grigie: quelle dicono «questa
       riga non si legge», questa dice quanti dati mancano perche' si legga.  */
    {
      const fam=[];
      const conta=(nome, righe, campo)=>{
        const sotto=righe.filter(r=>r[campo]>0 && r[campo]<N_MIN_FASCIA);
        if(sotto.length) fam.push({nome:nome, quante:sotto.length, tot:righe.length,
          manca:sotto.reduce((a,r)=>a+(N_MIN_FASCIA-r[campo]),0)});
      };
      conta('Approcci per fascia di distanza', statFasce(A), 'n');
      conta('Putting per fascia', statPutting(A).fasce, 'n');
      conta('Scrambling per fascia (ShotLink)', statScramblingTour(A).fasce, 'n');
      conta('Rendimento per fascia di stroke index', statPerSI(A).fasce, 'n');
      if(fam.length){
        paneNew.extra.appendChild(el('<div class="card"><h2>Cosa non e\u2019 ancora leggibile</h2>'+
          '<div class="hint">Le famiglie di fasce che hanno almeno una riga sotto la soglia di campione '+
          '('+N_MIN_FASCIA+' casi). La colonna a destra e\u2019 quanti casi mancano <b>in tutto</b> perche\u2019 '+
          'ogni riga della famiglia diventi leggibile.</div>'+
          '<table class="stat"><thead><tr><th>Famiglia</th><th class="n">Righe deboli</th><th class="n">Ne mancano</th></tr></thead><tbody>'+
          fam.map(f=>'<tr><td>'+esc(f.nome)+'</td><td class="n">'+f.quante+' su '+f.tot+
            '</td><td class="n">'+f.manca+'</td></tr>').join('')+
          '</tbody></table>'+
          '<div class="stcap">Non e\u2019 una scaletta da riempire a tutti i costi: alcune fasce restano '+
          'rare perche\u2019 quei colpi si giocano poco. Serve a sapere <b>quali verdetti aspettare</b> '+
          'e quali no.</div></div>'));
      }
    }
  }

  TABS.forEach(t=>{ if(!paneNew[t.k].children.length)
    paneNew[t.k].appendChild(el('<div class="card"><h2>'+t.n+'</h2><div class="hint">Con i filtri attuali '+
      'non c\u2019e\u2019 nulla da mostrare qui: servono giri con il dettaglio colpo per colpo.</div></div>')); });

  /* ---- montaggio ---- */
  TABS.forEach(t=>pager.appendChild(paneNew[t.k]));
  const panes=paneNew;
  function adatta(){ pager.style.height = (panes[STAT_F.tab].scrollHeight+6)+'px'; }
  function vaiA(k, scorri){
    STAT_F.tab=k;
    bar.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.k===k));
    if(scorri!==false){ const i=TABS.findIndex(t=>t.k===k); pager.scrollTo({left:i*pager.clientWidth, behavior:'smooth'}); }
    adatta();
  }
  bar.onclick=e=>{ const b=e.target.closest('button'); if(b) vaiA(b.dataset.k, true); };
  let tmr=null;
  pager.onscroll=()=>{ clearTimeout(tmr); tmr=setTimeout(()=>{
    const i=Math.round(pager.scrollLeft/Math.max(1,pager.clientWidth));
    const k=(TABS[i]||TABS[0]).k;
    if(k!==STAT_F.tab) vaiA(k, false);
  }, 90); };
  requestAnimationFrame(()=>{
    const i=TABS.findIndex(t=>t.k===STAT_F.tab);
    pager.scrollLeft = i*pager.clientWidth;
    adatta();
    setTimeout(adatta, 120);
  });
  window.addEventListener('resize', adatta, {once:true});

  /* v10 — «Metodo e definizioni»: link tenue in fondo che apre un paragrafo con
     baseline, definizioni e limite del campione. La scheda completa resta in
     Altro > Metodo e fonti: questo e' il promemoria a portata di pollice.     */
  {
    const box=el('<div style="margin:4px 2px 8px 2px">'+
      '<button class="tgl" data-mtd="1">Metodo e definizioni</button>'+
      '<div data-mtdbox="1" style="display:none; font-size:11.5px; line-height:1.6; color:var(--grigio); margin-top:8px">'+
      '<b>Baseline.</b> '+(STAT_F.baseline==='media'?'La tua media: finestra stabile degli ultimi 20 giri completi.':
        'PGA Tour, tabelle pubblicate (Broadie 2012 per il gioco lungo, 2011 per il putting), interpolate.')+
      ' Lo strokes gained e\u2019 la differenza fra i colpi che ti sono serviti e quelli attesi dalla baseline '+
      'nella stessa posizione: sopra lo zero guadagni, sotto perdi.<br><br>'+
      '<b>Perimetro.</b> '+nG+(nG===1?' giro':' giri')+' \u00b7 '+totB+' buche'+
      (completi.length!==nG?' \u00b7 '+completi.length+' completi (lo strokes gained si calcola solo su questi)':'')+'.<br><br>'+
      '<b>Limite del campione.</b> Sotto '+N_MIN_FASCIA+' casi una riga si mostra in grigio e non si legge: '+
      'la differenza che vedresti sarebbe rumore. I verdetti si scrivono solo quando lo scarto supera '+
      'due errori standard.<br><br>'+
      '<b>Le fasce non si cambiano da qui.</b> Approcci, putt, gioco corto e scrambling usano fasce fisse, '+
      'dichiarate nei rispettivi pannelli e allineate alle fonti: cambiarle a mano renderebbe due letture '+
      'successive non confrontabili.</div></div>');
    box.querySelector('[data-mtd]').onclick=()=>{
      const d=box.querySelector('[data-mtdbox]'), b=box.querySelector('[data-mtd]');
      const ap=d.style.display!=='none';
      d.style.display=ap?'none':'block';
      b.textContent=ap?'Metodo e definizioni':'Nascondi il metodo';
    };
    body.appendChild(box);
  }

  return {header:'Statistiche',
    sub: nG+(nG===1?' giro':' giri')+' · '+totB+' buche · baseline '+
      (STAT_F.baseline==='media'?'la tua media':'Tour'),
    body:body};
};
/* ---------------- RIEPILOGO GIRO ---------------- */
/* v10: il giro singolo ha le stesse schede delle statistiche di periodo —
   Sintesi, Gioco lungo, Gioco corto, Putt, Base, Incroci — costruite con le
   STESSE funzioni statistiche, applicate al campione di un giro solo. Dove il
   confronto ha senso, il termine e' la finestra stabile (ultimi 20 giri
   completi): e' il modo in cui un giro si legge — contro la propria storia. */
let RG_TAB='sintesi';
VIEWS.riepilogoGiro = function(p){
  const giri=LS.get('hcp_giri',[]);
  const g=giri.find(x=>x.id===p.id);
  const body=el('<div></div>');
  if(!g){ body.appendChild(el('<div class="empty">Giro non trovato.</div>')); return {header:'Riepilogo',body}; }
  const A=analizzaGiro(g, 'tour');
  const A1=[A];
  const c=A.calc, d=c.score-c.par;
  const cond=g.condizioni;
  const RIF=statBaseStabile();

  /* ---- v12: tre KPI in fila, come da handoff ----
     Il KPI dello SG e il cumulato dell'arco devono chiudere sullo stesso
     numero: e' lo stesso dato, sommato nello stesso ordine. */
  const F1=statFairway([A]);
  body.appendChild(el('<div class="kpin tre">'+
    '<div class="c"><div class="lab">Punteggio</div>'+
      '<div class="v">'+c.score+'</div>'+
      '<div class="sub">'+(d===0?'in par':sgn(d,0)+' sul par')+'</div></div>'+
    '<div class="c"><div class="lab">SG totale</div>'+
      '<div class="v" style="color:'+(A.completo?(c.sgTot>=0?'var(--verde-testo)':'var(--rosso)'):'var(--grigio)')+'">'+
      (A.completo?sgnIt(c.sgTot,1):'—')+'</div>'+
      '<div class="sub">rispetto al Tour</div></div>'+
    '<div class="c"><div class="lab">GIR · fairway</div>'+
      '<div class="v">'+c.gir+' · '+(F1.tot?F1.presi:'—')+'</div>'+
      '<div class="sub">su '+c.nBuche+' · su '+(F1.tot||0)+'</div></div>'+
  '</div>'+
  (cond?'<div class="nt" style="margin:-6px 0 14px 2px">Vento '+((VENTO_OPZ[cond.vento]||{}).n||'—').toLowerCase()+
    ' · terreno '+((METEO_OPZ[cond.meteo]||{}).n||'—').toLowerCase()+
    ' · green '+((GREEN_OPZ[cond.green]||{}).n||'—').toLowerCase()+
    (g.gara?' · '+esc(g.gara):'')+'</div>':'')));

  const TABS=[{k:'sintesi',n:'Sintesi'},{k:'lungo',n:'Gioco lungo'},{k:'corto',n:'Gioco corto'},
              {k:'putt',n:'Putt'},{k:'base',n:'Base'},{k:'incroci',n:'Incroci'}];
  if(!TABS.some(t=>t.k===RG_TAB)) RG_TAB='sintesi';
  const bar=el('<div class="tabbar sette">'+TABS.map(t=>'<button data-k="'+t.k+'" class="'+(RG_TAB===t.k?'on':'')+'">'+t.n+'</button>').join('')+'</div>');
  body.appendChild(bar);
  const pane={}; TABS.forEach(t=>pane[t.k]=el('<div>'+'</div>'));

  const nonCompleto='<div class="card"><h2>Solo per i giri con dettaglio</h2>'+
    '<div class="hint">Questo giro e’ stato registrato senza il dettaglio colpo per colpo: qui non c’e’ nulla da calcolare.</div></div>';

  /* ══ SINTESI ══ */
  /* v12 — l'arco del giro apre la scheda: e' la cosa che dice dove il giro si e'
     deciso. I pallini sono colorati per esito della buca (verde birdie, grigio
     par, rosso bogey), la linea dal segno del cumulato finale. */
  if(A.completo && A.bucheCalc.length>=9){
    let cum=0; const serie=[], colori=[], etichette=[];
    A.bucheCalc.forEach(b=>{
      cum+=(b.sg||0); serie.push(cum);
      colori.push(b.diff<=-1?'var(--verde-testo)':(b.diff===0?'var(--dv-neutral)':'var(--rosso)'));
      etichette.push('buca '+b.buca+' · par '+b.par);
    });
    pane.sintesi.appendChild(el(pannello({titolo:'L’arco del giro',
      nota:'Strokes gained <b>cumulato</b> buca per buca. Sopra lo zero stai guadagnando sulla baseline, sotto la '+
        'stai perdendo. I pallini sono colorati per esito della buca; tocca il grafico per leggere un punto.',
      grafico: grafLinea(serie, {h:96, dotColori:colori, etichette:etichette, fmt:v=>sgnIt(v,1),
        aria:'strokes gained cumulato buca per buca'}),
      chiusura:'Il cumulato chiude su <b>'+sgnIt(cum,1)+'</b>, che e’ esattamente il KPI dello strokes gained '+
        'totale qui sopra: e’ lo stesso dato sommato nello stesso ordine.'})));
    /* scorecard */
    pane.sintesi.appendChild(el(pannello({titolo:'Scorecard',
      grafico: grafScorecard(A.bucheCalc)})));
  }
  if(A.completo){
    /* colpi verso il green, griglia dei nove settori */
    const esG=statEsiti([g],null), esP0=statEsitiPutt([g]);
    const cg={}; let tg=0;
    ESITI.forEach(e=>{ cg[e.k]=(esG.conte[e.k]||0)-(esP0.conte[e.k]||0); tg+=cg[e.k]; });
    if(tg>0) pane.sintesi.appendChild(el(pannello({titolo:'Colpi verso il green',
      nota:'Dove sono finiti i '+tg+' colpi con settore registrato, rispetto alla bandiera.',
      grafico: grafSettori(cg, tg)})));
  }
  if(A.completo){
    const cats=['tee','approccio','corto','putting'];
    const maxA=Math.max(0.5,...cats.map(k=>Math.abs(c.sgCat[k])));
    const card=el('<div class="card"><h2>Strokes gained per categoria</h2>'+
      '<div class="hint">Questo giro contro il PGA Tour. La riga tee-to-green vale <b>'+
      sgn(c.sgCat.tee+c.sgCat.approccio+c.sgCat.corto,1)+'</b>.</div></div>');
    cats.forEach(k=>{
      const v=c.sgCat[k], w=Math.abs(v)/maxA*50;
      const st = v>0?'left:50%;width:'+w+'%;background:var(--dv-blue);'
              : v<0?'right:50%;width:'+w+'%;background:var(--dv-red);'
              : 'left:calc(50% - 2px);width:4px;background:var(--dv-neutral);';
      card.appendChild(el('<div class="dvrow"><div class="d">'+CAT_NOME[k]+'</div>'+
        '<div class="dvtrack"><div class="zero"></div><div class="dvbar" style="'+st+'"></div></div>'+
        '<div class="n '+(v>=0?'pos':'neg')+'">'+sgn(v,1)+'</div></div>'));
    });
    pane.sintesi.appendChild(card);

    // i colpi che hanno deciso il giro: le due code, non la media
    const tuttiC=[];
    A.bucheCalc.forEach(b=>b.colpi.forEach((x,i)=>tuttiC.push({buca:b.buca, i:i+1, sg:x.sg, cat:x.cat,
      lie:x.lie, dist:x.distM, pen:x.penalita})));
    const peggio=tuttiC.slice().sort((a,b)=>a.sg-b.sg).slice(0,5);
    const meglio=tuttiC.slice().sort((a,b)=>b.sg-a.sg).slice(0,3);
    const rigaC=x=>'<tr><td>Buca '+x.buca+' · colpo '+x.i+(x.pen?' <span class="dim">(pen.)</span>':'')+'</td>'+
      '<td class="dim" style="font-size:11px">'+CAT_NOME[x.cat]+', da '+(x.dist!==null?Math.round(x.dist)+' m':'—')+
      ' ('+(LIE_NOME[x.lie]||x.lie)+')</td>'+
      '<td class="n '+(x.sg>=0?'pos':'neg')+'">'+sgn(x.sg,2)+'</td></tr>';
    pane.sintesi.appendChild(el('<div class="card"><h2>I colpi che hanno deciso il giro</h2>'+
      '<div class="hint">Le code, non la media: i cinque colpi piu’ costosi e i tre migliori.</div>'+
      '<table class="stat"><tbody>'+peggio.map(rigaC).join('')+
      '<tr><td colspan="3" style="border-bottom:1px solid var(--bordo);padding:2px"></td></tr>'+
      meglio.map(rigaC).join('')+'</tbody></table></div>'));
  } else pane.sintesi.appendChild(el(nonCompleto));

  const list=el('<div class="card"><h2>Buca per buca</h2></div>');
  A.bucheCalc.forEach((b,i)=>{
    const bb=g.buche[i]||{};
    list.appendChild(el('<div class="listitem">'+
      '<div>Buca '+b.buca+' · par '+b.par+(b.distanza?' · '+b.distanza+' m':'')+
        (bb.completata===false?' · <span style="color:var(--ambra)">non completata</span>':'')+
        '<div class="meta">'+b.putt+' putt'+(b.girHit?' · green in regulation':'')+'</div></div>'+
      '<div style="text-align:right"><span class="badge">'+b.score+'</span>'+
        (b.sg!==null?'<div class="meta '+(b.sg>=0?'pos':'neg')+'" style="margin-top:3px">'+sgn(b.sg,1)+'</div>':'')+'</div></div>'));
  });
  pane.sintesi.appendChild(list);

  const R=riconcilia(g);
  const I=controlloIntegrita(g);
  if(R){
    pane.sintesi.appendChild(el('<div class="card"><h2>Controlli sul giro</h2>'+
      (R.ok?'<div class="stcap"><span class="badge ok">Motore a posto</span> Autodiagnosi superata (scarto '+R.scarto.toExponential(1)+').</div>'
           :'<div class="stcap"><span class="badge warn">Autodiagnosi non superata</span> Scarto di '+R.scarto.toFixed(2)+
            ' colpi: e’ un difetto del calcolo, da segnalare.</div>')+
      (I.length
        ? '<div class="avviso"><span class="ic">?</span><span><b>'+I.length+(I.length===1?' buca sospetta':' buche sospette')+'.</b><br>'+
            I.map(x=>'Buca '+x.buca+': '+esc(x.tutti.join('; '))).join('<br>')+'</span></div>'
        : '<div class="stcap"><span class="badge ok">Sequenza pulita</span> Nessuna discontinuita’ nelle posizioni.</div>')+
    '</div>'));
  }

  /* ══ v10: SCORE POTENZIALE — il controfattuale contro la tua abitudine ══ */
  {
    const MS=mediaStabile('tour');
    const PT=statPotenziale(A, MS);
    if(PT && PT.righe.length){
      pane.sintesi.appendChild(el('<div class="card"><h2>Score potenziale</h2>'+
        '<div class="verd">Con i tuoi valori abituali questo giro sarebbe stato <b>'+
        PT.potenziale.toFixed(1).replace('.',',')+'</b> invece di '+PT.score+'</div>'+
        '<div class="legg">'+PT.recuperabili.toFixed(1).replace('.',',')+' colpi lasciati indietro rispetto alla '+
        'tua media degli ultimi '+PT.nRif+' giri</div>'+
        '<table class="stat" style="margin-top:8px"><thead><tr><th>Reparto sotto la tua abitudine</th>'+
          '<th class="n">Colpi</th></tr></thead><tbody>'+
        PT.righe.map(x=>'<tr><td>'+CAT_NOME[x.cat]+'</td><td class="n neg">'+x.delta.toFixed(2).replace('.',',')+
          '</td></tr>').join('')+
        '</tbody></table>'+
        '<div class="stcap">Arccos lo chiama <i>Round Potential</i> e lo calcola sul percentile di un handicap '+
        'obiettivo. Qui il termine di confronto e\u2019 la <b>tua abitudine</b> \u2014 la finestra stabile dei 20 '+
        'giri \u2014 che per un giro singolo e\u2019 il metro giusto: dice quanto di questo punteggio e\u2019 '+
        'giornata e quanto e\u2019 livello.<br><br>Si contano solo i reparti andati <b>sotto</b> l\u2019abitudine: '+
        'un reparto andato meglio del solito non e\u2019 un colpo recuperabile, e sommarlo gonfierebbe il '+
        'potenziale.</div></div>'));
    }
  }

  /* v12: l'arco del giro e' stato rifatto in cima alla Sintesi col cursore al
     tocco e i pallini colorati per esito; la versione precedente e' rimossa
     per non avere due volte lo stesso grafico. */

  /* ══ GIOCO LUNGO ══ */
  if(A.completo){
    const LT=statLatoTee([g]);
    if(LT.tot>0){
      pane.lungo.appendChild(el('<div class="card"><h2>Dove finisce il drive</h2>'+
        '<div class="hint">'+LT.tot+' drive con lato su '+LT.opp+' par 4/5.</div>'+
        '<table class="stat"><tbody>'+['S','C','D'].map(k=>'<tr><td>'+(k==='S'?'Sinistra':k==='C'?'Centro':'Destra')+'</td>'+
          '<td class="n">'+LT.conte[k]+'</td></tr>').join('')+'</tbody></table></div>'));
    }
    // gli approcci del giro, uno per uno: al giro singolo l'elenco vale piu' delle fasce
    const appr=[];
    A.bucheCalc.forEach(b=>b.colpi.forEach((x,i)=>{
      if(x.cat!=='approccio') return;
      const nx=b.colpi[i+1];
      appr.push({buca:b.buca, da:x.distM, lie:x.lie, green:!nx||nx.lie==='green',
        lascia:nx?nx.distM:0, sg:x.sg, pen:x.penalita});
    }));
    if(appr.length){
      pane.lungo.appendChild(el('<div class="card"><h2>Gli approcci del giro</h2>'+
        '<div class="hint">Uno per uno: al giro singolo l’elenco dice piu’ delle medie. '+
        'Le fasce aggregate stanno nelle statistiche di periodo.</div>'+
        '<table class="stat"><thead><tr><th>Buca</th><th class="n">Da</th><th class="n">Green</th>'+
          '<th class="n">Lascia</th><th class="n">SG</th></tr></thead><tbody>'+
        appr.map(x=>'<tr><td>'+x.buca+' <span class="dim" style="font-size:10px">'+(LIE_NOME[x.lie]||'')+'</span></td>'+
          '<td class="n">'+Math.round(x.da)+' m</td>'+
          '<td class="n">'+(x.green?'●':'—')+'</td>'+
          '<td class="n">'+(x.lascia!==null?x.lascia.toFixed(1).replace('.',',')+' m':'—')+'</td>'+
          '<td class="n '+(x.sg>=0?'pos':'neg')+'">'+sgn(x.sg,2)+'</td></tr>').join('')+
        '</tbody></table></div>'));
    }
    const es=statEsiti([g],null), esP=statEsitiPutt([g]);
    const esG={conte:{},tot:es.tot-esP.tot}; ESITI.forEach(e=>esG.conte[e.k]=(es.conte[e.k]||0)-(esP.conte[e.k]||0));
    if(esG.tot>0) pane.lungo.appendChild(el('<div class="card"><h2>Colpi verso il green</h2>'+
      '<div class="hint">Il pattern di errore di questo giro, su '+esG.tot+' colpi con settore.</div>'+
      grigliaEsitiHtml(esG.conte, esG.tot)+'</div>'));
    const DR1=statDriving([A]);
    if(DR1.opp>0) pane.lungo.appendChild(el('<div class="card"><h2>Dal tee, in questo giro</h2>'+
      '<table class="stat"><tbody>'+
      '<tr><td>Good drive</td><td class="n"><b>'+DR1.good+' su '+DR1.opp+'</b></td>'+
        '<td class="n dim" style="font-size:11px">Tour 82,5%</td></tr>'+
      '<tr><td>Drive nei guai</td><td class="n"><b>'+DR1.trouble+'</b></td><td></td></tr>'+
      '<tr><td>Residua media, par 4</td><td class="n"><b>'+(DR1.res4.m!==null?Math.round(DR1.res4.m)+' m':'\u2014')+
        '</b></td><td class="n dim" style="font-size:11px">Tour 134\u2013139 m</td></tr>'+
      '<tr><td>Residua media, par 5</td><td class="n"><b>'+(DR1.res5.m!==null?Math.round(DR1.res5.m)+' m':'\u2014')+
        '</b></td><td class="n dim" style="font-size:11px">Tour 240\u2013248 m</td></tr>'+
      '<tr><td>Colpi di recupero</td><td class="n"><b>'+DR1.rec+'</b></td><td></td></tr>'+
      '</tbody></table></div>'));
    const BS=statBastoni([g]).filter(b=>b.bastone!=='Putter' && b.usi>0);
    if(BS.length) pane.lungo.appendChild(el('<div class="card"><h2>Bastoni usati</h2>'+
      '<table class="stat"><thead><tr><th>Bastone</th><th class="n">Usi</th><th class="n">Media</th></tr></thead><tbody>'+
      BS.map(b=>'<tr><td>'+esc(b.bastone)+'</td><td class="n">'+b.usi+'</td>'+
        '<td class="n">'+(b.distMedia!==null?b.distMedia+' m':'—')+'</td></tr>').join('')+
      '</tbody></table><div class="stcap">Le distanze di un giro solo sono aneddoto: la dispersione vera sta '+
      'nelle statistiche di periodo, scheda Gioco lungo.</div></div>'));
    if(!pane.lungo.children.length) pane.lungo.appendChild(el(nonCompleto));
  } else pane.lungo.appendChild(el(nonCompleto));

  /* ══ GIOCO CORTO ══ */
  if(A.completo){
    const GC=statGiocoCorto(A1);
    if(GC.n>0){
      pane.corto.appendChild(el('<div class="card"><h2>Gioco corto da dentro le 50 yd</h2>'+
        '<div class="hint">'+GC.n+' tentativi in questo giro (un tentativo per buca: il primo colpo da fuori '+
        'dal green entro le 50 yd).</div>'+
        '<table class="stat"><tbody>'+
        '<tr><td>Up and down</td><td class="n"><b>'+GC.ok+' su '+GC.n+'</b></td></tr>'+
        '<tr><td>Colpi per finire</td><td class="n"><b>'+GC.finire.toFixed(2).replace('.',',')+'</b> <span class="dim" style="font-size:10px">rif. scratch 2,45</span></td></tr>'+
        '<tr><td>Leave medio</td><td class="n"><b>'+GC.leave.toFixed(2).replace('.',',')+' m</b></td></tr>'+
        (GC.sand.n?'<tr><td>Sand save</td><td class="n"><b>'+GC.sand.ok+' su '+GC.sand.n+'</b></td></tr>':'')+
        '</tbody></table>'+
        '<div class="stcap">Su un giro solo questi sono fatti, non tendenze: ~7 tentativi non stimano niente. '+
        'La lettura vera sta nelle statistiche di periodo.</div></div>'));
    } else pane.corto.appendChild(el('<div class="card"><h2>Gioco corto</h2>'+
      '<div class="hint">Nessun tentativo da dentro le 50 yd in questo giro.</div></div>'));
    const CM1=statChipMultipli([A]);
    if(CM1.multi>0) pane.corto.appendChild(el('<div class="card"><h2>Chip multipli</h2>'+
      '<div class="verd" style="font-size:14px">'+CM1.multi+
      (CM1.multi===1?' buca ha richiesto':' buche hanno richiesto')+' due o piu\u2019 colpi corti</div>'+
      '<div class="stcap">Riferimento Shot Scope: 0,9 buche a giro per chi gira in 60, 2,1 per chi gira in 80.</div></div>'));
    const BK1=statBunker([A]);
    if(BK1.fairway.n>0) pane.corto.appendChild(el('<div class="card"><h2>Bunker di fairway</h2>'+
      '<div class="verd" style="font-size:14px">'+BK1.fairway.n+' colpi da bunker oltre le 30 yard, su '+
      BK1.fairway.buche+(BK1.fairway.buche===1?' buca':' buche')+'</div>'+
      '<div class="legg">costo medio su quelle buche: '+(BK1.fairway.costo!==null?sgn(BK1.fairway.costo,2):'\u2014')+
      ' sul par \u00b7 riferimento scratch +0,19</div></div>'));
    const SS=statShortSide(A1);
    if(SS.conPin>0 && SS.opp>0){
      pane.corto.appendChild(el('<div class="card"><h2>Short-side</h2>'+
        '<table class="stat"><tbody>'+
        '<tr><td>Green mancati dalla parte della bandiera</td><td class="n">'+SS.short+'</td></tr>'+
        '<tr><td>Dalla parte larga</td><td class="n">'+SS.lungo+'</td></tr>'+
        '</tbody></table></div>'));
    }
  } else pane.corto.appendChild(el(nonCompleto));

  /* ══ PUTT ══ */
  if(A.completo){
    const P=statPutting(A1);
    if(P.fasce.length){
      pane.putt.appendChild(el('<div class="card"><h2>Putting del giro</h2>'+
        '<div class="hint">'+c.putt+' putt in '+c.nBuche+' buche ('+(c.putt/c.nBuche).toFixed(2).replace('.',',')+
        ' per buca) · '+P.treputt+' tre-putt.</div>'+
        '<table class="stat"><thead><tr><th>Distanza</th><th class="n">Putt</th>'+
          '<th class="n">Imbucati</th><th class="n">Tour</th><th class="n">SG</th></tr></thead><tbody>'+
        P.fasce.map(x=>{
          const mid = x.hi>900 ? x.lo+2 : (x.lo+x.hi)/2;
          const tm = tourMakePct(mid);
          return '<tr><td>'+x.label+'</td><td class="n">'+x.n+'</td>'+
          '<td class="n">'+x.imbucati+'</td>'+
          '<td class="n dim">'+(tm!==null?Math.round(tm)+'%':'—')+'</td>'+
          '<td class="n '+(x.sg>=0?'pos':'neg')+'">'+sgn(x.sg,2)+'</td></tr>';}).join('')+
        '</tbody></table><div class="stcap">SG totale di fascia, non per putt: su un giro solo i conteggi '+
        'sono fatti, non percentuali. La colonna Tour e’ la probabilita’ di imbucata al centro fascia.</div></div>'));
    }
    const PA1=statPuttAvanzato([A]);
    if(PA1.girN>0) pane.putt.appendChild(el('<div class="card"><h2>Le letture che separano</h2>'+
      '<table class="stat"><tbody>'+
      '<tr><td>Putt per GIR</td><td class="n"><b>'+(PA1.puttGir!==null?PA1.puttGir.toFixed(2).replace('.',','):'\u2014')+
        '</b></td><td class="n dim" style="font-size:11px">'+PA1.girN+' buche in regulation</td></tr>'+
      '<tr><td>Primo putt, in GIR</td><td class="n"><b>'+(PA1.primoGir!==null?PA1.primoGir.toFixed(1).replace('.',',')+' m':'\u2014')+
        '</b></td><td class="n dim" style="font-size:11px">'+PA1.nPrimoGir+' buche</td></tr>'+
      '<tr><td>Primo putt, tutte le buche</td><td class="n"><b>'+(PA1.primo!==null?PA1.primo.toFixed(1).replace('.',',')+' m':'\u2014')+
        '</b></td><td class="n dim" style="font-size:11px">rif. amatoriale ~4,6 m</td></tr>'+
      '<tr><td>Putt corti mancati entro 5 ft</td><td class="n"><b>'+PA1.cortiMancati+'</b></td>'+
        '<td class="n dim" style="font-size:11px">su '+PA1.corti+' tentativi</td></tr>'+
      '<tr><td>Metri di putt imbucati</td><td class="n"><b>'+(PA1.footageGiro!==null?PA1.footageGiro.toFixed(1).replace('.',',')+' m':'\u2014')+
        '</b></td><td></td></tr>'+
      '</tbody></table>'+
      '<div class="stcap">Putt per GIR e\u2019 il putting al netto dell\u2019approccio; il primo putt in GIR e\u2019 '+
      'l\u2019approccio visto dal green. Su un giro solo sono conteggi, non tendenze.</div></div>'));
    const esP2=statEsitiPutt([g]);
    if(esP2.tot>0) pane.putt.appendChild(el('<div class="card"><h2>Putt non imbucati</h2>'+
      grigliaEsitiHtml(esP2.conte, esP2.tot)+'</div>'));
  } else pane.putt.appendChild(el(nonCompleto));

  /* ══ BASE ══ */
  {
    const SB=statBase(A1);
    if(SB) pane.base.appendChild(el(cardStatBase(SB, RIF, 'Base del giro',
      RIF?'La colonna “Media 20” e’ la tua finestra stabile: e’ il confronto che dice se '+
      'questo giro e’ stato sopra o sotto la tua storia.':'La finestra stabile compare da tre giri completi in avanti.')));
  }

  /* ══ INCROCI ══ */
  if(A.completo && c.nBuche===18){
    const bl6=[0,1,2,3,4,5].map(i=>{
      const bb=A.bucheCalc.slice(i*3,i*3+3);
      return {nome:'Buche '+(i*3+1)+'–'+(i*3+3), sg:bb.reduce((t,b)=>t+(b.sg||0),0),
              par:bb.reduce((t,b)=>t+b.diff,0)};
    });
    pane.incroci.appendChild(el('<div class="card"><h2>Il giro in sei blocchi</h2>'+
      '<table class="stat"><thead><tr><th>Tratto</th><th class="n">Sul par</th><th class="n">SG</th></tr></thead><tbody>'+
      bl6.map(x=>'<tr><td>'+x.nome+'</td><td class="n">'+sgn(x.par,0)+'</td>'+
        '<td class="n '+(x.sg>=0?'pos':'neg')+'">'+sgn(x.sg,1)+'</td></tr>').join('')+
      '</tbody></table></div>'));
    const n1=A.bucheCalc.slice(0,9), n2=A.bucheCalc.slice(9,18);
    const sd9=arr=>({par:arr.reduce((t,b)=>t+b.diff,0), sg:arr.reduce((t,b)=>t+(b.sg||0),0),
                     putt:arr.reduce((t,b)=>t+b.putt,0)});
    const N1=sd9(n1), N2=sd9(n2);
    pane.incroci.appendChild(el('<div class="card"><h2>Prima nove contro seconda</h2>'+
      '<table class="stat"><thead><tr><th></th><th class="n">Sul par</th><th class="n">SG</th><th class="n">Putt</th></tr></thead><tbody>'+
      '<tr><td>Prima nove</td><td class="n">'+sgn(N1.par,0)+'</td><td class="n '+(N1.sg>=0?'pos':'neg')+'">'+sgn(N1.sg,1)+'</td><td class="n">'+N1.putt+'</td></tr>'+
      '<tr><td>Seconda nove</td><td class="n">'+sgn(N2.par,0)+'</td><td class="n '+(N2.sg>=0?'pos':'neg')+'">'+sgn(N2.sg,1)+'</td><td class="n">'+N2.putt+'</td></tr>'+
      '</tbody></table><div class="stcap">Un giro solo: differenze di un paio di colpi fra le nove sono normali. '+
      'Il confronto appaiato su molti giri sta nelle statistiche di periodo.</div></div>'));
  } else pane.incroci.appendChild(el('<div class="card"><h2>Incroci</h2>'+
    '<div class="hint">'+(A.completo?'Gli incroci del giro singolo valgono per i giri da 18 buche.':'Servono i giri con dettaglio colpo per colpo.')+'</div></div>'));

  TABS.forEach(t=>{ if(!pane[t.k].children.length) pane[t.k].appendChild(el(nonCompleto)); });
  const cont=el('<div></div>'); body.appendChild(cont);
  function mostra(){ cont.innerHTML=''; cont.appendChild(pane[RG_TAB]);
    bar.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.k===RG_TAB)); }
  bar.onclick=e=>{ const b=e.target.closest('button'); if(b){ RG_TAB=b.dataset.k; mostra(); } };
  mostra();

  const mod=el('<button class="btn secondary">Correggi questo giro</button>');
  mod.onclick=()=>push('modificaGiro',{id:g.id});
  body.appendChild(mod);

  const del=el('<button class="btn danger">Elimina questo giro</button>');
  del.onclick=()=>{ if(confirm('Eliminare questo giro?\n\nNon viene distrutto: resta nelle copie automatiche e, sul repository, il file viene spostato fra i cancellati.')){
    eliminaGiroLocale(g); nav=[{view:'home'}]; render(); } };
  body.appendChild(del);
  return {header: circoloBreve(g.circolo),
    sub: fmtDataLunga(g.data)+' · tee '+String(g.tee||'').toLowerCase()+' · '+c.nBuche+' buche',
    body:body};
};

/* ---------------- CORREZIONE DI UN GIRO SALVATO ---------------- */
function trovaGiro(id){ return LS.get('hcp_giri',[]).find(g=>g.id===id); }
function salvaGiro(g, senzaMarca){
  if(!senzaMarca) marcaModifica(g);
  const giri=LS.get('hcp_giri',[]); const i=giri.findIndex(x=>x.id===g.id);
  if(i>=0){ giri[i]=g; LS.set('hcp_giri',giri); idbFlush(); bastCacheReset(); }
}

VIEWS.modificaGiro = function(p){
  const g=trovaGiro(p.id);
  const body=el('<div></div>');
  if(!g){ body.appendChild(el('<div class="empty">Giro non trovato.</div>')); return {header:'Correggi',body}; }
  const A=analizzaGiro(g,'tour');
  body.appendChild(el('<div class="hint">Tocca la buca da correggere. Ogni modifica ricalcola punteggio e '+
    'strokes gained. Prima di modificare viene salvata una copia automatica recuperabile da "Backup".</div>'));
  const I=controlloIntegrita(g);
  if(I.length) body.appendChild(el('<div class="avviso"><span class="ic">?</span><span>'+
    '<b>Sequenza sospetta.</b><br>'+I.map(x=>'Buca '+x.buca+': '+esc(x.tutti.join('; '))).join('<br>')+
    '</span></div>'));
  const card=el('<div class="card"><h2>Buche</h2></div>');
  A.bucheCalc.forEach(b=>{
    const it=el('<div class="listitem"><div>Buca '+b.buca+' · par '+b.par+
      '<div class="meta">'+b.colpi.length+' colpi registrati'+(b.distanza?' · '+b.distanza+' m':'')+'</div></div>'+
      '<span class="badge">'+b.score+'</span></div>');
    it.onclick=()=>push('modificaBuca',{id:g.id, i:b.buca-1});
    card.appendChild(it);
  });
  body.appendChild(card);

  const cond=g.condizioni||{vento:0,meteo:0,green:1};
  const cc=el('<div class="card"><h2>Condizioni del giro</h2>'+
    '<label>Vento</label><div class="grid3" id="e_vento">'+
      VENTO_OPZ.map(v=>'<div class="chip small'+(v.v===cond.vento?' selected':'')+'" data-v="'+v.v+'">'+v.n+'</div>').join('')+'</div>'+
    '<label style="margin-top:10px;">Terreno</label><div class="grid3" id="e_meteo">'+
      METEO_OPZ.map(v=>'<div class="chip small'+(v.v===cond.meteo?' selected':'')+'" data-v="'+v.v+'">'+v.n+'</div>').join('')+'</div>'+
    '<label style="margin-top:10px;">Green</label><div class="grid3" id="e_green">'+
      GREEN_OPZ.map(v=>'<div class="chip small'+(v.v===cond.green?' selected':'')+'" data-v="'+v.v+'">'+v.n+'</div>').join('')+'</div>'+
    '<label style="margin-top:10px;">Nome della gara</label>'+
    '<input type="text" id="e_gara" value="'+esc(g.gara||'')+'" placeholder="facoltativo">'+
  '</div>');
  const nuova={vento:cond.vento, meteo:cond.meteo, green:cond.green};
  [['#e_vento','vento'],['#e_meteo','meteo'],['#e_green','green']].forEach(pair=>{
    const box=cc.querySelector(pair[0]);
    box.onclick=e=>{ const ch=e.target.closest('.chip'); if(!ch) return;
      box.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));
      ch.classList.add('selected'); nuova[pair[1]]=parseInt(ch.dataset.v,10); };
  });
  const sv=el('<button class="btn secondary" style="margin:10px 0 0 0">Salva condizioni</button>');
  sv.onclick=async()=>{ await snapshotSalva('prima di modificare le condizioni');
    g.condizioni=nuova; g.gara=(cc.querySelector('#e_gara').value||'').trim()||null;
    salvaGiro(g); alert('Condizioni salvate.'); };
  cc.appendChild(sv);
  body.appendChild(cc);
  return {header:'Correggi giro', body};
};

VIEWS.modificaBuca = function(p){
  const g=trovaGiro(p.id);
  const body=el('<div></div>');
  if(!g){ body.appendChild(el('<div class="empty">Giro non trovato.</div>')); return {header:'Correggi',body}; }
  const b=g.buche[p.i];
  const bastoni=LS.get('hcp_bastoni_v2',BASTONI_DEFAULT);
  const optLie=v=>LIE_OPZ.map(l=>'<option value="'+l.k+'"'+(l.k===v?' selected':'')+'>'+l.n+'</option>').join('');
  const optBast=v=>bastoni.map(x=>'<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>').join('');
  const optEsito=v=>'<option value="">— settore —</option>'+
    ESITI.map(e=>'<option value="'+e.k+'"'+(e.k===v?' selected':'')+'>'+ESITO_NOME[e.k]+'</option>').join('');
  const optPen=v=>PENALITA_OPZ.map(x=>'<option value="'+x.k+'"'+(x.k===(v||'')?' selected':'')+'>'+x.n+'</option>').join('');

  body.appendChild(el('<div class="card"><h2>Buca '+(p.i+1)+'</h2>'+
    '<div class="row"><div><label>Par</label>'+
      '<select id="mPar">'+[3,4,5,6].map(x=>'<option'+(x===b.par?' selected':'')+'>'+x+'</option>').join('')+'</select></div>'+
      '<div><label>Distanza (m)</label><input type="number" id="mDist" value="'+(b.distanza===null||b.distanza===undefined?'':b.distanza)+'"></div></div>'+
    '<label style="margin-top:8px"><input type="checkbox" id="mCompl" '+(b.completata===false?'':'checked')+
      ' style="width:auto;margin-right:6px">Buca completata</label></div>'));

  const lista=el('<div class="card"><h2>Colpi</h2></div>');
  function ridisegna(){
    lista.querySelectorAll('.colpoRow').forEach(x=>x.remove());
    b.colpi.forEach((c,i)=>{
      const row=el('<div class="colpoRow" style="border-bottom:1px solid var(--bordo);padding:10px 0;">'+
        '<div style="font-size:12px;color:var(--grigio);margin-bottom:6px;font-weight:600;">Colpo '+(i+1)+'</div>'+
        '<div class="row" style="margin-bottom:6px;">'+
          '<div><select class="cLie">'+optLie(c.lie)+'</select></div>'+
          '<div><input type="number" step="0.1" class="cDist" value="'+c.distM+'" placeholder="m"></div>'+
        '</div>'+
        '<div class="row" style="margin-bottom:6px;">'+
          '<div><select class="cBast">'+optBast(c.bastone)+'</select></div>'+
          '<div><select class="cEsito">'+optEsito(c.esito)+'</select></div>'+
        '</div>'+
        '<div class="row" style="margin-bottom:0;">'+
          '<div><select class="cPen">'+optPen(c.penalita?(c.penTipo||'altro'):'')+'</select></div>'+
          '<div><button class="btn cDel secondary" style="margin:0;padding:11px;font-size:13px;">Elimina colpo</button></div>'+
        '</div></div>');
      row.querySelector('.cLie').onchange=e=>{ c.lie=e.target.value; };
      row.querySelector('.cDist').onchange=e=>{ c.distM=parseFloat(e.target.value)||0; };
      row.querySelector('.cBast').onchange=e=>{ c.bastone=e.target.value; };
      row.querySelector('.cEsito').onchange=e=>{ c.esito=e.target.value||null; };
      row.querySelector('.cPen').onchange=e=>{ const v=e.target.value; c.penalita=!!v; c.penTipo=v||null; ridisegna(); };
      row.querySelector('.cDel').onclick=()=>{ if(confirm('Eliminare il colpo '+(i+1)+'?')){ b.colpi.splice(i,1); ridisegna(); } };
      lista.appendChild(row);
    });
    const pen=b.colpi.reduce((s,c)=>s+(c.penalita?1:0),0);
    tot.textContent='Totale buca: '+(b.colpi.length+pen)+' colpi';
  }
  const tot=el('<div class="hint" style="margin-top:12px;font-weight:700;color:var(--testo)"></div>');
  const add=el('<button class="btn ghost" style="margin-top:10px">+ Aggiungi un colpo in fondo</button>');
  add.onclick=()=>{ const u=b.colpi[b.colpi.length-1];
    b.colpi.push({lie:u?u.lie:'fairway', distM:u?Math.max(1,Math.round(u.distM/2)):50,
                  bastone:u?u.bastone:'PW', penalita:false, penTipo:null, esito:null}); ridisegna(); };
  body.appendChild(lista); lista.appendChild(tot); lista.appendChild(add);
  ridisegna();

  const save=el('<button class="btn big">Salva le correzioni</button>');
  save.onclick=async()=>{
    b.par=parseInt(body.querySelector('#mPar').value,10);
    const d=body.querySelector('#mDist').value;
    b.distanza = d===''?null:parseFloat(d);
    b.completata = body.querySelector('#mCompl').checked;
    if(b.colpi.some(c=>!(c.distM>0))){ alert('Una distanza non e’ valida: devono essere tutte maggiori di zero.'); return; }
    const av=controlliBuca(b, b.colpi);
    const conf=testoConferma(av);
    if(conf && !confirm(conf)) return;
    await snapshotSalva('prima di correggere una buca');
    salvaGiro(g); back();
  };
  body.appendChild(save);
  return {header:'Buca '+(p.i+1), body};
};

/* ---------------- ARCHIVIO CAMPI ---------------- */
