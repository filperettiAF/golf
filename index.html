  /* v12 — quattro KPI a celle contigue, come nella scheda giro. Il delta
     resta, in piccolo sotto il valore. */
  const kc=(lab,val,delta,buonoSuGiu,dec,u)=>{
    let sub='\u00a0';   // niente entita' HTML dentro <script>: regola dell'archivio
    if(prev && delta!==null && Math.abs(delta)>=(dec===0?0.5:0.005)){
      const buono = buonoSuGiu==='giu' ? delta<0 : delta>0;
      sub='<span style="color:'+(buono?'var(--verde-testo)':'var(--rosso)')+'">'+sgnIt(delta,dec)+(u||'')+'</span>';
    } else if(prev) sub='\u2248';
    return '<div class="c"><div class="lab">'+lab+'</div><div class="v">'+val+'</div><div class="sub">'+sub+'</div></div>';
  };
  body.appendChild(el('<div class="kpin quattro">'+
    kc('Score', scoreMedio.toFixed(1).replace('.',','), prev?scoreMedio-prev.score:null, 'giu', 1)+
    kc('GIR', girPct+'%', prev?girPct-prev.gir:null, 'su', 0, '%')+
    kc('Putt/buca', puttB.toFixed(2).replace('.',','), prev?puttB-prev.putt:null, 'giu', 2)+
    kc('Scrambling', (scrPct===null?'\u2014':scrPct+'%'), (prev&&prev.scr!==null&&scrPct!==null)?scrPct-prev.scr:null, 'su', 0, '%')+
  '</div>'+(prev?'<div class="nt" style="margin:-10px 0 12px 2px">Il delta confronta con i '+prev.n+
    ' giri precedenti, a parita\u2019 di filtri.</div>':'')));

  /* v10: sette schede per domanda — Sintesi, Gioco lungo, Gioco corto, Putt,
     Base, Incroci, Consigli. I pannelli si costruiscono col codice collaudato
     delle versioni precedenti e si RICOLLOCANO per titolo: nessuna logica
     riscritta, solo la casa nuova. */
  /* v11: "Gioco lungo" aveva 20 pannelli dopo l'innesto del catalogo Tour, che su
     un telefono non e' una scheda ma un rotolo. La divisione segue la tassonomia
     del Tour, che separa Off the Tee da Approach the Green.
     Per tornare a sette schede: rimettere {k:'lungo',n:'Gioco lungo'} al posto
     delle due voci 'tee' e 'appr', e nella MAPPA sostituire 'tee' e 'appr' con
     'lungo'. Nient'altro. */
  const TABS=[{k:'sintesi',n:'Sintesi'},{k:'tee',n:'Dal tee'},{k:'appr',n:'Approcci'},
              {k:'corto',n:'Gioco corto'},{k:'putt',n:'Putt'},{k:'base',n:'Base'},
              {k:'incroci',n:'Incroci'},{k:'extra',n:'Consigli'}];
  const LEGACY_TAB={sg:'appr', par:'base', club:'tee', lungo:'appr'};
  if(LEGACY_TAB[STAT_F.tab]) STAT_F.tab=LEGACY_TAB[STAT_F.tab];
  if(!STAT_F.tab || !TABS.some(t=>t.k===STAT_F.tab)) STAT_F.tab='sintesi';
  const bar=el('<div class="tabbar sette">'+TABS.map(t=>'<button data-k="'+t.k+'" class="'+(STAT_F.tab===t.k?'on':'')+'">'+t.n+'</button>').join('')+'</div>');
  const pager=el('<div class="pager"></div>');
  body.appendChild(bar); body.appendChild(pager);

  const dvRow=(lab,v,maxA,dec)=>{
    const w=Math.abs(v)/maxA*50;
    const st=v>0?'left:50%;width:'+w+'%;background:var(--dv-blue);'
           :v<0?'right:50%;width:'+w+'%;background:var(--dv-red);'
           :'left:calc(50% - 2px);width:4px;background:var(--dv-neutral);';
    return '<div class="dvrow"><div class="d">'+lab+'</div>'+
      '<div class="dvtrack"><div class="zero"></div><div class="dvbar" style="'+st+'"></div></div>'+
      '<div class="n '+(v>=0?'pos':'neg')+'">'+sgn(v,dec===undefined?1:dec)+'</div></div>';
  };
  const etichette = A.map(g=>fmtDataBreve(g.data));

  /* ================= 0. SINTESI ================= */
  const p0=el('<div class="pane"></div>');
  if(completi.length>=3){
    // v10: il budget era calcolato verso lo scratch, che era una ricostruzione
    // dichiarata e non un dato. Ora la scomposizione del divario e' verso il
    // PGA Tour, la sola baseline pubblicata: dove stanno i colpi fra te e lei.
    const catsB=['tee','approccio','corto','putting'];
    const mB={};
    catsB.forEach(k=>{ mB[k]=media(completi.map(g=>g.calc.sgCat[k])); });
    const totB2=catsB.reduce((t,k)=>t+mB[k],0);
    const worst=catsB.slice().sort((a,b)=>mB[a]-mB[b])[0];
    const nA=completi.length;
    const pallini = nA>=40?'\u25cf\u25cf\u25cf':(nA>=10?'\u25cf\u25cf\u25cb':'\u25cf\u25cb\u25cb');
    const glegg = nA>=40?'leggibile':(nA>=10?'indicativo, non definitivo':'pochi dati: solo un orientamento');
    let verdB;
    if(totB2<-0.5) verdB='Perdi '+Math.abs(totB2).toFixed(1).replace('.',',')+' colpi a giro rispetto al Tour: '+
      Math.abs(mB[worst]).toFixed(1).replace('.',',')+' '+(Math.abs(mB[worst])===1?'sta':'stanno')+' in '+CAT_NOME[worst].toLowerCase()+'.';
    else if(totB2>0.5) verdB='Sei davanti al Tour di '+totB2.toFixed(1).replace('.',',')+' colpi a giro.';
    else verdB='Sei alla pari col Tour, dentro l\u2019incertezza.';
    const mxB=Math.max(0.5,...catsB.map(k=>Math.abs(mB[k])));
    const cB=el('<div class="card"><h2>Dove stanno i colpi che perdi</h2>'+
      '<div class="verd">'+verdB+'</div>'+
      '<div class="legg">leggibilita\u2019 <b>'+pallini+'</b> \u00b7 '+nA+' giri \u2014 '+glegg+'</div>'+
      /* v12: cascata verticale del handoff. Ogni gradino parte dal cumulato
         precedente, cosi' si vede come il divario si compone reparto per
         reparto invece di quattro barre indipendenti. */
      grafCascata(catsB.map(k=>({nome:CAT_NOME[k], v:mB[k]})), 12)+
      '<div class="stcap">Scomposizione del divario dalla baseline PGA Tour (dato pubblicato, Broadie 2012), per '+
      'reparto. Broadie: fra livelli diversi circa due terzi del divario sta nel gioco lungo, il putting pesa ~15%. '+
      'La riga <b>tee-to-green</b> (somma dei primi tre reparti) vale <b>'+sgn(mB.tee+mB.approccio+mB.corto,1)+
      '</b> colpi/giro. Il pannello \u201cQuanto pesa ogni reparto\u201d risponde a una domanda diversa: da dove '+
      'nasce la variabilita\u2019 dei tuoi giri. La baseline scratch delle versioni precedenti e\u2019 stata '+
      'dismessa: era una ricostruzione, non una tabella pubblicata.</div>'+
      '</div>');
    p0.appendChild(cB);
    if(mB[worst]<-0.3){
      p0.appendChild(el('<div class="card"><h2>Cosa allenare</h2>'+
        '<div class="verd" style="font-size:14px">Il reparto che ti costa di piu\u2019 e\u2019 <b>'+
        CAT_NOME[worst].toLowerCase()+'</b> ('+sgn(mB[worst],1)+' colpi/giro rispetto al Tour).</div>'+
        '<div class="hint">Il suggerimento legge la scomposizione del divario qui sopra, non le quote di varianza. '+
        'Gli esercizi corrispondenti sono nella sezione Allenamento (da innestare).</div></div>'));
    }
  } else {
    p0.appendChild(el('<div class="card"><h2>Sintesi</h2><div class="hint">La sintesi compare da tre giri '+
      'completi in avanti. Ora ne hai '+completi.length+'.</div></div>'));
  }

  /* ================= 1. STROKES GAINED ================= */
  const p1=el('<div class="pane"></div>');
  if(!completi.length){
    p1.appendChild(el('<div class="card"><h2>Strokes gained</h2>'+
      '<div class="hint">Nessuno dei giri selezionati ha il dettaglio colpo per colpo.</div></div>'));
  } else {
    const cats=['tee','approccio','corto','putting'];
    const nC=completi.length;
    const perGiro=cats.reduce((o,k)=>(o[k]=media(completi.map(g=>g.calc.sgCat[k])),o),{});
    const sdCat=cats.reduce((o,k)=>(o[k]=scartoTipo(completi.map(g=>g.calc.sgCat[k])),o),{});
    const mediaTot=cats.reduce((s,k)=>s+perGiro[k],0);
    const etC=completi.map(g=>fmtDataBreve(g.data));
    const rif = MS ? MS : null;

    if(STAT_F.baseline==='media'){
      if(!rif){
        p1.appendChild(el('<div class="card"><h2>La tua media</h2><div class="hint">'+
          'Servono almeno tre giri completi per costruire la finestra di riferimento.</div></div>'));
      } else {
        const vals=completi.map((g,i)=>({x:etC[i], y:g.calc.sgTot-rif.tot}));
        const seTot = rif.sdTot!==null ? rif.sdTot : null;
        const c=el('<div class="card"><h2>Ogni giro rispetto alla tua media</h2>'+
          '<div class="hint">Riferimento fisso: media degli <b>ultimi '+rif.n+' giri completi</b>, indipendente dai filtri, '+
          'cosi’ lo stesso giro non cambia valore cambiando vista. Media di riferimento '+sgn(rif.tot,2)+' colpi.</div>'+
          svgLinea(vals,{h:110, zero:true, colore:'var(--dv-blue)', fmt:v=>sgn(v,1), aria:'scarto dalla media per giro'})+'</div>');
        const mx=Math.max(0.5,...completi.map(x=>Math.abs(x.calc.sgTot-rif.tot)));
        completi.forEach((g,i)=>c.appendChild(el(dvRow(etC[i], g.calc.sgTot-rif.tot, mx))));
        c.appendChild(el('<div class="stcap">Un giro si distingue davvero dalla tua media quando esce di piu’ di '+
          (seTot?(2*seTot).toFixed(1):'—')+' colpi, cioe’ due scarti tipo. Sotto quella soglia e’ variabilita’ normale.</div>'));
        p1.appendChild(c);
      }
    } else {
      const maxA=Math.max(0.5,...cats.map(k=>Math.abs(perGiro[k])));
      const c=el('<div class="card"><h2>Strokes gained per categoria</h2>'+
        '<div class="hint">Media per giro rispetto '+etichetta+', su '+nC+' giri. Sopra lo zero guadagni colpi, sotto li perdi.</div>'+
        '<div class="legend"><span class="it"><span class="sw" style="background:var(--dv-blue)"></span>Guadagni</span>'+
          '<span class="it"><span class="sw" style="background:var(--dv-red)"></span>Perdi</span></div>'+
        cats.map(k=>dvRow(CAT_NOME[k], perGiro[k], maxA)).join('')+
        
        '<div class="stcap">Totale per giro: <b class="'+(mediaTot>=0?'pos':'neg')+'">'+sgn(mediaTot,1)+
          '</b> colpi rispetto '+etichetta+'.</div>'+
        '</div>');
      p1.appendChild(c);

      // andamento nel tempo, con soglia di leggibilita'
      const sdTot=scartoTipo(completi.map(g=>g.calc.sgTot));
      const cT=el('<div class="card"><h2>Andamento nel tempo</h2></div>');
      if(nC>=10){
        // G4: l'occhio deve inseguire il segnale, non il rumore. I singoli giri
        // sono punti in de-enfasi; l'unica linea e' la media mobile (10 giri).
        const seRoll = sdTot!==null ? sdTot/Math.sqrt(Math.min(10,nC)) : 0;
        const rollAll=completi.map((g,i)=> i<9?null: completi.slice(i-9,i+1).reduce((t,x)=>t+x.calc.sgTot,0)/10).filter(x=>x!==null);
        let verdA='La media mobile si muove dentro la banda del caso: nessuna tendenza leggibile.';
        if(rollAll.length>=2 && seRoll && Math.abs(rollAll[rollAll.length-1]-rollAll[0])>2*seRoll)
          verdA='La media mobile si e\u2019 spostata di '+sgn(rollAll[rollAll.length-1]-rollAll[0],1)+
            ' colpi da inizio periodo: piu\u2019 della banda del caso.';
        cT.appendChild(el('<div class="verd" style="font-size:14px">'+verdA+'</div>'));
        cT.appendChild(el('<div class="hint">Punti grigi: i singoli giri. Linea: media mobile sugli ultimi 10, '+
          'con la banda del caso.</div>'));
        cT.appendChild(trendMediaEl(completi.map((g,i)=>({x:etC[i], y:g.calc.sgTot})),
          {se:seRoll, aria:'strokes gained totale nel tempo'}));
        cT.appendChild(el('<div class="legend"><span class="it"><span class="sw" style="background:var(--dv-neutral)"></span>Singoli giri</span>'+
          '<span class="it"><span class="sw" style="background:var(--dv-blue)"></span>Media mobile (10)</span></div>'));
        cT.appendChild(el('<div class="stcap">Per distinguere un miglioramento di un colpo per giro servirebbero circa '+
          (sdTot?giriNecessari(sdTot,1):'—')+' giri prima e altrettanti dopo. Con '+nC+' giri, questa linea racconta '+
          'la variabilita’, non la tendenza.</div>'));
      } else {
        cT.appendChild(el(nonLeggibile(sdTot, 1.0, nC, 'Sotto i dieci giri la linea sarebbe rumore disegnato bene.')));
      }
      p1.appendChild(cT);

      const tuttiV=cats.flatMap(k=>completi.map(g=>g.calc.sgCat[k]));
      const mn=Math.min(0,...tuttiV), mx2=Math.max(0,...tuttiV);
      if(nC>=8){
        p1.appendChild(el('<div class="card"><h2>Andamento per categoria</h2>'+
          '<div class="hint">Stessa scala su tutti e quattro, cosi’ si vede subito quale pesa di piu’.</div>'+
          '<div class="smgrid">'+cats.map((k,ii)=>boxTrend(CAT_NOME[k],
            completi.map((g,i)=>({x:etC[i], y:g.calc.sgCat[k]})),
            'var(--dv-blue)',   /* G1: un facet titolato non ha bisogno di un colore per dire chi e';
                                    blu\u2194rosso restano riservati alla polarita' guadagni/perdite */
            {min:mn, max:mx2, fmt:v=>sgn(v,1)})).join('')+'</div>'+
          '<div class="stcap">Le etichette mostrano primo e ultimo giro del periodo. Con '+nC+' giri queste curve '+
          'servono a vedere la dispersione, non a leggere una direzione.</div></div>'));
      }
    }

    const fasce=statFasce(completi);
    if(fasce.length) p1.appendChild(el('<div class="card"><h2>Approcci per fascia di distanza</h2>'+
      '<div class="hint">Da dove parte il colpo, quanti green prendi da li’, quanto lasci alla buca. '+
      'Le righe con meno di '+N_MIN_FASCIA+' colpi sono in grigio: ci sono, ma non si leggono.</div>'+
      '<table class="stat"><thead><tr><th>Da</th><th class="n">Colpi</th><th class="n">Green</th>'+
        '<th class="n">Lascia</th><th class="n">Rif. m</th><th class="n">SG/colpo</th></tr></thead><tbody>'+
        fasce.map(x=>{
          // v9: riferimento esterno di prossimita', al centro della fascia, dal lie
          // fairway. Segue la baseline scelta in testa alla schermata: Tour oppure
          // giocatore scratch. Fonti nella didascalia.
          const centro = x.hi>900 ? x.lo+20 : (x.lo+x.hi)/2;
          const rif = proxRifM(centro, 'tour');
          let h='<tr'+(x.solido?'':' style="opacity:.5"')+'><td>'+x.label+'</td><td class="n">'+x.n+'</td>'+
            '<td class="n">'+Math.round(100*x.green/x.n)+'%</td>'+
            '<td class="n">'+(x.nProx?(x.prox/x.nProx).toFixed(1)+' m':'—')+'</td>'+
            '<td class="n dim">'+(rif!==null?rif.toFixed(1):'\u2014')+'</td>'+
            '<td class="n '+(x.sgColpo>=0?'pos':'neg')+'">'+sgn(x.sgColpo,3)+'</td></tr>';
          if(x.perLie){
            [['fairway','\u2514 dal fairway'],['rough','\u2514 dal rough']].forEach(pl=>{
              const y=x.perLie[pl[0]];
              h+='<tr style="font-size:11px;opacity:.85"><td style="padding-left:12px">'+pl[1]+'</td>'+
                 '<td class="n">'+y.n+'</td><td class="n">'+Math.round(y.greenPct)+'%</td>'+
                 '<td class="n">'+(y.prox!==null?y.prox.toFixed(1)+' m':'\u2014')+'</td>'+
                 '<td class="n dim">'+(pl[0]==='fairway' && rif!==null?rif.toFixed(1):'\u00b7')+'</td>'+
                 '<td class="n '+(y.sgColpo>=0?'pos':'neg')+'">'+sgn(y.sgColpo,3)+'</td></tr>';
            });
          }
          return h;
        }).join('')+
      '</tbody></table><div class="stcap">SG per colpo, non per giro. '+
      '"Lascia" vale solo quando il green viene preso. Le righe \u201cdi cui\u201d separano gli approcci per lie di '+
      'partenza, come lo standard ShotLink, e compaiono solo quando fairway e rough superano entrambi '+N_MIN_FASCIA+' colpi: '+
      'dalla stessa distanza sono due colpi diversi, ed e\u2019 il numero che decide se il driver aggressivo paga.<br><br>'+
      '<b>Rif.</b> e\u2019 la prossimita\u2019 PGA Tour 2022-23 DAL FAIRWAY, interpolata al centro della '+
      'fascia e convertita dalle yard (da 100-125 yd 20\u20194\u201d, da 150-175 yd 28\u20199\u201d). Va letta '+
      'come ordine di grandezza, non al piede: le tue fasce sono in metri e le loro in yard.</div>'+
      /* v10 — barre divergenti del handoff: scala fissa +-0,10 SG per colpo, tacca
         zero centrale, e le fasce sotto N_MIN in grigio al 50% con il conteggio
         in etichetta. La scala e' fissa perche' due letture successive con filtri
         diversi devono essere confrontabili a occhio.                          */
      '<div style="margin-top:12px">'+
      fasce.map(x=>{
        /* scala fissa +-0,50 e non +-0,10 come nel handoff: a +-0,10 sei righe su
           otto saturano e le barre non dicono piu' niente. +-0,10 e' la
           dispersione del Tour, non quella di un dilettante. Fissa resta, perche'
           due letture con filtri diversi devono confrontarsi a occhio. */
        const S=0.50, q=Math.max(-1,Math.min(1, x.sgColpo/S));
        const col = x.solido ? (x.sgColpo>=0?'var(--verde)':'var(--rosso)') : 'var(--tenue)';
        const w=Math.abs(q)*50;
        return '<div class="dvrow"'+(x.solido?'':' style="opacity:.5"')+'>'+
          '<div class="d">'+esc(x.label)+(x.solido?'':' <span style="font-size:10px">('+x.n+')</span>')+'</div>'+
          '<div class="dvtrack"><div class="zero"></div>'+
          '<div class="dvbar" style="background:'+col+'; '+
            (q>=0?('left:50%; width:'+w.toFixed(1)+'%'):('right:50%; width:'+w.toFixed(1)+'%'))+'"></div></div>'+
          '<div class="n" style="color:'+(x.solido?(x.sgColpo>=0?'var(--verde-testo)':'var(--rosso)'):'var(--grigio)')+
            '">'+sgnIt(x.sgColpo,2)+'</div></div>';
      }).join('')+
      '<div class="stcap" style="margin-top:2px">Scala fissa \u22120,50 \u00b7 0 \u00b7 +0,50 SG per colpo. '+
      'Le barre che toccano il bordo sono oltre la scala, non al limite. Grigio = sotto i '+N_MIN_FASCIA+
      ' colpi, col conteggio fra parentesi.</div></div>'+
      '</div>'));

    /* ══ v9 — FRL: prossimita' normalizzata sulla lunghezza del colpo ══════ */
    {
      const FR=statFRL(completi);
      const righe=FR.fasce.filter(x=>x.nTot>0);
      if(righe.length || FR.globale.n>=N_MIN_FASCIA){
        p1.appendChild(el('<div class="card"><h2>Prossimita\u2019 normalizzata (FRL)</h2>'+
          '<div class="hint">Distanza residua divisa per la distanza di partenza. Rende confrontabili colpi di '+
          'lunghezza diversa: 12 m da 90 metri e 12 m da 180 non sono la stessa cosa e non stanno nella stessa '+
          'colonna. Si calcola sui dati che hai gia\u2019, nessun tocco in piu\u2019.</div>'+
          (FR.globale.n>=N_MIN_FASCIA?'<div class="verd" style="font-size:14px">FRL mediano su tutti i colpi '+
            'lunghi: <b>'+FR.globale.med.toFixed(1).replace('.',',')+'%</b></div>'+
            '<div class="legg">'+FR.globale.n+' colpi oltre le 20 yd \u00b7 riferimento Broadie: '+
            FRL_TOT.map(t=>t[0]+' '+t[1]+'%').join(' \u00b7 ')+'</div>':'')+
          (righe.length?'<table class="stat" style="margin-top:10px"><thead><tr><th>Fascia</th><th class="n">Lie</th>'+
            '<th class="n">N</th><th class="n">Tuo</th><th class="n">Sei da</th></tr></thead><tbody>'+
            righe.map(x=>{
              const rf=FRL_RIF[x.k]||{};
              const rig=(nome,n,med,lie)=>{
                if(!n) return '';
                const ref=rf[lie]||[];
                const col=frlCollocazione(med, ref);
                return '<tr'+(n>=N_MIN_FASCIA?'':' style="opacity:.5"')+'><td>'+nome+'</td>'+
                  '<td class="n" style="font-size:11px">'+(lie==='fairway'?'fw':'rough')+'</td>'+
                  '<td class="n">'+n+'</td><td class="n"><b>'+med.toFixed(1).replace('.',',')+'%</b></td>'+
                  '<td class="n" style="font-size:11px">'+(col||'\u2014')+'</td></tr>'+
                  (ref.length?'<tr><td colspan="5" class="dim" style="font-size:10px;padding-top:0;padding-bottom:7px">'+
                    'scala: '+FRL_GRUPPI.map((g,i)=>g[0]+' '+String(ref[i]).replace('.',',')).join(' \u00b7 ')+'</td></tr>':'');
              };
              return rig(x.label, x.nFw, x.medFw, 'fairway')+rig(x.label, x.nRo, x.medRo, 'rough');
            }).join('')+'</tbody></table>':'')+
          '<div class="stcap">Valori in percentuale, mediane. La scala sotto ogni riga sono i gruppi di Broadie, '+
          '"Assessing Golfer Performance Using Golfmetrics", Science and Golf V, 2008 (circa 40.000 colpi, 500 giri, '+
          'oltre 130 giocatori): '+FRL_GRUPPI.map(g=>g[0]+' = punteggi '+g[1]).join(', ')+'. Sono le sue fasce, in '+
          'yard, perche\u2019 altrimenti il confronto non sarebbe lecito. Colpo imbucato = residua zero; i colpi con '+
          'penalita\u2019 sono esclusi. E\u2019 l\u2019unico riferimento di prossimita\u2019 normalizzata pubblicato '+
          'e primario che esista.<br><br><b>Un limite del riferimento, non tuo:</b> la scala del rough nel paper '+
          'non e\u2019 monotona \u2014 a 100-150 yd Am1 sta a 10,4% e Pro1 a 11,1% \u2014 quindi la collocazione dal '+
          'rough e\u2019 il gruppo piu\u2019 vicino in valore assoluto, non un\u2019interpolazione. Il confronto dal '+
          'fairway e\u2019 piu\u2019 solido di quello dal rough.</div></div>'));
      }
    }

    /* ══ v9 — errore di distanza con il segno ══════════════════════════════ */
    {
      const EL=statErroreLong(completi);
      if(EL.length){
        p1.appendChild(el('<div class="card"><h2>Errore di distanza, con il segno</h2>'+
          '<div class="hint">Dal settore e dal raggio residuo: quanti metri corto o lungo, in media, per fascia. '+
          'La griglia dava le percentuali corto/lungo su tutti i colpi insieme; qui il segno e\u2019 in metri e '+
          'la fascia e\u2019 separata, che e\u2019 dove la lettura diventa una scelta di bastone.</div>'+
          '<table class="stat"><thead><tr><th>Da</th><th class="n">N</th><th class="n">Corti</th>'+
            '<th class="n">Lunghi</th><th class="n">Errore medio</th></tr></thead><tbody>'+
          EL.map(x=>'<tr'+(x.solido?'':' style="opacity:.5"')+'><td>'+x.label+'</td>'+
            '<td class="n">'+x.n+'</td>'+
            '<td class="n">'+Math.round(100*x.corti/x.n)+'%</td>'+
            '<td class="n">'+Math.round(100*x.lunghi/x.n)+'%</td>'+
            '<td class="n"><b>'+sgn(x.bias,1)+' m</b>'+'</td></tr>').join('')+
          '</tbody></table>'+
          '<div class="stcap">Segno negativo = corto. Solo i colpi con settore e residua entro i '+ESITO_SOGLIA_M+' m, '+
          'dove la scomposizione e\u2019 attendibile.<br><br><b>Nessuna colonna di riferimento, per scelta:</b> non '+
          'esiste alcuna quantificazione primaria pubblicata del bias \u201ccorto\u201d per fascia di distanza, ne\u2019 '+
          'per i dilettanti ne\u2019 per il Tour. La frase di Broadie sulle ellissi tre volte piu\u2019 lunghe che '+
          'larghe riguarda i colpi di gioco corto del gruppo Am2, non la fascia 40-200 m: portarla qui sarebbe '+
          'un\u2019inferenza travestita da dato. Questa tabella e\u2019 una lettura interna, e va usata solo contro '+
          'se stessa nel tempo.</div></div>'));
      }
    }

    /* ══ v9 — le code, non la media ════════════════════════════════════════ */
    {
      const CD=statCode(completi);
      if(CD.nColpi>=30){
        p1.appendChild(el('<div class="card"><h2>Le code: i colpi che costano</h2>'+
          '<div class="hint">La media con due errori standard, che questa app mostra ovunque, nasconde le code. '+
          'E sugli approcci le code sono il punteggio.</div>'+
          (CD.quotaPeggiori!==null?'<div class="verd" style="font-size:14px">Il tuo <b>8% peggiore</b> ('+CD.k+
            ' colpi su '+CD.nColpi+') porta il <b>'+CD.quotaPeggiori.toFixed(0)+'%</b> di tutti i colpi persi.</div>'+
            '<div class="legg">riferimento Broadie, Golfmetrics: per il medio handicap meno dell\u20198% degli swing '+
            'produce oltre il 35% dei colpi persi</div>':'')+
          (CD.corto.pct!==null && CD.corto.n>=20?'<table class="stat" style="margin-top:10px"><tbody>'+
            '<tr><td>Da sotto le 100 yd, finiti oltre 75 ft (22,9 m) dalla buca</td>'+
            '<td class="n"><b>'+CD.corto.pct.toFixed(1)+'%</b><span class="dim" style="font-size:10px"> ('+
            CD.corto.oltre+'/'+CD.corto.n+')</span></td></tr>'+
            '<tr><td class="dim" style="font-size:11px">riferimento scratch 4% \u00b7 handicap 10: 11%</td><td></td></tr>'+
            '</tbody></table>':'')+
          (CD.fasce.length?'<table class="stat" style="margin-top:10px"><thead><tr><th>Approcci da</th>'+
            '<th class="n">N</th><th class="n">Colpi disastro</th></tr></thead><tbody>'+
            CD.fasce.map(x=>'<tr'+(x.n>=N_MIN_FASCIA?'':' style="opacity:.5"')+'><td>'+x.label+'</td>'+
              '<td class="n">'+x.n+'</td><td class="n">'+Math.round(100*x.bad/x.n)+'%'+
              '<span class="dim" style="font-size:10px"> ('+x.bad+')</span></td></tr>').join('')+
            '</tbody></table>':'')+
          '<div class="stcap">\u201cColpo disastro\u201d e\u2019 una soglia dichiarata: strokes gained sotto '+
          CODA_SG.toFixed(1).replace('.',',')+' colpi. Il riferimento del 4% viene da Stagner su dati Arccos e non '+
          'dichiara la numerosita\u2019: e\u2019 di classe piu\u2019 debole del dato Broadie sopra, e va trattato '+
          'come ordine di grandezza.</div></div>'));
      }
    }

    /* ══ v9 — gioco corto ══════════════════════════════════════════════════ */
    {
      const GC=statGiocoCorto(completi);
      if(GC.n>0){
        const rifFin=2.45, rifLeaveM=11/M_TO_FT, rifSand=37;
        p1.appendChild(el('<div class="card"><h2>Gioco corto da dentro le 50 yd</h2>'+
          '<div class="hint">Un tentativo per buca: il primo colpo giocato da fuori dal green entro le 50 yard. '+
          'Il gioco corto in gara e\u2019 raro \u2014 con GIR al 62% sono circa 6,8 occasioni a giro \u2014 quindi '+
          'qui la numerosita\u2019 cresce piano e le righe in grigio vanno lasciate stare.</div>'+
          // La disciplina N=12 vale anche per i riquadri, non solo per le tabelle:
          // un 0% su 10 tentativi va mostrato spento, altrimenti si legge come un fatto.
          (function(){
            const kpi=(lab,val,sub,n)=>{
              const debole = !(n>=N_MIN_FASCIA);
              return '<div class="kpi"'+(debole?' style="opacity:.55"':'')+'><div class="lab">'+lab+'</div>'+
                '<div class="v">'+val+'</div><div class="sub">'+sub+
                (debole?' \u00b7 sotto '+N_MIN_FASCIA+', non si legge':'')+'</div></div>';
            };
            return '<div class="kpigrid">'+
              kpi('Up and down', GC.pct.toFixed(0)+'<span class="u">%</span>', GC.ok+' su '+GC.n+' tentativi', GC.n)+
              kpi('Colpi per finire', GC.finire.toFixed(2).replace('.',','), 'riferimento scratch 2,45', GC.n)+
              kpi('Leave medio', GC.leave.toFixed(2).replace('.',',')+'<span class="u">m</span>',
                  'riferimento scratch 3,35 m (11 ft)', GC.n)+
              kpi('Sand save', GC.sand.n?GC.sand.pct.toFixed(0)+'<span class="u">%</span>':'\u2014',
                  GC.sand.ok+' su '+GC.sand.n+' \u00b7 rif. scratch '+rifSand+'%', GC.sand.n)+
            '</div>';
          })()+
          (GC.fasce.length?'<table class="stat" style="margin-top:10px"><thead><tr><th>Da</th><th class="n">N</th>'+
            '<th class="n">Up and down</th><th class="n">Rif.</th><th class="n">Per finire</th></tr></thead><tbody>'+
            GC.fasce.map(x=>'<tr'+(x.solido?'':' style="opacity:.5"')+'><td>'+x.label+'</td>'+
              '<td class="n">'+x.n+'</td><td class="n"><b>'+x.pct.toFixed(0)+'%</b></td>'+
              '<td class="n dim">'+x.rif+'%</td>'+
              '<td class="n">'+x.finireM.toFixed(2).replace('.',',')+'</td></tr>').join('')+
            '</tbody></table>':'')+
          (function(){
            const L=[['fairway','Dal fairway'],['rough','Dal rough'],['sabbia','Dalla sabbia'],['recupero','Dal recupero']];
            const righe=L.filter(l=>GC.perLie[l[0]] && GC.perLie[l[0]].n>0);
            if(!righe.length) return '';
            return '<table class="stat" style="margin-top:10px"><thead><tr><th>Up and down per lie</th>'+
              '<th class="n">N</th><th class="n">Riuscito</th></tr></thead><tbody>'+
              righe.map(l=>{ const o=GC.perLie[l[0]];
                return '<tr'+(o.n>=N_MIN_FASCIA?'':' style="opacity:.5"')+'><td>'+l[1]+'</td>'+
                  '<td class="n">'+o.n+'</td><td class="n"><b>'+Math.round(100*o.ok/o.n)+'%</b></td></tr>';}).join('')+
              '</tbody></table>';
          })()+
          '<div class="stcap">Lo <b>scrambling per lie</b> qui sopra era gia\u2019 calcolato dalla ver09 e non '+
          'veniva stampato: il Tour lo pubblica separando rough, sabbia e altro.<br><br>'+
          'Regola dichiarata: un tentativo per buca, il primo colpo da fuori dal green entro le '+
          '50 yd, qualunque colpo lo abbia prodotto \u2014 quindi include il pitch di terzo su un par 5, non solo lo '+
          'scrambling dopo un green mancato (che l\u2019app calcola a parte, sulle buche senza GIR). Contare ogni '+
          'posizione conterebbe due volte la stessa buca quando il primo chip e\u2019 sbagliato, gonfiando il '+
          'denominatore proprio nei casi peggiori.<br><br>Riferimenti Shot Scope per il giocatore scratch: up and down '+
          '63% sotto le 25 yd, 32% fra 25 e 50 yd, sand save 37%, prossimita\u2019 dopo il colpo corto 11 ft, colpi '+
          'per finire da dentro le 50 yd 2,45. La fonte non dichiara la numerosita\u2019.</div></div>'));
      }
    }

    /* ══ v9 — difficolta' del colpo corto: i due bit nuovi ═════════════════ */
    {
      const DC=statDifficoltaCorto(completi);
      if(DC.tot>0){
        if(!DC.conOst && !DC.conLc){
          p1.appendChild(el('<div class="card"><h2>Difficolta\u2019 del colpo corto</h2>'+
            '<div class="hint">Novita\u2019 dello schema v9: sui colpi entro i 30 yd puoi segnare se c\u2019era un '+
            'ostacolo da superare e com\u2019era il lie (pelato, normale, soffice). Due tocchi facoltativi su circa '+
            'sette colpi a giro. Entro quella distanza il lie domina la difficolta\u2019, e \u201crough\u201d mette '+
            'insieme un pelato e un soffice che sono due colpi diversi. Questa scheda si riempie dal prossimo giro.</div></div>'));
        } else {
          const rigaB=(nome,o)=>o.n?'<tr'+(o.n>=N_MIN_FASCIA?'':' style="opacity:.5"')+'><td>'+nome+'</td>'+
            '<td class="n">'+o.n+'</td><td class="n '+(o.sg>=0?'pos':'neg')+'">'+sgn(o.sg,3)+'</td>'+
            '<td class="n">'+(o.leave!==null?o.leave.toFixed(2).replace('.',',')+' m':'\u2014')+'</td></tr>':'';
          p1.appendChild(el('<div class="card"><h2>Difficolta\u2019 del colpo corto</h2>'+
            '<div class="legg">copertura ostacolo <b>'+Math.round(100*DC.conOst/DC.tot)+'%</b> \u00b7 lie '+
            '<b>'+Math.round(100*DC.conLc/DC.tot)+'%</b> su '+DC.tot+' colpi di gioco corto</div>'+
            '<table class="stat" style="margin-top:8px"><thead><tr><th>Situazione</th><th class="n">N</th>'+
              '<th class="n">SG/colpo</th><th class="n">Leave</th></tr></thead><tbody>'+
              rigaB('Con ostacolo da superare', DC.ost.si)+
              rigaB('Via libera', DC.ost.no)+
              rigaB('Lie pelato', DC.lc.pelato)+
              rigaB('Lie normale', DC.lc.normale)+
              rigaB('Lie soffice', DC.lc.soffice)+
            '</tbody></table>'+
            '<div class="stcap">Nessun riferimento esterno pubblicato per queste righe: lettura interna. Serve a '+
            'sapere se il gioco corto costa per tecnica o per situazioni che non si potevano salvare \u2014 due '+
            'diagnosi che portano ad allenamenti diversi.</div></div>'));
        }
      }
    }

    /* ══ v9 — short-side ═══════════════════════════════════════════════════ */
    {
      const SS=statShortSide(completi);
      if(SS.buche>0){
        if(!SS.conPin){
          p1.appendChild(el('<div class="card"><h2>Short-side</h2>'+
            '<div class="hint">Novita\u2019 dello schema v9: la <b>posizione della bandiera</b>, un tocco per buca '+
            'sulla stessa griglia a nove caselle. Con quella, il pattern di errore smette di dire soltanto dove '+
            'finisce la palla e comincia a dire se quel lato era il lato punibile. Arccos la registra, come ShotLink '+
            'e Golfmetrics; Shot Scope, 18Birdies e Clippd no. Questa scheda si riempie dal prossimo giro.</div></div>'));
        } else if(SS.opp>0){
          p1.appendChild(el('<div class="card"><h2>Short-side</h2>'+
            '<div class="verd" style="font-size:14px">Dei green mancati con la bandiera registrata, il '+
            '<b>'+SS.pctShort.toFixed(0)+'%</b> finisce dalla parte della bandiera.</div>'+
            '<div class="legg">'+SS.opp+' green mancati \u00b7 bandiera registrata su '+SS.conPin+' buche di '+SS.buche+'</div>'+
            '<table class="stat" style="margin-top:8px"><tbody>'+
              '<tr><td>Short-side (dalla parte della bandiera)</td><td class="n">'+SS.short+'</td>'+
                '<td class="n '+((SS.sgShort||0)>=0?'pos':'neg')+'">'+(SS.sgShort!==null?sgn(SS.sgShort,3):'\u2014')+'</td></tr>'+
              '<tr><td>Long-side (dalla parte larga)</td><td class="n">'+SS.lungo+'</td>'+
                '<td class="n '+((SS.sgLong||0)>=0?'pos':'neg')+'">'+(SS.sgLong!==null?sgn(SS.sgLong,3):'\u2014')+'</td></tr>'+
              '<tr><td>Ne\u2019 uno ne\u2019 l\u2019altro</td><td class="n">'+SS.neutro+'</td><td class="n">\u2014</td></tr>'+
            '</tbody></table>'+
            '<div class="stcap"><b>Numero senza riferimento esterno, e va detto:</b> non esiste alcun dato pubblicato '+
            'sul costo in colpi di un miss short-side contro long-side, le statistiche PGA Tour non hanno lo split e '+
            'DECADE non pubblica dataset. Il \u201c4-6 colpi risparmiati\u201d che circola in rete e\u2019 '+
            'un\u2019affermazione senza evidenza. Questa scheda serve alla scelta del bersaglio, non al confronto con '+
            'nessuno.<br><br>Contesto quantitativo: sul Tour le bandiere stanno tipicamente 9-15 ft dal bordo contro '+
            'una dispersione laterale totale di 42,6 ft da 184 yd (Trackman). A quelle distanze lo short-side non si '+
            'evita con la precisione: si evita scegliendo dove mirare.<br><br>Regola: green mancato con settore e '+
            'residua entro i '+ESITO_SOGLIA_M+' m; short-side se il settore condivide un asse con la posizione della '+
            'bandiera. Se un asse dice short-side e l\u2019altro long-side, vince short-side.</div></div>'));
        }
      }
    }

    const P=statPutting(completi);
    if(P.fasce.length){
      const tp=P.bucheConPutt?100*P.treputt/P.bucheConPutt:0;
      p1.appendChild(el('<div class="card"><h2>Putting per distanza</h2>'+
        '<div class="hint">Tre putt sul <b>'+tp.toFixed(1)+'%</b> delle buche ('+P.treputt+' su '+P.bucheConPutt+').</div>'+
        '<table class="stat"><thead><tr><th>Distanza</th><th class="n">Putt</th>'+
          '<th class="n">Imbucati</th><th class="n">Tour</th><th class="n">SG/putt</th></tr></thead><tbody>'+
          P.fasce.map(x=>{
            const mid = x.hi>900 ? x.lo+2 : (x.lo+x.hi)/2;
            const tm = tourMakePct(mid);
            return '<tr'+(x.solido?'':' style="opacity:.5"')+'><td>'+x.label+'</td><td class="n">'+x.n+'</td>'+
            '<td class="n">'+Math.round(100*x.imbucati/x.n)+'%</td>'+
            '<td class="n dim">'+(tm!==null?Math.round(tm)+'%':'\u2014')+'</td>'+
            '<td class="n '+(x.sgColpo>=0?'pos':'neg')+'">'+sgn(x.sgColpo,3)+'</td></tr>';}).join('')+
        '</tbody></table><div class="stcap">La colonna Tour e\u2019 la percentuale di imbucata PGA Tour al centro '+
        'della fascia (tabella validata, interpolata). Lo SG dice quanto costa, l\u2019imbucata dice cosa succede: '+
        'insieme si leggono meglio che da soli.</div></div>'));
    }
    // Derivate dalla sequenza gia' registrata: tre-putt per fascia di primo
    // putt e leave dopo il primo putt lungo. Riferimenti Tour dichiarati.
    if(completi.length){
      const PD=statPuttDerivato(completi);
      if(PD.fasce.length){
        p1.appendChild(el('<div class="card"><h2>Tre-putt per distanza del primo putt</h2>'+
          '<div class="hint">Distingue il lag debole dal putt corto fragile. Riferimento Tour: 9,5% di tre-putt '+
          'quando il primo putt parte da oltre 25 piedi (7,6 m); l\u201983% dei tre-putt del Tour parte da oltre 9,75 m.</div>'+
          '<table class="stat"><thead><tr><th>Primo putt da</th><th class="n">Buche</th>'+
            '<th class="n">Tre putt</th><th class="n">Imbucato al primo</th></tr></thead><tbody>'+
          PD.fasce.map(x=>'<tr'+(x.buche>=N_MIN_FASCIA?'':' style="opacity:.5"')+'><td>'+x.label+'</td>'+
            '<td class="n">'+x.buche+'</td>'+
            '<td class="n">'+Math.round(100*x.tre/x.buche)+'%</td>'+
            '<td class="n">'+Math.round(100*x.uno/x.buche)+'%</td></tr>').join('')+
          '</tbody></table>'+
          (PD.leave.n>=5?'<div class="stcap"><b>Leave dopo il primo putt da oltre 8 m:</b> '+
            PD.leave.media.toFixed(2).replace('.',',')+' m di media su '+PD.leave.n+' putt'+
            (PD.leave.sd!==null?' (scarto tipo '+PD.leave.sd.toFixed(2).replace('.',',')+')':'')+
            '. Riferimento Tour: 0,69 m. E\u2019 la stessa metrica del protocollo P3 di allenamento, letta in gara: '+
            'il ponte allenamento\u2013gara sul putting.</div>'
          :'<div class="stcap">Il leave dopo il primo putt lungo compare da cinque putt oltre gli 8 m in avanti.</div>')+
          '</div>'));
      }
    }
  }

  /* ================= 2. PUNTEGGIO E BASE ================= */
  const p2=el('<div class="pane"></div>');
  const diffs=A.map(g=>g.calc.score-g.calc.par);
  const sdDiff=scartoTipo(diffs);
  const cAnd=el('<div class="card"><h2>Andamento del punteggio</h2></div>');
  if(nG>=8){
    cAnd.appendChild(el('<div class="hint">Colpi sopra o sotto il par, giro per giro. Piu’ la linea scende, meglio e’. '+
      'Scarto tipo misurato: '+(sdDiff!==null?sdDiff.toFixed(1):'—')+' colpi.</div>'));
    cAnd.appendChild(el(svgLinea(A.map((g,i)=>({x:etichette[i], y:diffs[i], se:sdDiff!==null?sdDiff/Math.sqrt(nG):0})),
      {h:112, zero:true, banda:true, colore:'var(--dv-blue)', fmt:v=>sgn(v,0), aria:'punteggio sul par nel tempo'})));
  } else {
    cAnd.appendChild(el(nonLeggibile(sdDiff, 2.0, nG, 'Sotto gli otto giri la linea non dice nulla che il caso non spieghi.')));
  }
  p2.appendChild(cAnd);

  const maxAbs=Math.max(1,...diffs.map(Math.abs));
  const cd=el('<div class="card"><h2>Punteggio rispetto al par</h2>'+
    '<div class="hint">Un giro per riga, dal piu’ vecchio al piu’ recente.</div></div>');
  A.forEach((g,i)=>{
    const d=diffs[i], w=Math.abs(d)/maxAbs*50;
    const st=d>0?'left:50%;width:'+w+'%;background:var(--dv-red);':d<0?'right:50%;width:'+w+'%;background:var(--dv-blue);':'left:calc(50% - 2px);width:4px;background:var(--dv-neutral);';
    cd.appendChild(el('<div class="dvrow"><div class="d">'+etichette[i]+'</div>'+
      '<div class="dvtrack"><div class="zero"></div><div class="dvbar" style="'+st+'"></div></div>'+
      '<div class="n">'+(d===0?'PAR':sgn(d,0))+'</div></div>'));
  });
  p2.appendChild(cd);

  p2.appendChild(el('<div class="card"><h2>Andamento di green e putt</h2>'+
    '<div class="smgrid">'+
      boxTrend('Green in regulation', A.map((g,i)=>({x:etichette[i], y:100*g.calc.gir/g.calc.nBuche})),
        'var(--dv-aqua)', {zero:false, fmt:v=>Math.round(v)+'%'})+
      boxTrend('Putt per buca', A.map((g,i)=>({x:etichette[i], y:g.calc.putt/g.calc.nBuche})),
        'var(--dv-orange)', {zero:false, fmt:v=>v.toFixed(2)})+
    '</div></div>'));

  let eagle=0,birdie=0,parc=0,bogey=0,doppio=0;
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    if(b.diff<=-2)eagle++; else if(b.diff===-1)birdie++; else if(b.diff===0)parc++;
    else if(b.diff===1)bogey++; else doppio++;}));
  const sotto=eagle+birdie, sopra=bogey+doppio, pc=v=>v/totB*100;
  p2.appendChild(el('<div class="card"><h2>Come si chiudono le buche</h2>'+
    '<div class="hint">Su '+totB+' buche giocate.</div>'+
    '<div class="legend"><span class="it"><span class="sw" style="background:var(--dv-blue)"></span>Sotto par</span>'+
      '<span class="it"><span class="sw" style="background:var(--dv-neutral)"></span>Par</span>'+
      '<span class="it"><span class="sw" style="background:var(--dv-red)"></span>Sopra par</span></div>'+
    '<div class="strack">'+
      (sotto>0?'<div class="sseg" style="width:'+pc(sotto)+'%;background:var(--dv-blue)"></div>':'')+
      (parc>0?'<div class="sseg" style="width:'+pc(parc)+'%;background:var(--dv-neutral)"></div>':'')+
      (sopra>0?'<div class="sseg" style="width:'+pc(sopra)+'%;background:var(--dv-red)"></div>':'')+'</div>'+
    '<table class="stat" style="margin-top:12px;">'+
      '<thead><tr><th>Risultato</th><th class="n">Buche</th><th class="n">%</th></tr></thead><tbody>'+
      '<tr><td>Eagle o meglio</td><td class="n">'+eagle+'</td><td class="n">'+pc(eagle).toFixed(1)+'%</td></tr>'+
      '<tr><td>Birdie</td><td class="n">'+birdie+'</td><td class="n">'+pc(birdie).toFixed(1)+'%</td></tr>'+
      '<tr><td>Par</td><td class="n">'+parc+'</td><td class="n">'+pc(parc).toFixed(1)+'%</td></tr>'+
      '<tr><td>Bogey</td><td class="n">'+bogey+'</td><td class="n">'+pc(bogey).toFixed(1)+'%</td></tr>'+
      '<tr><td>Doppio o peggio</td><td class="n">'+doppio+'</td><td class="n">'+pc(doppio).toFixed(1)+'%</td></tr>'+
      '</tbody></table></div>'));

  // Conversioni di punteggio: metriche ShotLink a conteggio semplice, che
  // convergono piu' in fretta degli strokes gained e leggono COME si forma il punteggio.
  {
    const CV=statConversioni(A);
    if(CV.buche>=18){
      const pctc=(a,b)=>b>0?Math.round(100*a/b)+'%':'\u2014';
      const penK=Object.keys(CV.doppiPen).sort((a,b)=>CV.doppiPen[b]-CV.doppiPen[a]);
      p2.appendChild(el('<div class="card"><h2>Conversioni</h2>'+
        '<div class="hint">Quattro letture standard del Tour, su '+CV.buche+' buche. Conteggi semplici: '+
        'niente modello, solo definizioni dichiarate.</div>'+
        '<table class="stat"><tbody>'+
        '<tr><td>Conversione birdie <span class="dim">(birdie o meglio sulle buche con GIR)</span></td>'+
          '<td class="n">'+pctc(CV.girBirdie,CV.gir)+'</td><td class="n dim">'+CV.girBirdie+' su '+CV.gir+'</td></tr>'+
        '<tr><td>Bogey o peggio</td><td class="n">'+pctc(CV.bogeyPeggio,CV.buche)+'</td>'+
          '<td class="n dim">'+CV.bogeyPeggio+' buche</td></tr>'+
        '<tr><td>Doppio o peggio</td><td class="n">'+pctc(CV.doppioPeggio,CV.buche)+'</td>'+
          '<td class="n dim">'+CV.doppioPeggio+' buche</td></tr>'+
        '<tr><td>Bounce back <span class="dim">(birdie o meglio subito dopo un over par)</span></td>'+
          '<td class="n">'+pctc(CV.bounceOk,CV.bounceOpp)+'</td><td class="n dim">'+CV.bounceOk+' su '+CV.bounceOpp+'</td></tr>'+
        '<tr><td>Reverse bounce back <span class="dim">(bogey o peggio subito dopo un birdie)</span></td>'+
          '<td class="n">'+pctc(CV.revKo,CV.revOpp)+'</td><td class="n dim">'+CV.revKo+' su '+CV.revOpp+'</td></tr>'+
        '<tr><td>Par breakers <span class="dim">(buche sotto il par)</span></td>'+
          '<td class="n">'+(CV.parBreakers!==null?CV.parBreakers.toFixed(1)+'%':'\u2014')+'</td>'+
          '<td class="n dim">'+CV.birdiePiu+' buche</td></tr>'+
        '<tr><td>Rapporto birdie / bogey+</td>'+
          '<td class="n">'+(CV.rapporto!==null?CV.rapporto.toFixed(2).replace('.',','):'\u2014')+'</td>'+
          '<td class="n dim">'+CV.birdiePiu+' : '+CV.bogeyPeggio+'</td></tr>'+
        '</tbody></table>'+
        (CV.doppioPeggio>0 && penK.length ?
          '<div class="stcap"><b>Da dove vengono i doppi:</b> '+
          penK.map(k=>CV.doppiPen[k]+' con penalita\u2019 \u201c'+esc(k)+'\u201d').join(' \u00b7 ')+
          '. Broadie: i dilettanti perdono dal livello superiore piu\u2019 per le buche disastro che per i birdie mancati.</div>'
          :'')+'</div>'));
    }
  }
  if(completi.length){
    const P5=statPar5(completi);
    if(P5.go.n+P5.lay.n>=6){
      const riga=(nome,x)=>'<tr><td>'+nome+'</td><td class="n">'+x.n+'</td>'+
        '<td class="n '+(x.n&&x.score/x.n<=0?'pos':'neg')+'">'+(x.n?sgn(x.score/x.n,2):'\u2014')+'</td>'+
        '<td class="n">'+(x.n?Math.round(100*x.bird/x.n)+'%':'\u2014')+'</td></tr>';
      p2.appendChild(el('<div class="card"><h2>Par 5: andare o non andare</h2>'+
        '<div class="hint">Regola dichiarata, euristica: <b>secondo colpo giocato da oltre 200 m che finisce in green '+
        'o entro 40 m = tentativo di andare</b>. \u00c8 la categoria \u201cGoing for the Green\u201d di ShotLink, '+
        'ricavata dalle distanze gia\u2019 registrate.</div>'+
        '<table class="stat"><thead><tr><th></th><th class="n">Buche</th><th class="n">Sul par</th>'+
          '<th class="n">Birdie+</th></tr></thead><tbody>'+
        riga('Vai',P5.go)+riga('Appoggi',P5.lay)+
        '</tbody></table>'+
        '<div class="stcap">'+((P5.go.n>=10&&P5.lay.n>=10)?'':'Numeri piccoli: e\u2019 un orientamento, non una misura. ')+
        (P5.fuoriRegola?P5.fuoriRegola+' secondi colpi da 200 m o meno sono fuori dalla regola e non contati. ':'')+
        'E\u2019 la prima analisi di strategia dell\u2019app: il passo successivo e\u2019 la simulazione con '+
        'l\u2019ellisse di dispersione.</div></div>'));
    }
  }
  // v10: la card "Precisione dal tee e bunker" e' confluita nella scheda Base (FIR e sand save).

  const perTipo=statPerTipo(A);
  if(perTipo.length>1) p2.appendChild(el('<div class="card"><h2>Per tipo di giro</h2>'+
    '<div class="hint">Se il numero in gara e’ peggiore dell’allenamento, il problema non e’ tecnico. '+
    'Ma guarda l’errore standard prima di concludere.</div>'+
    '<table class="stat"><thead><tr><th>Tipo</th><th class="n">Giri</th>'+
      '<th class="n">Sul par</th><th class="n">SG medio</th></tr></thead><tbody>'+
      perTipo.map(t=>'<tr><td>'+esc(t.tipo)+'</td><td class="n">'+t.n+'</td>'+
        '<td class="n">'+sgn(t.mediaPar,1)+'</td>'+
        '<td class="n '+(t.mediaSg===null?'':(t.mediaSg>=0?'pos':'neg'))+'">'+(t.mediaSg===null?'—':sgn(t.mediaSg,1))+'</td></tr>').join('')+
    '</tbody></table></div>'));

  const perCond=statCondizioni(A);
  if(perCond.length>1) p2.appendChild(el('<div class="card"><h2>Per condizioni di vento</h2>'+
    '<div class="hint">Serviranno due stagioni prima che questa tabella dica qualcosa di solido: '+
    'e’ un investimento a scadenza lunga, non un’analisi.</div>'+
    '<table class="stat"><thead><tr><th>Vento</th><th class="n">Giri</th><th class="n">Sul par</th>'+
      '<th class="n">SG medio</th></tr></thead><tbody>'+
      perCond.map(t=>'<tr><td>'+esc(t.nome)+'</td><td class="n">'+t.n+'</td>'+
        '<td class="n">'+sgn(t.mediaPar,1)+'</td>'+
        '<td class="n">'+(t.mediaSg===null?'—':sgn(t.mediaSg,1))+'</td></tr>').join('')+
    '</tbody></table></div>'));

  const cSel=[...new Set(sel.map(g=>g.circolo))];
  if(cSel.length===1){
    const pbAll=statPerBuca(A);
    const pb=pbAll.filter(x=>x.contratta>0).slice(0,6);
    const cb=el('<div class="card"><h2>Buche che costano di piu’</h2>'+
      '<div class="hint">Su '+esc(cSel[0])+'. Il valore mostrato e’ <b>contratto verso la media</b>: '+
      'ordinare per media grezza e troncare in cima seleziona le buche piu’ rumorose, non le piu’ difficili. '+
      'Con poche osservazioni la buca resta vicina alla media generale; man mano che i giri crescono emerge il suo valore proprio.</div></div>');
    if(!pb.length) cb.appendChild(el('<div class="hint">Nessuna buca sopra la media dopo la contrazione.</div>'));
    else { const mx=Math.max(...pb.map(x=>x.contratta));
      pb.forEach(x=>cb.appendChild(el('<div class="hbrow wide">'+
        '<div class="l">Buca '+x.buca+' <span style="opacity:.7">· par '+x.par+'</span></div>'+
        '<div class="hbtrack"><div class="hbfill" style="width:'+(x.contratta/mx*100)+'%;background:var(--dv-red)"></div></div>'+
        '<div class="n">+'+x.contratta.toFixed(2)+'</div></div>')));
      cb.appendChild(el('<table class="stat" style="margin-top:10px"><thead><tr><th>Buca</th>'+
        '<th class="n">Giri</th><th class="n">Media grezza</th><th class="n">Contratta</th></tr></thead><tbody>'+
        pb.map(x=>'<tr><td>Buca '+x.buca+'</td><td class="n">'+x.n+'</td>'+
          '<td class="n dim">'+sgn(x.diffMedia,2)+'</td><td class="n">'+sgn(x.contratta,2)+'</td></tr>').join('')+
        '</tbody></table>'));
    }
    p2.appendChild(cb);
  } else {
    p2.appendChild(el('<div class="card"><h2>Buche che costano di piu’</h2>'+
      '<div class="hint">Seleziona un singolo circolo: confrontare la "buca 7" di campi diversi non avrebbe senso.</div></div>'));
  }

  /* ================= 3. BASTONI ================= */
  const p3=el('<div class="pane"></div>');
  const bast=statBastoni(sel);
  if(!bast.length){
    p3.appendChild(el('<div class="card"><h2>Bastoni</h2><div class="hint">Nessun colpo registrato.</div></div>'));
  } else {
    const conD=bast.filter(b=>b.distMedia!==null && b.bastone!=='Putter');
    const copTot = conD.reduce((s,b)=>s+b.esatti,0), stimTot=conD.reduce((s,b)=>s+b.stimati,0);
    const copPct = (copTot+stimTot)? Math.round(100*copTot/(copTot+stimTot)) : 0;
    p3.appendChild(el('<div class="card"><h2>Come si legge questo pannello</h2>'+
      '<div class="metodo">La distanza mostrata e’ la <b>distanza percorsa dalla palla</b>, non l’avanzamento verso '+
      'la buca. Sono due cose diverse: la distanza dalla buca e’ radiale e non segnata, quindi la vecchia differenza '+
      'fra due raggi registrava come piu’ corta ogni palla finita oltre la bandiera o di lato. Con il settore di esito '+
      'la componente longitudinale si somma invece di sottrarsi.<br><br>'+
      'Copertura attuale del settore: <b>'+copPct+'%</b> dei colpi misurati ('+copTot+' su '+(copTot+stimTot)+'). '+
      'I colpi senza settore che finiscono lontano dalla buca sono comunque esatti, perche’ li’ l’errore geometrico '+
      'e’ di secondo ordine; quelli vicini alla buca senza settore restano sottostimati.</div></div>'));

    const mx=Math.max(...bast.map(b=>b.usi));
    const cbs=el('<div class="card"><h2>Quanto usi ogni bastone</h2>'+
      '<div class="hint">Numero di colpi nel periodo selezionato.</div></div>');
    bast.forEach(b=>cbs.appendChild(el('<div class="hbrow">'+
      '<div class="l">'+esc(b.bastone)+'</div>'+
      '<div class="hbtrack"><div class="hbfill" style="width:'+(b.usi/mx*100)+'%"></div></div>'+
      '<div class="n">'+b.usi+'</div></div>')));
    p3.appendChild(cbs);

    if(conD.length){
      const maxD=Math.max(...conD.map(b=>b.dMax||0));
      const cr=el('<div class="card"><h2>Distanza percorsa e dispersione</h2>'+
        '<div class="hint">Il punto e’ la media, la barra chiara va dal 10° al 90° percentile: piu’ e’ larga, '+
          'meno il bastone e’ prevedibile.</div></div>');
      conD.forEach(b=>{
        const lo=(b.p10!==null?b.p10:b.dMin)||0, hi=(b.p90!==null?b.p90:b.dMax)||0;
        cr.appendChild(el('<div class="rngrow">'+
          '<div class="l">'+esc(b.bastone)+'</div>'+
          '<div class="rngtrack">'+
            '<div class="rngline" style="left:0;right:0"></div>'+
            '<div class="rngspan" style="left:'+(lo/maxD*100)+'%;width:'+Math.max(1,(hi-lo)/maxD*100)+'%"></div>'+
            '<div class="rngdot" style="left:'+(b.distMedia/maxD*100)+'%"></div>'+
          '</div>'+
          '<div class="n">'+b.distMedia+' m</div></div>'));
      });
      cr.appendChild(el('<div class="stcap">La colonna <b>Lavoro</b> e\u2019 il <b>70\u00b0 percentile</b> delle '+
        'distanze percorse: e\u2019 la distanza da usare per SCEGLIERE il bastone. La media e\u2019 il numero '+
        'sbagliato per quello, perche\u2019 la tirano giu\u2019 i colpi mal colpiti \u2014 Arccos usa lo stesso '+
        'criterio e lo chiama Smart Distance. Compare da cinque colpi misurati in su.</div>'));
      cr.appendChild(el('<details class="numeri"><summary>vedi i numeri</summary><table class="stat">'+
        '<thead><tr><th>Bastone</th><th class="n">Colpi</th><th class="n">Media</th>'+
          '<th class="n">Lavoro</th><th class="n">Lungo</th><th class="n">Lato</th></tr></thead><tbody>'+
        conD.map(b=>'<tr><td>'+esc(b.bastone)+'</td><td class="n">'+b.nMis+'</td>'+
          '<td class="n dim">'+b.distMedia+'</td>'+
          '<td class="n"><b>'+(b.p70!==null?b.p70+' m':'—')+'</b></td>'+
          '<td class="n">'+(b.disp!==null?'± '+b.disp:'—')+'</td>'+
          '<td class="n">'+(b.latDisp!==null?'± '+b.latDisp:'—')+'</td></tr>').join('')+
        '</tbody></table></details>'+
        '<div class="stcap">"Lungo" e’ lo scarto tipo della distanza percorsa, "Lato" quello dello scostamento '+
        'laterale: la seconda colonna esiste solo grazie al settore di esito e si riempie da tre giri in avanti. '+
        'La dispersione compare da 3 colpi, i percentili da 5.</div>'));
      p3.appendChild(cr);

      // ellisse per il bastone con piu' dati laterali
      const conLat = conD.filter(b=>b.latDisp!==null && b.disp!==null && b.nLat>=8)
        .sort((a,b)=>b.nLat-a.nLat);
      if(conLat.length){
        const b0=conLat[0];
        p3.appendChild(el('<div class="card"><h2>Ellisse di arrivo — '+esc(b0.bastone)+'</h2>'+
          '<div class="hint">Dove finiscono le palle rispetto alla bandiera, su '+b0.nLat+' colpi con settore. '+
          'L’ellisse interna contiene circa due terzi dei colpi, quella esterna circa il 95%.</div>'+
          svgEllisse(b0.disp, b0.latDisp, b0.distMedia)+
          '<div class="stcap">Dispersione lunga ± '+b0.disp+' m, laterale ± '+b0.latDisp+' m. '+
          'E’ la lettura che serve per scegliere il bersaglio: un bastone preciso in distanza ma largo di lato '+
          'chiede una linea diversa da uno che sbaglia solo in avanti e indietro.</div></div>'));
      }
    }

    const serieDrv=sel.map(g=>{
      const vals=[];
      (g.buche||[]).forEach(b=>(b.colpi||[]).forEach((c,i)=>{
        if(c.bastone!=='Driver') return;
        const p=percorsaColpo(b.colpi,i);
        if(p && p.d>0) vals.push(p.d);
      }));
      return {data:g.data, media:vals.length?media(vals):null};
    }).filter(x=>x.media!==null);
    if(serieDrv.length>=3){
      p3.appendChild(el('<div class="card"><h2>Andamento del driver</h2>'+
        '<div class="hint">Distanza media percorsa dal drive, giro per giro. Su questo bastone la vecchia formula '+
        'era gia’ quasi esatta: quando la palla si ferma lontano dalla buca l’errore geometrico e’ di due metri.</div>'+
        svgLinea(serieDrv.map(x=>({x:fmtDataBreve(x.data), y:x.media})),
          {h:112, zero:false, colore:'var(--dv-blue)', fmt:v=>Math.round(v)+' m', aria:'distanza media del driver nel tempo'})+'</div>'));
    }
  }

  /* ================= 4. DOVE FINISCE ================= */

  const esTot=statEsiti(sel, null), esPutt=statEsitiPutt(sel);
  const esGioco={conte:{}, tot:0};
  ESITI.forEach(e=>esGioco.conte[e.k]=(esTot.conte[e.k]||0)-(esPutt.conte[e.k]||0));
  esGioco.tot=esTot.tot-esPutt.tot;
  if(!esTot.tot){
    p1.appendChild(el('<div class="card"><h2>Dove finisce la palla</h2>'+
      '<div class="hint">Il settore di esito e’ la novita’ di questa versione: si chiede al momento di inserire '+
      'il colpo successivo, sui colpi che finiscono entro '+ESITO_SOGLIA_M+' metri dalla buca e su ogni putt non '+
      'imbucato. Da qui nascono la distanza vera per bastone e la dispersione laterale, che prima non esisteva. '+
      'Questa schermata si riempie dal prossimo giro.</div></div>'));
  } else {
    p1.appendChild(el('<div class="card"><h2>Colpi verso il green</h2>'+
      '<div class="hint">Su '+esGioco.tot+' colpi con settore registrato. Se una casella domina, hai una tendenza: '+
      'e’ l’informazione che la sola distanza dalla buca non poteva darti.</div>'+
      grigliaEsitiHtml(esGioco.conte, esGioco.tot)+
      (esGioco.tot<30?'<div class="stcap">Sotto i trenta colpi le percentuali ballano molto. Torna qui fra qualche giro.</div>':'')+
      '</div>'));
    if(esPutt.tot){
      const corti=(esPutt.conte.C||0)+(esPutt.conte.CS||0)+(esPutt.conte.CD||0);
      const lunghi=(esPutt.conte.L||0)+(esPutt.conte.LS||0)+(esPutt.conte.LD||0);
      const sx=(esPutt.conte.S||0)+(esPutt.conte.CS||0)+(esPutt.conte.LS||0);
      const dx=(esPutt.conte.D||0)+(esPutt.conte.CD||0)+(esPutt.conte.LD||0);
      p1.appendChild(el('<div class="card"><h2>Putt non imbucati</h2>'+
        '<div class="hint">Su '+esPutt.tot+' putt con settore. La distanza residua era gia’ registrata; il settore '+
        'aggiunge la direzione dell’errore, che e’ quello che si allena.</div>'+
        grigliaEsitiHtml(esPutt.conte, esPutt.tot)+
        '<table class="stat" style="margin-top:12px"><tbody>'+
          '<tr><td>Corti</td><td class="n">'+Math.round(100*corti/esPutt.tot)+'%</td>'+
            '<td>Lunghi</td><td class="n">'+Math.round(100*lunghi/esPutt.tot)+'%</td></tr>'+
          '<tr><td>A sinistra</td><td class="n">'+Math.round(100*sx/esPutt.tot)+'%</td>'+
            '<td>A destra</td><td class="n">'+Math.round(100*dx/esPutt.tot)+'%</td></tr>'+
        '</tbody></table>'+
        '<div class="stcap">Un putting che lascia corto in modo sistematico e uno che sbaglia sempre dallo stesso '+
        'lato sono due problemi diversi e si allenano in due modi diversi.</div></div>'));
    }
  }

  /* lato del colpo dal tee (v8): la dimensione del drive che la griglia entro
     40 m non puo' coprire. Facoltativo: qui si vede anche la copertura. */
  {
    const LT=statLatoTee(sel);
    if(LT.opp>0){
      if(!LT.tot){
        p1.appendChild(el('<div class="card"><h2>Dove finisce il drive</h2>'+
          '<div class="hint">Novita\u2019 dello schema v8: sul colpo dal tee dei par 4 e 5 puoi segnare il lato '+
          '(sinistra / centro / destra), un tocco facoltativo o una lettera sulla carta. Da qui nasceranno la '+
          'dispersione del driver e la scelta della linea. Questa scheda si riempie dal prossimo giro.</div></div>'));
      } else {
        const mxL=Math.max(LT.conte.S,LT.conte.C,LT.conte.D,1);
        const rig=(k,nome)=>{
          const v=LT.conte[k], fwp=v?Math.round(100*LT.fw[k]/v):0;
          return '<div class="hbrow wide"><div class="l">'+nome+'</div>'+
            '<div class="hbtrack"><div class="hbfill" style="width:'+(v/mxL*100)+'%"></div></div>'+
            '<div class="n">'+Math.round(100*v/LT.tot)+'% <span class="dim" style="font-size:10px">('+v+')</span></div></div>'+
            (v>=8?'<div class="hint tight" style="margin:-2px 0 6px 2px">di cui in fairway: '+fwp+'%</div>':'');
        };
        const dom = ['S','C','D'].sort((a,b)=>LT.conte[b]-LT.conte[a])[0];
        const domPct = Math.round(100*LT.conte[dom]/LT.tot);
        p1.appendChild(el('<div class="card"><h2>Dove finisce il drive</h2>'+
          '<div class="verd" style="font-size:14px">'+(domPct>=45 && dom!=='C'
            ? 'Il drive manca soprattutto a '+(dom==='S'?'sinistra':'destra')+' ('+domPct+'%).'
            : 'Nessun lato domina in modo netto.')+'</div>'+
          '<div class="legg">copertura <b>'+Math.round(100*LT.tot/LT.opp)+'%</b> \u00b7 '+LT.tot+' drive su '+LT.opp+' occasioni</div>'+
          rig('S','Sinistra')+rig('C','Centro')+rig('D','Destra')+
          '<div class="stcap">Con il lato, il lie di arrivo e l\u2019avanzamento gia\u2019 registrati, la dispersione '+
          'del driver si ricostruisce con l\u2019approssimazione che serve alla scelta della linea (metodo DECADE). '+
          'Sotto i 30 drive le percentuali ballano.</div></div>'));
      }
    }
  }

  /* ================= 5. INCROCI ================= */

  const QV = completi.length ? statQuotaVarianza(completi) : null;
  const cQV=el('<div class="card"><h2>Quanto pesa ogni reparto</h2></div>');
  if(!QV){
    cQV.appendChild(el('<div class="hint">Servono almeno sei giri con il dettaglio colpo per colpo. '+
      'Al momento ne hai '+completi.length+'.</div>'));
  } else {
    const topQ=QV.cats.slice().sort((a,b)=>QV.quote[b].quota-QV.quote[a].quota)[0];
    cQV.appendChild(el('<div class="verd" style="font-size:14px">Il '+Math.round(QV.quote[topQ].quota*100)+
      '% della variabilita\u2019 dei tuoi punteggi passa da '+CAT_NOME[topQ].toLowerCase()+'.</div>'));
    const mxq=Math.max(...QV.cats.map(c=>Math.abs(QV.quote[c].quota)));
    cQV.appendChild(el('<div class="hint">Quota della <b>variabilita’ del tuo risultato</b> che passa da ciascun reparto, '+
      'su '+QV.n+' giri. Le quattro quote sommano a 100% per identita’ algebrica.<br><br>'+
      'Questo pannello sostituisce il vecchio confronto fra i giri migliori e i peggiori. Quel confronto divideva i '+
      'giri <i>per punteggio</i> e poi confrontava le categorie che compongono il punteggio: condizionava sulla '+
      'variabile dipendente, e vinceva sempre la categoria piu’ rumorosa a prescindere da cosa determinasse '+
      'davvero una buona giornata.</div>'));
    QV.cats.forEach(c=>{
      const q=QV.quote[c].quota, w=Math.abs(q)/mxq*92;
      cQV.appendChild(el('<div class="hbrow wide">'+
        '<div class="l">'+CAT_NOME[c]+'</div>'+
        '<div class="hbtrack"><div class="hbfill" style="width:'+w+'%;background:'+(q>=0?'var(--dv-blue)':'var(--dv-red)')+'"></div></div>'+
        '<div class="n">'+Math.round(q*100)+'%</div></div>'));
    });
    const top=QV.cats.slice().sort((a,b)=>QV.quote[b].quota-QV.quote[a].quota)[0];
    cQV.appendChild(el('<details class="numeri"><summary>vedi i numeri</summary><table class="stat"><thead><tr><th>Reparto</th>'+
      '<th class="n">Quota</th><th class="n">Media</th></tr></thead><tbody>'+
      QV.cats.map(c=>'<tr><td>'+CAT_NOME[c]+'</td><td class="n">'+Math.round(QV.quote[c].quota*100)+'%</td>'+
        '<td class="n '+(QV.quote[c].media>=0?'pos':'neg')+'">'+sgn(QV.quote[c].media,2)+'</td></tr>').join('')+
      '</tbody></table></details>'+
      '<div class="stcap">Il <b>'+Math.round(QV.quote[top].quota*100)+'%</b> della variabilita’ dei tuoi '+
      'punteggi passa da <b>'+CAT_NOME[top]+'</b>. Vuol dire che e’ il reparto che muove di piu’ il risultato, '+
      'non necessariamente quello da allenare per primo: per quello conta la media, che trovi nella colonna accanto. '+
      '</div>'));
  }
  p0.appendChild(cQV);

  const PP2 = completi.length ? statPeriodi(completi) : null;
  if(PP2){
    const leggiP=PP2.cats.filter(c=>PP2.per[c].leggibile);
    const verdP = leggiP.length
      ? 'Fra le due meta\u2019 e\u2019 cambiato qualcosa di leggibile: '+leggiP.map(c=>CAT_NOME[c].toLowerCase()).join(', ')+'.'
      : 'Nessuna differenza leggibile fra le due meta\u2019 del periodo.';
    p0.appendChild(el('<div class="card"><h2>Sto cambiando? Prima meta’ contro seconda</h2>'+
      '<div class="verd" style="font-size:14px">'+verdP+'</div>'+
      '<div class="hint">Divisione <b>per data</b>, non per punteggio: il criterio non dipende dal risultato, '+
      'quindi qui non c’e’ artefatto. '+PP2.k+' giri per lato, dal '+fmtData(PP2.daA)+' al '+fmtData(PP2.aA)+
      ' contro dal '+fmtData(PP2.daB)+' al '+fmtData(PP2.aB)+'.</div>'+
      '<table class="stat"><thead><tr><th>Reparto</th><th class="n">Prima</th><th class="n">Dopo</th>'+
        '<th class="n">Differenza</th><th class="n">Leggibile?</th></tr></thead><tbody>'+
      PP2.cats.map(c=>{
        const x=PP2.per[c];
        return '<tr><td>'+CAT_NOME[c]+'</td><td class="n dim">'+sgn(x.prima,1)+'</td>'+
          '<td class="n dim">'+sgn(x.dopo,1)+'</td>'+
          '<td class="n '+(x.delta>=0?'pos':'neg')+'">'+sgn(x.delta,2)+'</td>'+
          '<td class="n" style="font-size:11px">'+(x.leggibile?'<span class="badge ok">si</span>':
            '<span class="dim">no, servono ~'+(x.servono||'—')+'/lato</span>')+'</td></tr>';
      }).join('')+'</tbody></table>'+
      '<div class="stcap">"Leggibile" significa che la differenza supera due errori standard. Sotto quella soglia '+
      'non e’ distinguibile dal caso, per quanto il numero sembri grande.</div></div>'));
  }

  if(completi.length){
    const DT=statDaTee(completi);
    if(DT.length){
      const mxA=Math.max(...DT.map(x=>Math.abs(x.media)),0.3);
      p2.appendChild(el('<div class="card"><h2>Quanto costa mancare il fairway</h2>'+
        '<div class="hint">Par 4 e 5, raggruppati per dove finisce il colpo dal tee.</div>'+
        DT.map(x=>{
          const w=Math.abs(x.media)/mxA*50;
          const st=x.media>0?'left:50%;width:'+w+'%;background:var(--dv-red);'
                :x.media<0?'right:50%;width:'+w+'%;background:var(--dv-blue);'
                :'left:calc(50% - 2px);width:4px;background:var(--dv-neutral);';
          return '<div class="dvrow"><div class="d">'+(LIE_NOME[x.lie]||x.lie)+'</div>'+
            '<div class="dvtrack"><div class="zero"></div><div class="dvbar" style="'+st+'"></div></div>'+
            '<div class="n">'+sgn(x.media,2)+'</div></div>';}).join('')+
        '<table class="stat" style="margin-top:12px">'+
          '<thead><tr><th>Dove arriva</th><th class="n">Buche</th><th class="n">Sul par</th>'+
            '<th class="n">Green</th></tr></thead><tbody>'+
          DT.map(x=>'<tr><td>'+(LIE_NOME[x.lie]||x.lie)+'</td><td class="n">'+x.n+'</td>'+
            '<td class="n">'+sgn(x.media,2)+'</td>'+
            '<td class="n">'+Math.round(x.girPct)+'%</td></tr>').join('')+
        '</tbody></table></div>'));
    }
  }

  const PP=statPerPar(A);
  if(PP.length){
    p2.appendChild(el('<div class="card"><h2>Rendimento per tipo di buca</h2>'+
      '<div class="hint">I par 5 sono occasioni, i par 3 no: separarli dice dove stai lasciando colpi.</div>'+
      '<table class="stat"><thead><tr><th>Buca</th><th class="n">N</th><th class="n">Sul par</th>'+
        '<th class="n">Scr.</th><th class="n">Birdie+</th><th class="n">Green</th></tr></thead><tbody>'+
        PP.map(x=>{
          const rs=RIF_SCRATCH.par[x.par];
          let bp=0, nb=0;
          A.forEach(g=>g.bucheCalc.forEach(b=>{ if(b.par===x.par){ nb++; if(b.diff<=-1) bp++; } }));
          return '<tr><td>Par '+x.par+'</td><td class="n">'+x.n+'</td>'+
          '<td class="n '+(x.media<=0?'pos':'neg')+'">'+sgn(x.media,2)+'</td>'+
          '<td class="n dim">'+(rs!==undefined?sgn(rs-x.par,1):'\u2014')+'</td>'+
          '<td class="n pos">'+(nb?Math.round(100*bp/nb):0)+'%</td>'+
          '<td class="n">'+Math.round(x.girPct)+'%</td></tr>';}).join('')+
      '</tbody></table><div class="stcap">La colonna <b>Scr.</b> e\u2019 il giocatore scratch secondo Shot Scope: '+
      'par 3 3,2 \u00b7 par 4 4,2 \u00b7 par 5 4,8, qui espressi sul par. Numerosita\u2019 non dichiarata dalla '+
      'fonte.</div></div>'));
  }

  const BL=statBlocchi(A);
  if(BL.nGiri>0){
    const b=BL.blocchi, cf=BL.confronto;
    let cap;
    if(!cf) cap='Servono almeno tre giri da 18 buche per confrontare i blocchi.';
    else if(cf.leggibile) cap='Il tratto piu’ costoso e’ <b>'+cf.peggio.nome+'</b> ('+sgn(cf.peggio.sgGiro,2)+
      ' di strokes gained per giro), il migliore e’ <b>'+cf.meglio.nome+'</b> ('+sgn(cf.meglio.sgGiro,2)+
      '). La differenza e’ '+cf.delta.toFixed(2)+' contro un errore standard di '+cf.se.toFixed(2)+
      ': supera due errori standard, quindi non e’ solo caso.';
    else cap='<b>Nessun blocco si distingue dagli altri.</b> La differenza fra il migliore e il peggiore e’ '+
      cf.delta.toFixed(2)+' colpi contro un errore standard di '+cf.se.toFixed(2)+
      ': dentro il rumore. Servirebbero circa '+(cf.servono||'—')+' giri per dire qualcosa. '+
      'Il giro non si rompe in un punto ricorrente.';
    p2.appendChild(el('<div class="card"><h2>Il giro in sei blocchi da tre buche</h2>'+
      '<div class="hint">La metrica e’ lo <b>strokes gained</b>, non i colpi sopra il par: lo SG e’ gia’ corretto '+
      'per la difficolta’ della buca, mentre confrontare blocchi non appaiati per par e stroke index mescolerebbe '+
      '"quando nel giro" con "quali buche". Su '+BL.nGiri+' giri da 18 buche. Le barrette verticali sono '+
      'due errori standard.</div>'+
      svgBarreDiv(b.map(x=>({x:x.nome, y:x.sgGiro, se:x.sgSe||0})),
        {h:138, banda:true, colPos:'var(--dv-blue)', colNeg:'var(--dv-red)', fmt:v=>sgn(v,1), aria:'strokes gained per blocco'})+
      '<details class="numeri"><summary>vedi i numeri</summary><table class="stat">'+
        '<thead><tr><th>Buche</th><th class="n">SG/giro</th><th class="n">Sul par</th>'+
          '<th class="n">Green</th><th class="n">Putt</th></tr></thead><tbody>'+
        b.map(x=>'<tr><td>'+x.nome+'</td>'+
          '<td class="n '+(x.sgGiro>=0?'pos':'neg')+'">'+sgn(x.sgGiro,2)+'</td>'+
          '<td class="n dim">'+sgn(x.parGiro,1)+'</td>'+
          '<td class="n">'+Math.round(x.girPct)+'%</td>'+
          '<td class="n">'+x.puttB.toFixed(2)+'</td></tr>').join('')+
      '</tbody></table></details>'+
      '<div class="stcap">'+cap+'</div></div>'));
  }

  const NV=statNove(A);
  if(NV.meta.length===2){
    const cf=NV.conf;
    let cap;
    if(!cf) cap='Servono almeno tre giri completi da 18 buche.';
    else if(cf.leggibile) cap='Sulla seconda nove giochi in media <b>'+Math.abs(cf.delta).toFixed(2)+' colpi '+
      (cf.delta>0?'in piu’':'in meno')+'</b> rispetto alla prima. Il confronto e’ appaiato giro per giro, quindi '+
      'tiene conto del fatto che le due meta’ condividono giornata e condizioni. Errore standard '+cf.se.toFixed(2)+
      ': la differenza lo supera di oltre due volte.';
    else cap='<b>Le due meta’ si equivalgono.</b> Differenza di '+cf.delta.toFixed(2)+' colpi contro un errore '+
      'standard di '+cf.se.toFixed(2)+': dentro il rumore. Su '+cf.nGiri+' giri non c’e’ nulla da spiegare.';
    p2.appendChild(el('<div class="card"><h2>Prima nove contro seconda nove</h2>'+
      '<div class="hint">Confronto appaiato: si guarda la differenza <i>dentro ogni giro</i> e poi la si media. '+
      'Trattarle come due campioni indipendenti sovrastimerebbe l’incertezza, perche’ le due meta’ sono giocate '+
      'lo stesso giorno con lo stesso vento.</div>'+
      '<table class="stat"><thead><tr><th></th><th class="n">Buche</th><th class="n">Sul par</th>'+
        '<th class="n">Green</th><th class="n">Putt</th></tr></thead><tbody>'+
        NV.meta.map(x=>'<tr><td>'+x.nome+'</td><td class="n">'+x.n+'</td>'+
          '<td class="n '+(x.media<=0?'pos':'neg')+'">'+sgn(x.media,2)+'</td>'+
          '<td class="n">'+Math.round(x.girPct)+'%</td><td class="n">'+x.puttB.toFixed(2)+'</td></tr>').join('')+
      '</tbody></table>'+
      '<div class="stcap">'+cap+' Solo giri da 18 buche.</div></div>'));
  }

  /* ══ v10 — I PANNELLI NUOVI ═══════════════════════════════════════════════
     Tutti derivati dallo schema v9. Vengono appesi qui e ricollocati per titolo
     dalla mappa piu' sotto, come tutti gli altri.                            */
  if(completi.length){
    /* ── dal tee: good drive, residua, trouble, recupero ── */
    {
      const DR=statDriving(completi);
      if(DR.opp>0){
        const rifRes4=136.5/1;   // 149,1 yd medi dello studio ShotLink, in metri
        p1.appendChild(el('<div class="card"><h2>Dal tee: good drive e distanza residua</h2>'+
          '<div class="hint">Il FIR punisce allo stesso modo il rough a due metri e la palla ingiocabile. '+
          'Il <b>good drive</b> misura cio\u2019 che al drive si chiede davvero: non compromettere la buca.</div>'+
          '<div class="kpigrid">'+
            '<div class="kpi"'+(DR.opp>=N_MIN_FASCIA?'':' style="opacity:.55"')+'><div class="lab">Good drive</div>'+
              '<div class="v">'+(DR.pct!==null?DR.pct.toFixed(0)+'<span class="u">%</span>':'\u2014')+'</div>'+
              '<div class="sub">'+DR.good+' su '+DR.opp+' \u00b7 Tour 82,5%</div></div>'+
            '<div class="kpi"><div class="lab">Drive nei guai</div>'+
              '<div class="v">'+(DR.troubleGiro!==null?DR.troubleGiro.toFixed(1):'\u2014')+'</div>'+
              '<div class="sub">per giro \u00b7 '+DR.trouble+' in totale</div></div>'+
            '<div class="kpi"><div class="lab">Residua par 4</div>'+
              '<div class="v">'+(DR.res4.m!==null?Math.round(DR.res4.m)+'<span class="u">m</span>':'\u2014')+'</div>'+
              '<div class="sub">'+DR.res4.n+' buche \u00b7 Tour 134\u2013139 m</div></div>'+
            '<div class="kpi"><div class="lab">Residua par 5</div>'+
              '<div class="v">'+(DR.res5.m!==null?Math.round(DR.res5.m)+'<span class="u">m</span>':'\u2014')+'</div>'+
              '<div class="sub">'+DR.res5.n+' buche \u00b7 Tour 240\u2013248 m</div></div>'+
          '</div>'+
          '<table class="stat" style="margin-top:10px"><tbody>'+
            '<tr><td>Colpi di recupero per giro</td>'+
              '<td class="n"><b>'+(DR.recGiro!==null?DR.recGiro.toFixed(2).replace('.',','):'\u2014')+'</b></td>'+
              '<td class="n dim" style="font-size:11px">scratch 0,39 nel giro migliore, 1,19 nel peggiore</td></tr>'+
          '</tbody></table>'+
          '<div class="stcap"><b>Good drive:</b> su par 4 e 5, fairway centrati piu\u2019 i casi in cui il drive '+
          'ha mancato il fairway ma la buca e\u2019 arrivata in green in regulation. Un drive con penalita\u2019 '+
          'non e\u2019 mai buono, qualunque sia il lie dopo il drop. Riferimenti Anova Golf: PGA Tour 82,5%, '+
          'college maschile 83%, Pac-12 84,5%.<br><br><b>Distanza residua:</b> quanto resta al buco dopo il drive. '+
          'E\u2019 l\u2019unico numero che fonde distanza e precisione in una cosa sola: due giocatori con lo '+
          'stesso FIR e la stessa distanza media possono avere residue diverse di venti metri. I drive con '+
          'penalita\u2019 sono esclusi. Riferimento: studio ShotLink R09 sul Tour.<br><br><b>Nei guai:</b> drive '+
          'finiti in recupero o con penalita\u2019. <b>Recupero:</b> il campo lo avevamo, ma solo come audit della '+
          'deriva di classificazione in Qualita\u2019 del dato \u2014 la\u2019 controlla il giudice, qui misura '+
          'il gioco. Riferimento Arccos.</div></div>'));
      }
    }
    /* ── quanto rende ogni bastone verso il green ── */
    {
      const BV=statBastoneVerde(completi).filter(x=>x.n>=5);
      if(BV.length) p1.appendChild(el('<div class="card"><h2>Quanto rende ogni bastone verso il green</h2>'+
        '<div class="hint">Non quanto porta, ma quanto rende: green presi e prossimita\u2019 per bastone. '+
        'E\u2019 l\u2019informazione che serve alla scelta, e i dati c\u2019erano gia\u2019.</div>'+
        '<table class="stat"><thead><tr><th>Bastone</th><th class="n">Colpi</th><th class="n">Da</th>'+
          '<th class="n">Green</th><th class="n">Lascia</th><th class="n">SG</th></tr></thead><tbody>'+
        BV.map(x=>'<tr'+(x.solido?'':' style="opacity:.5"')+'><td>'+esc(x.bastone)+'</td>'+
          '<td class="n">'+x.n+'</td>'+
          '<td class="n">'+(x.da!==null?Math.round(x.da)+' m':'\u2014')+'</td>'+
          '<td class="n">'+Math.round(x.greenPct)+'%</td>'+
          '<td class="n">'+(x.prox!==null?x.prox.toFixed(1).replace('.',',')+' m':'\u2014')+'</td>'+
          '<td class="n '+(x.sgColpo>=0?'pos':'neg')+'">'+sgn(x.sgColpo,2)+'</td></tr>').join('')+
        '</tbody></table><div class="stcap">Colpi verso il green (approccio e gioco corto), raggruppati per '+
        'bastone. "Da" e\u2019 la distanza media di partenza, "Lascia" la prossimita\u2019 quando il green viene '+
        'preso. Righe sotto i '+N_MIN_FASCIA+' colpi in grigio. Shot Scope e Arccos mostrano le stesse due '+
        'colonne.</div></div>'));
    }
    /* ── gapping ── */
    {
      const GP=statGapping(statBastoni(sel));
      if(GP.righe.length>=3){
        const col=x=>x.stato==='buco'?'var(--rosso)':(x.stato==='sovrapposti'?'var(--ambra)':'inherit');
        const eti=x=>x.stato==='buco'?'buco':(x.stato==='sovrapposti'?'sovrapposti':'');
        p1.appendChild(el('<div class="card"><h2>Gapping: i salti fra i bastoni</h2>'+
          '<div class="verd" style="font-size:14px">'+(GP.buchi||GP.sovrapposti
            ? (GP.buchi?GP.buchi+(GP.buchi===1?' salto troppo grande':' salti troppo grandi'):'')+
              (GP.buchi&&GP.sovrapposti?' e ':'')+
              (GP.sovrapposti?GP.sovrapposti+(GP.sovrapposti===1?' coppia sovrapposta':' coppie sovrapposte'):'')+'.'
            : 'I salti sono tutti dentro l\u2019intervallo utile.')+'</div>'+
          '<table class="stat"><thead><tr><th>Coppia</th><th class="n">Salto</th><th class="n"></th></tr></thead><tbody>'+
          GP.righe.map(x=>'<tr><td>'+esc(x.a)+' \u2192 '+esc(x.b)+' <span class="dim" style="font-size:10px">('+
            x.p70a+'\u2192'+x.p70b+' m)</span></td>'+
            '<td class="n" style="color:'+col(x)+'"><b>'+Math.round(x.gap)+' m</b></td>'+
            '<td class="n dim" style="font-size:10px">'+eti(x)+'</td></tr>').join('')+
          '</tbody></table>'+
          '<div class="stcap">Salti fra i <b>70\u00b0 percentili</b> di bastoni adiacenti. Intervallo utile '+
          'dichiarato: '+GAP_MIN_M+'\u2013'+GAP_MAX_M+' m (FlightScope consiglia 10\u201315 yard di carry). '+
          '<b>\u26a0 Approssimato, e va detto:</b> noi misuriamo la distanza <i>percorsa</i>, non il carry, quindi '+
          'un bastone che rotola molto sembra piu\u2019 lungo di quanto porta in aria. Serve a vedere buchi e '+
          'sovrapposizioni, non a scegliere le lofts.</div></div>'));
      }
    }
    /* ── bunker: greenside contro fairway ── */
    {
      const BK=statBunker(completi);
      if(BK.greenside.n+BK.fairway.n>0){
        const riga=(nome,o,rifCosto)=>'<tr'+(o.solido?'':' style="opacity:.55"')+'><td>'+nome+'</td>'+
          '<td class="n">'+o.n+'</td>'+
          '<td class="n">'+(o.perGiro!==null?o.perGiro.toFixed(2).replace('.',','):'\u2014')+'</td>'+
          '<td class="n '+((o.costo||0)<=0?'pos':'neg')+'">'+(o.costo!==null?sgn(o.costo,2):'\u2014')+'</td>'+
          '<td class="n dim">'+rifCosto+'</td></tr>';
        p1.appendChild(el('<div class="card"><h2>Bunker: greenside contro fairway</h2>'+
          '<div class="hint">Il sand save conta solo entro le 30 yard, quindi il <b>bunker di fairway non era '+
          'misurato da nessuna parte</b>. Il Tour li separa, e c\u2019e\u2019 un motivo.</div>'+
          '<table class="stat"><thead><tr><th></th><th class="n">Colpi</th><th class="n">/giro</th>'+
            '<th class="n">Costo</th><th class="n">Scr.</th></tr></thead><tbody>'+
          riga('Greenside <span class="dim" style="font-size:10px">(entro 30 yd)</span>', BK.greenside, '+0,43')+
          riga('Di fairway <span class="dim" style="font-size:10px">(oltre 30 yd)</span>', BK.fairway, '+0,19')+
          '</tbody></table>'+
          '<div class="stcap">"Costo" e\u2019 il punteggio medio sul par delle buche in cui e\u2019 finito in quel '+
          'tipo di bunker. Il riferimento Shot Scope ha un esito controintuitivo: per lo <b>scratch</b> il greenside '+
          'costa +0,43 e il fairway solo +0,19, mentre all\u2019handicap 20 si inverte (+0,42 contro +0,55). Al tuo '+
          'livello il problema atteso e\u2019 il greenside \u2014 ma il numero da guardare e\u2019 il tuo. '+
          'Classe del riferimento: dato divulgato senza numerosita\u2019.</div></div>'));
      }
    }
    /* ── chip multipli ── */
    {
      const CM=statChipMultipli(completi);
      if(CM.buche>0) p1.appendChild(el('<div class="card"><h2>Chip multipli entro le 50 yard</h2>'+
        '<div class="hint">Quante volte a giro serve <b>piu\u2019 di un colpo</b> di gioco corto per arrivare in '+
        'green. E\u2019 il complemento esatto dell\u2019up and down, che con la regola "un tentativo per buca" '+
        'esclude per costruzione il secondo chip \u2014 cioe\u2019 il caso peggiore.</div>'+
        '<div class="verd">'+(CM.perGiro!==null?CM.perGiro.toFixed(1).replace('.',','):'\u2014')+
        ' buche per giro con due o piu\u2019 colpi corti</div>'+
        '<div class="legg">'+CM.multi+' buche su '+CM.buche+' \u00b7 '+
        (CM.colpiGiro!==null?CM.colpiGiro.toFixed(1).replace('.',',')+' colpi corti a giro in totale':'')+'</div>'+
        '<div class="stcap">Riferimento Shot Scope per fascia di punteggio: <b>4,1</b> nei giri in 100, <b>3,2</b> '+
        'in 90, <b>2,1</b> in 80, <b>1,2</b> in 70, <b>0,9</b> in 60. Numerosita\u2019 non dichiarata dalla '+
        'fonte.</div></div>'));
    }
