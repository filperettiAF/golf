    '<label style="margin-top:10px;">Nome della gara</label>'+
    '<input type="text" id="e_gara" value="'+esc(g.gara||'')+'" placeholder="facoltativo">'+
  '</div>');
  const nuova={vento:cond.vento, meteo:cond.meteo, green:cond.green};
  [['#e_vento','vento'],['#e_meteo','meteo'],['#e_green','green']].forEach(pair=>{
    const box=cc.querySelector(pair[0]);
    box.onclick=e=>{ const ch=e.target.closest('.chip'); if(!ch) return;
      box.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));
      ch.classList.add('selected'); nuova[pair[1]]=parseInt(ch.dataset.v,10); };
  });
  const sv=el('<button class="btn secondary" style="margin:10px 0 0 0">Salva condizioni</button>');
  sv.onclick=async()=>{ await snapshotSalva('prima di modificare le condizioni');
    g.condizioni=nuova; g.gara=(cc.querySelector('#e_gara').value||'').trim()||null;
    salvaGiro(g); alert('Condizioni salvate.'); };
  cc.appendChild(sv);
  body.appendChild(cc);
  return {header:'Correggi giro', body};
};

VIEWS.modificaBuca = function(p){
  const g=trovaGiro(p.id);
  const body=el('<div></div>');
  if(!g){ body.appendChild(el('<div class="empty">Giro non trovato.</div>')); return {header:'Correggi',body}; }
  const b=g.buche[p.i];
  const bastoni=LS.get('hcp_bastoni_v2',BASTONI_DEFAULT);
  const optLie=v=>LIE_OPZ.map(l=>'<option value="'+l.k+'"'+(l.k===v?' selected':'')+'>'+l.n+'</option>').join('');
  const optBast=v=>bastoni.map(x=>'<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>').join('');
  const optEsito=v=>'<option value="">— settore —</option>'+
    ESITI.map(e=>'<option value="'+e.k+'"'+(e.k===v?' selected':'')+'>'+ESITO_NOME[e.k]+'</option>').join('');
  const optPen=v=>PENALITA_OPZ.map(x=>'<option value="'+x.k+'"'+(x.k===(v||'')?' selected':'')+'>'+x.n+'</option>').join('');

  body.appendChild(el('<div class="card"><h2>Buca '+(p.i+1)+'</h2>'+
    '<div class="row"><div><label>Par</label>'+
      '<select id="mPar">'+[3,4,5,6].map(x=>'<option'+(x===b.par?' selected':'')+'>'+x+'</option>').join('')+'</select></div>'+
      '<div><label>Distanza (m)</label><input type="number" id="mDist" value="'+(b.distanza===null||b.distanza===undefined?'':b.distanza)+'"></div></div>'+
    '<label style="margin-top:8px"><input type="checkbox" id="mCompl" '+(b.completata===false?'':'checked')+
      ' style="width:auto;margin-right:6px">Buca completata</label></div>'));

  const lista=el('<div class="card"><h2>Colpi</h2></div>');
  function ridisegna(){
    lista.querySelectorAll('.colpoRow').forEach(x=>x.remove());
    b.colpi.forEach((c,i)=>{
      const row=el('<div class="colpoRow" style="border-bottom:1px solid var(--bordo);padding:10px 0;">'+
        '<div style="font-size:12px;color:var(--grigio);margin-bottom:6px;font-weight:600;">Colpo '+(i+1)+'</div>'+
        '<div class="row" style="margin-bottom:6px;">'+
          '<div><select class="cLie">'+optLie(c.lie)+'</select></div>'+
          '<div><input type="number" step="0.1" class="cDist" value="'+c.distM+'" placeholder="m"></div>'+
        '</div>'+
        '<div class="row" style="margin-bottom:6px;">'+
          '<div><select class="cBast">'+optBast(c.bastone)+'</select></div>'+
          '<div><select class="cEsito">'+optEsito(c.esito)+'</select></div>'+
        '</div>'+
        '<div class="row" style="margin-bottom:0;">'+
          '<div><select class="cPen">'+optPen(c.penalita?(c.penTipo||'altro'):'')+'</select></div>'+
          '<div><button class="btn cDel secondary" style="margin:0;padding:11px;font-size:13px;">Elimina colpo</button></div>'+
        '</div></div>');
      row.querySelector('.cLie').onchange=e=>{ c.lie=e.target.value; };
      row.querySelector('.cDist').onchange=e=>{ c.distM=parseFloat(e.target.value)||0; };
      row.querySelector('.cBast').onchange=e=>{ c.bastone=e.target.value; };
      row.querySelector('.cEsito').onchange=e=>{ c.esito=e.target.value||null; };
      row.querySelector('.cPen').onchange=e=>{ const v=e.target.value; c.penalita=!!v; c.penTipo=v||null; ridisegna(); };
      row.querySelector('.cDel').onclick=()=>{ if(confirm('Eliminare il colpo '+(i+1)+'?')){ b.colpi.splice(i,1); ridisegna(); } };
      lista.appendChild(row);
    });
    const pen=b.colpi.reduce((s,c)=>s+(c.penalita?1:0),0);
    tot.textContent='Totale buca: '+(b.colpi.length+pen)+' colpi';
  }
  const tot=el('<div class="hint" style="margin-top:12px;font-weight:700;color:var(--testo)"></div>');
  const add=el('<button class="btn ghost" style="margin-top:10px">+ Aggiungi un colpo in fondo</button>');
  add.onclick=()=>{ const u=b.colpi[b.colpi.length-1];
    b.colpi.push({lie:u?u.lie:'fairway', distM:u?Math.max(1,Math.round(u.distM/2)):50,
                  bastone:u?u.bastone:'PW', penalita:false, penTipo:null, esito:null}); ridisegna(); };
  body.appendChild(lista); lista.appendChild(tot); lista.appendChild(add);
  ridisegna();

  const save=el('<button class="btn big">Salva le correzioni</button>');
  save.onclick=async()=>{
    b.par=parseInt(body.querySelector('#mPar').value,10);
    const d=body.querySelector('#mDist').value;
    b.distanza = d===''?null:parseFloat(d);
    b.completata = body.querySelector('#mCompl').checked;
    if(b.colpi.some(c=>!(c.distM>0))){ alert('Una distanza non e’ valida: devono essere tutte maggiori di zero.'); return; }
    const av=controlliBuca(b, b.colpi);
    const conf=testoConferma(av);
    if(conf && !confirm(conf)) return;
    await snapshotSalva('prima di correggere una buca');
    salvaGiro(g); back();
  };
  body.appendChild(save);
  return {header:'Buca '+(p.i+1), body};
};

/* ---------------- ARCHIVIO CAMPI ---------------- */
VIEWS.archivio = function(){
  const arch=LS.get('hcp_archivio_v3',ARCHIVIO_DEFAULT);
  const nomi=Object.keys(arch);
  const conNota=nomi.filter(n=>arch[n].nota).length;
  const body=el('<div>'+
    '<div class="hint" style="margin-bottom:8px"><b>'+nomi.length+' campi</b> in archivio. '+
      'Par, stroke index e distanze buca per buca dalle carte ufficiali dei circoli.'+
      (conNota?' <b>'+conNota+'</b> hanno un avviso: leggilo prima di fidarti del dato.':'')+'</div>'+
    '<input type="search" id="a_cerca" placeholder="Cerca per nome o provincia" '+
      'autocapitalize="off" autocorrect="off" spellcheck="false">'+
    '<div id="a_lista"></div></div>');

  const senzaAcc = t => String(t===null||t===undefined?'':t).toLowerCase()
                          .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const lista=body.querySelector('#a_lista');

  function disegna(){
    const q=senzaAcc(body.querySelector('#a_cerca').value.trim());
    const sel=nomi.filter(n=>!q || senzaAcc(n).indexOf(q)>=0 || senzaAcc(arch[n].luogo||'').indexOf(q)>=0);
    lista.innerHTML='';
    if(!sel.length){ lista.appendChild(el('<div class="empty">Nessun campo trovato.</div>')); return; }
    sel.forEach(n=>{
      const a=arch[n];
      const card=el('<div class="card"><h2>'+esc(n)+'</h2>'+
        (a.luogo?'<div class="hint tight" style="margin-top:-6px">'+esc(a.luogo)+'</div>':'')+
        '<div class="hint">Par '+a.par.reduce((x,y)=>x+y,0)+' \u00b7 '+a.par.length+' buche</div></div>');
      Object.keys(a.tees).forEach(t=>{
        const T=a.tees[t];
        card.appendChild(el('<div class="hint"><b>'+esc(t)+'</b>: '+T.d.reduce((x,y)=>x+(y||0),0)+' m'+
          (T.cr?' \u00b7 CR '+T.cr+' / Slope '+T.sr
              :' \u00b7 <span style="color:var(--ambra)">CR/Slope non pubblicati</span>')+'</div>'));
      });
      if(a.nota)  card.appendChild(el('<div class="installtip" style="color:var(--ambra)">\u26a0\ufe0e '+esc(a.nota)+'</div>'));
      if(a.fonte) card.appendChild(el('<div class="hint" style="margin:6px 0 0 0;font-size:11px">'+esc(a.fonte)+'</div>'));
      lista.appendChild(card);
    });
  }
  body.querySelector('#a_cerca').oninput=disegna;
  disegna();

  body.appendChild(el('<div class="installtip">Le distanze sono quelle delle carte ufficiali dei circoli. '+
    'Se durante il giro una buca ha una distanza diversa (tee avanzato, bandiera corta), puoi correggerla '+
    'direttamente in cima alla schermata della buca: vale solo per quel giro.<br><br>'+
    'Dove il circolo ha piu percorsi omologati, qui c\'e quello di gara. Se giochi un percorso diverso, '+
    'scegli "Altro (non in archivio)" e inserisci par e distanze a mano. '+
    'I campi con un avviso sui CR/Slope si registrano e producono statistiche, ma non danno il '+
    'differenziale per l\'handicap.</div>'));
  return {header:'Archivio campi', body};
};
/* ---------------- QUALITA' DEL DATO ---------------- */
VIEWS.qualita = function(){
  const Q=statQualita();
  const body=el('<div></div>');
  if(!Q.nGiri){
    body.appendChild(el('<div class="card"><h2>Nessun giro</h2><div class="hint">Questa schermata si riempie dal primo giro.</div></div>'));
    return {header:'Qualita’ del dato', body};
  }
  body.appendChild(el('<div class="hint" style="margin-top:-4px">'+Q.nGiri+' giri · '+Q.colpi+' colpi registrati</div>'));

  body.appendChild(el('<div class="kpigrid">'+
    '<div class="kpi"><div class="lab">Copertura del settore</div><div class="v">'+
      (Q.coperturaEsito===null?'—':Math.round(Q.coperturaEsito*100)+'<span class="u">%</span>')+'</div>'+
      '<div class="sub">'+Q.conEsito+' su '+Q.daEsito+' colpi che lo richiedono</div></div>'+
    '<div class="kpi"><div class="lab">Colpi di recupero</div><div class="v">'+Q.pctRecupero.toFixed(1)+'<span class="u">%</span></div>'+
      '<div class="sub">'+Q.recupero+' colpi su '+Q.colpi+'</div></div>'+
    '<div class="kpi"><div class="lab">Giri senza condizioni</div><div class="v">'+Q.senzaCond+'</div>'+
      '<div class="sub">su '+Q.nGiri+' giri</div></div>'+
    '<div class="kpi"><div class="lab">Sequenze sospette</div><div class="v">'+Q.integrKO.length+'</div>'+
      '<div class="sub">'+(Q.integrKO.length?'giri con un possibile colpo mancante':'nessuna discontinuita’')+'</div></div>'+
  '</div>'));

  /* --- audit di "Recupero": si controlla il GIUDIZIO, non il gioco --- */
  const cr=el('<div class="card"><h2>Deriva del giudizio su "Recupero"</h2>'+
    '<div class="metodo">Delle sei categorie di lie, cinque sono osservabili senza margine di giudizio. '+
    '"Recupero" no: richiede che tu decida se la situazione e’ un rough difficile o un colpo di recupero. '+
    'La differenza vale circa <b>0,58 colpi attesi</b> a 150 metri, ed entra direttamente nello strokes gained.<br><br>'+
    'Questa tabella non guarda il tuo gioco: guarda la <b>coerenza della tua classificazione</b>. Se la percentuale '+
    'deriva nel tempo senza che sia cambiato niente in campo, non e’ cambiato il gioco: e’ cambiato il giudice.</div></div>');
  if(Q.mesi.length<2){
    cr.appendChild(el('<div class="hint" style="margin-top:10px">Servono almeno due mesi con trenta colpi ciascuno.</div>'));
  } else {
    const mx=Math.max(...Q.mesi.map(x=>x.pct),1);
    Q.mesi.forEach(x=>cr.appendChild(el('<div class="hbrow wide">'+
      '<div class="l">'+x.mese+' <span style="opacity:.7">· '+x.giri+' giri</span></div>'+
      '<div class="hbtrack"><div class="hbfill" style="width:'+(x.pct/mx*100)+'%"></div></div>'+
      '<div class="n">'+x.pct.toFixed(1)+'%</div></div>')));
    if(Q.derivaRec){
      const amp=Q.derivaRec.max-Q.derivaRec.min;
      cr.appendChild(el('<div class="stcap">Scarto tipo fra i mesi: '+Q.derivaRec.sd.toFixed(2)+
        ' punti percentuali, ampiezza '+amp.toFixed(1)+'. '+
        (amp>4?'<b>Ampiezza alta.</b> Rileggi la definizione operativa e verifica se la stai applicando allo stesso modo.'
              :'Classificazione stabile: la definizione operativa sta reggendo.')+'</div>'));
    }
    cr.appendChild(el('<div class="installtip" style="margin-top:10px"><b>La definizione da applicare sempre:</b> '+
      esc(LIE_AIUTO.recupero)+'</div>'));
  }
  body.appendChild(cr);

  /* --- giri con una sequenza sospetta --- */
  if(Q.integrKO.length){
    const ck=el('<div class="card" style="border-color:var(--ambra)"><h2 style="color:var(--ambra)">Giri da controllare</h2>'+
      '<div class="hint">Su questi giri la catena delle posizioni ha una discontinuita’: un salto di distanza che '+
      'il bastone non spiega, una palla che si allontana senza penalita’, o una buca con troppi colpi. '+
      'E’ il segnale tipico di un colpo non registrato o di una distanza sbagliata.</div></div>');
    Q.integrKO.forEach(x=>{
      const it=el('<div class="listitem"><div><b>'+esc(x.circolo)+'</b>'+
        '<div class="meta">'+fmtData(x.data)+' · '+x.n+(x.n===1?' buca':' buche')+' · '+esc(x.primo)+'</div></div>'+
        '<span class="badge warn">Apri</span></div>');
      it.onclick=()=>push('modificaGiro',{id:x.id});
      ck.appendChild(it);
    });
    body.appendChild(ck);
  }
  if(Q.ricKO.length){
    body.appendChild(el('<div class="card" style="border-color:var(--rosso)">'+
      '<h2 style="color:var(--rosso)">Autodiagnosi del motore</h2>'+
      '<div class="hint">Su '+Q.ricKO.length+' giri l’identita’ "strokes gained + punteggio = giro atteso" non '+
      'torna. Non e’ un problema dei tuoi dati: e’ un difetto del calcolo, e va segnalato.</div></div>'));
  }

  /* --- misura mista --- */
  const misK=Object.keys(Q.misure);
  if(misK.length>1){
    body.appendChild(el('<div class="card"><h2>Attenzione: misure miste</h2>'+
      '<div class="hint">I tuoi giri non usano tutti lo stesso riferimento di misura: '+
      misK.map(k=>'<b>'+k+'</b> ('+Q.misure[k]+')').join(', ')+'. '+
      'Mescolare bandiera e centro green sposta di qualche metro, sempre nella stessa direzione, '+
      'le statistiche di prossimita’ e le distanze per bastone.</div></div>'));
  }

  /* --- il rischio che nessuna metrica mostra --- */
  body.appendChild(el('<div class="card"><h2>Il controllo che l’app non puo’ fare da sola</h2>'+
    '<div class="metodo">Il rischio piu’ serio di questo impianto non e’ un campo mancante: sono i <b>giri mancanti</b>, '+
    'e mancanti non a caso. Si salta l’inserimento quando si e’ sotto pressione, quando si gioca male, quando il '+
    'gruppo va veloce, quando piove. Cioe’ esattamente nei giri piu’ informativi.<br><br>'+
    'Un archivio di ottanta giri a cui mancano i venti peggiori e’ sistematicamente ottimista, e non c’e’ modo di '+
    'accorgersene guardando i dati.<br><br>'+
    '<b>Verifica da fare a mano, ogni tanto:</b> conta i giri registrati qui in un periodo e confrontali con le gare '+
    'giocate secondo lo storico federale. Se i due numeri divergono, quella divergenza conta piu’ di qualunque '+
    'statistica in questa app.</div></div>'));

  return {header:'Qualita’ del dato', body};
};

/* ---------------- METODO E FONTI ---------------- */
VIEWS.metodo = function(){
  const body=el('<div>'+
    '<div class="card"><h2>Come si calcola</h2><div class="metodo">'+
      'Lo <b>strokes gained</b> di un colpo e’: colpi attesi da dove parte la palla, meno colpi attesi da dove '+
      'arriva, meno 1 (il colpo giocato), meno le eventuali penalita’. Se il valore e’ positivo hai guadagnato '+
      'terreno rispetto al riferimento, se e’ negativo l’hai perso.<br><br>'+
      'Le quattro categorie seguono la convenzione standard: <b>colpo dal tee</b> sui par 4 e 5, '+
      '<b>approccio</b> oltre i 30 yard fuori dal green, <b>gioco corto</b> entro i 30 yard fuori dal green, '+
      '<b>putting</b> sul green. Il colpo dal tee di un par 3 conta come approccio.<br><br>'+
      '<b>Due controlli da non confondere.</b> Il primo e’ l’identita’ "strokes gained totale + punteggio = giro '+
      'atteso": vale per costruzione su qualunque sequenza concatenata, perche’ la somma degli SG e’ telescopica. '+
      'Se togli un colpo dal mezzo, la catena si richiude e l’identita’ continua a valere. Serve quindi a verificare '+
      'il <i>motore di calcolo</i>, non la completezza dei dati, ed e’ un errore comune credere il contrario. '+
      'Il secondo e’ il controllo di <b>integrita’ della sequenza</b>, che i colpi dimenticati li cerca davvero, '+
      'guardando le discontinuita’ nella catena delle posizioni: salti di distanza che il bastone non spiega, palle '+
      'che si allontanano senza penalita’, buche con troppi colpi. Li trovi entrambi nel riepilogo di ogni giro.'+
    '</div></div>'+

    '<div class="card"><h2>Il settore di esito e la distanza dei bastoni</h2><div class="metodo">'+
      'La distanza dalla buca e’ una grandezza <b>radiale e non segnata</b>: e’ sempre positiva, sia che la palla '+
      'sia corta, sia che sia lunga, sia che sia a lato. La differenza fra due raggi consecutivi misura quindi '+
      'l’<b>avanzamento verso la buca</b>, non la distanza percorsa dalla palla.<br><br>'+
      'Esempio. Ferro 7 da 150 metri, palla che finisce a 10 metri dalla bandiera. Se e’ corta sulla linea, ha '+
      'percorso 140 metri e 140 venivano registrati: esatto. Se e’ <i>lunga</i> sulla linea ha percorso 160 metri, '+
      'ma ne venivano registrati 140: venti metri di errore. Se e’ a lato pin high ha percorso 150 metri e ne '+
      'venivano registrati 140.<br><br>'+
      'Il valore registrato era quindi sempre pari alla distanza di partenza meno la prossimita’ radiale, e la media '+
      'per ogni bastone risultava piu’ corta della realta’ di una quantita’ pari alla prossimita’ media. '+
      'Il <b>settore di esito</b> — la griglia a nove caselle che compare quando inserisci il colpo successivo — '+
      'aggiunge la direzione. Combinato col raggio, ricostruisce la posizione: la componente longitudinale si somma '+
      'quando la palla e’ lunga invece di sottrarsi sempre, e quella laterale, che prima non esisteva, diventa '+
      'misurabile.<br><br>'+
      'Il settore si chiede solo dove serve: sui colpi che finiscono entro <b>'+ESITO_SOGLIA_M+' metri</b> dalla '+
      'buca e su ogni putt non imbucato. Piu’ lontano l’errore geometrico e’ di secondo ordine: un drive di 250 '+
      'metri che finisce 20 metri fuori linea su una buca di 400 sbaglia di due metri.<br><br>'+
      'Si chiede al colpo <i>successivo</i> e non a quello in corso perche’ il segno si conosce solo dopo aver '+
      'tirato. Per la stessa ragione anche la penalita’ e’ stata spostata li’: prima stava nella scheda compilata '+
      'prima del colpo, che e’ una contraddizione.'+
    '</div></div>'+

    '<div class="card"><h2>Quanti giri servono</h2><div class="metodo">'+
      'Lo scarto tipo degli strokes gained di una categoria, da giro a giro, sta intorno a 1,5–1,8 colpi. Per '+
      'confrontare due periodi con una potenza dell’80% e un livello del 5%, il numero di giri necessari per '+
      '<i>ciascun</i> periodo e’ <code>n = 15,7 · sigma² / delta²</code>.<br><br>'+
      'Con sigma = 1,6: per rilevare 1,5 colpi servono 18 giri per lato; per 1,0 ne servono 40; per 0,5 ne servono '+
      '<b>161</b>; per 0,3 ne servono 447. A cento giri l’anno, mezzo colpo di miglioramento in una categoria si '+
      'distingue dal caso dopo <b>oltre tre anni</b>.<br><br>'+
      'Per questo l’app non disegna piu’ una linea di tendenza quando il campione non basta, e ogni tabella porta '+
      'accanto il numero di osservazioni e, dove serve, due errori standard. Un numero senza la sua incertezza '+
      'invita a leggere il rumore.<br><br>'+
      '<b>Un malinteso da evitare:</b> avere 7.400 colpi l’anno invece di 100 giri non aumenta la numerosita’. '+
      'Se lo scarto tipo per giro e’ 1,6 su 74 colpi, quello per colpo e’ circa 0,19 e l’errore standard e’ '+
      'identico. Quello che l’analisi per colpo da’ davvero e’ l’aggiustamento per distanza, lie e campo, che '+
      'toglie dal denominatore la variabilita’ che non e’ tua.'+
    '</div></div>'+

    '<div class="card"><h2>Baseline PGA Tour — dato pubblicato</h2><div class="metodo">'+
      'Tabella dei colpi attesi per distanza e lie da <b>Broadie, M., "Assessing Golfer Performance on the '+
      'PGA TOUR", Interfaces 42(2):146–165, 2012</b>, Tabella B.1, costruita su oltre 8 milioni di colpi '+
      'rilevati da ShotLink fra il 2003 e il 2010. Il putting viene da <b>Broadie, "Putts Gained: Measuring '+
      'Putting on the PGA TOUR", 2011</b>, Figura 1.<br><br>'+
      'Le tabelle sono in <b>yard</b> (gioco lungo) e <b>piedi</b> (putting); l’app converte dai metri che '+
      'inserisci tu. Fra un punto e l’altro della tabella interpola linearmente.<br><br>'+
      '<b>Limite dichiarato:</b> Broadie non pubblica valori sotto i 10 yard fuori dal green. I chip da meno '+
      'di 9 metri usano quindi un raccordo lineare fra 2,0 colpi a distanza zero e il valore pubblicato a '+
      '10 yard. E’ un’estrapolazione, non un dato.'+
    '</div></div>'+

    '<div class="card"><h2>Baseline scratch — ricostruzione</h2><div class="metodo">'+
      '<b>Non esiste una tabella scratch pubblicata liberamente.</b> Le tabelle per livello di handicap sono '+
      'nel libro <i>Every Shot Counts</i> di Broadie, protetto da copyright, e quello che circola online e’ '+
      'o una copia non citata del libro o materiale sbagliato.<br><br>'+
      'Quella usata qui e’ quindi una <b>ricostruzione dichiarata</b>. <b>Gioco lungo:</b> '+
      '<code>scratch = 2 + K · (tour − 2)</code>, con <code>K = 1,1478</code>, calibrato su un vincolo '+
      'verificabile: su Colline del Gavi Champion dal tee Bianco (CR 74,2, par 73), imponendo una media scratch '+
      'di CR + 1,8 si ottiene un giro atteso di 76,0.<br><br>'+
      '<b>Scarto noto:</b> sugli unici due ancoraggi scratch liberi (Broadie, <i>Golfmetrics</i>, 2008: tee da '+
      '140 yard = 3,2 colpi e da 200 yard = 3,5) il modello e’ ottimista di 0,09 e 0,21 colpi.<br><br>'+
      '<b>Putting scratch:</b> <code>E[putt] = 2 − P(imbuca) + P(3 putt)</code>, con le percentuali di imbucato '+
      'per handicap 0 rilevate da Shot Scope e la probabilita’ di tre putt calibrata su due ancoraggi Broadie. '+
      'Trattala come un ordine di grandezza, non come un dato ufficiale.'+
    '</div></div>'+

    '<div class="card"><h2>La tua media</h2><div class="metodo">'+
      'Terzo confronto, e l’unico che non dipende da nessuna fonte esterna: ogni giro viene misurato rispetto '+
      'alla tua prestazione media. La finestra e’ fissa agli <b>ultimi 20 giri completi</b> ed e’ indipendente '+
      'dai filtri di visualizzazione: prima si muoveva col filtro, quindi lo stesso giro cambiava valore '+
      'cambiando vista e il numero non era citabile.'+
    '</div></div>'+

    '<div class="card"><h2>Dati dei campi</h2><div class="metodo">'+
      '<b>Colline del Gavi (Champion):</b> carta ufficiale del circolo sul sistema GES Golf, con il totale '+
      'confermato da FederGolf Piemonte (6380 m dal bianco, par 73).<br><br>'+
      '<b>Des Iles Borromées:</b> carta ufficiale GES Golf, circolo_id 480. Tutte le somme per nove e i totali '+
      'tornano su tutti e sei i tee.'+
    '</div></div>'+
  '</div>');
  return {header:'Metodo e fonti', body};
};

/* ---------------- BACKUP E RIPRISTINO ---------------- */
function payloadBackup(){
  return {app:'HCP+Stat Registra Giro', schema:SCHEMA_VERSION, esportato:new Date().toISOString(),
          giri:LS.get('hcp_giri',[]), archivio:LS.get('hcp_archivio_v3'),
          impostazioni:LS.get('hcp_impostazioni')};
}
async function eseguiBackup(){
  const txt=JSON.stringify(payloadBackup());
  const nome='giri-golf-'+new Date().toISOString().slice(0,10)+'.json';
  try{
    const file=new File([txt],nome,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Backup giri'});
      metaSet({ultimoBackup:Date.now()}); return 'ok';
    }
  }catch(e){ if(e && e.name==='AbortError') return 'annullato'; }
  try{
    const b=new Blob([txt],{type:'application/json'}), u=URL.createObjectURL(b);
    const a=document.createElement('a'); a.href=u; a.download=nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    metaSet({ultimoBackup:Date.now()}); return 'ok';
  }catch(e){ return 'errore'; }
}

VIEWS.backup = function(){
  const m=LS.get('hcp_meta',{})||{};
  const daSalvare=giriDaBackup();
  const quando = m.ultimoBackup ? new Date(m.ultimoBackup).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}) : null;
  const body=el('<div>'+
    '<div class="card"><h2>Stato del backup</h2>'+
      '<div class="hint">'+(quando ? 'Ultimo backup: <b>'+quando+'</b>.' : 'Non hai mai fatto un backup.')+
        (daSalvare>0 ? ' Da allora ci sono <b>'+daSalvare+' giri</b> non ancora salvati fuori dal telefono.' : ' Tutti i giri sono al sicuro.')+'</div>'+
      '<div class="hint">Il backup e’ un unico file che contiene tutti i giri, colpo per colpo. Salvalo su iCloud '+
        'Drive quando iOS te lo chiede: da li’ lo ritrovi anche se cambi telefono.</div>'+
      '<button class="btn big" id="bk">Salva backup su File / iCloud</button>'+
    '</div>'+
    '<div class="card"><h2>Ripristina</h2>'+
      '<div class="hint">Scegli un file di backup salvato in precedenza. I giri di uno schema piu’ vecchio '+
        'vengono portati a v6 in modo additivo: nessun colpo viene toccato.</div>'+
      '<input type="file" accept=".json,application/json" id="imp">'+
    '</div>'+
    '<div class="card"><h2>Copie automatiche nel telefono</h2>'+
      '<div class="hint">L’app conserva da sola le ultime 8 versioni complete dell’archivio. Servono a '+
        'recuperare da una cancellazione per sbaglio, non da un telefono perso.</div>'+
      '<div id="snapList"><div class="hint">Caricamento…</div></div>'+
    '</div>'+
    '<div class="card" id="cardArch" style="display:none"><h2>Giri messi da parte</h2>'+
      '<div class="hint" id="archTesto"></div>'+
      '<button class="btn secondary" id="archExp">Esporta questi giri (JSON)</button>'+
    '</div>'+
    '<div class="card"><h2>Esporta per analisi</h2>'+
      '<div class="hint">CSV da aprire in Excel o Numbers. Non sono backup: non si possono reimportare.</div>'+
      '<button class="btn secondary" id="e1">Riepilogo giri</button>'+
      '<button class="btn secondary" id="e2">Riepilogo buche</button>'+
      '<button class="btn secondary" id="e3">Dettaglio colpi + SG + settore</button>'+
    '</div>'+
  '</div>');

  body.querySelector('#bk').onclick=async()=>{
    const r=await eseguiBackup();
    if(r==='ok') render();
    else if(r==='errore') alert('Non e’ stato possibile creare il file di backup.');
  };

  body.querySelector('#imp').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      let d;
      try{ d=JSON.parse(rd.result); }catch(err){ alert('File non leggibile: non sembra un backup.'); return; }
      if(!d || !Array.isArray(d.giri)){ alert('File non valido: non contiene giri.'); return; }
      d.giri.forEach(migraGiroInArrivo);
      const attuali=LS.get('hcp_giri',[]);
      const ids=new Set(attuali.map(g=>g.id));
      const nuovi=d.giri.filter(g=>!ids.has(g.id));
      const scelta=confirm('Il file contiene '+d.giri.length+' giri, di cui '+nuovi.length+' non presenti nell’archivio.\n\nOK = aggiunge solo i '+nuovi.length+' mancanti (consigliato)\nAnnulla = sostituisce tutto con i '+d.giri.length+' del file');
      snapshotSalva();
      if(scelta){ LS.set('hcp_giri', attuali.concat(nuovi)); }
      else { if(!confirm('Confermi la sostituzione? I '+attuali.length+' giri attuali verranno rimpiazzati. Una copia resta nelle copie automatiche.')) return;
             LS.set('hcp_giri', d.giri); }
      if(d.impostazioni) LS.set('hcp_impostazioni', Object.assign({}, IMPOSTAZIONI_DEFAULT, d.impostazioni));
      idbFlush(); bastCacheReset(); render();
    };
    rd.readAsText(f);
  };

  snapshotElenco().then(sn=>{
    const box=body.querySelector('#snapList');
    if(!sn.length){ box.innerHTML='<div class="hint">Nessuna copia ancora: se ne crea una a ogni giro completato.</div>'; return; }
    box.innerHTML='';
    sn.slice().reverse().forEach(s=>{
      const it=el('<div class="listitem"><div>'+new Date(s.ts).toLocaleString('it-IT')+
        '<div class="meta">'+s.giri.length+' giri'+(s.etichetta?' · '+esc(s.etichetta):'')+'</div></div>'+
        '<span class="badge">Ripristina</span></div>');
      it.onclick=()=>{ if(confirm('Riportare l’archivio a questa copia ('+s.giri.length+' giri)? I giri attuali verranno sostituiti.')){
        snapshotSalva(); LS.set('hcp_giri', s.giri); idbFlush(); bastCacheReset(); nav=[{view:'home'}]; render(); } };
      box.appendChild(it);
    });
  });

  const arch=LS.get('hcp_giri_archiviati',[]);
  if(arch.length){
    body.querySelector('#cardArch').style.display='block';
    body.querySelector('#archTesto').innerHTML='Ci sono <b>'+arch.length+' giri</b> registrati con una '+
      'versione precedente dell’app, messi da parte durante un aggiornamento. Non entrano nelle statistiche '+
      'perche’ il loro formato non permette di calcolare gli strokes gained, ma <b>non sono stati cancellati</b>.';
    body.querySelector('#archExp').onclick=()=>{
      const txt=JSON.stringify({app:'HCP+Stat', tipo:'giri-archiviati', giri:arch}, null, 1);
      const bl=new Blob([txt],{type:'application/json'}), u=URL.createObjectURL(bl);
      const a=document.createElement('a'); a.href=u; a.download='giri-messi-da-parte.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
    };
  }

  const giriTutti=LS.get('hcp_giri',[]);
  const bl = STAT_F.baseline==='scratch'?'scratch':'tour';
  body.querySelector('#e1').onclick=()=>{
    const r=[['giro_id','data','tipo','gara','circolo','tee','buche','punteggio','par','sul_par','putt','gir',
      'vento','terreno','green','misura','slope',
      'sg_tee','sg_approccio','sg_corto','sg_putting','sg_totale','giro_atteso','coerenza','baseline']];
    giriTutti.forEach(g=>{const A=analizzaGiro(g,bl), c=A.calc, R=riconcilia(g,bl);
      const co=g.condizioni||{};
      r.push([g.id,g.data,g.tipo,g.gara||'',g.circolo,g.tee,c.nBuche,c.score,c.par,c.score-c.par,c.putt,c.gir,
        co.vento===undefined?'':(VENTO_OPZ[co.vento]||{}).n||'',
        co.meteo===undefined?'':(METEO_OPZ[co.meteo]||{}).n||'',
        co.green===undefined?'':(GREEN_OPZ[co.green]||{}).n||'',
        g.misura||'', g.slope||'',
        c.sgCat?c.sgCat.tee.toFixed(2):'',c.sgCat?c.sgCat.approccio.toFixed(2):'',
        c.sgCat?c.sgCat.corto.toFixed(2):'',c.sgCat?c.sgCat.putting.toFixed(2):'',
        c.sgTot!==null?c.sgTot.toFixed(2):'', c.atteso!==null&&c.atteso!==undefined?c.atteso.toFixed(2):'',
        R?(R.ok?'ok':'scarto '+R.scarto.toFixed(2)):'', bl]);});
    download('giri-riepilogo.csv', r.map(x=>x.map(escCsv).join(';')).join('\n'));
  };
  body.querySelector('#e2').onclick=()=>{
    const r=[['giro_id','data','circolo','tee','buca','par','distanza_m','punteggio','sul_par','putt','gir','completata','sg_buca']];
    giriTutti.forEach(g=>{const A=analizzaGiro(g,bl);
      A.bucheCalc.forEach((b,i)=>r.push([g.id,g.data,g.circolo,g.tee,b.buca,b.par,b.distanza===null||b.distanza===undefined?'':b.distanza,
        b.score,b.diff,b.putt,b.girHit?'si':'no',(g.buche[i]&&g.buche[i].completata===false)?'no':'si',
        b.sg!==null?b.sg.toFixed(2):'']));});
    download('buche-riepilogo.csv', r.map(x=>x.map(escCsv).join(';')).join('\n'));
  };
  body.querySelector('#e3').onclick=()=>{
    const r=[['giro_id','data','circolo','tee','buca','par','colpo','lie','distanza_m','bastone','penalita','tipo_penalita',
      'settore_esito','percorsa_m','laterale_m','misura_esatta','categoria','attesi_partenza','attesi_arrivo','strokes_gained']];
    giriTutti.forEach(g=>{const A=analizzaGiro(g,bl);
      A.bucheCalc.forEach((b,bi)=>{
        const colpiRaw=(g.buche[bi]||{}).colpi||[];
        b.colpi.forEach((c,i)=>{
          const p=percorsaColpo(colpiRaw,i);
          r.push([g.id,g.data,g.circolo,g.tee,b.buca,b.par,i+1,
            LIE_NOME[c.lie],c.distM,c.bastone,c.penalita?'si':'no',c.penTipo||'',
            c.esito||'', p&&p.d!==null?p.d.toFixed(1):'', p&&p.lat!==null&&p.lat!==undefined?p.lat.toFixed(1):'',
            p?(p.esatta?'si':'no'):'',
            CAT_NOME[c.cat],c.e0.toFixed(3),c.e1.toFixed(3),c.sg.toFixed(3)]);
        });
      });});
    download('colpi-dettaglio-sg.csv', r.map(x=>x.map(escCsv).join(';')).join('\n'));
  };
  return {header:'Backup e ripristino', body};
};

/* ---------------- SINCRONIZZAZIONE (schermata) ---------------- */
VIEWS.sincronizza = function(){
  const s=S();
  const sosp=syncInSospeso();
  const body=el('<div></div>');
  let statoTesto, statoCol;
  if(!s.attiva){ statoTesto='Spenta. I giri restano solo dentro questo telefono.'; statoCol='var(--grigio)'; }
  else if(s.ultimoErrore){ statoTesto='Ultimo tentativo non riuscito.'; statoCol='var(--rosso)'; }
  else if(sosp>0){ statoTesto=sosp+(sosp===1?' giro non ancora':' giri non ancora')+' al sicuro.'; statoCol='var(--ambra)'; }
  else { statoTesto='Tutto al sicuro.'; statoCol='var(--dv-good)'; }

  body.appendChild(el('<div class="card"><h2>Stato</h2>'+
    '<div style="font-size:16px;font-weight:700;color:'+statoCol+';margin-bottom:6px;">'+esc(statoTesto)+'</div>'+
    '<div class="hint">Ultima sincronizzazione riuscita: <b>'+esc(quandoTesto(s.ultimoOk))+'</b>.'+
      (s.privato===false?'<br><b style="color:var(--rosso)">Attenzione: il repository risulta pubblico.</b> I tuoi punteggi sarebbero visibili a chiunque.':'')+
      (s.privato===true?'<br>Repository verificato <b>privato</b>.':'')+'</div>'+
    (s.ultimoErrore?'<div class="installtip" style="color:var(--rosso)">'+esc(s.ultimoErrore)+'</div>':'')+
  '</div>'));

  if(s.attiva){
    const bSync=el('<button class="btn big" id="sy">'+(_sy.inCorso?'Sincronizzazione in corso…':'Sincronizza adesso')+'</button>');
    bSync.disabled=_sy.inCorso;
    bSync.onclick=async()=>{
      bSync.disabled=true; bSync.textContent='Sincronizzazione in corso…';
      const r=await syncEsegui();
      render();
      if(r.esito==='ok'){
        const p=[];
        if(r.caricati) p.push(r.caricati+' messi al sicuro');
        if(r.nuovi) p.push(r.nuovi+' arrivati da un altro dispositivo');
        if(r.aggiornati) p.push(r.aggiornati+' aggiornati');
        if(r.rimossi) p.push(r.rimossi+' spostati fra i cancellati');
        if(r.conflitti) p.push(r.conflitti+' da decidere');
        alert(p.length?('Fatto: '+p.join(', ')+'.'):'Fatto. Era gia’ tutto allineato.');
      } else if(r.esito==='errore'){ alert('Non e’ andata a buon fine.\n\n'+r.messaggio+'\n\nNessun dato e’ andato perso.'); }
      else if(r.esito==='offline'){ alert('Nessuna connessione. Riprovo da solo appena torna la rete.'); }
    };
    body.appendChild(bSync);
  }

  if(_sy.conflitti.length){
    const cc=el('<div class="card" style="border-color:var(--ambra)">'+
      '<h2 style="color:var(--ambra)">Da decidere tu</h2>'+
      '<div class="hint">Questi giri risultano modificati in due posti diversi. L’app non sceglie al posto '+
        'tuo e non ha sovrascritto niente.</div></div>');
    _sy.conflitti.forEach(c=>{
      const L=c.locale, R=c.remoto;
      const descr=g=>{
        if(!g) return 'versione non leggibile';
        const nb=(g.buche||[]).length;
        const q=g.modificatoIl?new Date(g.modificatoIl).toLocaleString('it-IT'):'data sconosciuta';
        return nb+' buche · modificata il '+q+(g.modificatoDa?' da '+esc(g.modificatoDa):'');
      };
      const box=el('<div style="border-top:1px solid var(--bordo);padding-top:12px;margin-top:12px;">'+
        '<b>'+esc((L&&L.circolo)||(R&&R.circolo)||'Giro')+'</b>'+
        '<div class="meta" style="margin-bottom:8px;">'+fmtData((L&&L.data)||(R&&R.data))+'</div>'+
        '<div class="hint"><b>Su questo telefono:</b> '+descr(L)+'</div>'+
        '<div class="hint"><b>Sul repository:</b> '+descr(R)+'</div>'+
        '<div class="grid2">'+
          '<button class="btn secondary" style="margin:0">Tieni quella del telefono</button>'+
          '<button class="btn secondary" style="margin:0">Tieni quella del repository</button>'+
        '</div></div>');
      box.querySelectorAll('button')[0].onclick=()=>{ if(confirm('Tenere la versione di questo telefono?')) risolviConflitto(c.id,'locale'); };
      box.querySelectorAll('button')[1].onclick=()=>{ if(confirm('Tenere la versione del repository?')) risolviConflitto(c.id,'remoto'); };
      cc.appendChild(box);
    });
    body.appendChild(cc);
  }

  const cImp=el('<div class="card"><h2>Collegamento a GitHub</h2>'+
    '<div class="hint">Serve una volta per dispositivo. Il token si genera su GitHub e vale solo per il '+
      'repository dei dati: non da’ accesso a nient’altro.</div>'+
    '<label>Nome utente GitHub</label>'+
    '<input type="text" id="sy_u" autocapitalize="off" autocorrect="off" spellcheck="false" value="'+esc(s.utente)+'" placeholder="il tuo nome utente">'+
    '<label style="margin-top:10px;">Repository dei dati</label>'+
    '<input type="text" id="sy_r" autocapitalize="off" autocorrect="off" spellcheck="false" value="'+esc(s.repo)+'" placeholder="golf-dati">'+
    '<label style="margin-top:10px;">Token</label>'+
    '<input type="password" id="sy_t" autocapitalize="off" autocorrect="off" spellcheck="false" value="'+esc(s.token)+'" placeholder="github_pat_…">'+
    '<div class="hint" style="margin-top:6px;">Il token resta dentro questo telefono. Non finisce nei backup.</div>'+
    '<label style="margin-top:10px;">Nome di questo dispositivo</label>'+
    '<input type="text" id="sy_d" value="'+esc(s.dispositivo)+'" placeholder="iPhone">'+
    '<button class="btn secondary" id="sy_v">Verifica il collegamento</button>'+
    '<div id="sy_esito"></div>'+
  '</div>');
  const leggi=()=>({
    utente:cImp.querySelector('#sy_u').value.trim(),
    repo:cImp.querySelector('#sy_r').value.trim(),
    token:cImp.querySelector('#sy_t').value.trim(),
    dispositivo:cImp.querySelector('#sy_d').value.trim()||nomeDispositivoIniziale()
  });
  cImp.querySelector('#sy_v').onclick=async()=>{
    Sset(leggi());
    const box=cImp.querySelector('#sy_esito');
    box.innerHTML='<div class="hint">Verifico…</div>';
    try{
      const r=await syncVerifica();
      box.innerHTML='<div class="installtip">Collegamento riuscito con <b>'+esc(r.nome)+'</b>.<br>'+
        (r.privato?'Il repository e’ <b>privato</b>, come deve essere.'
                 :'<b style="color:var(--rosso)">Il repository e’ PUBBLICO.</b> Rendilo privato su GitHub prima di attivare.')+'</div>';
    }catch(e){
      box.innerHTML='<div class="installtip" style="color:var(--rosso)">'+esc(e.message||String(e))+'</div>';
    }
  };
  body.appendChild(cImp);

  const cSw=el('<div class="card"><h2>Interruttore</h2>'+
    '<div class="hint">Finche’ e’ spenta, l’app si comporta esattamente come prima: i dati restano nel '+
      'telefono e non esce niente. Accendila solo dopo che la verifica qui sopra e’ riuscita.</div></div>');
  const bSw=el('<button class="btn '+(s.attiva?'danger':'')+'" style="margin:0">'+(s.attiva?'Spegni la sincronizzazione':'Accendi la sincronizzazione')+'</button>');
  bSw.onclick=async()=>{
    if(s.attiva){ Sset({attiva:false}); render(); return; }
    Sset(leggi());
    try{
      const r=await syncVerifica();
      if(!r.privato && !confirm('Il repository risulta PUBBLICO: i tuoi giri sarebbero visibili a chiunque.\n\nAccendere lo stesso? (sconsigliato)')) return;
      Sset({attiva:true});
      render();
      syncAuto();
    }catch(e){ alert('Non posso accendere la sincronizzazione:\n\n'+(e.message||String(e))); }
  };
  cSw.appendChild(bSw);
  body.appendChild(cSw);

  const canc=LS.get('hcp_giri_cancellati',[]);
  if(canc.length){
    const cN=el('<div class="card"><h2>Giri eliminati</h2>'+
      '<div class="hint">Eliminare un giro dal telefono non lo distrugge: la copia resta qui e, sul '+
        'repository, il file viene spostato in <code>cancellati/</code> invece che rimosso.</div></div>');
    canc.slice().reverse().forEach(c=>{
      const g=c.giro||{};
      const it=el('<div class="listitem"><div><b>'+esc(g.circolo||'giro')+'</b>'+
        '<div class="meta">'+fmtData(g.data)+(c.spostato?'':' · da spostare')+'</div></div>'+
        '<span class="badge">Ripristina</span></div>');
      it.onclick=()=>{
        if(!confirm('Rimettere questo giro fra i giri salvati?')) return;
        const giri=LS.get('hcp_giri',[]);
        if(!giri.some(x=>x.id===c.id)){ marcaModifica(c.giro); giri.push(c.giro); LS.set('hcp_giri',giri); }
        LS.set('hcp_giri_cancellati', LS.get('hcp_giri_cancellati',[]).filter(x=>x.id!==c.id));
        idbFlush(); bastCacheReset(); render(); syncAuto();
      };
      cN.appendChild(it);
    });
    body.appendChild(cN);
  }

  body.appendChild(el('<div class="card"><h2>Come funziona</h2><div class="metodo">'+
    '<b>Cosa sale.</b> Un file per ogni giro, dentro la cartella <code>giri/</code> del repository privato. '+
    'Non c’e’ un archivio unico: due telefoni che registrano giri diversi non si pestano i piedi.<br><br>'+
    '<b>Cosa scende.</b> All’apertura dell’app, i giri presenti sul repository e assenti qui vengono '+
    'aggiunti, e portati allo schema v6 se arrivano da una versione piu’ vecchia. La sincronizzazione '+
    'aggiunge: non cancella mai un giro da sola.<br><br>'+
    '<b>Se due dispositivi correggono lo stesso giro.</b> L’app se ne accorge, non sovrascrive niente e '+
    'ti mostra le due versioni chiedendo quale tenere.<br><br>'+
    '<b>Se perdi il telefono.</b> Su GitHub, Settings → Developer settings → Fine-grained tokens → '+
    'Revoke accanto al token.'+
  '</div></div>'));

  return {header:'Sincronizzazione', body};
};
/* ==========================================================
   AVVIO
   ========================================================== */
initStore().then(()=>{
  bozza = LS.get('hcp_bozza_v3', null);
  render();
  const m=LS.get('hcp_meta',{})||{};
  if(m.rimossiLegacy && !m.avvisoLegacy){
    metaSet({avvisoLegacy:1});
    setTimeout(()=>alert('Aggiornamento archivio: '+m.rimossiLegacy+' giri registrati con una versione precedente sono stati messi da parte, non cancellati.\n\nLi trovi in Backup, sezione "Giri messi da parte".'), 400);
  }
  if(m.migrazioneV7 && !m.avvisoV7){
    metaSet({avvisoV7:1});
    setTimeout(()=>alert('Aggiornamento a v7.'+
      '\n\nArchivio campi: ora sono '+(m.campiTotali||0)+' circoli italiani, dalle carte ufficiali GES Golf. '+
      'In "Nuovo giro" e in "Archivio campi" trovi la ricerca per nome o provincia. '+
      (m.campiConservati?'I '+m.campiConservati+' campi che avevi solo su questo telefono sono stati conservati. ':'')+
      'Alcuni campi portano un avviso: dove CR e Slope non sono pubblicati, il giro si registra e le '+
      'statistiche si calcolano, ma quel campo non produce il differenziale per l\'handicap.'+
      '\n\nRaccolta dati: la griglia a nove settori sull\'esito del colpo, la fase di putting separata, '+
      'i controlli di plausibilita\' sull\'inserimento e la revisione dei pannelli statistici.'+
      '\n\nNessun giro esistente e\' stato modificato: la migrazione e\' solo additiva. I giri gia\' '+
      'registrati non hanno il settore di esito, quindi per loro le distanze per bastone restano '+
      'calcolate con la vecchia formula, e la schermata "Qualita\' del dato" ti dice quanti sono.'), 500);
  }
  if(!S().dispositivo) Sset({dispositivo:nomeDispositivoIniziale()});
  syncAuto();
  window.addEventListener('online', syncAuto);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncAuto(); });
}).catch(e=>{
  document.getElementById('app').innerHTML =
    '<main><div class="card"><h2>Errore di avvio</h2><div class="hint">'+String(e && e.message || e)+'</div></div></main>';
});
</script>
</body>
</html>
