    g.bucheCalc.forEach(h=>{
      const z=t[h.buca<=9?0:1];
      z.n++; z.sopraPar+=h.diff; if(h.girHit)z.gir++; z.putt+=h.putt; if(h.sg!==null) z.sg+=h.sg;
      if(h.buca<=9){ a+=h.diff; na++; } else { b+=h.diff; nb++; }
    });
    if(na===9 && nb===9){ p1.push(a); p2.push(b); dif.push(b-a); }
  });
  const meta=t.filter(x=>x.n>0).map(x=>({...x, media:x.sopraPar/x.n, girPct:100*x.gir/x.n, puttB:x.putt/x.n}));
  let conf=null;
  if(dif.length>=3){
    const sd=scartoTipo(dif), se=sd!==null?sd/Math.sqrt(dif.length):null, d=media(dif);
    conf={nGiri:dif.length, delta:d, se:se, leggibile: se!==null && se>0 && Math.abs(d)>2*se,
          servono: sd!==null?giriNecessari(sd, Math.max(0.5,Math.abs(d))):null};
  }
  return {meta:meta, conf:conf};
}

/* v11: fasce piu' fini sotto i 100 m, in METRI. La fascia unica "fino a 100 m"
   mescolava il pitch da 35 m e il wedge pieno da 95: era un difetto segnalato il
   16/08 e mai corretto. La granularita' e' quella di ShotLink (che usa 25 yard),
   qui in metri perche' tutte le distanze dell'app sono in metri. Le celle sotto
   N minimo restano in grigio, come sempre. */
const FASCE_APP=[[0,50,'fino a 50 m'],[50,75,'50–75 m'],[75,100,'75–100 m'],
  [100,125,'100–125 m'],[125,150,'125–150 m'],
  [150,175,'150–175 m'],[175,200,'175–200 m'],[200,9999,'oltre 200 m']];
const FASCE_PUTT=[[0,1,'meno di 1 m'],[1,2,'1–2 m'],[2,3,'2–3 m'],[3,5,'3–5 m'],
  [5,8,'5–8 m'],[8,12,'8–12 m'],[12,999,'oltre 12 m']];
const N_MIN_FASCIA = 12;   // sotto questa numerosita' la riga si mostra ma non si legge

function statFasce(A){
  const mkSub=()=>({n:0,sg:0,green:0,nProx:0,prox:0});
  const out=FASCE_APP.map(f=>({label:f[2],lo:f[0],hi:f[1],n:0,sg:0,prox:0,nProx:0,green:0,vals:[],
    sub:{fairway:mkSub(), rough:mkSub()}}));
  A.forEach(g=>g.bucheCalc.forEach(b=>b.colpi.forEach((c,i)=>{
    if(c.cat!=='approccio') return;
    const f=out.find(x=>c.distM>=x.lo && c.distM<x.hi); if(!f) return;
    f.n++; f.sg+=c.sg; f.vals.push(c.sg);
    const nx=b.colpi[i+1];
    const inGreen = !nx || nx.lie==='green';
    if(!nx){ f.green++; f.nProx++; }
    else if(nx.lie==='green'){ f.green++; f.prox+=nx.distM; f.nProx++; }
    // lo standard ShotLink separa gli approcci per lie di partenza:
    // dalla stessa distanza, fairway e rough sono due colpi diversi
    const sb=f.sub[c.lie];
    if(sb){
      sb.n++; sb.sg+=c.sg;
      if(inGreen){ sb.green++; sb.nProx++; if(nx) sb.prox+=nx.distM; }
    }
  })));
  return out.filter(x=>x.n>0).map(x=>({...x,
    sgColpo:x.sg/x.n,
    se:x.vals.length>=2?(scartoTipo(x.vals)||0)/Math.sqrt(x.vals.length):null,
    solido:x.n>=N_MIN_FASCIA,
    perLie: (x.sub.fairway.n>=N_MIN_FASCIA && x.sub.rough.n>=N_MIN_FASCIA) ? {
      fairway:{n:x.sub.fairway.n, sgColpo:x.sub.fairway.sg/x.sub.fairway.n,
        greenPct:100*x.sub.fairway.green/x.sub.fairway.n,
        prox:x.sub.fairway.nProx?x.sub.fairway.prox/x.sub.fairway.nProx:null},
      rough:{n:x.sub.rough.n, sgColpo:x.sub.rough.sg/x.sub.rough.n,
        greenPct:100*x.sub.rough.green/x.sub.rough.n,
        prox:x.sub.rough.nProx?x.sub.rough.prox/x.sub.rough.nProx:null}
    } : null}));
}
function statPutting(A){
  const out=FASCE_PUTT.map(f=>({label:f[2],lo:f[0],hi:f[1],n:0,imbucati:0,sg:0,vals:[]}));
  let bucheConPutt=0, treputt=0;
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    const pt=b.colpi.filter(c=>c.lie==='green');
    if(pt.length){ bucheConPutt++; if(pt.length>=3) treputt++; }
    b.colpi.forEach((c,i)=>{
      if(c.lie!=='green') return;
      const f=out.find(x=>c.distM>=x.lo && c.distM<x.hi); if(!f) return;
      f.n++; f.sg+=c.sg; f.vals.push(c.sg); if(!b.colpi[i+1]) f.imbucati++;
    });
  }));
  return {fasce:out.filter(x=>x.n>0).map(x=>({...x, sgColpo:x.sg/x.n,
    se:x.vals.length>=2?(scartoTipo(x.vals)||0)/Math.sqrt(x.vals.length):null,
    solido:x.n>=N_MIN_FASCIA})), bucheConPutt, treputt};
}
/* ── v8: statistiche derivate dai dati gia' raccolti ─────────────────────
   Nessun tocco in piu' in campo: sono letture standard del PGA Tour ricavate
   dalle sequenze esistenti. Riferimenti citati nel pannello, fonte nel
   documento 16-08-2026-osservazioni-raccolta-e-analisi-vs-pga-tour.md.      */

/* percentuale di imbucata PGA Tour per distanza (metri): tabella validata in
   15-08-2026-riferimenti-e-setup-putting.md, interpolazione lineare. */
const TOUR_MAKE=[[0.5,99.7],[1,93.4],[1.5,77.0],[2,61.2],[2.5,49.1],[3,40.1],
                 [4,27.9],[5,20.3],[6,15.3],[8,9.5],[10,6.4],[12,4.6],[15,3.0]];
function tourMakePct(m){
  if(m===null||m===undefined||isNaN(m)) return null;
  if(m<=TOUR_MAKE[0][0]) return TOUR_MAKE[0][1];
  const u=TOUR_MAKE[TOUR_MAKE.length-1];
  if(m>=u[0]) return u[1];
  for(let i=1;i<TOUR_MAKE.length;i++){
    const a=TOUR_MAKE[i-1], b=TOUR_MAKE[i];
    if(m<=b[0]) return a[1]+(b[1]-a[1])*(m-a[0])/(b[0]-a[0]);
  }
  return null;
}

/* tre-putt per fascia di PRIMO putt, e leave dopo il primo putt lungo (>=8 m).
   Riferimenti Tour: 9,5% di tre-putt oltre i 25 piedi; leave medio 0,69 m. */
function statPuttDerivato(A){
  const out=FASCE_PUTT.map(f=>({label:f[2],lo:f[0],hi:f[1],buche:0,tre:0,uno:0}));
  let leaveN=0, leaveVals=[];
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    const pt=b.colpi.filter(c=>c.lie==='green');
    if(!pt.length) return;
    const p1=pt[0];
    if(p1.distM===null||p1.distM===undefined) return;
    const f=out.find(x=>p1.distM>=x.lo && p1.distM<x.hi);
    if(f){ f.buche++; if(pt.length>=3) f.tre++; if(pt.length===1) f.uno++; }
    if(p1.distM>=8){ leaveN++; leaveVals.push(pt.length>=2 && pt[1].distM!==null ? pt[1].distM : 0); }
  }));
  return {fasce:out.filter(x=>x.buche>0),
    leave:{n:leaveN, media:leaveN?leaveVals.reduce((a,b)=>a+b,0)/leaveN:null, sd:scartoTipo(leaveVals)}};
}

/* conversioni di punteggio: metriche ShotLink a conteggio semplice */
function statConversioni(A){
  let buche=0, gir=0, girBirdie=0, bogeyPeggio=0, doppioPeggio=0, bounceOpp=0, bounceOk=0;
  /* v10: tre letture standard del Tour che mancavano.
     Reverse bounce back = bogey o peggio subito DOPO un birdie o meglio: il Tour la
     pubblica accanto al bounce back, ed e' la stessa domanda girata.
     Par breakers = quota di buche sotto il par.
     Rapporto birdie/bogey = quanti birdie per ogni bogey o peggio. */
  let revOpp=0, revKo=0, birdiePiu=0;
  const doppiPen={};
  A.forEach(g=>{
    let prevOver=false, prevUnder=false;
    g.bucheCalc.forEach(b=>{
      buche++;
      if(b.diff<=-1) birdiePiu++;
      if(prevUnder){ revOpp++; if(b.diff>=1) revKo++; }
      if(b.girHit){ gir++; if(b.diff<=-1) girBirdie++; }
      if(b.diff>=1) bogeyPeggio++;
      if(b.diff>=2){
        doppioPeggio++;
        const pens=(b.colpi||[]).filter(c=>c.penalita).map(c=>c.penTipo||'altro');
        const k=pens.length?pens[0]:'senza penalita\u2019';
        doppiPen[k]=(doppiPen[k]||0)+1;
      }
      if(prevOver){ bounceOpp++; if(b.diff<=-1) bounceOk++; }
      prevOver = b.diff>=1;
      prevUnder = b.diff<=-1;
    });
  });
  return {buche:buche, gir:gir, girBirdie:girBirdie, bogeyPeggio:bogeyPeggio,
          doppioPeggio:doppioPeggio, doppiPen:doppiPen, bounceOpp:bounceOpp, bounceOk:bounceOk,
          revOpp:revOpp, revKo:revKo, birdiePiu:birdiePiu,
          parBreakers: buche?100*birdiePiu/buche:null,
          rapporto: bogeyPeggio? birdiePiu/bogeyPeggio : null};
}

/* par 5: andare o non andare. Regola euristica DICHIARATA: secondo colpo
   giocato da oltre 200 m che finisce in green o entro 40 m = tentativo. */
function statPar5(A){
  const go={n:0,score:0,bird:0}, lay={n:0,score:0,bird:0};
  let fuoriRegola=0;
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    if(b.par!==5 || !b.colpi || b.colpi.length<2) return;
    const c2=b.colpi[1];
    if(c2.lie==='green' || c2.penalita || c2.distM===null || c2.distM===undefined) return;
    if(!(c2.distM>200)){ fuoriRegola++; return; }
    const dopo=b.colpi[2];
    const arrivato = !dopo || dopo.lie==='green' ||
      (dopo.distM!==null && dopo.distM!==undefined && dopo.distM<=ESITO_SOGLIA_M);
    const box = arrivato ? go : lay;
    box.n++; box.score+=b.diff; if(b.diff<=-1) box.bird++;
  }));
  return {go:go, lay:lay, fuoriRegola:fuoriRegola};
}

/* lato del colpo dal tee (v8): S/C/D sui par 4 e 5, dai giri grezzi */
function statLatoTee(giri){
  const conte={S:0,C:0,D:0}, fw={S:0,C:0,D:0};
  let opp=0;
  giri.forEach(g=>(g.buche||[]).forEach(b=>{
    const c0=(b.colpi||[])[0];
    if(!c0 || c0.lie!=='tee' || (b.par||4)<4) return;
    opp++;
    if(c0.latoTee && conte[c0.latoTee]!==undefined){
      conte[c0.latoTee]++;
      const c1=(b.colpi||[])[1];
      if(c1 && c1.lie==='fairway') fw[c0.latoTee]++;
    }
  }));
  return {conte:conte, fw:fw, tot:conte.S+conte.C+conte.D, opp:opp};
}

/* ══════════════════════════════════════════════════════════════════════════
   v9 — APPROCCI E GIOCO CORTO
   ══════════════════════════════════════════════════════════════════════════
   Tutto quello che segue e' derivato dai dati GIA' raccolti, tranne lo short-side
   che richiede la posizione della bandiera (campo nuovo, facoltativo). Ogni
   riferimento esterno porta la fonte e la sua classe: dato pubblicato con numeri,
   dato divulgato senza numerosita', oppure nessun riferimento esistente.       */

function mediana(a){
  if(!a || !a.length) return null;
  const d=a.slice().sort((x,y)=>x-y), n=d.length, m=n>>1;
  return n%2 ? d[m] : (d[m-1]+d[m])/2;
}
function interpCoppie(tab, x){
  if(x<=tab[0][0]) return tab[0][1];
  const u=tab[tab.length-1]; if(x>=u[0]) return u[1];
  for(let i=1;i<tab.length;i++){
    const a=tab[i-1], b=tab[i];
    if(x<=b[0]) return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);
  }
  return u[1];
}

/* ── FRL — prossimita' NORMALIZZATA ───────────────────────────────────────
   distanza residua / distanza di partenza. Broadie, "Assessing Golfer Performance
   Using Golfmetrics", Science and Golf V, 2008: circa 40.000 colpi, 500 giri,
   oltre 130 giocatori, 6 campi, 2005-2007. E' l'unico riferimento di prossimita'
   normalizzata pubblicato e primario, e si calcola sui dati che ci sono gia'.
   Risolve il problema per cui 12 m da 90 metri e 12 m da 180 non sono la stessa
   cosa e non si possono mettere nella stessa colonna.
   Broadie riporta la MEDIANA per gruppo di punteggio: qui si usa la mediana, e le
   fasce sono le sue, in yard, perche' altrimenti il confronto non e' lecito.
   Convenzione dichiarata: colpo imbucato = residua 0; i colpi con penalita' sono
   esclusi (il drop non e' il punto di arrivo della palla colpita).            */
const FRL_FASCE=[
  {k:'20-60',   lo:20,  hi:60,  label:'20\u201360 yd'},
  {k:'100-150', lo:100, hi:150, label:'100\u2013150 yd'}
];
const FRL_RIF={
  '20-60':  {fairway:[7.3,9.4,13.8,16.9,20.3], rough:[12.9,15.3,15.4,21.0,25.6]},
  '100-150':{fairway:[5.4,5.8,8.7,12.0,17.3],  rough:[11.1,12.8,10.4,13.5,18.4]}
};
const FRL_GRUPPI=[['Pro1','64\u201371'],['Pro2','72\u201379'],['Am1','70\u201383'],
                  ['Am2','84\u201397'],['Am3','97\u2013120']];
const FRL_TOT=[['Pro',16],['Am1',30],['Am2',40],['Am3',49]];

/* Collocazione sulla scala di Broadie. La scala del ROUGH non e' monotona nel
   paper (a 100-150 yd Am1 sta a 10,4% e Pro1 a 11,1%: un artefatto del suo
   campione), quindi non si puo' interpolare fra i gruppi come se fosse una retta.
   Si prende il gruppo piu' VICINO in valore assoluto, e la non monotonia viene
   dichiarata nella didascalia invece di essere nascosta da un'interpolazione. */
function frlCollocazione(med, ref){
  if(med===null || !ref || !ref.length) return null;
  let bi=0, bd=Infinity;
  ref.forEach((v,i)=>{ const d=Math.abs(med-v); if(d<bd){ bd=d; bi=i; } });
  const nome=FRL_GRUPPI[bi][0];
  if(med < ref[0]-0.5 && bi===0) return 'meglio di '+nome;
  if(med > ref[ref.length-1]+0.5 && bi===ref.length-1) return 'oltre '+nome;
  return nome;
}
function statFRL(A){
  const out=FRL_FASCE.map(f=>({k:f.k, lo:f.lo, hi:f.hi, label:f.label, fairway:[], rough:[], tutti:[]}));
  const globali=[];
  A.forEach(g=>g.bucheCalc.forEach(b=>b.colpi.forEach((c,i)=>{
    if(c.lie==='green' || c.penalita || !(c.distM>0)) return;
    const nx=b.colpi[i+1];
    if(nx && !(nx.distM>=0)) return;
    const res = nx ? (nx.distM||0) : 0;
    const frl = 100*res/c.distM;
    if(!isFinite(frl) || frl<0 || frl>300) return;
    const yd=c.distM*M_TO_YD;
    if(yd>=20) globali.push(frl);
    const f=out.find(x=>yd>=x.lo && yd<x.hi); if(!f) return;
    f.tutti.push(frl);
    if(c.lie==='fairway') f.fairway.push(frl);
    else if(c.lie==='rough') f.rough.push(frl);
  })));
  return {fasce: out.map(f=>({k:f.k, label:f.label,
      nTot:f.tutti.length, medTot:mediana(f.tutti),
      nFw:f.fairway.length, medFw:mediana(f.fairway),
      nRo:f.rough.length,   medRo:mediana(f.rough)})),
    globale:{n:globali.length, med:mediana(globali)}};
}

/* ── prossimita' di riferimento, due fonti dichiarate ─────────────────────
   PGA Tour, approcci DAL FAIRWAY, stagione 2022-23, per fascia di yard:
   50-75 yd 16'6" · 75-100 17'10" · 100-125 20'4" · 125-150 23'8" ·
   150-175 28'9" · 175-200 35'9".
   Shot Scope, giocatore scratch, fasce larghe: 50-100 yd 26 ft · 100-150 38 ft ·
   150-200 54 ft · oltre 200 92 ft — numerosita' NON dichiarata dalla fonte.
   Le fasce dell'app sono in metri: il riferimento si interpola al centro della
   fascia convertito in yard, e va letto come ordine di grandezza, non al piede. */
const TOUR_PROX_FT=[[62.5,16.5],[87.5,17.83],[112.5,20.33],[137.5,23.67],[162.5,28.75],[187.5,35.75]];
const SCRATCH_PROX_FT=[[75,26],[125,38],[175,54],[230,92]];
function proxRifM(centroM, quale){
  if(!(centroM>0)) return null;
  const ft=interpCoppie(quale==='scratch'?SCRATCH_PROX_FT:TOUR_PROX_FT, centroM*M_TO_YD);
  return ft/M_TO_FT;
}

/* ── le code, non la media ────────────────────────────────────────────────
   Broadie, Golfmetrics: per il golfista di medio handicap meno dell'8% degli
   swing produce oltre il 35% dei colpi persi. La media con due errori standard,
   che l'app mostra da v6, nasconde esattamente questo.
   Secondo riferimento, di classe piu' debole (Stagner su dati Arccos, numerosita'
   non dichiarata): da sotto le 100 yd il giocatore scratch finisce oltre 75 ft
   dalla buca il 4% delle volte, il 10 di handicap l'11%.                      */
const CODA_SG = -0.5;      // soglia dichiarata di "colpo disastro", in colpi persi
const CODA_QUOTA = 0.08;   // l'8% peggiore, per confronto diretto con Broadie
function statCode(A){
  const perFascia=FASCE_APP.map(f=>({label:f[2],lo:f[0],hi:f[1],n:0,bad:0}));
  const tuttiSg=[];
  let cortoN=0, cortoOltre=0;
  A.forEach(g=>g.bucheCalc.forEach(b=>b.colpi.forEach((c,i)=>{
    if(c.lie==='green') return;
    tuttiSg.push(c.sg);
    if(c.cat==='approccio'){
      const f=perFascia.find(x=>c.distM>=x.lo && c.distM<x.hi);
      if(f){ f.n++; if(c.sg<CODA_SG) f.bad++; }
    }
    if(!c.penalita && c.distM>0 && c.distM*M_TO_YD<=100){
      const nx=b.colpi[i+1];
      const res=nx?(nx.distM||0):0;
      cortoN++; if(res*M_TO_FT>75) cortoOltre++;
    }
  })));
  const persiTot=tuttiSg.filter(v=>v<0).reduce((s,v)=>s+v,0);
  const ord=tuttiSg.slice().sort((a,b)=>a-b);
  const k=Math.max(1, Math.round(CODA_QUOTA*ord.length));
  const persiPeggiori=ord.slice(0,k).reduce((s,v)=>s+Math.min(0,v),0);
  return {fasce:perFascia.filter(x=>x.n>0), nColpi:tuttiSg.length, k:k,
    quotaPeggiori: persiTot<0 ? 100*persiPeggiori/persiTot : null,
    corto:{n:cortoN, oltre:cortoOltre, pct: cortoN? 100*cortoOltre/cortoN : null}};
}

/* ── errore di distanza CON IL SEGNO, per fascia ──────────────────────────
   Dal settore e dal raggio residuo, entro la soglia geometrica.
   LETTURA INTERNA, e per questo senza colonna di riferimento: non esiste alcuna
   quantificazione primaria pubblicata del bias "corto" per fascia di distanza,
   ne' per i dilettanti ne' per il Tour. La frase di Broadie sulle ellissi tre
   volte piu' lunghe che larghe riguarda i colpi di gioco corto del gruppo Am2,
   non la fascia 40-200 m: portarla qui sarebbe un'inferenza travestita da dato. */
function statErroreLong(A){
  const out=FASCE_APP.map(f=>({label:f[2],lo:f[0],hi:f[1],vals:[],corti:0,lunghi:0,pari:0}));
  A.forEach(g=>g.bucheCalc.forEach(b=>b.colpi.forEach((c,i)=>{
    if(c.cat!=='approccio' || !c.esito || c.penalita) return;
    const nx=b.colpi[i+1];
    if(!nx || !(nx.distM>0) || nx.distM>ESITO_SOGLIA_M) return;
    const sc=scomponiEsito(c.esito, nx.distM); if(!sc) return;
    const f=out.find(x=>c.distM>=x.lo && c.distM<x.hi); if(!f) return;
    f.vals.push(sc.lungo);
    const e=ESITO_MAP[c.esito];
    if(e.sl<0) f.corti++; else if(e.sl>0) f.lunghi++; else f.pari++;
  })));
  return out.filter(x=>x.vals.length>0).map(x=>({label:x.label, n:x.vals.length,
    corti:x.corti, lunghi:x.lunghi, pari:x.pari, bias:media(x.vals),
    se:x.vals.length>=2?(scartoTipo(x.vals)||0)/Math.sqrt(x.vals.length):null,
    solido:x.vals.length>=N_MIN_FASCIA}));
}

/* ── gioco corto: up and down, colpi per finire, leave ────────────────────
   Riferimenti scratch Shot Scope, numerosita' non dichiarata dalla fonte:
   up and down 63% sotto le 25 yd, 32% fra 25 e 50 yd, sand save 37%,
   prossimita' media dopo il colpo corto 11 ft (3,35 m), colpi per finire da
   dentro le 50 yd 2,45. Riferimento Tour: 6 ft (1,83 m) da 20 yd dal fairway.
   REGOLA DICHIARATA: un solo tentativo per buca, il PRIMO colpo giocato da fuori
   dal green entro le 50 yd, qualunque colpo lo abbia prodotto — quindi include il
   pitch di terzo su un par 5, non solo lo scrambling dopo un green mancato.
   Contare ogni posizione conterebbe due volte la stessa buca quando il primo chip
   e' sbagliato, e gonfierebbe il denominatore proprio nei casi peggiori.       */
const CORTO_FASCE=[{k:'<25', lo:0,  hi:25, label:'sotto 25 yd (23 m)',        rif:63},
                   {k:'25-50',lo:25, hi:50, label:'25\u201350 yd (23\u201346 m)', rif:32}];
function statGiocoCorto(A){
  const fasce=CORTO_FASCE.map(f=>({k:f.k, lo:f.lo, hi:f.hi, label:f.label, rif:f.rif,
                                   n:0, ok:0, finire:[], leave:[]}));
  const perLie={fairway:{n:0,ok:0}, rough:{n:0,ok:0}, sabbia:{n:0,ok:0}, recupero:{n:0,ok:0}};
  let n=0, ok=0; const finire=[], leave=[];
  let sandN=0, sandOk=0;
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    const cs=b.colpi; let iAtt=-1;
    for(let i=1;i<cs.length;i++){
      const c=cs[i];
      if(c.lie==='green' || !(c.distM>0)) continue;
      if(c.distM*M_TO_YD>50) continue;
      iAtt=i; break;
    }
    if(iAtt<0) return;
    const c=cs[iAtt];
    let cpf=0;
    for(let j=iAtt;j<cs.length;j++) cpf += 1 + (cs[j].penalita?1:0);
    const nx=cs[iAtt+1];
    const res = nx ? (nx.distM||0) : 0;
    const riuscito = cpf<=2;
    n++; finire.push(cpf); leave.push(res); if(riuscito) ok++;
    const f=fasce.find(x=>{const yd=c.distM*M_TO_YD; return yd>=x.lo && yd<x.hi;});
    if(f){ f.n++; if(riuscito) f.ok++; f.finire.push(cpf); f.leave.push(res); }
    const pl=perLie[c.lie]; if(pl){ pl.n++; if(riuscito) pl.ok++; }
    if(c.lie==='sabbia'){ sandN++; if(riuscito) sandOk++; }
  }));
  return {n:n, ok:ok, pct: n?100*ok/n:null,
    finire: n?media(finire):null, leave: n?media(leave):null,
    leaveSd: leave.length>=3?scartoTipo(leave):null,
    fasce: fasce.filter(x=>x.n>0).map(x=>({k:x.k, label:x.label, rif:x.rif, n:x.n, ok:x.ok,
      pct:100*x.ok/x.n, finireM:media(x.finire), leaveM:media(x.leave),
      solido:x.n>=N_MIN_FASCIA})),
    perLie:perLie, sand:{n:sandN, ok:sandOk, pct:sandN?100*sandOk/sandN:null}};
}

/* ── difficolta' del colpo corto: i due bit nuovi ─────────────────────────
   Entro i 30 yd il lie DOMINA la difficolta', e "rough" mette insieme un pelato
   e un soffice, che sono due colpi diversi. Sono gli unici due campi nuovi
   richiesti sul colpo, entrambi facoltativi, su circa 7 colpi a giro.
   Nessun riferimento esterno pubblicato: lettura interna.                     */
const LIECORTO_OPZ=[{k:'pelato',n:'Pelato'},{k:'normale',n:'Normale'},{k:'soffice',n:'Soffice'}];
const LIECORTO_NOME={pelato:'pelato', normale:'normale', soffice:'soffice'};
function statDifficoltaCorto(A){
  const ost={si:{n:0,sg:0,leave:[]}, no:{n:0,sg:0,leave:[]}};
  const lc={pelato:{n:0,sg:0,leave:[]}, normale:{n:0,sg:0,leave:[]}, soffice:{n:0,sg:0,leave:[]}};
  let tot=0, conOst=0, conLc=0;
  A.forEach(g=>g.bucheCalc.forEach(b=>b.colpi.forEach((c,i)=>{
    if(c.cat!=='corto' || c.lie==='green' || c.penalita) return;
    tot++;
    const nx=b.colpi[i+1];
    const res=nx?(nx.distM||0):0;
    if(c.ostacolo===true || c.ostacolo===false){
      conOst++; const box=c.ostacolo?ost.si:ost.no;
      box.n++; box.sg+=c.sg; box.leave.push(res);
    }
    if(c.lieCorto && lc[c.lieCorto]){
      conLc++; const box=lc[c.lieCorto];
      box.n++; box.sg+=c.sg; box.leave.push(res);
    }
  })));
  const fin=o=>({n:o.n, sg:o.n?o.sg/o.n:null, leave:o.leave.length?media(o.leave):null});
  return {tot:tot, conOst:conOst, conLc:conLc,
    ost:{si:fin(ost.si), no:fin(ost.no)},
    lc:{pelato:fin(lc.pelato), normale:fin(lc.normale), soffice:fin(lc.soffice)}};
}

/* ── short-side ───────────────────────────────────────────────────────────
   Richiede la posizione della bandiera, campo v9. Regola dichiarata: si guardano
   i colpi verso il green che NON finiscono in green ed entro la soglia geometrica;
   il miss e' short-side se cade dallo stesso lato della bandiera (laterale) o sullo
   stesso estremo (corto con bandiera davanti, lungo con bandiera dietro). Se un
   asse dice short-side e l'altro long-side, vince short-side.
   NESSUN RIFERIMENTO ESTERNO, e va detto: non esiste alcun dato pubblicato sul
   costo in colpi di un miss short-side contro long-side, le statistiche PGA Tour
   non hanno lo split e DECADE non pubblica dataset. Questo numero e' una lettura
   interna e prescrittiva: serve alla scelta del bersaglio, non al confronto.
   Contesto quantitativo: sul Tour le bandiere stanno tipicamente 9-15 ft dal bordo
   contro una dispersione laterale totale di 42,6 ft da 184 yd (Trackman), cioe' a
   quelle distanze lo short-side non si evita con la precisione.                */
function statShortSide(A){
  let opp=0, short=0, lungo=0, neutro=0, sgS=0, sgL=0, buche=0, conPin=0;
  A.forEach(g=>g.bucheCalc.forEach((b,bi)=>{
    buche++;
    const pin=((g.buche||[])[bi]||{}).posizionePin;
    if(!pin || !ESITO_MAP[pin]) return;
    conPin++;
    const P=ESITO_MAP[pin];
    b.colpi.forEach((c,i)=>{
      if(c.lie==='green' || c.cat==='tee' || c.penalita || !c.esito) return;
      const nx=b.colpi[i+1];
      if(!nx || nx.lie==='green' || !(nx.distM>0) || nx.distM>ESITO_SOGLIA_M) return;
      const E=ESITO_MAP[c.esito]; if(!E) return;
      opp++;
      const ss = (P.sx!==0 && E.sx===P.sx) || (P.sl!==0 && E.sl===P.sl);
      const ls = (P.sx!==0 && E.sx===-P.sx) || (P.sl!==0 && E.sl===-P.sl);
      if(ss){ short++; sgS+=c.sg; }
      else if(ls){ lungo++; sgL+=c.sg; }
      else neutro++;
    });
  }));
  return {opp:opp, short:short, lungo:lungo, neutro:neutro, buche:buche, conPin:conPin,
    pctShort: opp?100*short/opp:null,
    sgShort: short?sgS/short:null, sgLong: lungo?sgL/lungo:null};
}

/* ── scarto fra la baseline ricostruita del gioco corto e la retta ────────
   Serve al pannello di validazione in Impostazioni: mostra la tabella nei due
   modi, il controllo fuori intervallo, e quanto cambierebbe lo SG di gioco corto
   sui giri realmente registrati. Non tocca nessuna impostazione: calcola e basta. */
function validaBaseCorto(){
  const righe=[];
  for(let yd=1; yd<=10; yd++){
    const r={yd:yd};
    ['fairway','rough','sabbia'].forEach(l=>{
      r[l]={ric:attesiCortoTour(l,yd), lin:2.0+(TOUR_LONG[l][10]-2.0)*(yd/10)};
    });
    righe.push(r);
  }
  const fuori=[];
  [20,30].forEach(yd=>['fairway','rough','sabbia'].forEach(l=>{
    fuori.push({lie:l, yd:yd, ric:attesiCortoTour(l,yd), pub:interp(TOUR_LONG[l],yd)});
  }));
  /* Effetto sui giri veri. Attenzione a una proprieta' che il collaudo ha messo in
     luce e che va detta: cambiare la superficie dei colpi attesi sotto le 10 yd non
     tocca SOLO il gioco corto. Lo strokes gained di un colpo e' attesi(partenza) -
     attesi(arrivo) - 1, quindi cambia anche per un APPROCCIO che finisce appena
     fuori dal green, dove il valore di arrivo e' quello ricostruito.
     E c'e' di piu': la somma degli SG di un giro e' telescopica, quindi il TOTALE
     del giro non cambia di un millesimo. La ricostruzione non peggiora ne' migliora
     il giro: RIDISTRIBUISCE colpi fra approcci e gioco corto, cioe' sposta il
     confine di dove finisce un colpo e comincia l'altro. Ed e' proprio quello che
     ci si aspetta da una correzione del metro, non del gioco. */
  const giri=LS.get('hcp_giri',[]).filter(formatoCompleto);
  let delta=null, nG=0, dCat=null, dTot=null;
  if(giri.length){
    const prima=_BASE_CORTO;
    _BASE_CORTO=false; const a=giri.map(g=>analizzaGiro(g,'tour'));
    _BASE_CORTO=true;  const b=giri.map(g=>analizzaGiro(g,'tour'));
    _BASE_CORTO=prima;
    nG=giri.length;
    dCat={};
    ['tee','approccio','corto','putting'].forEach(k=>{
      dCat[k]= media(b.map(g=>g.calc.sgCat[k])) - media(a.map(g=>g.calc.sgCat[k]));
    });
    delta=dCat.corto;
    dTot = media(b.map(g=>g.calc.sgTot)) - media(a.map(g=>g.calc.sgTot));
  }
  return {righe:righe, fuori:fuori, k:CORTO_K, delta:delta, dCat:dCat, dTot:dTot, nGiri:nG};
}

/* ══════════════════════════════════════════════════════════════════════════
   v10 — LE METRICHE CHE LE ALTRE APP HANNO E NOI NO
   ══════════════════════════════════════════════════════════════════════════
   Tutte derivate dallo schema v9, nessun campo nuovo, nessun tocco in campo.
   Fonti e classe di ogni riferimento nel documento
   03-Metodo-e-riferimenti/19-08-2026-confronto-metriche-app-e-lacune.md      */

/* ── GIOCO LUNGO DAL TEE ───────────────────────────────────────────────────
   GOOD DRIVE: su par 4 e 5, fairway centrati PIU' i casi in cui il drive ha
   mancato il fairway ma la buca e' arrivata in green in regulation. Il FIR
   punisce allo stesso modo il rough a due metri e la palla ingiocabile; questo
   misura cio' che al drive si chiede davvero, cioe' non compromettere la buca.
   Riferimenti Anova Golf: PGA Tour 82,5% · college maschile 83% · Pac-12 84,5%.
   Regola dichiarata: un drive con penalita' non e' mai "buono", qualunque sia il
   lie di arrivo dopo il drop.
   DISTANZA RESIDUA: quanto resta al buco dopo il drive, par 4 e par 5 separati.
   E' l'unico numero che fonde distanza e precisione in una cosa sola. I drive con
   penalita' sono esclusi: dopo un OB la residua e' quella del tee e falserebbe la
   media. Riferimento studio ShotLink R09: Tour par 4 146,5-151,7 yd (134-139 m),
   par 5 262,9-270,7 yd (240-248 m).
   RECUPERO: i colpi senza linea diretta verso il green, per giro. Il campo lo
   avevamo, ma solo nel pannello di qualita' del dato come audit della deriva di
   classificazione: la' controlla il giudice, qui misura il gioco.
   Riferimento Arccos, fra il giro migliore e il peggiore dello stesso giocatore:
   scratch 0,39 -> 1,19 · handicap 5 0,71 -> 1,75 · handicap 10 1,18 -> 2,38.   */
function statDriving(A){
  const nGiri=A.length;
  let opp=0, good=0, trouble=0, rec=0;
  const res4=[], res5=[];
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    b.colpi.forEach(c=>{ if(c.lie==='recupero') rec++; });
    const c0=b.colpi[0];
    if(!c0 || c0.lie!=='tee' || b.par<4) return;
    opp++;
    const c1=b.colpi[1] || null;
    const pen=!!c0.penalita;
    const arrivo=c1?c1.lie:null;
    if(!pen && (arrivo==='fairway' || arrivo==='green' || b.girHit)) good++;
    if(pen || arrivo==='recupero') trouble++;
    if(!pen && c1 && c1.distM>0) (b.par>=5?res5:res4).push(c1.distM);
  }));
  return {nGiri:nGiri, opp:opp, good:good, pct: opp?100*good/opp:null,
    trouble:trouble, troubleGiro: nGiri?trouble/nGiri:null,
    rec:rec, recGiro: nGiri?rec/nGiri:null,
    res4:{n:res4.length, m:res4.length?media(res4):null},
    res5:{n:res5.length, m:res5.length?media(res5):null}};
}

/* ── PUTTING: le due letture che SEPARANO ──────────────────────────────────
   PUTT PER GIR: i putt sulle sole buche prese in regulation, cioe' il putting al
   netto della qualita' dell'approccio. Il Tour la chiama GIR Putting Average;
   la mostrano anche TheGrint e Hole19. Nessun riferimento numerico pubblicato
   che abbia superato la verifica: il confronto e' con la propria finestra stabile.
   DISTANZA DEL PRIMO PUTT: e' l'approccio misurato dal punto di vista del putt.
   Data due volte: su tutte le buche e sulle sole buche in GIR, che e' la versione
   pulita (senza i chip finiti vicini). Riferimento amatoriale ~15 ft (4,6 m,
   GolfWRX); prossimita' media d'approccio scratch 41,7 ft (12,7 m) contro 68 ft
   dell'handicap 15 (Arccos) — grandezza affine, non la stessa cosa.
   PUTT CORTI MANCATI entro 5 ft, per giro. Riferimento Shot Scope per fascia di
   punteggio: 4,6 (giri in 100) · 3,6 (90) · 2,7 (80) · 1,9 (70) · 1,6 (60).
   FOOTAGE: metri totali di putt imbucati per giro (Shot Scope).               */
const PUTT_CORTO_M = 5/M_TO_FT;      // cinque piedi
function statPuttAvanzato(A){
  const nGiri=A.length;
  let girN=0, girPutt=0, corti=0, cortiMancati=0, footage=0;
  const primo=[], primoGir=[];
  A.forEach(g=>g.bucheCalc.forEach((b,bi)=>{
    const compl = ((g.buche||[])[bi]||{}).completata!==false;
    const pt=b.colpi.filter(c=>c.lie==='green');
    if(b.girHit){ girN++; girPutt+=b.putt; }
    if(pt.length && pt[0].distM>0){ primo.push(pt[0].distM); if(b.girHit) primoGir.push(pt[0].distM); }
    pt.forEach((x,i)=>{
      const ultimo = i===pt.length-1;
      const imbucato = ultimo && compl && b.colpi[b.colpi.length-1]===x;
      if(imbucato) footage += (x.distM||0);
      if(x.distM>0 && x.distM<=PUTT_CORTO_M){ corti++; if(!imbucato) cortiMancati++; }
    });
  }));
  return {nGiri:nGiri, girN:girN, puttGir: girN? girPutt/girN : null,
    primo: primo.length?media(primo):null, nPrimo:primo.length,
    primoGir: primoGir.length?media(primoGir):null, nPrimoGir:primoGir.length,
    corti:corti, cortiMancati:cortiMancati,
    cortiMancatiGiro: nGiri? cortiMancati/nGiri : null,
    cortiPct: corti? 100*(corti-cortiMancati)/corti : null,
    footageGiro: nGiri? footage/nGiri : null};
}

/* ── RENDIMENTO PER FASCIA DI STROKE INDEX ─────────────────────────────────
   Lo stroke index sta in ogni buca da sempre, copiato dall'archivio campi alla
   creazione del giro, e non era mai entrato in nessuna analisi.
   NESSUNA piattaforma di gioco lo espone (esiste solo lato handicapping): questa
   e' una lettura originale, non una copia — e per il ponte verso lo storico
   federale e' la piu' promettente che abbiamo.                                */
const SI_FASCE=[{k:'1-6',  lo:1,  hi:6,  nome:'SI 1\u20136, le sei difficili'},
                {k:'7-12', lo:7,  hi:12, nome:'SI 7\u201312, le sei centrali'},
                {k:'13-18',lo:13, hi:18, nome:'SI 13\u201318, le sei facili'}];
function statPerSI(A){
  const out=SI_FASCE.map(f=>({k:f.k, nome:f.nome, lo:f.lo, hi:f.hi,
    nb:0, diff:0, gir:0, putt:0, sg:0, nSg:0, bogeyPiu:0, birdie:0}));
  let senzaSI=0;
  A.forEach(g=>g.bucheCalc.forEach((b,bi)=>{
    const si=((g.buche||[])[bi]||{}).si;
    if(!(si>=1 && si<=18)){ senzaSI++; return; }
    const f=out.find(x=>si>=x.lo && si<=x.hi); if(!f) return;
    f.nb++; f.diff+=b.diff; f.putt+=b.putt;
    if(b.girHit) f.gir++;
    if(b.diff>=1) f.bogeyPiu++;
    if(b.diff<=-1) f.birdie++;
    if(b.sg!==null && b.sg!==undefined){ f.sg+=b.sg; f.nSg++; }
  }));
  return {fasce: out.filter(x=>x.nb>0).map(x=>({k:x.k, nome:x.nome, n:x.nb,
      media:x.diff/x.nb, girPct:100*x.gir/x.nb, puttB:x.putt/x.nb,
      bogeyPct:100*x.bogeyPiu/x.nb, birdiePct:100*x.birdie/x.nb,
      sgB: x.nSg? x.sg/x.nSg : null, solido:x.nb>=N_MIN_FASCIA})),
    senzaSI:senzaSI};
}

/* ── CHIP MULTIPLI entro le 50 yard ───────────────────────────────────────
   Quante volte a giro serve PIU' DI UN colpo di gioco corto per arrivare in green.
   E' il complemento esatto dell'up and down: la nostra regola "un tentativo per
   buca" esclude per costruzione il secondo chip, cioe' il caso peggiore.
   Riferimento Shot Scope per fascia di punteggio: 4,1 (giri in 100) · 3,2 (90) ·
   2,1 (80) · 1,2 (70) · 0,9 (60).                                            */
function statChipMultipli(A){
  const nGiri=A.length;
  let buche=0, multi=0, colpi=0;
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    buche++;
    let k=0;
    b.colpi.forEach((c,i)=>{
      if(i>0 && c.lie!=='green' && c.distM>0 && c.distM*M_TO_YD<=50) k++;
    });
    colpi+=k;
    if(k>=2) multi++;
  }));
  return {nGiri:nGiri, buche:buche, multi:multi,
    perGiro: nGiri? multi/nGiri : null, pct: buche? 100*multi/buche : null,
    colpiGiro: nGiri? colpi/nGiri : null};
}

/* ── BUNKER: greenside contro fairway ─────────────────────────────────────
   Il sand save conta solo entro le 30 yard, quindi il bunker di fairway non era
   misurato da nessuna parte. Il Tour li separa (Fairway Bunker Tendency,
   GIR Pct. Fairway Bunker).
   Riferimento Shot Scope sul costo a punteggio, con un esito controintuitivo:
   per lo SCRATCH il greenside costa +0,43 e il fairway +0,19; all'handicap 20 si
   inverte (+0,42 contro +0,55). Classe: dato divulgato senza numerosita'.     */
function statBunker(A){
  const nGiri=A.length;
  const mk=()=>({n:0, sg:0, buche:0, diff:0, gir:0});
  const gs=mk(), fw=mk();
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    let hasG=false, hasF=false;
    b.colpi.forEach(c=>{
      if(c.lie!=='sabbia' || !(c.distM>0)) return;
      const greenside = c.distM*M_TO_YD<=30;
      const box = greenside? gs : fw;
      box.n++; box.sg += (c.sg||0);
      if(greenside) hasG=true; else hasF=true;
    });
    if(hasG){ gs.buche++; gs.diff+=b.diff; if(b.girHit) gs.gir++; }
    if(hasF){ fw.buche++; fw.diff+=b.diff; if(b.girHit) fw.gir++; }
  }));
  const fin=o=>({n:o.n, perGiro: nGiri? o.n/nGiri : null, sg: o.n? o.sg/o.n : null,
    buche:o.buche, costo: o.buche? o.diff/o.buche : null,
    girPct: o.buche? 100*o.gir/o.buche : null, solido:o.n>=N_MIN_FASCIA});
  return {greenside:fin(gs), fairway:fin(fw), nGiri:nGiri};
}

/* ── QUANTO RENDE OGNI BASTONE VERSO IL GREEN ─────────────────────────────
   Shot Scope mostra green success by club e average proximity by club, Arccos il
   GIR per bastone. Noi avevamo distanza e dispersione per bastone, ma non quanto
   RENDE ciascuno verso il green: e' l'informazione che serve alla scelta.      */
function statBastoneVerde(A){
  const m={};
  A.forEach(g=>g.bucheCalc.forEach(b=>b.colpi.forEach((c,i)=>{
    if(c.lie==='green' || c.penalita) return;
    if(c.cat!=='approccio' && c.cat!=='corto') return;
    const k=c.bastone; if(!k) return;
    if(!m[k]) m[k]={bastone:k, n:0, green:0, prox:[], da:[], sg:0};
    const x=m[k];
    x.n++; x.da.push(c.distM); x.sg+=(c.sg||0);
    const nx=b.colpi[i+1];
    if(!nx){ x.green++; x.prox.push(0); }
    else if(nx.lie==='green'){ x.green++; x.prox.push(nx.distM); }
  })));
  return Object.values(m).map(x=>({bastone:x.bastone, n:x.n,
    greenPct: 100*x.green/x.n,
    prox: x.prox.length? media(x.prox) : null,
    da: x.da.length? media(x.da) : null,
    sgColpo: x.sg/x.n, solido: x.n>=N_MIN_FASCIA}))
    .sort((a,b)=>(b.da||0)-(a.da||0));
}

/* ── GAPPING DEI BASTONI ──────────────────────────────────────────────────
   Shot Scope e Arccos lo fanno; FlightScope consiglia 10-15 yard di carry fra
   bastoni adiacenti. Qui il salto e' fra i 70esimi percentili.
   ⚠️ APPROSSIMATO, e va dichiarato: noi misuriamo la distanza PERCORSA
   (corretta col settore), non il carry. Un bastone che rotola molto sembra piu'
   lungo di quanto porta in aria, quindi i salti sono indicativi.              */
const GAP_MIN_M = 6, GAP_MAX_M = 14;
function statGapping(bast){
  const c=(bast||[]).filter(b=>b.bastone!=='Putter' && b.p70!==null && b.p70!==undefined && b.nMis>=5)
    .slice().sort((a,b)=>b.p70-a.p70);
  const righe=[];
  for(let i=0;i<c.length-1;i++){
    const gap=c[i].p70-c[i+1].p70;
    righe.push({a:c[i].bastone, b:c[i+1].bastone, p70a:c[i].p70, p70b:c[i+1].p70, gap:gap,
      stato: gap>GAP_MAX_M? 'buco' : (gap<GAP_MIN_M? 'sovrapposti' : 'ok')});
  }
  return {righe:righe, n:c.length,
    buchi:righe.filter(x=>x.stato==='buco').length,
    sovrapposti:righe.filter(x=>x.stato==='sovrapposti').length};
}

/* ── IL LIVELLO, REPARTO PER REPARTO ─────────────────────────────────────
   Broadie in Golfmetrics esprime ogni reparto come un HANDICAP, e Clippd fa la
   stessa mossa con una scala 0-200 di cui non pubblica la formula. E' una
   traduzione che mancava: "putting -0,8 colpi/giro" e' corretto e astratto.
   Costruzione dichiarata, in due passi verificabili:
   1. la scala colpi-sul-par -> handicap e' quella pubblicata da Shot Scope
      (hcp 0 +0,83 · 5 +6,33 · 10 +10,88 · 15 +17,38 · 20 +21,69 · 25 +28,97),
      interpolata linearmente. Classe: dato divulgato senza numerosita';
   2. per ogni reparto si calcola il CONTROFATTUALE: che punteggio faresti se quel
      reparto fosse al livello della baseline, lasciando gli altri come sono. Il
      livello equivalente di quel punteggio e' il numero mostrato.
   LIMITE DICHIARATO: la scala e' sul punteggio rispetto al PAR, non al CR. Su un
   campo dove il CR supera il par (Colline del Gavi: CR 74,2, par 73) il livello
   esce pessimistico di circa un colpo. Non e' un indice WHS e non lo sostituisce:
   quello vero sta nella Dashboard, sulle 386 gare.                            */
const LADDER_HCP=[[0,0.83],[5,6.33],[10,10.88],[15,17.38],[20,21.69],[25,28.97]];
function livelloDaVsPar(v){
  if(v===null||v===undefined||isNaN(v)) return null;
  if(v<=LADDER_HCP[0][1]) return 0;
  const u=LADDER_HCP[LADDER_HCP.length-1];
  if(v>=u[1]) return u[0];
  for(let i=1;i<LADDER_HCP.length;i++){
    const a=LADDER_HCP[i-1], b=LADDER_HCP[i];
    if(v<=b[1]) return a[0]+(b[0]-a[0])*(v-a[1])/(b[1]-a[1]);
  }
  return u[0];
}
function statLivelli(A){
  const C=A.filter(g=>g.completo);
  if(C.length<3) return null;
  const bMedie=media(C.map(g=>g.calc.nBuche));
  const per18 = bMedie>0 ? 18/bMedie : 1;
  const vsPar=media(C.map(g=>g.calc.score-g.calc.par))*per18;
  const cats=['tee','approccio','corto','putting'];
  const out={n:C.length, vsPar:vsPar, livello:livelloDaVsPar(vsPar), per18:per18, cat:{}};
  cats.forEach(k=>{
    const sg=media(C.map(g=>g.calc.sgCat[k]))*per18;
    const v2=vsPar+sg;                      // sg negativo => il punteggio migliora
    const l2=livelloDaVsPar(v2);
    out.cat[k]={sg:sg, vsPar:v2, livello:l2, guadagno: out.livello!==null&&l2!==null? out.livello-l2 : null};
  });
  return out;
}

/* ── SCORE POTENZIALE DI UN GIRO ─────────────────────────────────────────
   Arccos lo chiama Round Potential e lo calcola sul percentile del "goal
   handicap". Qui il termine di confronto e' la TUA abitudine — la finestra
   stabile di 20 giri — che per un giro singolo e' il metro giusto: "questo giro,
   col tuo putting solito, sarebbe stato X". Si contano solo i reparti andati
   SOTTO l'abitudine: un reparto andato meglio del solito non e' un colpo
   "recuperabile", e sommarlo gonfierebbe il potenziale.                       */
function statPotenziale(a, MS){
  if(!a || !a.completo || !MS) return null;
  const cats=['tee','approccio','corto','putting'];
  const per18 = a.calc.nBuche>0 ? 18/a.calc.nBuche : 1;
  const righe=[];
  cats.forEach(k=>{
    const d=(a.calc.sgCat[k]*per18) - MS.cat[k];
    if(d < -0.05) righe.push({cat:k, delta:-d});
  });
  righe.sort((x,y)=>y.delta-x.delta);
  const tot=righe.reduce((s,x)=>s+x.delta,0)/per18;
  return {score:a.calc.score, righe:righe, recuperabili:tot,
    potenziale: a.calc.score-tot, nRif:MS.n};
}

/* ── ARCO DEL GIRO ──────────────────────────────────────────────────────
   Lo strokes gained CUMULATO buca per buca: dove il giro si e' deciso. Arccos la
   chiama Round Arc. I sei blocchi da tre buche che avevamo sono un'aggregazione
   piu' grossolana della stessa informazione; sul giro singolo la curva e'
   strettamente migliore.                                                      */
function statArco(a){
  if(!a || !a.completo) return null;
  let cum=0; const punti=[], sg=[];
  a.bucheCalc.forEach(b=>{ cum+=(b.sg||0); sg.push(b.sg||0); punti.push({x:String(b.buca), y:cum}); });
  let best=null, worst=null;
  const W=3;
  for(let i=0;i+W<=sg.length;i++){
    const s=sg.slice(i,i+W).reduce((t,v)=>t+v,0);
    if(!best || s>best.s) best={i:i, s:s};
    if(!worst || s<worst.s) worst={i:i, s:s};
  }
  return {punti:punti, tot:cum, best:best, worst:worst, W:W};
}

/* ══════════════════════════════════════════════════════════════════════════
   v11 — IL CATALOGO PGA TOUR APPLICATO A UN SINGOLO GIOCATORE
   ══════════════════════════════════════════════════════════════════════════
   Le statistiche di pgatour.com/stats che si possono calcolare su un dataset
   personale, escluse Money e Points. Le fasce sono convertite in METRI.
   Cosa resta fuori, e perche', e' scritto nel documento
   03-Metodo-e-riferimenti/20-08-2026-catalogo-pga-tour-applicato.md
   In breve: tutto cio' che richiede il campo dei concorrenti (Scoring Average
   Adjusted, Total Driving, Ball Striking, Total Putting, gli SG "vs field"),
   le coordinate laterali (Distance from Edge/Center of Fairway, Left/Right
   Tendency), un radar (Club Head Speed, Smash Factor, Spin Rate...) o il taglio
   del torneo (Consecutive Cuts, Final Round Performance).                     */

/* ── OFF THE TEE: dove finisce quando manca il fairway ─────────────────────
   Rough Tendency (con lato), Fairway Bunker Tendency, Missed Fairway Percent
   Other e Driving Accuracy: sul Tour le quattro sommano a 100%.
   Il lato viene dal campo latoTee, quindi esiste solo dove l'hai segnato: le
   percentuali di lato sono calcolate sui soli drive con il lato dichiarato.   */
function statMissFairway(A){
  let tot=0, fw=0, rough=0, roughSx=0, roughDx=0, roughNd=0, bunker=0, altro=0, pen=0, conLato=0;
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    const c0=b.colpi[0];
    if(!c0 || c0.lie!=='tee' || b.par<4) return;
    tot++;
    if(c0.penalita){ pen++; return; }
    const c1=b.colpi[1];
    const l=c1?c1.lie:null;
    if(l==='fairway' || l==='green'){ fw++; return; }
    if(l==='rough'){
      rough++;
      if(c0.latoTee==='S'){ roughSx++; conLato++; }
      else if(c0.latoTee==='D'){ roughDx++; conLato++; }
      else if(c0.latoTee==='C'){ roughNd++; conLato++; }
      else roughNd++;
      return;
    }
    if(l==='sabbia'){ bunker++; return; }
    altro++;
  }));
  const q=v=>tot? 100*v/tot : null;
  return {tot:tot, fw:fw, fwPct:q(fw), rough:rough, roughPct:q(rough),
    roughSx:roughSx, roughDx:roughDx, roughNd:roughNd, conLato:conLato,
    bunker:bunker, bunkerPct:q(bunker), altro:altro, altroPct:q(altro),
    pen:pen, penPct:q(pen)};
}

/* ── OFF THE TEE: % of Yardage covered by Tee Shots ───────────────────────
   Distanza percorsa dal colpo dal tee diviso la lunghezza della buca, su par 4
   e par 5, poi separati. Usa percorsaColpo, quindi tiene conto del settore.   */
function statYardage(A){
  const tutti=[], p4=[], p5=[];
  let dMax=null;
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    const c0=b.colpi[0];
    if(!c0 || c0.lie!=='tee' || b.par<4 || !(b.distanza>0) || c0.penalita) return;
    const pc=percorsaColpo(b.colpi,0);
    if(!pc || !(pc.d>0)) return;
    if(dMax===null || pc.d>dMax) dMax=pc.d;
    const q=100*pc.d/b.distanza;
    if(q<=0 || q>130) return;
    tutti.push(q); (b.par>=5?p5:p4).push(q);
  }));
  return {n:tutti.length, tot: tutti.length?media(tutti):null,
    p4:{n:p4.length, m:p4.length?media(p4):null},
    p5:{n:p5.length, m:p5.length?media(p5):null}, dMax:dMax};
}

/* ── APPROACH: GIR per lie di partenza, e sopra/sotto i 91 m ──────────────
   Il Tour pubblica GIR Percentage from Fairway, from Fairway Bunker e from
   Other than Fairway. E "Approaches from > 100 yards / inside 100 yards", che
   misurano la PROSSIMITA', non il GIR: 91,44 m sono 100 yard.               */
const CENTO_YD_M = 100/M_TO_YD;
function statApproccioLie(A){
  const mk=()=>({n:0, green:0, prox:[]});
  const per={fairway:mk(), rough:mk(), sabbia:mk(), recupero:mk()};
  const sopra=mk(), sotto=mk();
  A.forEach(g=>g.bucheCalc.forEach(b=>b.colpi.forEach((c,i)=>{
    if(c.cat!=='approccio' || c.penalita) return;
    const nx=b.colpi[i+1];
    const inGreen = !nx || nx.lie==='green';
    const prox = !nx ? 0 : (nx.lie==='green' ? nx.distM : null);
    const add=box=>{ box.n++; if(inGreen){ box.green++; if(prox!==null) box.prox.push(prox); } };
    if(per[c.lie]) add(per[c.lie]);
    add(c.distM>=CENTO_YD_M ? sopra : sotto);
  })));
  const fin=o=>({n:o.n, greenPct:o.n?100*o.green/o.n:null,
    prox:o.prox.length?media(o.prox):null, solido:o.n>=N_MIN_FASCIA});
  return {per:{fairway:fin(per.fairway), rough:fin(per.rough),
    sabbia:fin(per.sabbia), recupero:fin(per.recupero)},
    sopra:fin(sopra), sotto:fin(sotto)};
}

/* ── APPROACH: da che distanza nascono birdie e bogey ─────────────────────
   Average Approach Distance - Birdie or Better / Par / Bogey or Worse.       */
function statApproccioEsito(A){
  const b={n:0,d:[]}, p={n:0,d:[]}, w={n:0,d:[]};
  A.forEach(g=>g.bucheCalc.forEach(bu=>{
    const app=bu.colpi.filter(c=>c.cat==='approccio' && !c.penalita && c.distM>0);
    if(!app.length) return;
    const ult=app[app.length-1];
    const box = bu.diff<=-1 ? b : (bu.diff===0 ? p : w);
    box.n++; box.d.push(ult.distM);
  }));
  const fin=o=>({n:o.n, m:o.d.length?media(o.d):null, solido:o.n>=N_MIN_FASCIA});
  return {birdie:fin(b), par:fin(p), bogey:fin(w)};
}

/* ── APPROACH: birdie e punteggio per fascia (la famiglia RTP) ────────────
   Birdie or Better Percentage per fascia e "RTP Score", cioe' il punteggio
   medio della buca relativo al par condizionato alla fascia di partenza.
   Stesse fasce della tabella degli approcci, domanda diversa: non quanto e'
   buono il colpo, ma come finisce la buca.                                   */
function statRTPFasce(A){
  const out=FASCE_APP.map(f=>({label:f[2], lo:f[0], hi:f[1], n:0, diff:0, birdie:0, bogey:0}));
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    const app=b.colpi.filter(c=>c.cat==='approccio' && !c.penalita && c.distM>0);
    if(!app.length) return;
    const d=app[app.length-1].distM;
    const f=out.find(x=>d>=x.lo && d<x.hi); if(!f) return;
    f.n++; f.diff+=b.diff;
    if(b.diff<=-1) f.birdie++;
    if(b.diff>=1) f.bogey++;
  }));
  return out.filter(x=>x.n>0).map(x=>({label:x.label, n:x.n, rtp:x.diff/x.n,
    birdiePct:100*x.birdie/x.n, bogeyPct:100*x.bogey/x.n, solido:x.n>=N_MIN_FASCIA}));
}

/* ── APPROACH: holeouts ──────────────────────────────────────────────────
   Total Hole Outs e Longest Hole Out. Un holeout e' la palla in buca da un
   colpo giocato FUORI dal green: approccio, chip, bunker, o il tee di un par 3
   (hole in one). I putt dal green non contano.                               */
function statHoleouts(A){
  const nGiri=A.length; const d=[];
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    const ult=b.colpi[b.colpi.length-1];
    if(!ult || ult.lie==='green' || !(ult.distM>0)) return;
    d.push(ult.distM);
  }));
  return {n:d.length, perGiro:nGiri?d.length/nGiri:null,
    media:d.length?media(d):null, max:d.length?Math.max.apply(null,d):null, nGiri:nGiri};
}

/* ── AROUND THE GREEN: scrambling nella definizione ShotLink ──────────────
   Scrambling = percentuale delle buche in cui, MANCATO il green in regulation,
   si fa par o meglio. E' una cosa diversa dall'up and down (palla in buca in due
   colpi da fuori dal green): un chip perfetto seguito da un bogey e' up and down
   riuscito e scrambling mancato.
   Fascia: distanza del primo colpo giocato da fuori dal green DOPO che il green
   e' stato mancato in regulation, cioe' dal colpo di indice par-2 in avanti.
   Fasce ShotLink (<10, 10-20, 20-30, >30 yard) convertite in metri.
   ⚠ Il Tour misura quelle distanze dal CENTRO DEL GREEN, noi dalla bandiera:
   e' una differenza di qualche metro, sempre nello stesso verso.            */
const SCR_FASCE=[{lo:0,hi:9,label:'fino a 9 m'},{lo:9,hi:18,label:'9\u201318 m'},
                 {lo:18,hi:27,label:'18\u201327 m'},{lo:27,hi:9999,label:'oltre 27 m'}];
function statScramblingTour(A){
  const fasce=SCR_FASCE.map(f=>({label:f.label, lo:f.lo, hi:f.hi, n:0, ok:0, d:[]}));
  const perLie={rough:{n:0,ok:0}, sabbia:{n:0,ok:0}, altro:{n:0,ok:0}};
  let n=0, ok=0; const dist=[], leave=[];
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    if(b.girHit) return;
    const cs=b.colpi;
    const iMin=Math.max(1, b.par-2);
    let idx=-1;
    for(let i=iMin;i<cs.length;i++){ if(cs[i].lie!=='green' && cs[i].distM>0){ idx=i; break; } }
    if(idx<0) return;
    const c=cs[idx], riuscito = b.diff<=0;
    n++; if(riuscito) ok++;
    dist.push(c.distM);
    const nx=cs[idx+1];
    leave.push(nx? (nx.distM||0) : 0);
    const f=fasce.find(x=>c.distM>=x.lo && c.distM<x.hi);
    if(f){ f.n++; if(riuscito) f.ok++; f.d.push(c.distM); }
    const kl = c.lie==='rough'?'rough' : (c.lie==='sabbia'?'sabbia':'altro');
    perLie[kl].n++; if(riuscito) perLie[kl].ok++;
  }));
  return {n:n, ok:ok, pct:n?100*ok/n:null,
    dist:dist.length?media(dist):null, leave:leave.length?media(leave):null,
    fasce:fasce.filter(x=>x.n>0).map(x=>({label:x.label, n:x.n, ok:x.ok,
      pct:100*x.ok/x.n, dMedia:media(x.d), solido:x.n>=N_MIN_FASCIA})),
    perLie:perLie};
}

/* ── PUTTING: i numeri del Tour ───────────────────────────────────────────
   1/2/3/3+ Putts per Round, Putting Inside 10' (3,05 m), Putts Made Over
   10'/20' (3,05 e 6,10 m), Average Distance of Putts Made, Longest Putt,
   Approach Putt Performance (residua dopo il primo putt da oltre 25 ft).     */
const DIECI_FT_M = 10/M_TO_FT, VENTI_FT_M = 20/M_TO_FT, VENTICINQUE_FT_M = 25/M_TO_FT;
function statPuttNumeri(A){
  const nGiri=A.length;
  const cnt={1:0, 2:0, 3:0, 4:0};
  let dentro=0, dentroOk=0, madeOver10=0, madeOver20=0;
  const madeD=[]; let maxMade=null;
  const lag=[];
  A.forEach(g=>g.bucheCalc.forEach((b,bi)=>{
    const compl=((g.buche||[])[bi]||{}).completata!==false;
    const pt=b.colpi.filter(c=>c.lie==='green');
    if(pt.length){ const k=Math.min(4, pt.length); cnt[k]++; }
    pt.forEach((x,i)=>{
      const ultimo=i===pt.length-1;
      const imbucato = ultimo && compl && b.colpi[b.colpi.length-1]===x;
      if(!(x.distM>0)) return;
      if(x.distM<=DIECI_FT_M){ dentro++; if(imbucato) dentroOk++; }
      if(imbucato){
        madeD.push(x.distM);
        if(maxMade===null || x.distM>maxMade) maxMade=x.distM;
        if(x.distM>DIECI_FT_M) madeOver10++;
        if(x.distM>VENTI_FT_M) madeOver20++;
      }
      if(i===0 && x.distM>=VENTICINQUE_FT_M && pt.length>=2 && pt[1].distM>=0) lag.push(pt[1].distM);
    });
  }));
  const pg=v=>nGiri? v/nGiri : null;
  return {nGiri:nGiri,
    p1:pg(cnt[1]), p2:pg(cnt[2]), p3:pg(cnt[3]), p4:pg(cnt[4]),
    n1:cnt[1], n2:cnt[2], n3:cnt[3], n4:cnt[4],
    dentro:dentro, dentroPct: dentro?100*dentroOk/dentro:null,
    over10:pg(madeOver10), over20:pg(madeOver20),
    mediaMade: madeD.length?media(madeD):null, maxMade:maxMade,
    lag: lag.length?media(lag):null, nLag:lag.length};
}

/* ── SCORING: i numeri del Tour ───────────────────────────────────────────
   Bogey Average (i soli bogey, non bogey-o-peggio), Total Eagles e Holes per
   Eagle, Lowest Round, e la distribuzione dei giri per fascia di punteggio —
   che e' l'equivalente locale onesto di "Rounds in the 60s", una statistica
   che al di fuori del Tour non vuol dire niente.                            */
const SCORE_FASCE=[{lo:-99,hi:0,label:'sotto il par'},{lo:0,hi:4,label:'da par a +3'},
                   {lo:4,hi:8,label:'da +4 a +7'},{lo:8,hi:99,label:'+8 e oltre'}];
function statScoringNumeri(A){
  const nGiri=A.length;
  let bogey=0, doppi=0, eagle=0, buche=0, birdie=0;
  let best=null;
  const fasce=SCORE_FASCE.map(f=>({label:f.label, lo:f.lo, hi:f.hi, n:0}));
  A.forEach(g=>{
    const d=g.calc.score-g.calc.par;
    if(best===null || d<best) best=d;
    const f=fasce.find(x=>d>=x.lo && d<x.hi); if(f) f.n++;
    g.bucheCalc.forEach(b=>{
      buche++;
      if(b.diff===1) bogey++;
      if(b.diff>=2) doppi++;
      if(b.diff<=-2) eagle++;
      if(b.diff<=-1) birdie++;
    });
  });
  return {nGiri:nGiri, buche:buche,
    bogeyGiro:nGiri?bogey/nGiri:null, doppiGiro:nGiri?doppi/nGiri:null,
    eagle:eagle, buchePerEagle: eagle? buche/eagle : null,
    birdieGiro:nGiri?birdie/nGiri:null, best:best,
    fasce:fasce.filter(x=>x.n>0)};
}

/* ── STREAKS: le serie ───────────────────────────────────────────────────
   La categoria Streaks del Tour, meno tutto cio' che dipende dal taglio del
   torneo. Le serie attraversano il confine fra giri consecutivi, come sul Tour.
   Valore analitico basso, dichiarato: e' una lettura di costanza, non una
   diagnosi.                                                                  */
function serieDa(vals){
  let best=0, cur=0;
  vals.forEach(v=>{ if(v){ cur++; if(cur>best) best=cur; } else cur=0; });
  return {best:best, cur:cur};
}
function statSerie(A){
  const senzaBogey=[], birdie=[], gir=[], fw=[], senzaTre=[], sandOk=[];
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    senzaBogey.push(b.diff<=0);
    birdie.push(b.diff<=-1);
    gir.push(!!b.girHit);
    senzaTre.push(b.putt<3);
    const c0=b.colpi[0];
    if(c0 && c0.lie==='tee' && b.par>=4){
      const c1=b.colpi[1];
      fw.push(!c0.penalita && c1 && (c1.lie==='fairway'||c1.lie==='green'));
    }
    if(b.colpi.some(c=>c.lie==='sabbia' && c.distM>0 && c.distM*M_TO_YD<=30)) sandOk.push(b.diff<=0);
  }));
  const giriPar=A.map(g=>(g.calc.score-g.calc.par)<=0);
  return {senzaBogey:serieDa(senzaBogey), birdie:serieDa(birdie), gir:serieDa(gir),
    fairway:serieDa(fw), senzaTrePutt:serieDa(senzaTre), sand:serieDa(sandOk),
    giriPar:serieDa(giriPar), nBuche:senzaBogey.length};
}

function statFairway(A){
  let tot=0,presi=0;
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    if(b.par<4 || b.colpi.length<2 || b.colpi[0].lie!=='tee') return;
    tot++; const l=b.colpi[1].lie; if(l==='fairway'||l==='green') presi++;
  }));
  return {tot,presi};
}
function statSand(A){
  let opp=0,ok=0;
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    if(!b.colpi.some(c=>c.lie==='sabbia' && c.distM*M_TO_YD<=30)) return;
    opp++; if(b.score<=b.par) ok++;
  }));
  return {opp,ok};
}
/* ══ v10 — STATISTICHE BASE ═══════════════════════════════════════════════
   Le classiche: FIR, GIR, putt, scrambling, sand save, penalita', 1-putt e
   3-putt, birdie e doppi per giro. Conteggi semplici su definizioni dichiarate.
   FIR: par 4 e 5 col primo colpo dal tee; "preso" include la palla in green.
   Il riferimento non e' il Tour (numeri non verificati nelle fonti di progetto)
   ma la PROPRIA finestra stabile: gli ultimi 20 giri completi, indipendente dai
   filtri, la stessa di "la tua media". */
function statBase(A){
  const nG=A.length;
  if(!nG) return null;
  let buche=0,score=0,par=0,putt=0,pen=0,gir=0,scrOpp=0,scrOk=0;
  let best=null,worst=null,unPutt=0,trePutt=0,bucheP=0,fwTot=0,fwOk=0;
  let birdie=0,doppi=0;
  const penT={};
  A.forEach(g=>{
    score+=g.calc.score; par+=g.calc.par; putt+=g.calc.putt; pen+=g.calc.pen;
    gir+=g.calc.gir; scrOpp+=g.calc.scrOpp; scrOk+=g.calc.scrOk; buche+=g.calc.nBuche;
    const d=g.calc.score-g.calc.par;
    if(best===null||d<best)best=d; if(worst===null||d>worst)worst=d;
    g.bucheCalc.forEach(b=>{
      if(b.diff<=-1)birdie++; if(b.diff>=2)doppi++;
      if(b.putt>=1){bucheP++; if(b.putt===1)unPutt++; if(b.putt>=3)trePutt++;}
      if(b.par>=4 && b.colpi.length>=2 && b.colpi[0].lie==='tee'){
        fwTot++; const l=b.colpi[1].lie; if(l==='fairway'||l==='green')fwOk++;
      }
      (b.colpi||[]).forEach(c=>{ if(c.penalita) penT[c.penTipo||'altro']=(penT[c.penTipo||'altro']||0)+1; });
    });
  });
  const Sd=statSand(A.filter(g=>g.completo));
  return {nG:nG, buche:buche,
    score:score/nG, vsPar:(score-par)/nG, best:best, worst:worst,
    fir: fwTot? {pct:100*fwOk/fwTot, ok:fwOk, tot:fwTot} : null,
    gir:{pct:100*gir/buche, ok:gir, tot:buche},
    puttGiro:putt/nG, puttBuca:putt/buche,
    unPutt: bucheP?100*unPutt/bucheP:null, trePutt: bucheP?100*trePutt/bucheP:null,
    scr: scrOpp?{pct:100*scrOk/scrOpp, ok:scrOk, tot:scrOpp}:null,
    sand: Sd.opp?{pct:100*Sd.ok/Sd.opp, ok:Sd.ok, tot:Sd.opp}:null,
    penGiro:pen/nG, penT:penT, birdie:birdie, doppi:doppi,
    birdiePerGiro:birdie/nG, doppiPerGiro:doppi/nG};
}
function statBaseStabile(){
  const tutti=LS.get('hcp_giri',[]).filter(formatoCompleto)
    .slice().sort((a,b)=>(a.data||'')<(b.data||'')?-1:1).slice(-20);
  if(tutti.length<3) return null;
  return statBase(tutti.map(g=>analizzaGiro(g,'tour')));
}
/* v10 — RIFERIMENTI SCRATCH per la scheda Base.
   Nella ver07 questa colonna non c'era, con la motivazione che i numeri che
   circolano non hanno fonte verificata. Ora la fonte c'e': l'ebook Strokes Gained
   di Shot Scope pubblica la tabella per handicap, e l'articolo sul profilo
   scratch i punteggi per tipo di par e i tre putt.
   Classe: dato divulgato, numerosita' NON dichiarata dalla fonte.             */
const RIF_SCRATCH = {
  vsPar:0.83, fir:50, gir:61, puttGiro:29.4, trePutt:3, scr:47, sand:37,
  pen:0.56, doppi:0.7, spread:17,
  par:{3:3.2, 4:4.2, 5:4.8}
};

/* La scheda Base, riusata identica dalle statistiche di periodo e dal giro
   singolo: cambia solo cosa c'e' nella colonna di confronto. */
function cardStatBase(SB, RIF, titolo, notaConfronto){
  const f1=v=>v===null||v===undefined?'\u2014':(Math.round(v*10)/10).toFixed(1).replace('.',',');
  const f2=v=>v===null||v===undefined?'\u2014':v.toFixed(2).replace('.',',');
  const pctS=v=>v===null||v===undefined?'\u2014':Math.round(v)+'%';
  const riga=(nome,val,rif,nota,scr)=>'<tr><td>'+nome+(nota?' <span class="dim" style="font-size:10px">'+nota+'</span>':'')+'</td>'+
    '<td class="n"><b>'+val+'</b></td><td class="n dim">'+(rif===undefined||rif===null?'\u2014':rif)+'</td>'+
    '<td class="n dim">'+(scr===undefined||scr===null?'\u2014':scr)+'</td></tr>';
  const penTxt=Object.keys(SB.penT).length?
    Object.keys(SB.penT).sort((a,b)=>SB.penT[b]-SB.penT[a]).map(k=>SB.penT[k]+' '+esc(PENALITA_NOME[k]||k)).join(' \u00b7 '):null;
  return '<div class="card"><h2>'+titolo+'</h2>'+
    '<div class="hint">Conteggi semplici su definizioni dichiarate, '+SB.nG+' giri e '+SB.buche+' buche. '+
    notaConfronto+'</div>'+
    '<table class="stat"><thead><tr><th></th><th class="n">Tu</th><th class="n">Media<br>20</th>'+
      '<th class="n">Scr.</th></tr></thead><tbody>'+
    riga('Punteggio', f1(SB.score)+' <span class="dim">('+sgnIt(SB.vsPar,1)+')</span>', RIF?f1(RIF.score):null, '', sgn(RIF_SCRATCH.vsPar,1))+
    riga('Migliore \u00b7 peggiore', sgn(SB.best,0)+' \u00b7 '+sgn(SB.worst,0), RIF?sgn(RIF.best,0)+' \u00b7 '+sgn(RIF.worst,0):null)+
    riga('FIR', SB.fir?pctS(SB.fir.pct):'\u2014', RIF&&RIF.fir?pctS(RIF.fir.pct):null, SB.fir?'('+SB.fir.ok+'/'+SB.fir.tot+')':'', RIF_SCRATCH.fir+'%')+
    riga('GIR', pctS(SB.gir.pct), RIF?pctS(RIF.gir.pct):null, '('+SB.gir.ok+'/'+SB.gir.tot+')', RIF_SCRATCH.gir+'%')+
    riga('Putt per giro', f1(SB.puttGiro), RIF?f1(RIF.puttGiro):null, '('+f2(SB.puttBuca)+'/buca)', f1(RIF_SCRATCH.puttGiro))+
    riga('Un putt', pctS(SB.unPutt), RIF?pctS(RIF.unPutt):null, 'buche')+
    riga('Tre putt o piu\u2019', pctS(SB.trePutt), RIF?pctS(RIF.trePutt):null, 'buche', RIF_SCRATCH.trePutt+'%')+
    riga('Scrambling', SB.scr?pctS(SB.scr.pct):'\u2014', RIF&&RIF.scr?pctS(RIF.scr.pct):null, SB.scr?'('+SB.scr.ok+'/'+SB.scr.tot+')':'', RIF_SCRATCH.scr+'%')+
    riga('Sand save', SB.sand?pctS(SB.sand.pct):'\u2014', RIF&&RIF.sand?pctS(RIF.sand.pct):null, SB.sand?'('+SB.sand.ok+'/'+SB.sand.tot+')':'', RIF_SCRATCH.sand+'%')+
    riga('Penalita\u2019/giro', f2(SB.penGiro), RIF?f2(RIF.penGiro):null, '', f2(RIF_SCRATCH.pen))+
    riga('Birdie+/giro', f2(SB.birdiePerGiro), RIF?f2(RIF.birdiePerGiro):null)+
    riga('Doppi+/giro', f2(SB.doppiPerGiro), RIF?f2(RIF.doppiPerGiro):null, '', f2(RIF_SCRATCH.doppi))+
    '</tbody></table>'+
    (penTxt?'<div class="stcap"><b>Da dove vengono le penalita\u2019:</b> '+penTxt+'.</div>':'')+
    '<div class="stcap">FIR sui par 4 e 5 (palla in fairway o in green col colpo dal tee). Scrambling: buca chiusa '+
    'in par o meglio senza GIR. Sand save: colpo dalla sabbia entro i 30 yd e buca in par o meglio (convenzione '+
    'piu\u2019 stretta di quella del Tour).<br><br>La colonna <b>Scr.</b> e\u2019 il giocatore scratch secondo '+
    'l\u2019ebook Strokes Gained di Shot Scope e il suo profilo dello scratch: punteggio +0,8 sul par, FIR 50%, '+
    'GIR 61%, 29,4 putt, tre putt sul 3% delle buche, scrambling 47%, sand save 37%, 0,56 penalita\u2019 a giro. '+
    'I doppi per giro (0,7) vengono dalle statistiche di scoring del Tour. <b>Classe: dato divulgato, numerosita\u2019 '+
    'non dichiarata dalla fonte</b> \u2014 ordine di grandezza, non un metro al decimale. La colonna che conta resta '+
    'la tua finestra stabile.<br><br>Lo <b>spread migliore-peggiore</b> di riferimento e\u2019 17 colpi (mediana 17, '+
    'Stagner): quello e\u2019 misurato su una stagione intera, quindi confrontalo solo con un periodo lungo.</div></div>';
}

function statPerTipo(A){
  const m={};
  A.forEach(g=>{const t=g.tipo||'—';
    if(!m[t]) m[t]={tipo:t,n:0,sopraPar:0,sg:0,completi:0,vals:[]};
    m[t].n++; m[t].sopraPar+=g.calc.score-g.calc.par; m[t].vals.push(g.calc.score-g.calc.par);
    if(g.completo){ m[t].sg+=g.calc.sgTot; m[t].completi++; }});
  return Object.values(m).map(x=>({...x, mediaPar:x.sopraPar/x.n,
    mediaSg:x.completi?x.sg/x.completi:null,
    se:x.vals.length>=2?(scartoTipo(x.vals)||0)/Math.sqrt(x.vals.length):null})).sort((a,b)=>b.n-a.n);
}
function statCondizioni(A){
  const m={};
  A.forEach(g=>{
    if(!g.condizioni) return;
    const k='v'+g.condizioni.vento;
    if(!m[k]) m[k]={k:k, nome:(VENTO_OPZ[g.condizioni.vento]||{}).n||'—', n:0, vals:[], sg:[]};
    m[k].n++; m[k].vals.push(g.calc.score-g.calc.par);
    if(g.completo) m[k].sg.push(g.calc.sgTot);
  });
  return Object.values(m).map(x=>({...x, mediaPar:media(x.vals),
    mediaSg:x.sg.length?media(x.sg):null,
    se:x.vals.length>=2?(scartoTipo(x.vals)||0)/Math.sqrt(x.vals.length):null}))
    .sort((a,b)=>a.k<b.k?-1:1);
}

/* Baseline "la tua media": finestra STABILE sugli ultimi 20 giri completi,
   indipendente dal filtro attivo. Prima si muoveva col filtro, quindi lo stesso
   giro cambiava valore cambiando vista e il numero non era citabile. */
function mediaStabile(baseline){
  const tutti=LS.get('hcp_giri',[]).filter(formatoCompleto)
    .slice().sort((a,b)=>(a.data||'')<(b.data||'')?-1:1).slice(-20);
  if(tutti.length<3) return null;
  const A=tutti.map(g=>analizzaGiro(g, 'tour'));
  const cats=['tee','approccio','corto','putting'];
  const out={n:A.length, tot:media(A.map(g=>g.calc.sgTot)), cat:{}};
  cats.forEach(c=>out.cat[c]=media(A.map(g=>g.calc.sgCat[c])));
  out.sdTot=scartoTipo(A.map(g=>g.calc.sgTot));
  out.sdCat={}; cats.forEach(c=>out.sdCat[c]=scartoTipo(A.map(g=>g.calc.sgCat[c])));
  return out;
}

/* ==========================================================
   QUALITA' DEL DATO
   ========================================================== */
function statQualita(){
  const giri=LS.get('hcp_giri',[]).filter(formatoCompleto);
  let colpi=0, conEsito=0, daEsito=0, recupero=0, senzaCond=0, misure={};
  let conEsito40=0, daEsito40=0;   // v9: copertura sulla regola storica, per confronto
  const perMese={};
  const ric=[], integr=[];
  giri.forEach(g=>{
    if(!g.condizioni) senzaCond++;
    const mis=g.misura||'bandiera'; misure[mis]=(misure[mis]||0)+1;
    const mese=(g.data||'').slice(0,7);
    if(!perMese[mese]) perMese[mese]={mese:mese, colpi:0, recupero:0, giri:0};
    perMese[mese].giri++;
    (g.buche||[]).forEach(b=>{
      const c=b.colpi||[];
      c.forEach((x,i)=>{
        colpi++; perMese[mese].colpi++;
        if(x.lie==='recupero'){ recupero++; perMese[mese].recupero++; }
        if(serveEsito(c, i, b.par)){ daEsito++; if(x.esito) conEsito++; }
        if(serveEsitoStorico(c, i)){ daEsito40++; if(x.esito) conEsito40++; }
      });
    });
    const R=riconcilia(g);
    if(R) ric.push({id:g.id, data:g.data, circolo:g.circolo, ok:R.ok, scarto:R.scarto});
    const I=controlloIntegrita(g);
    if(I.length) integr.push({id:g.id, data:g.data, circolo:g.circolo, n:I.length, primo:I[0].motivo, tutti:I});
  });
  const mesi=Object.values(perMese).filter(x=>x.colpi>=30)
    .map(x=>({...x, pct:100*x.recupero/x.colpi})).sort((a,b)=>a.mese<b.mese?-1:1);
  const pctRec = mesi.map(x=>x.pct);
  const derivaRec = pctRec.length>=3 ? {sd:scartoTipo(pctRec), min:Math.min(...pctRec), max:Math.max(...pctRec)} : null;
  return {nGiri:giri.length, colpi:colpi, conEsito:conEsito, daEsito:daEsito,
    coperturaEsito: daEsito? conEsito/daEsito : null,
    conEsito40:conEsito40, daEsito40:daEsito40,
    coperturaEsito40: daEsito40? conEsito40/daEsito40 : null,
    recupero:recupero, pctRecupero: colpi? 100*recupero/colpi : 0,
    mesi:mesi, derivaRec:derivaRec, senzaCond:senzaCond, misure:misure,
    riconciliazioni:ric, ricKO:ric.filter(x=>!x.ok), integrKO:integr};
}
/* ══════════════════════════════════════════════════════════════════════════
   v12 — COMPONENTI DEL HANDOFF DI DESIGN
   ══════════════════════════════════════════════════════════════════════════
   Riferimento: design_handoff_home_statistiche/README.md, con le geometrie
   lette dai prototipi. Nessuna dipendenza nuova: stringhe HTML e SVG inline,
   come tutto il resto dell'app.
   Convenzione cromatica del handoff, applicata qui senza eccezioni:
   VERDE E ROSSO SOLO PER IL SEGNO, grigio per i dati neutri (volumi, distanze,
   conteggi, riferimenti Tour). Il riferimento Tour e' sempre una barretta
   verticale grigia o un'area grigia di sfondo, mai una seconda serie colorata. */

/* Registro dei grafici interattivi. Il tocco NON fa un re-render completo:
   aggiorna in posto cursore, raggi dei pallini e riga dei valori. Con oltre
   cinquanta card a schermo un render intero a ogni tocco si sentirebbe. */
const GRAF = {};
/* v10 — apertura ricordata fra i render, come chiede il handoff (`openTables`):
   chiave = titolo del pannello + indice della tabella dentro la card.        */
const TBL_APERTE = {};
let _grafSeq = 0;
function grafId(){ return 'gr'+(++_grafSeq); }

/* Collega i gestori dopo che il DOM e' stato montato: lo chiama render(). */
/* v10 — REGOLA SUI DUPLICATI DEL HANDOFF
   «dove un pannello ha sia tabella sia grafico, la tabella sta sopra, chiusa,
   dietro il toggle "Mostra tabella"; il grafico sta sotto, sempre visibile.»
   Passata generica invece di riscrivere ogni card: si applica solo dove la
   card ha davvero anche un grafico, e solo alle tabelle con almeno quattro
   righe di corpo. Le tabelle che sono l'unico contenuto restano visibili:
   nasconderle non toglierebbe un duplicato, toglierebbe il pannello.        */
function tabelleRichiudibili(radice){
  const VISIVO='svg, .dvrow, .hbrow, .rngrow, .strack, .bulrow, .calmese, .heatcell';
  radice.querySelectorAll('.card, .pnl').forEach(card=>{
    if(!card.querySelector(VISIVO)) return;
    const tit = card.querySelector('h2, .t');
    const chiave = (tit? tit.textContent : '?');
    [...card.querySelectorAll('table')].forEach((t,i)=>{
      if(t.closest('[data-tblbox]')) return;
      if(t.querySelectorAll('tr').length < 4) return;
      const k = chiave+'#'+i, id = 'tw'+(++_tblSeq);
      const aperta = !!TBL_APERTE[k];
      const box = document.createElement('div');
      box.setAttribute('data-tblbox', id);
      box.setAttribute('data-tblkey', k);
      box.style.display = aperta ? 'block' : 'none';
      t.parentNode.insertBefore(box, t);
      box.appendChild(t);
      /* la didascalia e la legenda spiegano la tabella: seguono la tabella dentro
         il box, altrimenti restano in vista un muro di testo su una tabella che
         non si vede, e il grafico finisce sotto la didascalia di un'altra cosa. */
      while(box.nextSibling && box.nextSibling.nodeType===1 &&
            /\b(stcap|legg|legend)\b/.test(box.nextSibling.className||'')){
        box.appendChild(box.nextSibling);
      }
      const b = document.createElement('button');
      b.className='tgl'; b.setAttribute('data-tgl', id);
      b.textContent = aperta ? 'Nascondi tabella' : 'Mostra tabella';
      box.parentNode.insertBefore(b, box);
    });
  });
}
let _tblSeq = 0;

function grafCollega(radice){
  radice.querySelectorAll('[data-graf]').forEach(sv=>{
    const id=sv.getAttribute('data-graf');
    const G=GRAF[id]; if(!G) return;
    const agisci=(clientX)=>{
      const r=sv.getBoundingClientRect();
      const i=Math.max(0, Math.min(G.n-1, Math.round((clientX-r.left)/r.width*(G.n-1))));
      G.idx=i;
      const cur=sv.querySelector('.gcur'); if(cur){ cur.setAttribute('x1',G.x(i)); cur.setAttribute('x2',G.x(i)); }
      sv.querySelectorAll('.gdot').forEach((d,j)=>{
        d.setAttribute('r', j===i?4:2.4);
        if(!G.dotColori) d.setAttribute('fill', j===i?G.colore:'var(--dv-neutral)');
      });
      const box=sv.parentNode.querySelector('.grafrow');
      if(box){
        box.querySelector('.gl').textContent=G.etichette[i]||('punto '+(i+1));
        const gv=box.querySelector('.gv');
        gv.textContent=G.testi[i];
        gv.style.color = G.neutro ? 'var(--testo)' : (G.valori[i]>=0?'var(--verde-testo)':'var(--rosso)');
      }
    };
    sv.addEventListener('click', e=>agisci(e.clientX));
    sv.addEventListener('touchstart', e=>{ if(e.touches[0]) agisci(e.touches[0].clientX); }, {passive:true});
  });
  /* tabelle richiudibili: chiuse per difetto, toggle testuale */
  radice.querySelectorAll('[data-tgl]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const box=radice.querySelector('[data-tblbox="'+b.getAttribute('data-tgl')+'"]');
      if(!box) return;
      const aperta = box.style.display!=='none';
      box.style.display = aperta ? 'none' : 'block';
      b.textContent = aperta ? 'Mostra tabella' : 'Nascondi tabella';
      const k = box.getAttribute('data-tblkey');
      if(k) TBL_APERTE[k] = !aperta;
    });
  });
}

/* ── grafico a linea con cursore al tocco ─────────────────────────────────
   A riposo mostra l'ultimo punto della serie, come chiede il handoff.
   `dotColori` colora i pallini per esito (verde birdie, grigio par, rosso
   bogey) senza toccare il colore della linea, che dipende dal segno finale. */
function grafLinea(valori, o){
  o=o||{};
  const n=valori.length; if(!n) return '';
  const W=o.w||320, H=o.h||96, PT=6;
  const se=o.se||0;
  const lo=Math.min.apply(null,valori.concat([0]))-(se?2*se:0);
  const hi=Math.max.apply(null,valori.concat([0]))+(se?2*se:0);
  const span=(hi-lo)||1;
  const x=i=>n<2?W/2:(i/(n-1))*W;
  const y=v=>PT+(hi-v)/span*(H-PT*2);
  const idx=n-1;
  const colore=o.colore||(valori[n-1]>=0?'var(--verde-testo)':'var(--rosso)');
  const fmt=o.fmt||(v=>sgn(v,1));
  const id=grafId();
  const etichette=o.etichette||valori.map((v,i)=>'punto '+(i+1));
  GRAF[id]={n:n, idx:idx, x:i=>x(i).toFixed(1), colore:colore, etichette:etichette,
    valori:valori, testi:valori.map(fmt), neutro:!!o.neutro, dotColori:!!o.dotColori};
  const punti=valori.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  const banda=se? valori.map((v,i)=>x(i).toFixed(1)+','+y(v+2*se).toFixed(1)).join(' ')+' '+
    valori.map((v,i)=>x(i).toFixed(1)+','+y(v-2*se).toFixed(1)).reverse().join(' ') : '';
  return '<svg data-graf="'+id+'" viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+
    '" style="overflow:visible; display:block; cursor:pointer" role="img" aria-label="'+esc(o.aria||'grafico')+'">'+
    (banda?'<polygon points="'+banda+'" fill="'+colore+'" opacity="0.10"></polygon>':'')+
    '<line x1="0" y1="'+y(0).toFixed(1)+'" x2="'+W+'" y2="'+y(0).toFixed(1)+'" stroke="var(--rif)" stroke-width="1"></line>'+
    '<line class="gcur" x1="'+x(idx).toFixed(1)+'" y1="0" x2="'+x(idx).toFixed(1)+'" y2="'+H+
      '" stroke="var(--tenue)" stroke-width="1" stroke-dasharray="2 3"></line>'+
    '<polyline points="'+punti+'" fill="none" stroke="'+colore+'" stroke-width="1.8" stroke-linejoin="round"></polyline>'+
    valori.map((v,i)=>'<circle class="gdot" cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="'+(i===idx?4:2.4)+
      '" fill="'+(o.dotColori? o.dotColori[i] : (i===idx?colore:'var(--dv-neutral)'))+'"></circle>').join('')+
    '</svg>'+
    '<div class="grafrow"><div class="gl">'+esc(etichette[idx])+'</div>'+
    '<div class="gv" style="color:'+(o.neutro?'var(--testo)':(valori[idx]>=0?'var(--verde-testo)':'var(--rosso)'))+'">'+
    fmt(valori[idx])+'</div></div>';
}

/* ── curva di realizzazione su area di riferimento ─────────────────
   Geometria del handoff: 320×110, poligono grigio del Tour a opacita' 0,35,
   linea propria 1,8px, pallini r=2,4 (selezionato r=4), cursore tratteggiato,
   etichette delle fasce sotto. Il riferimento e' sempre grigio, mai colorato.
   Riusa la macchina del cursore di `grafCollega` (.gcur / .gdot / .grafrow).  */
function grafCurvaRif(voci, o){
  o=o||{};
  const n=voci.length; if(!n) return '';
  const W=320, H=o.h||110, PT=8, PB=16;
  const hi=100, lo=0;
  const x=i=>n<2?W/2:8+(i/(n-1))*(W-16);
  const y=v=>PT+(hi-Math.max(lo,Math.min(hi,v)))/(hi-lo)*(H-PT-PB);
  const idx=0;
  const id=grafId();
  const et=voci.map(v=>v.nome+' — tu / rif. · '+Math.round(v.v)+'% / '+
    (v.rif===null?'—':Math.round(v.rif)+'%'));
  GRAF[id]={n:n, idx:idx, x:i=>x(i).toFixed(1), colore:'var(--rosso)', etichette:et,
    valori:voci.map(v=>v.rif===null?0:v.v-v.rif), testi:voci.map(v=>v.n+' putt'),
    neutro:true, dotColori:false};
  const area='8,'+y(0).toFixed(1)+' '+voci.map((v,i)=>x(i).toFixed(1)+','+y(v.rif===null?0:v.rif).toFixed(1)).join(' ')+
    ' '+(W-8)+','+y(0).toFixed(1);
  const mia=voci.map((v,i)=>x(i).toFixed(1)+','+y(v.v).toFixed(1)).join(' ');
  return '<svg data-graf="'+id+'" viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+
    '" style="overflow:visible; display:block; cursor:pointer" role="img" aria-label="'+esc(o.aria||'curva')+'">'+
    '<polygon points="'+area+'" fill="var(--tenue)" opacity="0.35"></polygon>'+
    '<line x1="8" y1="'+y(0).toFixed(1)+'" x2="'+(W-8)+'" y2="'+y(0).toFixed(1)+
      '" stroke="var(--asse)" stroke-width="1"></line>'+
    '<line class="gcur" x1="'+x(idx).toFixed(1)+'" y1="0" x2="'+x(idx).toFixed(1)+'" y2="'+(H-PB)+
      '" stroke="var(--tenue)" stroke-width="1" stroke-dasharray="2 3"></line>'+
    '<polyline points="'+mia+'" fill="none" stroke="var(--rosso)" stroke-width="1.8" stroke-linejoin="round"></polyline>'+
    voci.map((v,i)=>'<circle class="gdot" cx="'+x(i).toFixed(1)+'" cy="'+y(v.v).toFixed(1)+'" r="'+
      (i===idx?4:2.4)+'" fill="'+(i===idx?'var(--rosso)':'var(--dv-neutral)')+'"></circle>').join('')+
    voci.map((v,i)=>'<text x="'+x(i).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="8" '+
      'fill="var(--tenue)">'+esc(v.breve||v.nome)+'</text>').join('')+
    '</svg>'+
    '<div class="grafrow"><div class="gl">'+esc(et[idx])+'</div>'+
    '<div class="gv" style="color:var(--testo)">'+voci[idx].n+' putt</div></div>';
}

/* ── sparkline compatta, senza interazione ────────────────────────────────*/
function grafSpark(valori, o){
  o=o||{}; const n=valori.length; if(!n) return '';
  const W=o.w||120, H=o.h||44, PT=4;
  const lo=Math.min.apply(null,valori.concat([0])), hi=Math.max.apply(null,valori.concat([0]));
  const span=(hi-lo)||1;
  const x=i=>n<2?W/2:(i/(n-1))*W, y=v=>PT+(hi-v)/span*(H-PT*2);
  const col=valori[n-1]>=0?'var(--verde-testo)':'var(--rosso)';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" style="flex-shrink:0; overflow:visible">'+
    '<line x1="0" y1="'+y(0).toFixed(1)+'" x2="'+W+'" y2="'+y(0).toFixed(1)+'" stroke="var(--rif)" stroke-width="1"></line>'+
    '<polyline points="'+valori.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')+
      '" fill="none" stroke="'+col+'" stroke-width="1.6" stroke-linejoin="round"></polyline>'+
    '<circle cx="'+x(n-1).toFixed(1)+'" cy="'+y(valori[n-1]).toFixed(1)+'" r="2.6" fill="'+col+'"></circle></svg>';
}

/* ── cascata verticale: come nasce il divario ─────────────────────────────*/
function grafCascata(voci, scala){
  scala=scala||12;
  let run=0; let out='';
  voci.forEach(v=>{
    const from=run; run+=v.v;
    const a=Math.min(from,run), b=Math.max(from,run);
    const left=50+a/scala*50, w=Math.max(1.2,(b-a)/scala*50);
    const col=v.v>=0?'var(--verde-testo)':'var(--rosso)';
    out+='<div style="margin-bottom:13px">'+
      '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px">'+
      '<span style="font-size:12.5px; letter-spacing:-0.01em">'+esc(v.nome)+'</span>'+
      '<span style="font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; color:'+col+'">'+sgn(v.v,2)+'</span></div>'+
      '<div style="position:relative; height:9px; background:var(--dv-track); border-radius:3px">'+
      '<div style="position:absolute; left:50%; top:-1px; bottom:-1px; width:1px; background:var(--rif)"></div>'+
      '<div style="position:absolute; top:0; bottom:0; border-radius:3px; left:'+left.toFixed(2)+'%; width:'+w.toFixed(2)+'%; background:'+col+'"></div>'+
      '</div></div>';
  });
  const tot=run, half=Math.min(50,Math.abs(tot)/scala*50);
  const colT=tot>=0?'var(--verde-testo)':'var(--rosso)';
  out+='<div style="padding-top:12px; border-top:1px solid var(--sep)">'+
    '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px">'+
    '<span style="font-size:12.5px; font-weight:700">Totale</span>'+
    '<span style="font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; color:'+colT+'">'+sgn(tot,2)+'</span></div>'+
    '<div style="position:relative; height:9px; background:var(--dv-track); border-radius:3px">'+
    '<div style="position:absolute; left:50%; top:-1px; bottom:-1px; width:1px; background:var(--rif)"></div>'+
    '<div style="position:absolute; top:0; bottom:0; border-radius:3px; left:'+(tot>=0?50:50-half).toFixed(2)+'%; width:'+half.toFixed(2)+'%; background:'+colT+'"></div>'+
    '</div></div>'+
    '<div style="display:flex; justify-content:space-between; font-size:9.5px; color:var(--tenue); margin-top:6px">'+
    '<span>\u2212'+scala+'</span><span>0</span><span>+'+scala+'</span></div>';
  return out;
}

/* ── heatmap reparti x giri ───────────────────────────────────────────────*/
function grafHeat(righe, primo, ultimo){
  let max=0;
  righe.forEach(r=>r.vals.forEach(v=>{ if(Math.abs(v)>max) max=Math.abs(v); }));
  max=max||1;
  return righe.map(r=>'<div class="heatrow"><div class="l">'+esc(r.nome)+'</div><div class="heatcells">'+
    r.vals.map(v=>{
      const k=Math.min(1,Math.abs(v)/max);
      const rgb = v>=0 ? '78,207,146' : '230,103,103';
      return '<div style="flex:1; height:16px; border-radius:3px; background:rgba('+rgb+','+(0.10+0.72*k).toFixed(2)+')"></div>';
    }).join('')+'</div></div>').join('')+
    '<div style="display:flex; justify-content:space-between; font-size:9.5px; color:var(--tenue); margin-top:4px; padding-left:88px">'+
    '<span>'+esc(primo||'primo giro')+'</span><span>'+esc(ultimo||'ultimo giro')+'</span></div>';
}

/* ── quattro grafici piccoli, stessa scala ────────────────────────────────*/
function grafMini(serie, o){
  o=o||{};
  let lo=0, hi=0;
  serie.forEach(s=>s.vals.forEach(v=>{ if(v<lo)lo=v; if(v>hi)hi=v; }));
  const span=(hi-lo)||1;
  return '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px">'+serie.map(s=>{
    const n=s.vals.length, W=130, H=40, PT=4;
    const x=i=>n<2?W/2:(i/(n-1))*W, y=v=>PT+(hi-v)/span*(H-PT*2);
    const ult=s.vals[n-1];
    return '<div style="border:1px solid var(--bordo); border-radius:10px; padding:8px">'+
