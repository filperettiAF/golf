/* ==========================================================
   SINCRONIZZAZIONE CON IL REPOSITORY PRIVATO
   ==========================================================
   Le sei condizioni non negoziabili, dal piano del 15/08/2026.
   1. la sincronizzazione AGGIUNGE, non cancella mai
   2. nessuna sovrascrittura silenziosa (ogni scrittura porta lo sha atteso)
   3. stato sempre visibile, fallimento sempre annunciato
   4. il backup su file resta la via di scorta
   5. repository dati privato, token limitato
   6. collaudo su archivio finto prima dei dati veri                            */
const GH_API = 'https://api.github.com';
const SYNC_DEF = {attiva:false, utente:'', repo:'golf-dati', token:'', dispositivo:'',
                  giri:{}, ultimoOk:null, ultimoErrore:null, privato:null, api:null};

function S(){ return Object.assign({}, SYNC_DEF, LS.get('hcp_sync',{})||{}); }
function Sset(patch){ LS.set('hcp_sync', Object.assign(S(), patch)); }

function b64enc(str){
  const b=new TextEncoder().encode(str); let s='';
  for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
  return btoa(s);
}
function b64dec(b64){
  const bin=atob(String(b64).replace(/\s/g,'')); const b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}

async function ghFetch(percorso, opz){
  const s=S();
  if(!s.token) throw Object.assign(new Error('Token non impostato.'),{stato:0});
  opz=opz||{};
  const h={'Authorization':'Bearer '+s.token,
           'Accept':'application/vnd.github+json',
           'X-GitHub-Api-Version':'2022-11-28'};
  if(opz.body) h['Content-Type']='application/json';
  let r;
  try{
    r=await fetch((s.api||GH_API)+percorso, {method:opz.method||'GET', headers:h, body:opz.body});
  }catch(e){
    throw Object.assign(new Error('Non sono riuscito a raggiungere GitHub. Connessione assente o instabile.'),{stato:0});
  }
  if(r.status===204) return null;
  let d=null; try{ d=await r.json(); }catch(e){}
  if(r.ok) return d;
  const msg=(d&&d.message)||'';
  let testo;
  if(r.status===401) testo='Il token non e’ valido, e’ scaduto o e’ stato revocato. Generane uno nuovo su GitHub e reincollalo qui.';
  else if(r.status===403 && /rate limit/i.test(msg)) testo='GitHub ha messo in pausa le richieste per qualche minuto. Riprova fra poco: non si e’ perso niente.';
  else if(r.status===403) testo='Il token non ha il permesso di scrivere in questo repository. Controlla che sia impostato su "Contents: Read and write" e che includa proprio golf-dati.';
  else if(r.status===404) testo='Non trovo il repository. Controlla il nome utente e il nome del repository, e che il token comprenda proprio quel repository.';
  else if(r.status===409) testo='Il file e’ cambiato su GitHub dopo l’ultima volta che questo telefono l’ha visto.';
  else if(r.status===422) testo='GitHub ha rifiutato la scrittura: '+(msg||'richiesta non valida')+'.';
  else testo='GitHub ha risposto con un errore ('+r.status+'). '+msg;
  throw Object.assign(new Error(testo),{stato:r.status, github:msg});
}
function ghPath(sotto){
  const s=S();
  return '/repos/'+encodeURIComponent(s.utente)+'/'+encodeURIComponent(s.repo)+'/contents/'+sotto;
}
function slug(t){
  return String(t||'campo').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,32) || 'campo';
}
function nomeFileGiro(g){
  if(g.file) return g.file;
  const coda=String(g.id||'').slice(-4) || Math.random().toString(36).slice(2,6);
  return (g.data||'0000-00-00')+'-'+slug(g.circolo)+'-'+coda+'.json';
}
function nomeDispositivoIniziale(){
  const ua=navigator.userAgent||'';
  const base = /iPhone/i.test(ua) ? 'iPhone' : /iPad/i.test(ua) ? 'iPad'
             : /Macintosh|Mac OS/i.test(ua) ? 'Mac' : /Android/i.test(ua) ? 'Android' : 'dispositivo';
  return base+'-'+Math.random().toString(36).slice(2,5);
}
function marcaModifica(g){
  if(!g) return g;
  if(!g.file) g.file=nomeFileGiro(g);
  g.schema=SCHEMA_VERSION;
  g.modificatoIl=new Date().toISOString();
  g.modificatoDa=S().dispositivo||'dispositivo';
  return g;
}

let _sy={inCorso:false, promessa:null, conflitti:[], snapFatto:false, ultimoEsito:null};

function giriDaSincronizzare(){
  const s=S(), giri=LS.get('hcp_giri',[]);
  return giri.filter(g=>{
    const st=s.giri[g.id];
    if(!st) return true;
    return st.modificatoIl !== (g.modificatoIl||null);
  });
}
function cancellatiDaSpostare(){
  return LS.get('hcp_giri_cancellati',[]).filter(c=>!c.spostato);
}
function syncInSospeso(){ return giriDaSincronizzare().length + cancellatiDaSpostare().length; }
function syncConfigurata(){ const s=S(); return !!(s.attiva && s.token && s.utente && s.repo); }

async function snapUnaVolta(){
  if(_sy.snapFatto) return;
  _sy.snapFatto=true;
  await snapshotSalva('prima di una sincronizzazione');
}
function registraConflitto(id, locale, remoto, sha, file){
  if(_sy.conflitti.some(c=>c.id===id)) return;
  _sy.conflitti.push({id:id, locale:locale, remoto:remoto, sha:sha, file:file});
}
async function syncVerifica(){
  const s=S();
  if(!s.utente) throw new Error('Manca il nome utente GitHub.');
  if(!s.repo)   throw new Error('Manca il nome del repository.');
  if(!s.token)  throw new Error('Manca il token.');
  const r=await ghFetch('/repos/'+encodeURIComponent(s.utente)+'/'+encodeURIComponent(s.repo));
  const privato = r && r.private===true;
  Sset({privato:privato});
  return {privato:privato, nome:(r&&r.full_name)||''};
}
async function syncCaricaGiro(g){
  if(!g.modificatoIl || !g.file){ marcaModifica(g); salvaGiro(g, true); }
  const s=S(), st=s.giri[g.id]||{}, path=ghPath('giri/'+encodeURIComponent(g.file));
  const corpo={message:'giro '+(g.data||'')+' '+(g.circolo||'')+' — '+(s.dispositivo||''),
               content:b64enc(JSON.stringify(g,null,1))};
  if(st.sha) corpo.sha=st.sha;
  let r;
  try{
    r=await ghFetch(path,{method:'PUT', body:JSON.stringify(corpo)});
  }catch(e){
    if(e.stato===409 || e.stato===422) return await syncRisolviSalita(g, path);
    throw e;
  }
  const s2=S(); s2.giri[g.id]={sha:r.content.sha, modificatoIl:g.modificatoIl, file:g.file};
  Sset({giri:s2.giri});
  return 'caricato';
}
async function syncRisolviSalita(g, path){
  const remotoRaw=await ghFetch(path);
  let remoto=null;
  try{ remoto=JSON.parse(b64dec(remotoRaw.content)); }catch(e){}
  const s=S(), st=s.giri[g.id]||{};
  if(remoto && remoto.modificatoIl===g.modificatoIl){
    const s2=S(); s2.giri[g.id]={sha:remotoRaw.sha, modificatoIl:g.modificatoIl, file:g.file};
    Sset({giri:s2.giri}); return 'allineato';
  }
  if(remoto && st.modificatoIl && remoto.modificatoIl===st.modificatoIl){
    const corpo={message:'correzione giro '+(g.data||'')+' — '+(s.dispositivo||''),
                 content:b64enc(JSON.stringify(g,null,1)), sha:remotoRaw.sha};
    const r2=await ghFetch(path,{method:'PUT', body:JSON.stringify(corpo)});
    const s2=S(); s2.giri[g.id]={sha:r2.content.sha, modificatoIl:g.modificatoIl, file:g.file};
    Sset({giri:s2.giri}); return 'caricato';
  }
  registraConflitto(g.id, g, remoto, remotoRaw.sha, g.file);
  return 'conflitto';
}
async function syncCaricaTutti(){
  const daFare=giriDaSincronizzare();
  let n=0;
  for(const g of daFare){
    const esito=await syncCaricaGiro(g);
    if(esito==='caricato') n++;
  }
  return n;
}
async function syncScarica(){
  let elencoCanc=[];
  try{ elencoCanc=await ghFetch(ghPath('cancellati'))||[]; }
  catch(e){ if(e.stato!==404) throw e; }
  const nomiCanc=new Set((Array.isArray(elencoCanc)?elencoCanc:[]).filter(x=>x.type==='file').map(x=>x.name));
  if(nomiCanc.size){
    const giri=LS.get('hcp_giri',[]);
    const daNascondere=giri.filter(g=>g.file && nomiCanc.has(g.file));
    if(daNascondere.length){
      await snapUnaVolta();
      const canc=LS.get('hcp_giri_cancellati',[]);
      daNascondere.forEach(g=>{
        if(!canc.some(c=>c.id===g.id)) canc.push({id:g.id, file:g.file, giro:g, spostato:true, quando:Date.now()});
      });
      LS.set('hcp_giri_cancellati', canc);
      LS.set('hcp_giri', giri.filter(g=>!(g.file && nomiCanc.has(g.file))));
    }
  }
  const nascostiQui=new Set(LS.get('hcp_giri_cancellati',[]).map(c=>c.file).filter(Boolean));
  let elenco=[];
  try{ elenco=await ghFetch(ghPath('giri'))||[]; }
  catch(e){ if(e.stato===404) elenco=[]; else throw e; }
  if(!Array.isArray(elenco)) elenco=[];
  let nuovi=0, aggiornati=0;
  for(const it of elenco){
    if(it.type!=='file' || !/\.json$/i.test(it.name)) continue;
    if(nomiCanc.has(it.name) || nascostiQui.has(it.name)) continue;
    const giri=LS.get('hcp_giri',[]);
    const locale=giri.find(g=>g.file===it.name) || null;
    const st=locale ? (S().giri[locale.id]||{}) : {};
    if(locale && st.sha===it.sha) continue;
    let d=null;
    const r=await ghFetch(ghPath('giri/'+encodeURIComponent(it.name)));
    try{ d=JSON.parse(b64dec(r.content)); }catch(e){ continue; }
    if(!d || !d.id || !Array.isArray(d.buche)) continue;
    if(!d.file) d.file=it.name;
    migraGiroInArrivo(d);
    const perId=giri.find(g=>g.id===d.id) || locale;
    if(!perId){
      await snapUnaVolta();
      giri.push(d); LS.set('hcp_giri', giri);
      const s2=S(); s2.giri[d.id]={sha:r.sha, modificatoIl:d.modificatoIl||null, file:d.file};
      Sset({giri:s2.giri}); nuovi++; continue;
    }
    if((d.modificatoIl||null)===(perId.modificatoIl||null)){
      const s2=S(); s2.giri[perId.id]={sha:r.sha, modificatoIl:perId.modificatoIl||null, file:perId.file||it.name};
      Sset({giri:s2.giri}); continue;
    }
    const stId=S().giri[perId.id]||{};
    const localeIntatto = stId.modificatoIl===(perId.modificatoIl||null);
    if(localeIntatto){
      await snapUnaVolta();
      const i=giri.findIndex(g=>g.id===perId.id);
      giri[i]=d; LS.set('hcp_giri', giri);
      const s2=S(); s2.giri[d.id]={sha:r.sha, modificatoIl:d.modificatoIl||null, file:d.file};
      Sset({giri:s2.giri}); aggiornati++; continue;
    }
    registraConflitto(perId.id, perId, d, r.sha, perId.file||it.name);
  }
  idbFlush();
  bastCacheReset();
  return {nuovi:nuovi, aggiornati:aggiornati};
}
/* Un giro che arriva da un dispositivo con schema piu' vecchio va portato a v6
   prima di entrare nell'archivio. Additivo: non tocca nessun colpo. */
function migraGiroInArrivo(g){
  if(g.condizioni===undefined) g.condizioni=null;
  if(g.gara===undefined) g.gara=null;
  (g.buche||[]).forEach(b=>{
    if(b.completata===undefined) b.completata=true;
    (b.colpi||[]).forEach(c=>{
      if(c.esito===undefined) c.esito=null;
      if(c.penalita && c.penTipo===undefined) c.penTipo='altro';
    });
  });
  return g;
}
async function syncSpostaCancellati(){
  const canc=LS.get('hcp_giri_cancellati',[]);
  let mosso=0;
  for(const c of canc){
    if(c.spostato || !c.file) continue;
    const pNuovo=ghPath('cancellati/'+encodeURIComponent(c.file));
    const pVecchio=ghPath('giri/'+encodeURIComponent(c.file));
    let shaEsistente=null;
    try{ const e=await ghFetch(pNuovo); shaEsistente=e.sha; }
    catch(e){ if(e.stato!==404) throw e; }
    const corpo={message:'giro rimosso dal telefono '+(S().dispositivo||''),
                 content:b64enc(JSON.stringify(c.giro,null,1))};
    if(shaEsistente) corpo.sha=shaEsistente;
    await ghFetch(pNuovo,{method:'PUT', body:JSON.stringify(corpo)});
    try{
      const v=await ghFetch(pVecchio);
      await ghFetch(pVecchio,{method:'DELETE',
        body:JSON.stringify({message:'spostato in cancellati/', sha:v.sha})});
    }catch(e){ if(e.stato!==404) throw e; }
    c.spostato=true; mosso++;
    const s2=S(); delete s2.giri[c.id]; Sset({giri:s2.giri});
  }
  if(mosso) LS.set('hcp_giri_cancellati', canc);
  return mosso;
}
function syncEsegui(){
  if(!syncConfigurata()) return Promise.resolve({esito:'spenta'});
  if(_sy.inCorso && _sy.promessa) return _sy.promessa;
  if(navigator.onLine===false){
    Sset({ultimoErrore:'Nessuna connessione. I giri restano nel telefono e salgono da soli appena torna la rete.'});
    return Promise.resolve({esito:'offline'});
  }
  _sy.inCorso=true; _sy.snapFatto=false; _sy.conflitti=[];
  _sy.promessa=_syncEseguiOra();
  return _sy.promessa;
}
async function _syncEseguiOra(){
  try{
    const mossi=await syncSpostaCancellati();
    const giu=await syncScarica();
    const su=await syncCaricaTutti();
    Sset({ultimoOk:Date.now(), ultimoErrore:null});
    _sy.ultimoEsito={caricati:su, nuovi:giu.nuovi, aggiornati:giu.aggiornati, rimossi:mossi,
                     conflitti:_sy.conflitti.length};
    return Object.assign({esito:'ok'}, _sy.ultimoEsito);
  }catch(e){
    const m=e&&e.message||String(e);
    Sset({ultimoErrore:m});
    return {esito:'errore', messaggio:m};
  }finally{ _sy.inCorso=false; _sy.promessa=null; }
}
function syncAuto(){
  if(!syncConfigurata()) return;
  syncEsegui().then(r=>{
    if(!r || r.esito==='spenta' || r.esito==='gia_in_corso') return;
    const v=nav[nav.length-1].view;
    if(v==='home' || v==='sincronizza') render();
  });
}
function eliminaGiroLocale(g){
  const giri=LS.get('hcp_giri',[]);
  const i=giri.findIndex(x=>x.id===g.id);
  if(i<0) return;
  snapshotSalva('prima di eliminare un giro');
  const canc=LS.get('hcp_giri_cancellati',[]);
  if(!canc.some(c=>c.id===g.id)){
    canc.push({id:g.id, file:g.file||nomeFileGiro(g), giro:g,
               spostato: !S().giri[g.id], quando:Date.now()});
    LS.set('hcp_giri_cancellati', canc);
  }
  giri.splice(i,1); LS.set('hcp_giri', giri); idbFlush(); bastCacheReset();
  syncAuto();
}
function risolviConflitto(id, scelta){
  const c=_sy.conflitti.find(x=>x.id===id); if(!c) return;
  const giri=LS.get('hcp_giri',[]); const i=giri.findIndex(g=>g.id===id);
  snapshotSalva('prima di risolvere un conflitto');
  if(scelta==='locale'){
    const g=giri[i]; if(g){ marcaModifica(g); giri[i]=g; LS.set('hcp_giri',giri); }
    const s2=S(); s2.giri[id]={sha:c.sha, modificatoIl:null, file:c.file}; Sset({giri:s2.giri});
  }else{
    if(i>=0 && c.remoto){ giri[i]=c.remoto; LS.set('hcp_giri',giri); }
    else if(c.remoto){ giri.push(c.remoto); LS.set('hcp_giri',giri); }
    const s2=S(); s2.giri[id]={sha:c.sha, modificatoIl:(c.remoto&&c.remoto.modificatoIl)||null, file:c.file};
    Sset({giri:s2.giri});
  }
  _sy.conflitti=_sy.conflitti.filter(x=>x.id!==id);
  idbFlush(); bastCacheReset();
  syncAuto(); render();
}
function quandoTesto(ts){
  if(!ts) return 'mai';
  const d=new Date(ts), ora=Date.now(), diff=(ora-ts)/1000;
  if(diff<90) return 'poco fa';
  if(diff<3600) return Math.round(diff/60)+' minuti fa';
  const oggi=new Date().toDateString()===d.toDateString();
  const hh=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  return oggi ? 'oggi alle '+hh : d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})+' alle '+hh;
}
function rigaStatoSync(){
  const s=S(), sosp=syncInSospeso();
  let col, testo;
  if(!s.attiva){
    col='var(--grigio)';
    testo='<b>Sincronizzazione spenta.</b> I giri vivono solo in questo telefono. Tocca per attivarla.';
  } else if(s.ultimoErrore){
    col='var(--rosso)';
    testo='<b>Sincronizzazione ferma.</b> '+esc(String(s.ultimoErrore).slice(0,90))+(String(s.ultimoErrore).length>90?'…':'');
  } else if(_sy.conflitti.length){
    col='var(--ambra)';
    testo='<b>'+_sy.conflitti.length+' giro/i da decidere.</b> Due versioni diverse dello stesso giro: tocca per scegliere.';
  } else if(sosp>0){
    col='var(--ambra)';
    testo='<b>'+sosp+(sosp===1?' giro non ancora al sicuro.':' giri non ancora al sicuro.')+'</b> Salgono da soli appena c’e’ rete.';
  } else {
    col='var(--dv-good)';
    testo='<b>Tutto al sicuro.</b> Ultimo invio '+esc(quandoTesto(s.ultimoOk))+'.';
  }
  const r=el('<div class="syncline"><span class="pallino" style="background:'+col+'"></span><span>'+testo+'</span><span class="frecc">›</span></div>');
  r.onclick=()=>push('sincronizza');
  return r;
}

/* ==========================================================
   BUCA — due fasi dichiarate: avvicinamento e putting
   ==========================================================
   Il passaggio al putting e' un tocco esplicito. Da li' il bastone e' il putter
   e non e' modificabile, il tastierino e' tarato sulle distanze corte e i controlli
   di plausibilita' cambiano soglia.
   L'esito del colpo PRECEDENTE si raccoglie qui, non nella scheda del colpo che si
   sta per giocare: il segno si conosce dopo aver tirato, non prima. Stessa ragione
   per cui anche la penalita' e' stata spostata qui.                              */
VIEWS.buca = function(){
  if(!bozza){ nav=[{view:'home'}]; return VIEWS.home(); }
  const idx=bozza.bucaCorrente, b=bozza.buche[idx];
  if(!b.fase) b.fase='lungo';
  const bastoni=LS.get('hcp_bastoni_v2',BASTONI_DEFAULT);
  const putting = b.fase==='putting';
  const body=el('<div></div>');

  /* --- intestazione della buca --- */
  body.appendChild(el('<div class="holeprog">'+
    '<div><div class="n">Buca '+(idx+1)+'<span style="font-size:15px;color:var(--grigio)">/'+bozza.numBuche+'</span></div></div>'+
    '<div class="par">Par <select id="parSel" style="width:56px;display:inline-block;padding:3px;">'+
        [3,4,5,6].map(p=>'<option'+(p===b.par?' selected':'')+'>'+p+'</option>').join('')+'</select><br>'+
      '<input type="number" id="distSel" value="'+(b.distanza===null||b.distanza===undefined?'':b.distanza)+'" placeholder="metri" style="width:76px;margin-top:4px;padding:3px;font-size:13px;"> m</div>'+
  '</div>'));
  body.querySelector('#parSel').onchange=e=>{ b.par=parseInt(e.target.value,10); salvaBozza(); render(); };
  body.querySelector('#distSel').onchange=e=>{ b.distanza=e.target.value?parseFloat(e.target.value):null; salvaBozza(); render(); };

  /* --- colpi gia' inseriti --- */
  if(b.colpi.length){
    const c=el('<div class="card"><h2>Colpi di questa buca</h2></div>');
    b.colpi.forEach((s,i)=>{
      const next=b.colpi[i+1]||null;
      const e0=colpiAttesi(s.lie,s.distM,'tour');
      const e1=next?colpiAttesi(next.lie,next.distM,'tour'):null;
      const sg = e1===null ? null : (e0-e1-1-(s.penalita?1:0));
      const badge = s.esito ? '<span class="esitobadge">'+ESITO_NOME[s.esito]+'</span>' : '';
      c.appendChild(el('<div class="shot'+(s.lie==='green'?' putt':'')+'">'+
        '<span>'+(i+1)+'. '+LIE_NOME[s.lie]+' '+s.distM+' m · '+esc(s.bastone)+
          (s.penalita?' · +1 '+(PENALITA_NOME[s.penTipo]||'pen.'):'')+badge+'</span>'+
        '<span class="sgv '+(sg===null?'':(sg>=0?'pos':'neg'))+'">'+(sg===null?'—':sgn(sg))+'</span></div>'));
    });
    const del=el('<button class="btn ghost" style="margin-top:8px">Annulla ultimo colpo</button>');
    del.onclick=()=>{
      b.colpi.pop();
      if(b.colpi.length){ const u=b.colpi[b.colpi.length-1]; u.esito=null; b.fase = u.lie==='green'?'putting':'lungo'; }
      else b.fase='lungo';
      salvaBozza(); render();
    };
    c.appendChild(del);
    body.appendChild(c);
  }

  /* --- barra putting --- */
  if(putting){
    const np=b.colpi.filter(x=>x.lie==='green').length;
    const perGreen=b.colpi.length-np+b.colpi.reduce((s,x)=>s+(x.penalita?1:0),0);
    body.appendChild(el('<div class="puttbar">'+
      '<div><div class="lab">Putt</div><div class="big">'+np+'</div></div>'+
      '<div><div class="lab">Al green in</div><div class="big">'+perGreen+'</div></div>'+
      '<div style="margin-left:auto;text-align:right"><div class="lab">Par</div><div class="big">'+b.par+'</div></div>'+
    '</div>'));
  }

  const nShot=b.colpi.length+1;
  const prec = b.colpi[b.colpi.length-1] || null;

  /* ================= FASE PUTTING ================= */
  if(putting){
    const form=el('<div class="card"><h2>Putt '+(b.colpi.filter(x=>x.lie==='green').length+1)+'</h2>'+
      '<div class="puttflag">Sei in green. Il bastone e’ il putter e non serve sceglierlo.</div>'+
      '<div id="esitoWrap"></div>'+
      '<label>Distanza dalla buca (metri)</label>'+
      '<input type="number" inputmode="decimal" step="0.1" id="dist" placeholder="es. 2,4">'+
      '<div class="distchips" id="dchip">'+
        [0.5,1,1.5,2,3,5,8,12].map(v=>'<div class="chip" data-v="'+v+'">'+String(v).replace('.',',')+' m</div>').join('')+
      '</div>'+
      '<div id="avvBox"></div>'+
      '<button class="btn" style="margin-top:14px;" id="add">Aggiungi putt</button>'+
      '<button class="btn ghost" style="margin-top:2px" id="esci">La palla non e’ in green</button>'+
    '</div>');
    montaEsito(form, b, prec, ()=>{});
    const dist=form.querySelector('#dist');
    form.querySelector('#dchip').onclick=e=>{
      const c=e.target.closest('.chip'); if(!c) return;
      dist.value=c.dataset.v; dist.dispatchEvent(new Event('input'));
      form.querySelectorAll('#dchip .chip').forEach(x=>x.classList.remove('selected'));
      c.classList.add('selected');
    };
    dist.oninput=()=>aggiornaEsitoVisibilita(form, b, prec, parseFloat(dist.value));
    // sul green il settore serve sempre, quindi la griglia compare subito e non
    // solo dopo che hai digitato la distanza
    aggiornaEsitoVisibilita(form, b, prec, parseFloat(dist.value));
    form.querySelector('#esci').onclick=()=>{ b.fase='lungo'; salvaBozza(); render(); };
    form.querySelector('#add').onclick=()=>aggiungiColpo(form, b, idx, {lie:'green', bastone:'Putter'});
    body.appendChild(form);
  }
  /* ================= FASE AVVICINAMENTO ================= */
  else {
    const lieOpz = LIE_OPZ.filter(l=>l.k!=='green');
    const lieDefault = nShot===1 ? 'tee' : null;
    const distDefault = nShot===1 && b.distanza ? b.distanza : '';
    const form=el('<div class="card"><h2>Colpo '+nShot+'</h2>'+
      '<div class="hint">Inserisci <b>prima di tirare</b>: dove si trova la palla, quanto manca alla buca, che bastone usi.</div>'+
      '<div id="esitoWrap"></div>'+
      '<label>Lie</label>'+
      '<div class="grid3" id="lieGrid">'+lieOpz.map(l=>'<div class="chip'+(l.k===lieDefault?' selected':'')+'" data-v="'+l.k+'">'+l.n+'</div>').join('')+'</div>'+
      '<div class="hint tight" id="lieAiuto" style="margin-top:6px">'+(lieDefault?esc(LIE_AIUTO[lieDefault]):'Tocca il lie per vederne la definizione.')+'</div>'+
      '<label style="margin-top:12px;">Distanza dalla buca (metri)</label>'+
      '<input type="number" inputmode="decimal" step="0.1" id="dist" value="'+distDefault+'" placeholder="es. 145">'+
      '<label style="margin-top:12px;">Bastone</label>'+
      '<div class="grid3" id="bastGrid">'+bastoni.filter(x=>x!=='Putter').map(x=>'<div class="chip" data-v="'+esc(x)+'">'+esc(x)+'</div>').join('')+
        '<div class="chip" data-v="Putter">Putter</div></div>'+
      '<div id="avvBox"></div>'+
      '<button class="btn" style="margin-top:14px;" id="add">Aggiungi colpo</button>'+
      '<button class="btn secondary" style="margin-top:2px" id="ingreen">⛳ La palla e’ in green — passa al putting</button>'+
    '</div>');
    montaEsito(form, b, prec, ()=>{});
    let lieSel=lieDefault, bastSel=null;
    form.querySelector('#lieGrid').onclick=e=>{
      const c=e.target.closest('.chip'); if(!c) return;
      form.querySelectorAll('#lieGrid .chip').forEach(x=>x.classList.remove('selected'));
      c.classList.add('selected'); lieSel=c.dataset.v;
      form.querySelector('#lieAiuto').innerHTML=esc(LIE_AIUTO[lieSel]||'');
    };
    form.querySelector('#bastGrid').onclick=e=>{
      const c=e.target.closest('.chip'); if(!c) return;
      form.querySelectorAll('#bastGrid .chip').forEach(x=>x.classList.remove('selected'));
      c.classList.add('selected'); bastSel=c.dataset.v;
    };
    const dist=form.querySelector('#dist');
    dist.oninput=()=>aggiornaEsitoVisibilita(form, b, prec, parseFloat(dist.value));
    aggiornaEsitoVisibilita(form, b, prec, parseFloat(dist.value));
    form.querySelector('#ingreen').onclick=()=>{ b.fase='putting'; salvaBozza(); render(); };
    form.querySelector('#add').onclick=()=>aggiungiColpo(form, b, idx, {getLie:()=>lieSel, getBast:()=>bastSel});
    body.appendChild(form);
  }

  /* --- chiusura della buca --- */
  if(b.colpi.length){
    const pen=b.colpi.reduce((s,c)=>s+(c.penalita?1:0),0);
    const tot=b.colpi.length+pen;
    const isUlt = idx===bozza.numBuche-1;
    const chiudi=el('<button class="btn big">⛳ Palla in buca — '+tot+' colpi'+(isUlt?' · termina giro':'')+'</button>');
    chiudi.onclick=()=>chiudiBuca(b, idx, true);
    body.appendChild(chiudi);
    const racc=el('<button class="btn ghost">Buca non completata (raccolta o concessa)</button>');
    racc.onclick=()=>{
      if(!confirm('Segnare la buca come non completata?\n\nIl punteggio resta quello dei colpi registrati, ma la buca viene marcata e resta fuori dai calcoli che richiedono una buca chiusa.')) return;
      chiudiBuca(b, idx, false);
    };
    body.appendChild(racc);
  }
  return {header:bozza.circolo+(putting?' · putting':''), body, putting:putting};
};

/* --- montaggio della griglia di esito del colpo precedente --- */
function montaEsito(form, b, prec, onSel){
  const w=form.querySelector('#esitoWrap');
  if(!w || !prec || prec.esito) return;
  if(!IMP().esitoAttivo) return;
  const nProg=b.colpi.length;
  w.innerHTML='<div class="esitowrap" id="esitoBox" style="display:none">'+
    '<label>Dov’e’ finita la palla del colpo '+nProg+'?</label>'+
    '<div class="hint tight">Rispetto alla bandiera. La distanza che inserisci sotto e’ il raggio: '+
      'il settore aggiunge la direzione, e insieme dicono quanto e’ volata davvero la palla.</div>'+
    '<div class="esitogrid" id="esGrid">'+
      ESITI.map(e=>'<div class="esitocell'+(e.k==='P'?' centro':'')+'" data-v="'+e.k+'">'+
        (e.k==='P'?'<span class="fl">⛳</span>':'')+'<span>'+e.n+'</span></div>').join('')+
    '</div>'+
    '<div style="margin-top:12px"><label>Penalita’ su quel colpo?</label>'+
      '<div class="grid3" id="penGrid">'+PENALITA_OPZ.map(p=>'<div class="chip small'+(p.k===''?' selected':'')+'" data-v="'+p.k+'">'+p.n+
        (p.d?'<br><span style="font-size:10px;opacity:.75">'+p.d+'</span>':'')+'</div>').join('')+'</div></div>'+
  '</div>';
  const grid=w.querySelector('#esGrid');
  grid.onclick=e=>{
    const c=e.target.closest('.esitocell'); if(!c) return;
    grid.querySelectorAll('.esitocell').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); w.dataset.esito=c.dataset.v; onSel&&onSel(c.dataset.v);
  };
  const pg=w.querySelector('#penGrid');
  pg.onclick=e=>{
    const c=e.target.closest('.chip'); if(!c) return;
    pg.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected'); w.dataset.pen=c.dataset.v;
  };
  w.dataset.pen='';
}
function aggiornaEsitoVisibilita(form, b, prec, distanzaNuova){
  const w=form.querySelector('#esitoWrap'); if(!w) return;
  const box=w.querySelector('#esitoBox'); if(!box) return;
  const serve = prec && !prec.esito && IMP().esitoAttivo &&
    (prec.lie==='green' || (distanzaNuova>0 && distanzaNuova<=ESITO_SOGLIA_M));
  // la penalita' si puo' segnare sempre, anche quando il settore non serve
  const soloPen = prec && !prec.esito && !serve;
  box.style.display = (serve||soloPen) ? 'block' : 'none';
  const g=box.querySelector('#esGrid');
  const lab=box.querySelector('label');
  if(g) g.style.display = serve ? 'grid' : 'none';
  if(lab) lab.style.display = serve ? 'block' : 'none';
  const hint=box.querySelector('.hint');
  if(hint) hint.style.display = serve ? 'block' : 'none';
}

/* --- aggiunta di un colpo, con tutti i controlli --- */
function aggiungiColpo(form, b, idx, o){
  const w=form.querySelector('#esitoWrap');
  const prec=b.colpi[b.colpi.length-1]||null;
  const dv=form.querySelector('#dist').value;
  const distM = dv===''?null:parseFloat(dv);
  const lie = o.lie || (o.getLie?o.getLie():null);
  const bastone = o.bastone || (o.getBast?o.getBast():null);

  const av=controlliColpo({lie:lie, distM:distM, bastone:bastone, par:b.par,
    colpi:b.colpi, distanzaBuca:b.distanza});
  const box=form.querySelector('#avvBox');
  box.innerHTML='';
  const blocchi=av.filter(a=>a.liv==='blocco');
  if(blocchi.length){ const bb=bloccoAvvisi(blocchi); if(bb) box.appendChild(bb); return; }
  const bb=bloccoAvvisi(av); if(bb) box.appendChild(bb);
  const conf=testoConferma(av);
  if(conf && !confirm(conf)) return;

  // esito e penalita' del colpo PRECEDENTE, raccolti adesso perche' adesso si sanno
  if(prec && !prec.esito && w){
    const es=w.dataset.esito||null;
    const serve = prec.lie==='green' || (distM>0 && distM<=ESITO_SOGLIA_M);
    if(serve && IMP().esitoAttivo && !es){
      if(!confirm('Non hai indicato dove e’ finita la palla del colpo '+b.colpi.length+'.\n\nSenza il settore, la distanza di quel bastone viene calcolata con la vecchia formula, che sottostima ogni palla finita oltre la bandiera o di lato.\n\nProseguire lo stesso?')) return;
    }
    if(es) prec.esito=es;
    const pt=w.dataset.pen||'';
    if(pt){ prec.penalita=true; prec.penTipo=pt; }
  }

  b.colpi.push({lie:lie, distM:distM, bastone:bastone, penalita:false, penTipo:null, esito:null});
  if(lie==='green') b.fase='putting';
  salvaBozza(); render();
}

/* --- chiusura della buca --- */
function chiudiBuca(b, idx, completata){
  // l'esito del colpo precedente e' noto anche adesso: la palla e' in buca,
  // quindi il raggio residuo e' zero e non serve nessun settore.
  const av=controlliBuca(b, b.colpi);
  if(haBlocchi(av)){ alert(av.filter(a=>a.liv==='blocco').map(a=>a.txt).join('\n\n')); return; }
  const conf=testoConferma(av);
  if(conf && !confirm(conf)) return;
  b.chiusa=true; b.completata=!!completata;
  const isUlt = idx===bozza.numBuche-1;
  if(isUlt) chiudiGiro();
  else { bozza.bucaCorrente++; salvaBozza(); render(); }
}

function chiudiGiro(){
  const av=controlliGiro(bozza);
  const conf=testoConferma(av);
  if(conf && !confirm(conf+'\n\n(Il giro viene salvato comunque: puoi correggerlo dopo dal riepilogo.)')){
    // l'utente ha detto no: si resta sulla buca, niente e' perduto
    return;
  }
  bozza.stato='completato';
  bozza.salvatoIl = Date.now();
  bozza.misura = IMP().misura;
  bozza.slope = IMP().slope;
  marcaModifica(bozza);
  const giri=LS.get('hcp_giri',[]); giri.push(bozza); LS.set('hcp_giri',giri);
  snapshotSalva();
  bastCacheReset();
  const id=bozza.id; LS.set('hcp_bozza_v3',null); bozza=null;
  replaceTop('riepilogoGiro',{id});
  syncAuto();
}
/* ==========================================================
   STATISTICHE — cinque pannelli
   ==========================================================
   Regola nuova, applicata ovunque: accanto a ogni numero c'e' su quante
   osservazioni e' calcolato, e nessun commento automatico scatta su una soglia
   fissa. Le soglie sono due errori standard, calcolati sui dati reali.        */
VIEWS.statistiche = function(){
  const tutti=LS.get('hcp_giri',[]).filter(g=>g.buche&&g.buche.length);
  const body=el('<div></div>');
  if(!tutti.length){
    body.appendChild(el('<div class="card"><h2>Ancora nessun dato</h2>'+
      '<div class="hint">Le statistiche compaiono qui appena completi il primo giro.</div></div>'));
    const b=el('<button class="btn">+ Registra il primo giro</button>');
    b.onclick=()=>push('nuovoGiro'); body.appendChild(b);
    return {header:'Statistiche', body};
  }

  const circoli=[...new Set(tutti.map(g=>g.circolo))], tees=[...new Set(tutti.map(g=>g.tee))];
  const f=el('<div class="filters">'+
    '<div class="full"><label>Circolo</label><select id="fC"><option value="__tutti__">Tutti i circoli</option>'+
      circoli.map(c=>'<option value="'+esc(c)+'"'+(STAT_F.circolo===c?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div>'+
    '<div><label>Tee</label><select id="fT"><option value="__tutti__">Tutti</option>'+
      tees.map(t=>'<option value="'+esc(t)+'"'+(STAT_F.tee===t?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select></div>'+
    '<div><label>Periodo</label><select id="fP">'+
      '<option value="tutti"'+(STAT_F.periodo==='tutti'?' selected':'')+'>Tutti i giri</option>'+
      '<option value="5"'+(STAT_F.periodo==='5'?' selected':'')+'>Ultimi 5</option>'+
      '<option value="10"'+(STAT_F.periodo==='10'?' selected':'')+'>Ultimi 10</option>'+
      '<option value="20"'+(STAT_F.periodo==='20'?' selected':'')+'>Ultimi 20</option></select></div>'+
    '<div class="full"><label>Confronto strokes gained</label><select id="fB">'+
      '<option value="tour"'+(STAT_F.baseline==='tour'?' selected':'')+'>PGA Tour (dato pubblicato)</option>'+
      '<option value="scratch"'+(STAT_F.baseline==='scratch'?' selected':'')+'>Giocatore scratch (stima)</option>'+
      '<option value="media"'+(STAT_F.baseline==='media'?' selected':'')+'>La tua media (ultimi 20 giri)</option></select></div>'+
  '</div>');
  f.querySelector('#fC').onchange=e=>{STAT_F.circolo=e.target.value; render();};
  f.querySelector('#fT').onchange=e=>{STAT_F.tee=e.target.value; render();};
  f.querySelector('#fP').onchange=e=>{STAT_F.periodo=e.target.value; render();};
  f.querySelector('#fB').onchange=e=>{STAT_F.baseline=e.target.value; render();};
  body.appendChild(f);

  let sel=tutti.slice().sort((a,b)=>(a.data||'')<(b.data||'')?-1:1);
  if(STAT_F.circolo!=='__tutti__') sel=sel.filter(g=>g.circolo===STAT_F.circolo);
  if(STAT_F.tee!=='__tutti__') sel=sel.filter(g=>g.tee===STAT_F.tee);
  if(STAT_F.periodo!=='tutti') sel=sel.slice(-parseInt(STAT_F.periodo,10));
  if(!sel.length){
    body.appendChild(el('<div class="card"><h2>Nessun giro</h2><div class="hint">Nessun giro corrisponde ai filtri. Allarga la selezione.</div></div>'));
    return {header:'Statistiche', body};
  }

  const baseCalc = STAT_F.baseline==='scratch' ? 'scratch' : 'tour';
  const A=sel.map(g=>analizzaGiro(g, baseCalc));
  const completi=A.filter(g=>g.completo);
  const nG=A.length, totB=A.reduce((s,g)=>s+g.calc.nBuche,0);
  const sum=k=>A.reduce((s,g)=>s+g.calc[k],0);
  const scoreMedio=sum('score')/nG, diffMedia=(sum('score')-sum('par'))/nG;
  const girPct=Math.round(100*sum('gir')/totB), puttB=sum('putt')/totB;
  const scrOpp=sum('scrOpp'), scrOk=sum('scrOk');
  const scrPct=scrOpp>0?Math.round(100*scrOk/scrOpp):null;
  const etichetta = STAT_F.baseline==='scratch' ? 'a un giocatore scratch (stima)' : 'al PGA Tour';
  const MS = STAT_F.baseline==='media' ? mediaStabile(baseCalc) : null;

  body.appendChild(el('<div class="hint" style="margin-top:-4px;">'+nG+' giri · '+totB+' buche'+
    (completi.length<nG?' · '+completi.length+' con dettaglio colpo per colpo':'')+'</div>'));
  body.appendChild(el('<div class="kpigrid">'+
    '<div class="kpi"><div class="lab">Punteggio medio</div><div class="v">'+scoreMedio.toFixed(1)+'</div>'+
      '<div class="sub">'+sgn(diffMedia,1)+' dal par · '+nG+' giri</div></div>'+
    '<div class="kpi"><div class="lab">Green in regulation</div><div class="v">'+girPct+'<span class="u">%</span></div>'+
      '<div class="sub">'+sum('gir')+' su '+totB+' buche</div></div>'+
    '<div class="kpi"><div class="lab">Putt per buca</div><div class="v">'+puttB.toFixed(2)+'</div>'+
      '<div class="sub">circa '+(puttB*18).toFixed(0)+' su 18 buche</div></div>'+
    '<div class="kpi"><div class="lab">Scrambling</div><div class="v">'+(scrPct===null?'—':scrPct+'%')+'</div>'+
      '<div class="sub">'+(scrOpp===0?'sempre in green':scrOk+' par salvati su '+scrOpp)+'</div></div>'+
  '</div>'));

  const TABS=[{k:'sg',n:'Strokes<br>gained'},{k:'par',n:'Punteggio<br>e base'},
              {k:'club',n:'Bastoni'},{k:'esiti',n:'Dove<br>finisce'},{k:'x',n:'Incroci'}];
  if(!STAT_F.tab) STAT_F.tab='sg';
  const bar=el('<div class="tabbar">'+TABS.map(t=>'<button data-k="'+t.k+'" class="'+(STAT_F.tab===t.k?'on':'')+'">'+t.n+'</button>').join('')+'</div>');
  const pager=el('<div class="pager"></div>');
  body.appendChild(bar); body.appendChild(pager);

  const dvRow=(lab,v,maxA,dec)=>{
    const w=Math.abs(v)/maxA*50;
    const st=v>0?'left:50%;width:'+w+'%;background:var(--dv-blue);'
           :v<0?'right:50%;width:'+w+'%;background:var(--dv-red);'
           :'left:calc(50% - 2px);width:4px;background:var(--dv-neutral);';
    return '<div class="dvrow"><div class="d">'+lab+'</div>'+
      '<div class="dvtrack"><div class="zero"></div><div class="dvbar" style="'+st+'"></div></div>'+
      '<div class="n '+(v>=0?'pos':'neg')+'">'+sgn(v,dec===undefined?1:dec)+'</div></div>';
  };
  const etichette = A.map(g=>fmtDataBreve(g.data));

  /* ================= 1. STROKES GAINED ================= */
  const p1=el('<div class="pane"></div>');
  if(!completi.length){
    p1.appendChild(el('<div class="card"><h2>Strokes gained</h2>'+
      '<div class="hint">Nessuno dei giri selezionati ha il dettaglio colpo per colpo.</div></div>'));
  } else {
    const cats=['tee','approccio','corto','putting'];
    const nC=completi.length;
    const perGiro=cats.reduce((o,k)=>(o[k]=media(completi.map(g=>g.calc.sgCat[k])),o),{});
    const sdCat=cats.reduce((o,k)=>(o[k]=scartoTipo(completi.map(g=>g.calc.sgCat[k])),o),{});
    const mediaTot=cats.reduce((s,k)=>s+perGiro[k],0);
    const etC=completi.map(g=>fmtDataBreve(g.data));
    const rif = MS ? MS : null;

    if(STAT_F.baseline==='media'){
      if(!rif){
        p1.appendChild(el('<div class="card"><h2>La tua media</h2><div class="hint">'+
          'Servono almeno tre giri completi per costruire la finestra di riferimento.</div></div>'));
      } else {
        const vals=completi.map((g,i)=>({x:etC[i], y:g.calc.sgTot-rif.tot}));
        const seTot = rif.sdTot!==null ? rif.sdTot : null;
        const c=el('<div class="card"><h2>Ogni giro rispetto alla tua media</h2>'+
          '<div class="hint">Riferimento fisso: media degli <b>ultimi '+rif.n+' giri completi</b>, indipendente dai filtri, '+
          'cosi’ lo stesso giro non cambia valore cambiando vista. Media di riferimento '+sgn(rif.tot,2)+' colpi, '+
          'scarto tipo '+(rif.sdTot!==null?rif.sdTot.toFixed(2):'—')+'.</div>'+
          svgLinea(vals,{h:110, zero:true, colore:'var(--dv-blue)', fmt:v=>sgn(v,1), aria:'scarto dalla media per giro'})+'</div>');
        const mx=Math.max(0.5,...completi.map(x=>Math.abs(x.calc.sgTot-rif.tot)));
        completi.forEach((g,i)=>c.appendChild(el(dvRow(etC[i], g.calc.sgTot-rif.tot, mx))));
        c.appendChild(el('<div class="stcap">Un giro si distingue davvero dalla tua media quando esce di piu’ di '+
          (seTot?(2*seTot).toFixed(1):'—')+' colpi, cioe’ due scarti tipo. Sotto quella soglia e’ variabilita’ normale.</div>'));
        p1.appendChild(c);
      }
    } else {
      const maxA=Math.max(0.5,...cats.map(k=>Math.abs(perGiro[k])));
      const c=el('<div class="card"><h2>Strokes gained per categoria</h2>'+
        '<div class="hint">Media per giro rispetto '+etichetta+', su '+nC+' giri. Sopra lo zero guadagni colpi, sotto li perdi.</div>'+
        '<div class="legend"><span class="it"><span class="sw" style="background:var(--dv-blue)"></span>Guadagni</span>'+
          '<span class="it"><span class="sw" style="background:var(--dv-red)"></span>Perdi</span></div>'+
        cats.map(k=>dvRow(CAT_NOME[k], perGiro[k], maxA)).join('')+
        '<table class="stat" style="margin-top:12px"><thead><tr><th>Categoria</th><th class="n">Media</th>'+
          '<th class="n">Scarto tipo</th><th class="n">Errore std</th></tr></thead><tbody>'+
        cats.map(k=>{
          const sd=sdCat[k], se=sd!==null?sd/Math.sqrt(nC):null;
          return '<tr><td>'+CAT_NOME[k]+'</td><td class="n '+(perGiro[k]>=0?'pos':'neg')+'">'+sgn(perGiro[k],2)+'</td>'+
            '<td class="n dim">'+(sd!==null?sd.toFixed(2):'—')+'</td>'+
            '<td class="n dim">'+(se!==null?'± '+se.toFixed(2):'—')+'</td></tr>';
        }).join('')+
        '</tbody></table>'+
        '<div class="stcap">Totale per giro: <b class="'+(mediaTot>=0?'pos':'neg')+'">'+sgn(mediaTot,1)+
          '</b> colpi rispetto '+etichetta+'. L’errore standard dice di quanto puo’ spostarsi la media '+
          'per solo effetto del caso: una categoria si distingue da zero quando la media supera due errori standard.</div>'+
        (STAT_F.baseline==='scratch'?'<div class="hint" style="margin-top:8px">La baseline scratch e’ una <b>ricostruzione</b>. Vedi "Metodo e fonti".</div>':'')+'</div>');
      p1.appendChild(c);

      // andamento nel tempo, con soglia di leggibilita'
      const sdTot=scartoTipo(completi.map(g=>g.calc.sgTot));
      const cT=el('<div class="card"><h2>Andamento nel tempo</h2></div>');
      if(nC>=10){
        cT.appendChild(el('<div class="hint">Strokes gained totale, giro per giro. Lo scarto tipo misurato sui tuoi giri e’ '+
          (sdTot!==null?sdTot.toFixed(2):'—')+' colpi: la banda chiara e’ l’intervallo entro cui il caso da solo puo’ muovere la media.</div>'));
        const se = sdTot!==null ? sdTot/Math.sqrt(nC) : 0;
        cT.appendChild(el(svgLinea(completi.map((g,i)=>({x:etC[i], y:g.calc.sgTot, se:se})),
          {h:112, zero:true, banda:true, colore:'var(--dv-blue)', fmt:v=>sgn(v,1), aria:'strokes gained totale nel tempo'})));
        cT.appendChild(el('<div class="stcap">Per distinguere un miglioramento di un colpo per giro servirebbero circa '+
          (sdTot?giriNecessari(sdTot,1):'—')+' giri prima e altrettanti dopo. Con '+nC+' giri, questa linea racconta '+
          'la variabilita’, non la tendenza.</div>'));
      } else {
        cT.appendChild(el(nonLeggibile(sdTot, 1.0, nC, 'Sotto i dieci giri la linea sarebbe rumore disegnato bene.')));
      }
      p1.appendChild(cT);

      const tuttiV=cats.flatMap(k=>completi.map(g=>g.calc.sgCat[k]));
      const mn=Math.min(0,...tuttiV), mx2=Math.max(0,...tuttiV);
      if(nC>=8){
        p1.appendChild(el('<div class="card"><h2>Andamento per categoria</h2>'+
          '<div class="hint">Stessa scala su tutti e quattro, cosi’ si vede subito quale pesa di piu’.</div>'+
          '<div class="smgrid">'+cats.map((k,ii)=>boxTrend(CAT_NOME[k],
            completi.map((g,i)=>({x:etC[i], y:g.calc.sgCat[k]})),
            ['var(--dv-blue)','var(--dv-orange)','var(--dv-aqua)','var(--dv-red)'][ii],
            {min:mn, max:mx2, fmt:v=>sgn(v,1)})).join('')+'</div>'+
          '<div class="stcap">Le etichette mostrano primo e ultimo giro del periodo. Con '+nC+' giri queste curve '+
          'servono a vedere la dispersione, non a leggere una direzione.</div></div>'));
      }
    }

    const fasce=statFasce(completi);
    if(fasce.length) p1.appendChild(el('<div class="card"><h2>Approcci per fascia di distanza</h2>'+
      '<div class="hint">Da dove parte il colpo, quanti green prendi da li’, quanto lasci alla buca. '+
      'Le righe con meno di '+N_MIN_FASCIA+' colpi sono in grigio: ci sono, ma non si leggono.</div>'+
      '<table class="stat"><thead><tr><th>Da</th><th class="n">Colpi</th><th class="n">Green</th>'+
        '<th class="n">Lascia</th><th class="n">SG/colpo</th></tr></thead><tbody>'+
        fasce.map(x=>'<tr'+(x.solido?'':' style="opacity:.5"')+'><td>'+x.label+'</td><td class="n">'+x.n+'</td>'+
          '<td class="n">'+Math.round(100*x.green/x.n)+'%</td>'+
          '<td class="n">'+(x.nProx?(x.prox/x.nProx).toFixed(1)+' m':'—')+'</td>'+
          '<td class="n '+(x.sgColpo>=0?'pos':'neg')+'">'+sgn(x.sgColpo,3)+
            (x.se?'<span class="dim" style="font-size:10px"> ±'+(2*x.se).toFixed(2)+'</span>':'')+'</td></tr>').join('')+
      '</tbody></table><div class="stcap">SG per colpo, non per giro, con due errori standard accanto. '+
      '"Lascia" vale solo quando il green viene preso.</div></div>'));

    const P=statPutting(completi);
    if(P.fasce.length){
      const tp=P.bucheConPutt?100*P.treputt/P.bucheConPutt:0;
      p1.appendChild(el('<div class="card"><h2>Putting per distanza</h2>'+
        '<div class="hint">Tre putt sul <b>'+tp.toFixed(1)+'%</b> delle buche ('+P.treputt+' su '+P.bucheConPutt+').</div>'+
        '<table class="stat"><thead><tr><th>Distanza</th><th class="n">Putt</th>'+
          '<th class="n">Imbucati</th><th class="n">SG/putt</th></tr></thead><tbody>'+
          P.fasce.map(x=>'<tr'+(x.solido?'':' style="opacity:.5"')+'><td>'+x.label+'</td><td class="n">'+x.n+'</td>'+
            '<td class="n">'+Math.round(100*x.imbucati/x.n)+'%</td>'+
            '<td class="n '+(x.sgColpo>=0?'pos':'neg')+'">'+sgn(x.sgColpo,3)+
              (x.se?'<span class="dim" style="font-size:10px"> ±'+(2*x.se).toFixed(2)+'</span>':'')+'</td></tr>').join('')+
        '</tbody></table></div>'));
    }
  }

  /* ================= 2. PUNTEGGIO E BASE ================= */
  const p2=el('<div class="pane"></div>');
  const diffs=A.map(g=>g.calc.score-g.calc.par);
  const sdDiff=scartoTipo(diffs);
  const cAnd=el('<div class="card"><h2>Andamento del punteggio</h2></div>');
  if(nG>=8){
    cAnd.appendChild(el('<div class="hint">Colpi sopra o sotto il par, giro per giro. Piu’ la linea scende, meglio e’. '+
      'Scarto tipo misurato: '+(sdDiff!==null?sdDiff.toFixed(1):'—')+' colpi.</div>'));
    cAnd.appendChild(el(svgLinea(A.map((g,i)=>({x:etichette[i], y:diffs[i], se:sdDiff!==null?sdDiff/Math.sqrt(nG):0})),
      {h:112, zero:true, banda:true, colore:'var(--dv-blue)', fmt:v=>sgn(v,0), aria:'punteggio sul par nel tempo'})));
  } else {
    cAnd.appendChild(el(nonLeggibile(sdDiff, 2.0, nG, 'Sotto gli otto giri la linea non dice nulla che il caso non spieghi.')));
  }
  p2.appendChild(cAnd);

  const maxAbs=Math.max(1,...diffs.map(Math.abs));
  const cd=el('<div class="card"><h2>Punteggio rispetto al par</h2>'+
    '<div class="hint">Un giro per riga, dal piu’ vecchio al piu’ recente.</div></div>');
  A.forEach((g,i)=>{
    const d=diffs[i], w=Math.abs(d)/maxAbs*50;
    const st=d>0?'left:50%;width:'+w+'%;background:var(--dv-red);':d<0?'right:50%;width:'+w+'%;background:var(--dv-blue);':'left:calc(50% - 2px);width:4px;background:var(--dv-neutral);';
    cd.appendChild(el('<div class="dvrow"><div class="d">'+etichette[i]+'</div>'+
      '<div class="dvtrack"><div class="zero"></div><div class="dvbar" style="'+st+'"></div></div>'+
      '<div class="n">'+(d===0?'PAR':sgn(d,0))+'</div></div>'));
  });
  p2.appendChild(cd);

  p2.appendChild(el('<div class="card"><h2>Andamento di green e putt</h2>'+
    '<div class="smgrid">'+
      boxTrend('Green in regulation', A.map((g,i)=>({x:etichette[i], y:100*g.calc.gir/g.calc.nBuche})),
        'var(--dv-aqua)', {zero:false, fmt:v=>Math.round(v)+'%'})+
      boxTrend('Putt per buca', A.map((g,i)=>({x:etichette[i], y:g.calc.putt/g.calc.nBuche})),
        'var(--dv-orange)', {zero:false, fmt:v=>v.toFixed(2)})+
    '</div></div>'));

  let eagle=0,birdie=0,parc=0,bogey=0,doppio=0;
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    if(b.diff<=-2)eagle++; else if(b.diff===-1)birdie++; else if(b.diff===0)parc++;
    else if(b.diff===1)bogey++; else doppio++;}));
  const sotto=eagle+birdie, sopra=bogey+doppio, pc=v=>v/totB*100;
  p2.appendChild(el('<div class="card"><h2>Come si chiudono le buche</h2>'+
    '<div class="hint">Su '+totB+' buche giocate.</div>'+
    '<div class="legend"><span class="it"><span class="sw" style="background:var(--dv-blue)"></span>Sotto par</span>'+
      '<span class="it"><span class="sw" style="background:var(--dv-neutral)"></span>Par</span>'+
      '<span class="it"><span class="sw" style="background:var(--dv-red)"></span>Sopra par</span></div>'+
    '<div class="strack">'+
      (sotto>0?'<div class="sseg" style="width:'+pc(sotto)+'%;background:var(--dv-blue)"></div>':'')+
      (parc>0?'<div class="sseg" style="width:'+pc(parc)+'%;background:var(--dv-neutral)"></div>':'')+
      (sopra>0?'<div class="sseg" style="width:'+pc(sopra)+'%;background:var(--dv-red)"></div>':'')+'</div>'+
    '<table class="stat" style="margin-top:12px;">'+
      '<thead><tr><th>Risultato</th><th class="n">Buche</th><th class="n">%</th></tr></thead><tbody>'+
      '<tr><td>Eagle o meglio</td><td class="n">'+eagle+'</td><td class="n">'+pc(eagle).toFixed(1)+'%</td></tr>'+
      '<tr><td>Birdie</td><td class="n">'+birdie+'</td><td class="n">'+pc(birdie).toFixed(1)+'%</td></tr>'+
      '<tr><td>Par</td><td class="n">'+parc+'</td><td class="n">'+pc(parc).toFixed(1)+'%</td></tr>'+
      '<tr><td>Bogey</td><td class="n">'+bogey+'</td><td class="n">'+pc(bogey).toFixed(1)+'%</td></tr>'+
      '<tr><td>Doppio o peggio</td><td class="n">'+doppio+'</td><td class="n">'+pc(doppio).toFixed(1)+'%</td></tr>'+
      '</tbody></table></div>'));

  if(completi.length){
    const F=statFairway(completi), Sd=statSand(completi);
    p2.appendChild(el('<div class="card"><h2>Precisione dal tee e bunker</h2>'+
      '<table class="stat"><tbody>'+
        '<tr><td>Fairway presi</td><td class="n">'+(F.tot?Math.round(100*F.presi/F.tot)+'%':'—')+'</td>'+
          '<td class="n dim">'+F.presi+' su '+F.tot+'</td></tr>'+
        '<tr><td>Sand save</td><td class="n">'+(Sd.opp?Math.round(100*Sd.ok/Sd.opp)+'%':'—')+'</td>'+
          '<td class="n dim">'+Sd.ok+' su '+Sd.opp+'</td></tr>'+
      '</tbody></table>'+
      '<div class="stcap">Fairway sui par 4 e 5. Sand save: buche con un colpo dalla sabbia entro i 30 yard, '+
      'chiuse in par o meglio. E’ una convenzione piu’ stretta di quella del Tour, che non pone limite di distanza.</div></div>'));
  }

  const perTipo=statPerTipo(A);
  if(perTipo.length>1) p2.appendChild(el('<div class="card"><h2>Per tipo di giro</h2>'+
    '<div class="hint">Se il numero in gara e’ peggiore dell’allenamento, il problema non e’ tecnico. '+
    'Ma guarda l’errore standard prima di concludere.</div>'+
    '<table class="stat"><thead><tr><th>Tipo</th><th class="n">Giri</th>'+
      '<th class="n">Sul par</th><th class="n">SG medio</th></tr></thead><tbody>'+
      perTipo.map(t=>'<tr><td>'+esc(t.tipo)+'</td><td class="n">'+t.n+'</td>'+
        '<td class="n">'+sgn(t.mediaPar,1)+(t.se?'<span class="dim" style="font-size:10px"> ±'+(2*t.se).toFixed(1)+'</span>':'')+'</td>'+
        '<td class="n '+(t.mediaSg===null?'':(t.mediaSg>=0?'pos':'neg'))+'">'+(t.mediaSg===null?'—':sgn(t.mediaSg,1))+'</td></tr>').join('')+
    '</tbody></table></div>'));

  const perCond=statCondizioni(A);
  if(perCond.length>1) p2.appendChild(el('<div class="card"><h2>Per condizioni di vento</h2>'+
    '<div class="hint">Serviranno due stagioni prima che questa tabella dica qualcosa di solido: '+
    'e’ un investimento a scadenza lunga, non un’analisi.</div>'+
    '<table class="stat"><thead><tr><th>Vento</th><th class="n">Giri</th><th class="n">Sul par</th>'+
      '<th class="n">SG medio</th></tr></thead><tbody>'+
      perCond.map(t=>'<tr><td>'+esc(t.nome)+'</td><td class="n">'+t.n+'</td>'+
        '<td class="n">'+sgn(t.mediaPar,1)+(t.se?'<span class="dim" style="font-size:10px"> ±'+(2*t.se).toFixed(1)+'</span>':'')+'</td>'+
        '<td class="n">'+(t.mediaSg===null?'—':sgn(t.mediaSg,1))+'</td></tr>').join('')+
    '</tbody></table></div>'));

  const cSel=[...new Set(sel.map(g=>g.circolo))];
  if(cSel.length===1){
    const pbAll=statPerBuca(A);
    const pb=pbAll.filter(x=>x.contratta>0).slice(0,6);
    const cb=el('<div class="card"><h2>Buche che costano di piu’</h2>'+
      '<div class="hint">Su '+esc(cSel[0])+'. Il valore mostrato e’ <b>contratto verso la media</b>: '+
      'ordinare per media grezza e troncare in cima seleziona le buche piu’ rumorose, non le piu’ difficili. '+
      'Con poche osservazioni la buca resta vicina alla media generale; man mano che i giri crescono emerge il suo valore proprio.</div></div>');
    if(!pb.length) cb.appendChild(el('<div class="hint">Nessuna buca sopra la media dopo la contrazione.</div>'));
    else { const mx=Math.max(...pb.map(x=>x.contratta));
      pb.forEach(x=>cb.appendChild(el('<div class="hbrow wide">'+
        '<div class="l">Buca '+x.buca+' <span style="opacity:.7">· par '+x.par+'</span></div>'+
        '<div class="hbtrack"><div class="hbfill" style="width:'+(x.contratta/mx*100)+'%;background:var(--dv-red)"></div></div>'+
        '<div class="n">+'+x.contratta.toFixed(2)+'</div></div>')));
      cb.appendChild(el('<table class="stat" style="margin-top:10px"><thead><tr><th>Buca</th>'+
        '<th class="n">Giri</th><th class="n">Media grezza</th><th class="n">Contratta</th></tr></thead><tbody>'+
        pb.map(x=>'<tr><td>Buca '+x.buca+'</td><td class="n">'+x.n+'</td>'+
          '<td class="n dim">'+sgn(x.diffMedia,2)+'</td><td class="n">'+sgn(x.contratta,2)+'</td></tr>').join('')+
        '</tbody></table>'));
    }
    p2.appendChild(cb);
  } else {
    p2.appendChild(el('<div class="card"><h2>Buche che costano di piu’</h2>'+
      '<div class="hint">Seleziona un singolo circolo: confrontare la "buca 7" di campi diversi non avrebbe senso.</div></div>'));
  }

  /* ================= 3. BASTONI ================= */
  const p3=el('<div class="pane"></div>');
  const bast=statBastoni(sel);
  if(!bast.length){
    p3.appendChild(el('<div class="card"><h2>Bastoni</h2><div class="hint">Nessun colpo registrato.</div></div>'));
  } else {
    const conD=bast.filter(b=>b.distMedia!==null && b.bastone!=='Putter');
    const copTot = conD.reduce((s,b)=>s+b.esatti,0), stimTot=conD.reduce((s,b)=>s+b.stimati,0);
    const copPct = (copTot+stimTot)? Math.round(100*copTot/(copTot+stimTot)) : 0;
    p3.appendChild(el('<div class="card"><h2>Come si legge questo pannello</h2>'+
      '<div class="metodo">La distanza mostrata e’ la <b>distanza percorsa dalla palla</b>, non l’avanzamento verso '+
      'la buca. Sono due cose diverse: la distanza dalla buca e’ radiale e non segnata, quindi la vecchia differenza '+
      'fra due raggi registrava come piu’ corta ogni palla finita oltre la bandiera o di lato. Con il settore di esito '+
      'la componente longitudinale si somma invece di sottrarsi.<br><br>'+
      'Copertura attuale del settore: <b>'+copPct+'%</b> dei colpi misurati ('+copTot+' su '+(copTot+stimTot)+'). '+
      'I colpi senza settore che finiscono lontano dalla buca sono comunque esatti, perche’ li’ l’errore geometrico '+
      'e’ di secondo ordine; quelli vicini alla buca senza settore restano sottostimati.</div></div>'));

    const mx=Math.max(...bast.map(b=>b.usi));
    const cbs=el('<div class="card"><h2>Quanto usi ogni bastone</h2>'+
      '<div class="hint">Numero di colpi nel periodo selezionato.</div></div>');
    bast.forEach(b=>cbs.appendChild(el('<div class="hbrow">'+
      '<div class="l">'+esc(b.bastone)+'</div>'+
      '<div class="hbtrack"><div class="hbfill" style="width:'+(b.usi/mx*100)+'%"></div></div>'+
      '<div class="n">'+b.usi+'</div></div>')));
    p3.appendChild(cbs);

    if(conD.length){
      const maxD=Math.max(...conD.map(b=>b.dMax||0));
      const cr=el('<div class="card"><h2>Distanza percorsa e dispersione</h2>'+
        '<div class="hint">Il punto e’ la media, la barra chiara va dal 10° al 90° percentile: piu’ e’ larga, '+
          'meno il bastone e’ prevedibile.</div></div>');
      conD.forEach(b=>{
        const lo=(b.p10!==null?b.p10:b.dMin)||0, hi=(b.p90!==null?b.p90:b.dMax)||0;
        cr.appendChild(el('<div class="rngrow">'+
          '<div class="l">'+esc(b.bastone)+'</div>'+
          '<div class="rngtrack">'+
            '<div class="rngline" style="left:0;right:0"></div>'+
            '<div class="rngspan" style="left:'+(lo/maxD*100)+'%;width:'+Math.max(1,(hi-lo)/maxD*100)+'%"></div>'+
            '<div class="rngdot" style="left:'+(b.distMedia/maxD*100)+'%"></div>'+
          '</div>'+
          '<div class="n">'+b.distMedia+' m</div></div>'));
      });
      cr.appendChild(el('<table class="stat" style="margin-top:10px">'+
        '<thead><tr><th>Bastone</th><th class="n">Colpi</th><th class="n">Media</th>'+
          '<th class="n">Lungo</th><th class="n">Lato</th><th class="n">Settore</th></tr></thead><tbody>'+
        conD.map(b=>'<tr><td>'+esc(b.bastone)+'</td><td class="n">'+b.nMis+'</td>'+
          '<td class="n">'+b.distMedia+' m</td>'+
          '<td class="n">'+(b.disp!==null?'± '+b.disp:'—')+'</td>'+
          '<td class="n">'+(b.latDisp!==null?'± '+b.latDisp:'—')+'</td>'+
          '<td class="n dim">'+Math.round(b.copertura*100)+'%</td></tr>').join('')+
        '</tbody></table>'+
        '<div class="stcap">"Lungo" e’ lo scarto tipo della distanza percorsa, "Lato" quello dello scostamento '+
        'laterale: la seconda colonna esiste solo grazie al settore di esito e si riempie da tre giri in avanti. '+
        'La dispersione compare da 3 colpi, i percentili da 5.</div>'));
      p3.appendChild(cr);

      // ellisse per il bastone con piu' dati laterali
      const conLat = conD.filter(b=>b.latDisp!==null && b.disp!==null && b.nLat>=8)
        .sort((a,b)=>b.nLat-a.nLat);
      if(conLat.length){
        const b0=conLat[0];
        p3.appendChild(el('<div class="card"><h2>Ellisse di arrivo — '+esc(b0.bastone)+'</h2>'+
          '<div class="hint">Dove finiscono le palle rispetto alla bandiera, su '+b0.nLat+' colpi con settore. '+
          'L’ellisse interna contiene circa due terzi dei colpi, quella esterna circa il 95%.</div>'+
          svgEllisse(b0.disp, b0.latDisp, b0.distMedia)+
          '<div class="stcap">Dispersione lunga ± '+b0.disp+' m, laterale ± '+b0.latDisp+' m. '+
          'E’ la lettura che serve per scegliere il bersaglio: un bastone preciso in distanza ma largo di lato '+
          'chiede una linea diversa da uno che sbaglia solo in avanti e indietro.</div></div>'));
      }
    }

    const serieDrv=sel.map(g=>{
      const vals=[];
      (g.buche||[]).forEach(b=>(b.colpi||[]).forEach((c,i)=>{
        if(c.bastone!=='Driver') return;
        const p=percorsaColpo(b.colpi,i);
        if(p && p.d>0) vals.push(p.d);
      }));
      return {data:g.data, media:vals.length?media(vals):null};
    }).filter(x=>x.media!==null);
    if(serieDrv.length>=3){
      p3.appendChild(el('<div class="card"><h2>Andamento del driver</h2>'+
        '<div class="hint">Distanza media percorsa dal drive, giro per giro. Su questo bastone la vecchia formula '+
        'era gia’ quasi esatta: quando la palla si ferma lontano dalla buca l’errore geometrico e’ di due metri.</div>'+
        svgLinea(serieDrv.map(x=>({x:fmtDataBreve(x.data), y:x.media})),
          {h:112, zero:false, colore:'var(--dv-blue)', fmt:v=>Math.round(v)+' m', aria:'distanza media del driver nel tempo'})+'</div>'));
    }
  }

  /* ================= 4. DOVE FINISCE ================= */
  const p4=el('<div class="pane"></div>');
  const esTot=statEsiti(sel, null), esPutt=statEsitiPutt(sel);
  const esGioco={conte:{}, tot:0};
  ESITI.forEach(e=>esGioco.conte[e.k]=(esTot.conte[e.k]||0)-(esPutt.conte[e.k]||0));
  esGioco.tot=esTot.tot-esPutt.tot;
  if(!esTot.tot){
    p4.appendChild(el('<div class="card"><h2>Dove finisce la palla</h2>'+
      '<div class="hint">Il settore di esito e’ la novita’ di questa versione: si chiede al momento di inserire '+
      'il colpo successivo, sui colpi che finiscono entro '+ESITO_SOGLIA_M+' metri dalla buca e su ogni putt non '+
      'imbucato. Da qui nascono la distanza vera per bastone e la dispersione laterale, che prima non esisteva. '+
      'Questa schermata si riempie dal prossimo giro.</div></div>'));
  } else {
    p4.appendChild(el('<div class="card"><h2>Colpi verso il green</h2>'+
      '<div class="hint">Su '+esGioco.tot+' colpi con settore registrato. Se una casella domina, hai una tendenza: '+
      'e’ l’informazione che la sola distanza dalla buca non poteva darti.</div>'+
      grigliaEsitiHtml(esGioco.conte, esGioco.tot)+
      (esGioco.tot<30?'<div class="stcap">Sotto i trenta colpi le percentuali ballano molto. Torna qui fra qualche giro.</div>':'')+
      '</div>'));
    if(esPutt.tot){
      const corti=(esPutt.conte.C||0)+(esPutt.conte.CS||0)+(esPutt.conte.CD||0);
      const lunghi=(esPutt.conte.L||0)+(esPutt.conte.LS||0)+(esPutt.conte.LD||0);
      const sx=(esPutt.conte.S||0)+(esPutt.conte.CS||0)+(esPutt.conte.LS||0);
      const dx=(esPutt.conte.D||0)+(esPutt.conte.CD||0)+(esPutt.conte.LD||0);
      p4.appendChild(el('<div class="card"><h2>Putt non imbucati</h2>'+
        '<div class="hint">Su '+esPutt.tot+' putt con settore. La distanza residua era gia’ registrata; il settore '+
        'aggiunge la direzione dell’errore, che e’ quello che si allena.</div>'+
        grigliaEsitiHtml(esPutt.conte, esPutt.tot)+
        '<table class="stat" style="margin-top:12px"><tbody>'+
          '<tr><td>Corti</td><td class="n">'+Math.round(100*corti/esPutt.tot)+'%</td>'+
            '<td>Lunghi</td><td class="n">'+Math.round(100*lunghi/esPutt.tot)+'%</td></tr>'+
          '<tr><td>A sinistra</td><td class="n">'+Math.round(100*sx/esPutt.tot)+'%</td>'+
            '<td>A destra</td><td class="n">'+Math.round(100*dx/esPutt.tot)+'%</td></tr>'+
        '</tbody></table>'+
        '<div class="stcap">Un putting che lascia corto in modo sistematico e uno che sbaglia sempre dallo stesso '+
        'lato sono due problemi diversi e si allenano in due modi diversi.</div></div>'));
    }
  }

  /* ================= 5. INCROCI ================= */
  const p5=el('<div class="pane"></div>');
  const QV = completi.length ? statQuotaVarianza(completi) : null;
  const cQV=el('<div class="card"><h2>Quanto pesa ogni reparto</h2></div>');
  if(!QV){
    cQV.appendChild(el('<div class="hint">Servono almeno sei giri con il dettaglio colpo per colpo. '+
      'Al momento ne hai '+completi.length+'.</div>'));
  } else {
    const mxq=Math.max(...QV.cats.map(c=>Math.abs(QV.quote[c].quota)));
    cQV.appendChild(el('<div class="hint">Quota della <b>variabilita’ del tuo risultato</b> che passa da ciascun reparto, '+
      'su '+QV.n+' giri. Le quattro quote sommano a 100% per identita’ algebrica.<br><br>'+
      'Questo pannello sostituisce il vecchio confronto fra i giri migliori e i peggiori. Quel confronto divideva i '+
      'giri <i>per punteggio</i> e poi confrontava le categorie che compongono il punteggio: condizionava sulla '+
      'variabile dipendente, e vinceva sempre la categoria piu’ rumorosa a prescindere da cosa determinasse '+
      'davvero una buona giornata.</div>'));
    QV.cats.forEach(c=>{
      const q=QV.quote[c].quota, w=Math.abs(q)/mxq*92;
      cQV.appendChild(el('<div class="hbrow wide">'+
        '<div class="l">'+CAT_NOME[c]+'</div>'+
        '<div class="hbtrack"><div class="hbfill" style="width:'+w+'%;background:'+(q>=0?'var(--dv-blue)':'var(--dv-red)')+'"></div></div>'+
        '<div class="n">'+Math.round(q*100)+'%</div></div>'));
    });
    const top=QV.cats.slice().sort((a,b)=>QV.quote[b].quota-QV.quote[a].quota)[0];
    cQV.appendChild(el('<table class="stat" style="margin-top:12px"><thead><tr><th>Reparto</th>'+
      '<th class="n">Quota</th><th class="n">Media</th><th class="n">Scarto tipo</th></tr></thead><tbody>'+
      QV.cats.map(c=>'<tr><td>'+CAT_NOME[c]+'</td><td class="n">'+Math.round(QV.quote[c].quota*100)+'%</td>'+
        '<td class="n '+(QV.quote[c].media>=0?'pos':'neg')+'">'+sgn(QV.quote[c].media,2)+'</td>'+
        '<td class="n dim">'+QV.quote[c].sd.toFixed(2)+'</td></tr>').join('')+
      '</tbody></table>'+
      '<div class="stcap">Il <b>'+Math.round(QV.quote[top].quota*100)+'%</b> della variabilita’ dei tuoi '+
      'punteggi passa da <b>'+CAT_NOME[top]+'</b>. Vuol dire che e’ il reparto che muove di piu’ il risultato, '+
      'non necessariamente quello da allenare per primo: per quello conta la media, che trovi nella colonna accanto. '+
      'Scarto tipo del totale: '+QV.sdT.toFixed(2)+' colpi per giro.</div>'));
  }
  p5.appendChild(cQV);

  const PP2 = completi.length ? statPeriodi(completi) : null;
  if(PP2){
    p5.appendChild(el('<div class="card"><h2>Prima meta’ contro seconda meta’ del periodo</h2>'+
      '<div class="hint">Divisione <b>per data</b>, non per punteggio: il criterio non dipende dal risultato, '+
      'quindi qui non c’e’ artefatto. '+PP2.k+' giri per lato, dal '+fmtData(PP2.daA)+' al '+fmtData(PP2.aA)+
      ' contro dal '+fmtData(PP2.daB)+' al '+fmtData(PP2.aB)+'.</div>'+
      '<table class="stat"><thead><tr><th>Reparto</th><th class="n">Prima</th><th class="n">Dopo</th>'+
        '<th class="n">Differenza</th><th class="n">Leggibile?</th></tr></thead><tbody>'+
      PP2.cats.map(c=>{
        const x=PP2.per[c];
        return '<tr><td>'+CAT_NOME[c]+'</td><td class="n dim">'+sgn(x.prima,1)+'</td>'+
          '<td class="n dim">'+sgn(x.dopo,1)+'</td>'+
          '<td class="n '+(x.delta>=0?'pos':'neg')+'">'+sgn(x.delta,2)+'</td>'+
          '<td class="n" style="font-size:11px">'+(x.leggibile?'<span class="badge ok">si</span>':
            '<span class="dim">no, servono ~'+(x.servono||'—')+'/lato</span>')+'</td></tr>';
      }).join('')+'</tbody></table>'+
      '<div class="stcap">"Leggibile" significa che la differenza supera due errori standard. Sotto quella soglia '+
      'non e’ distinguibile dal caso, per quanto il numero sembri grande.</div></div>'));
  }

  if(completi.length){
    const DT=statDaTee(completi);
    if(DT.length){
      const mxA=Math.max(...DT.map(x=>Math.abs(x.media)),0.3);
      p5.appendChild(el('<div class="card"><h2>Quanto costa mancare il fairway</h2>'+
        '<div class="hint">Par 4 e 5, raggruppati per dove finisce il colpo dal tee.</div>'+
        DT.map(x=>{
          const w=Math.abs(x.media)/mxA*50;
          const st=x.media>0?'left:50%;width:'+w+'%;background:var(--dv-red);'
                :x.media<0?'right:50%;width:'+w+'%;background:var(--dv-blue);'
                :'left:calc(50% - 2px);width:4px;background:var(--dv-neutral);';
          return '<div class="dvrow"><div class="d">'+(LIE_NOME[x.lie]||x.lie)+'</div>'+
            '<div class="dvtrack"><div class="zero"></div><div class="dvbar" style="'+st+'"></div></div>'+
            '<div class="n">'+sgn(x.media,2)+'</div></div>';}).join('')+
        '<table class="stat" style="margin-top:12px">'+
          '<thead><tr><th>Dove arriva</th><th class="n">Buche</th><th class="n">Sul par</th>'+
            '<th class="n">Green</th></tr></thead><tbody>'+
          DT.map(x=>'<tr><td>'+(LIE_NOME[x.lie]||x.lie)+'</td><td class="n">'+x.n+'</td>'+
            '<td class="n">'+sgn(x.media,2)+(x.se?'<span class="dim" style="font-size:10px"> ±'+(2*x.se).toFixed(2)+'</span>':'')+'</td>'+
            '<td class="n">'+Math.round(x.girPct)+'%</td></tr>').join('')+
        '</tbody></table></div>'));
    }
  }

  const PP=statPerPar(A);
  if(PP.length){
    p5.appendChild(el('<div class="card"><h2>Rendimento per tipo di buca</h2>'+
      '<div class="hint">I par 5 sono occasioni, i par 3 no: separarli dice dove stai lasciando colpi.</div>'+
      '<table class="stat"><thead><tr><th>Buca</th><th class="n">Giocate</th><th class="n">Sul par</th>'+
        '<th class="n">Green</th><th class="n">Putt</th></tr></thead><tbody>'+
        PP.map(x=>'<tr><td>Par '+x.par+'</td><td class="n">'+x.n+'</td>'+
          '<td class="n '+(x.media<=0?'pos':'neg')+'">'+sgn(x.media,2)+
            (x.se?'<span class="dim" style="font-size:10px"> ±'+(2*x.se).toFixed(2)+'</span>':'')+'</td>'+
          '<td class="n">'+Math.round(x.girPct)+'%</td><td class="n">'+x.puttB.toFixed(2)+'</td></tr>').join('')+
      '</tbody></table></div>'));
  }

  const BL=statBlocchi(A);
  if(BL.nGiri>0){
    const b=BL.blocchi, cf=BL.confronto;
    let cap;
    if(!cf) cap='Servono almeno tre giri da 18 buche per confrontare i blocchi.';
    else if(cf.leggibile) cap='Il tratto piu’ costoso e’ <b>'+cf.peggio.nome+'</b> ('+sgn(cf.peggio.sgGiro,2)+
      ' di strokes gained per giro), il migliore e’ <b>'+cf.meglio.nome+'</b> ('+sgn(cf.meglio.sgGiro,2)+
      '). La differenza e’ '+cf.delta.toFixed(2)+' contro un errore standard di '+cf.se.toFixed(2)+
      ': supera due errori standard, quindi non e’ solo caso.';
    else cap='<b>Nessun blocco si distingue dagli altri.</b> La differenza fra il migliore e il peggiore e’ '+
      cf.delta.toFixed(2)+' colpi contro un errore standard di '+cf.se.toFixed(2)+
      ': dentro il rumore. Servirebbero circa '+(cf.servono||'—')+' giri per dire qualcosa. '+
      'Il giro non si rompe in un punto ricorrente.';
    p5.appendChild(el('<div class="card"><h2>Il giro in sei blocchi da tre buche</h2>'+
      '<div class="hint">La metrica e’ lo <b>strokes gained</b>, non i colpi sopra il par: lo SG e’ gia’ corretto '+
      'per la difficolta’ della buca, mentre confrontare blocchi non appaiati per par e stroke index mescolerebbe '+
      '"quando nel giro" con "quali buche". Su '+BL.nGiri+' giri da 18 buche. Le barrette verticali sono '+
      'due errori standard.</div>'+
      svgBarreDiv(b.map(x=>({x:x.nome, y:x.sgGiro, se:x.sgSe||0})),
        {h:138, banda:true, colPos:'var(--dv-blue)', colNeg:'var(--dv-red)', fmt:v=>sgn(v,1), aria:'strokes gained per blocco'})+
      '<table class="stat" style="margin-top:10px">'+
        '<thead><tr><th>Buche</th><th class="n">SG/giro</th><th class="n">Sul par</th>'+
          '<th class="n">Green</th><th class="n">Putt</th></tr></thead><tbody>'+
        b.map(x=>'<tr><td>'+x.nome+'</td>'+
          '<td class="n '+(x.sgGiro>=0?'pos':'neg')+'">'+sgn(x.sgGiro,2)+
            (x.sgSe?'<span class="dim" style="font-size:10px"> ±'+(2*x.sgSe).toFixed(2)+'</span>':'')+'</td>'+
          '<td class="n dim">'+sgn(x.parGiro,1)+'</td>'+
          '<td class="n">'+Math.round(x.girPct)+'%</td>'+
          '<td class="n">'+x.puttB.toFixed(2)+'</td></tr>').join('')+
      '</tbody></table>'+
      '<div class="stcap">'+cap+'</div></div>'));
  }

  const NV=statNove(A);
  if(NV.meta.length===2){
    const cf=NV.conf;
    let cap;
    if(!cf) cap='Servono almeno tre giri completi da 18 buche.';
    else if(cf.leggibile) cap='Sulla seconda nove giochi in media <b>'+Math.abs(cf.delta).toFixed(2)+' colpi '+
      (cf.delta>0?'in piu’':'in meno')+'</b> rispetto alla prima. Il confronto e’ appaiato giro per giro, quindi '+
      'tiene conto del fatto che le due meta’ condividono giornata e condizioni. Errore standard '+cf.se.toFixed(2)+
      ': la differenza lo supera di oltre due volte.';
    else cap='<b>Le due meta’ si equivalgono.</b> Differenza di '+cf.delta.toFixed(2)+' colpi contro un errore '+
      'standard di '+cf.se.toFixed(2)+': dentro il rumore. Su '+cf.nGiri+' giri non c’e’ nulla da spiegare.';
    p5.appendChild(el('<div class="card"><h2>Prima nove contro seconda nove</h2>'+
      '<div class="hint">Confronto appaiato: si guarda la differenza <i>dentro ogni giro</i> e poi la si media. '+
      'Trattarle come due campioni indipendenti sovrastimerebbe l’incertezza, perche’ le due meta’ sono giocate '+
      'lo stesso giorno con lo stesso vento.</div>'+
      '<table class="stat"><thead><tr><th></th><th class="n">Buche</th><th class="n">Sul par</th>'+
        '<th class="n">Green</th><th class="n">Putt</th></tr></thead><tbody>'+
        NV.meta.map(x=>'<tr><td>'+x.nome+'</td><td class="n">'+x.n+'</td>'+
          '<td class="n '+(x.media<=0?'pos':'neg')+'">'+sgn(x.media,2)+'</td>'+
          '<td class="n">'+Math.round(x.girPct)+'%</td><td class="n">'+x.puttB.toFixed(2)+'</td></tr>').join('')+
      '</tbody></table>'+
      '<div class="stcap">'+cap+' Solo giri da 18 buche.</div></div>'));
  }

  /* ---- montaggio ---- */
  [p1,p2,p3,p4,p5].forEach(x=>pager.appendChild(x));
  const panes={sg:p1, par:p2, club:p3, esiti:p4, x:p5};
  function adatta(){ pager.style.height = (panes[STAT_F.tab].scrollHeight+6)+'px'; }
  function vaiA(k, scorri){
    STAT_F.tab=k;
    bar.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.k===k));
    if(scorri!==false){ const i=TABS.findIndex(t=>t.k===k); pager.scrollTo({left:i*pager.clientWidth, behavior:'smooth'}); }
    adatta();
  }
  bar.onclick=e=>{ const b=e.target.closest('button'); if(b) vaiA(b.dataset.k, true); };
  let tmr=null;
  pager.onscroll=()=>{ clearTimeout(tmr); tmr=setTimeout(()=>{
    const i=Math.round(pager.scrollLeft/Math.max(1,pager.clientWidth));
    const k=(TABS[i]||TABS[0]).k;
    if(k!==STAT_F.tab) vaiA(k, false);
  }, 90); };
  requestAnimationFrame(()=>{
    const i=TABS.findIndex(t=>t.k===STAT_F.tab);
    pager.scrollLeft = i*pager.clientWidth;
    adatta();
    setTimeout(adatta, 120);
  });
  window.addEventListener('resize', adatta, {once:true});

  return {header:'Statistiche', body};
};
/* ---------------- RIEPILOGO GIRO ---------------- */
VIEWS.riepilogoGiro = function(p){
  const giri=LS.get('hcp_giri',[]);
  const g=giri.find(x=>x.id===p.id);
  const body=el('<div></div>');
  if(!g){ body.appendChild(el('<div class="empty">Giro non trovato.</div>')); return {header:'Riepilogo',body}; }
  const A=analizzaGiro(g, STAT_F.baseline==='scratch'?'scratch':'tour');
  const c=A.calc, d=c.score-c.par;
  const cond=g.condizioni;
  body.appendChild(el('<div class="card"><h2>'+esc(g.circolo)+'</h2>'+
    '<div class="hint">'+fmtData(g.data)+' · '+esc(g.tipo)+(g.gara?' · '+esc(g.gara):'')+
      ' · Tee '+esc(g.tee)+' · '+c.nBuche+' buche</div>'+
    (cond?'<div class="hint tight">Vento '+((VENTO_OPZ[cond.vento]||{}).n||'—').toLowerCase()+
      ' · terreno '+((METEO_OPZ[cond.meteo]||{}).n||'—').toLowerCase()+
      ' · green '+((GREEN_OPZ[cond.green]||{}).n||'—').toLowerCase()+'</div>':'')+
    '<div style="font-size:36px;font-weight:800;color:var(--verde-testo);margin-top:6px;">'+c.score+
      '<span style="font-size:16px;color:var(--grigio);"> (par '+c.par+', '+sgn(d,0)+')</span></div>'+
    (A.completo?'<div class="hint" style="margin-top:8px">Strokes gained totale '+
      '<b class="'+(c.sgTot>=0?'pos':'neg')+'">'+sgn(c.sgTot)+'</b> rispetto '+
      (STAT_F.baseline==='scratch'?'a un giocatore scratch (stima)':'al PGA Tour')+'</div>':'')+
  '</div>'));

  // Due controlli distinti, che provano cose diverse.
  const R=riconcilia(g);
  const I=controlloIntegrita(g);
  if(R){
    body.appendChild(el('<div class="card"><h2>Controlli sul giro</h2>'+
      '<div class="hint tight"><b>1. Autodiagnosi del motore.</b> L’identita’ "strokes gained + punteggio = '+
        'giro atteso" e’ vera per costruzione su qualunque sequenza concatenata, perche’ la somma degli SG e’ '+
        'telescopica. Se non torna, il difetto e’ nel calcolo, non nei tuoi dati. Non serve a scoprire un colpo '+
        'dimenticato: togliendo un colpo dal mezzo la catena si richiude e l’identita’ regge lo stesso.</div>'+
      '<table class="stat"><tbody>'+
        '<tr><td>Strokes gained</td><td class="n">'+sgn(R.sg,2)+'</td></tr>'+
        '<tr><td>Punteggio</td><td class="n">'+R.score+'</td></tr>'+
        '<tr><td>Somma</td><td class="n">'+R.somma.toFixed(2)+'</td></tr>'+
        '<tr><td>Giro atteso</td><td class="n">'+R.atteso.toFixed(2)+'</td></tr>'+
      '</tbody></table>'+
      (R.ok?'<div class="stcap"><span class="badge ok">Motore a posto</span> Scarto '+R.scarto.toExponential(1)+' colpi.</div>'
           :'<div class="stcap"><span class="badge warn">Non torna</span> Scarto di '+R.scarto.toFixed(2)+
            ' colpi: e’ un difetto del calcolo, da segnalare.</div>')+
      '<div class="hint" style="margin-top:12px"><b>2. Integrita’ della sequenza.</b> Questo si’ cerca i colpi '+
        'dimenticati, e lo fa guardando le discontinuita’: salti di distanza che nessun bastone spiega, palle '+
        'che si allontanano senza penalita’, buche con troppi colpi.</div>'+
      (I.length
        ? '<div class="avviso"><span class="ic">?</span><span><b>'+I.length+(I.length===1?' buca sospetta':' buche sospette')+'.</b><br>'+
            I.map(x=>'Buca '+x.buca+': '+esc(x.tutti.join('; '))).join('<br>')+'</span></div>'
        : '<div class="stcap"><span class="badge ok">Sequenza pulita</span> Nessuna discontinuita’ nelle posizioni.</div>')+
    '</div>'));
  }

  if(A.completo){
    const cats=['tee','approccio','corto','putting'];
    const maxA=Math.max(0.5,...cats.map(k=>Math.abs(c.sgCat[k])));
    const card=el('<div class="card"><h2>Strokes gained per categoria</h2></div>');
    cats.forEach(k=>{
      const v=c.sgCat[k], w=Math.abs(v)/maxA*50;
      const st = v>0?'left:50%;width:'+w+'%;background:var(--dv-blue);'
              : v<0?'right:50%;width:'+w+'%;background:var(--dv-red);'
              : 'left:calc(50% - 2px);width:4px;background:var(--dv-neutral);';
      card.appendChild(el('<div class="dvrow"><div class="d">'+CAT_NOME[k]+'</div>'+
        '<div class="dvtrack"><div class="zero"></div><div class="dvbar" style="'+st+'"></div></div>'+
        '<div class="n '+(v>=0?'pos':'neg')+'">'+sgn(v,1)+'</div></div>'));
    });
    body.appendChild(card);
  }

  const list=el('<div class="card"><h2>Buca per buca</h2></div>');
  A.bucheCalc.forEach((b,i)=>{
    const bb=g.buche[i]||{};
    list.appendChild(el('<div class="listitem">'+
      '<div>Buca '+b.buca+' · par '+b.par+(b.distanza?' · '+b.distanza+' m':'')+
        (bb.completata===false?' · <span style="color:var(--ambra)">non completata</span>':'')+
        '<div class="meta">'+b.putt+' putt'+(b.girHit?' · green in regulation':'')+'</div></div>'+
      '<div style="text-align:right"><span class="badge">'+b.score+'</span>'+
        (b.sg!==null?'<div class="meta '+(b.sg>=0?'pos':'neg')+'" style="margin-top:3px">'+sgn(b.sg,1)+'</div>':'')+'</div></div>'));
  });
  body.appendChild(list);

  const mod=el('<button class="btn secondary">Correggi questo giro</button>');
  mod.onclick=()=>push('modificaGiro',{id:g.id});
  body.appendChild(mod);

  const del=el('<button class="btn danger">Elimina questo giro</button>');
  del.onclick=()=>{ if(confirm('Eliminare questo giro?\n\nNon viene distrutto: resta nelle copie automatiche e, sul repository, il file viene spostato fra i cancellati.')){
    eliminaGiroLocale(g); nav=[{view:'home'}]; render(); } };
  body.appendChild(del);
  return {header:'Riepilogo giro', body};
};

/* ---------------- CORREZIONE DI UN GIRO SALVATO ---------------- */
function trovaGiro(id){ return LS.get('hcp_giri',[]).find(g=>g.id===id); }
function salvaGiro(g, senzaMarca){
  if(!senzaMarca) marcaModifica(g);
  const giri=LS.get('hcp_giri',[]); const i=giri.findIndex(x=>x.id===g.id);
  if(i>=0){ giri[i]=g; LS.set('hcp_giri',giri); idbFlush(); bastCacheReset(); }
}

VIEWS.modificaGiro = function(p){
  const g=trovaGiro(p.id);
  const body=el('<div></div>');
  if(!g){ body.appendChild(el('<div class="empty">Giro non trovato.</div>')); return {header:'Correggi',body}; }
  const A=analizzaGiro(g,'tour');
  body.appendChild(el('<div class="hint">Tocca la buca da correggere. Ogni modifica ricalcola punteggio e '+
    'strokes gained. Prima di modificare viene salvata una copia automatica recuperabile da "Backup".</div>'));
  const I=controlloIntegrita(g);
  if(I.length) body.appendChild(el('<div class="avviso"><span class="ic">?</span><span>'+
    '<b>Sequenza sospetta.</b><br>'+I.map(x=>'Buca '+x.buca+': '+esc(x.tutti.join('; '))).join('<br>')+
    '</span></div>'));
  const card=el('<div class="card"><h2>Buche</h2></div>');
  A.bucheCalc.forEach(b=>{
    const it=el('<div class="listitem"><div>Buca '+b.buca+' · par '+b.par+
      '<div class="meta">'+b.colpi.length+' colpi registrati'+(b.distanza?' · '+b.distanza+' m':'')+'</div></div>'+
      '<span class="badge">'+b.score+'</span></div>');
    it.onclick=()=>push('modificaBuca',{id:g.id, i:b.buca-1});
    card.appendChild(it);
  });
  body.appendChild(card);

  const cond=g.condizioni||{vento:0,meteo:0,green:1};
  const cc=el('<div class="card"><h2>Condizioni del giro</h2>'+
    '<label>Vento</label><div class="grid3" id="e_vento">'+
      VENTO_OPZ.map(v=>'<div class="chip small'+(v.v===cond.vento?' selected':'')+'" data-v="'+v.v+'">'+v.n+'</div>').join('')+'</div>'+
    '<label style="margin-top:10px;">Terreno</label><div class="grid3" id="e_meteo">'+
      METEO_OPZ.map(v=>'<div class="chip small'+(v.v===cond.meteo?' selected':'')+'" data-v="'+v.v+'">'+v.n+'</div>').join('')+'</div>'+
    '<label style="margin-top:10px;">Green</label><div class="grid3" id="e_green">'+
      GREEN_OPZ.map(v=>'<div class="chip small'+(v.v===cond.green?' selected':'')+'" data-v="'+v.v+'">'+v.n+'</div>').join('')+'</div>'+
