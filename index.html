<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Registra Giro">
<meta name="theme-color" content="#0f5132">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Registra Giro — HCP+Stat</title>
<style>
  :root{
    --verde:#0f5132; --verde-chiaro:#1a7a4a; --verde-testo:#0f5132;
    --bg:#f4f6f5; --card:#ffffff;
    --testo:#1c2621; --grigio:#6b7a72; --bordo:#dfe6e2; --rosso:#b3261e; --ambra:#8a6d00;
    --safe-top:env(safe-area-inset-top); --safe-bottom:env(safe-area-inset-bottom);
    --dv-blue:#2a78d6; --dv-orange:#eb6834; --dv-aqua:#1baf7a;
    --dv-red:#e34948; --dv-neutral:#7d8b83; --dv-track:#e6e9e7; --dv-good:#0a7d3c;
    --surf2:#eef2f0; --wash:#e9efec;
    /* v12 — token del handoff di design. Il tema chiaro e' la corrispondenza
       esatta dichiarata nel README, generata dallo scuro. */
    --surf-bar:#ffffff;      /* superficie barra e filtro */
    --surf-alta:#e4eae7;     /* superficie elevata: scheda attiva */
    --cella-par:#e0e5e2;     /* cella par della scorecard */
    --sep:#eaeeec;           /* separatore interno */
    --asse:#c9d2cc;          /* linea asse */
    --rif:#b9c2bc;           /* riferimento e tacca zero */
    --tenue:#8b9a91;         /* testo tenue */
    --eagle:#046b30;
    --link:#3f6b57;          /* link e toggle */
    --corso-bg:#eef5f0; --corso-bd:#bcdac8;
    --su-colore:#ffffff;     /* testo su fondo colorato */
    --par3:#4a7ba8; --par5:#a87a4a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --verde:#1a7a4a; --verde-chiaro:#25a163; --verde-testo:#4ecf92;
      --bg:#0d0d0d; --card:#1a1a19;
      --testo:#ffffff; --grigio:#9c9c94; --bordo:#2c2c2a; --rosso:#ff8a80; --ambra:#e0b53a;
      --dv-blue:#3987e5; --dv-orange:#d95926; --dv-aqua:#199e70;
      --dv-red:#e66767; --dv-neutral:#8f8f88; --dv-track:#262625; --dv-good:#0ca30c;
      /* correzione: --surf2 si autoreferenziava, quindi nel tema scuro restava
         non definita e i componenti che la usano cadevano sul valore chiaro. */
      --surf2:#141412; --wash:#22302a;
      --surf-bar:#141412; --surf-alta:#2a2a27; --cella-par:#33332f; --sep:#23231f;
      --asse:#3a3a36; --rif:#4a4a46; --tenue:#6b6b66; --eagle:#8ff0bd; --link:#6b8f7f;
      --corso-bg:#12251b; --corso-bd:#2a5c43; --su-colore:#0d1a13;
      --par3:#8ab4d8; --par5:#d8b48a;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg); color:var(--testo);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; overscroll-behavior:none;}
  body{padding-top:var(--safe-top); padding-bottom:var(--safe-bottom); user-select:none;}
  /* v12 — intestazione e barra ferme, solo l'area centrale scorre. */
  html,body{height:100%; overflow:hidden;}
  #app{height:100%; display:flex; flex-direction:column; overflow:hidden;}
  header.topbar{flex:0 0 auto; z-index:20; background:var(--card); color:var(--testo);
    display:flex; align-items:flex-start; gap:8px; border-bottom:1px solid var(--bordo);
    padding:12px 16px 12px 16px; padding-top:calc(12px + var(--safe-top));}
  header.topbar h1{font-size:26px; margin:0; flex:1; font-weight:700; letter-spacing:-0.02em;
    text-align:left; line-height:1.12;}
  header.topbar .sub{font-size:12px; color:var(--grigio); margin-top:2px;}
  header.topbar.putting h1{color:var(--verde-testo);}
  .backbtn{background:none; border:none; color:var(--verde-testo); font-size:30px; padding:0 6px 0 0;
    line-height:1; align-self:center;}
  main{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:16px 16px 40px 16px; max-width:520px; margin:0 auto; width:100%;}
  .card{background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); border:1px solid var(--bordo);}
  .card h2{font-size:15px; margin:0 0 10px 0; color:var(--verde-testo); text-transform:uppercase; letter-spacing:.03em;}
  .row{display:flex; gap:10px; margin-bottom:10px;}
  .row > *{flex:1;}
  label{display:block; font-size:13px; color:var(--grigio); margin-bottom:4px; font-weight:600;}
  input[type=text], input[type=date], input[type=number], input[type=password], select, textarea{
    width:100%; padding:12px 10px; font-size:16px; border-radius:10px; border:1.5px solid var(--bordo);
    background:#fff; color:var(--testo); font-family:inherit;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--verde-chiaro); border-color:var(--verde-chiaro);}
  .btn{display:block; width:100%; padding:16px; font-size:16px; font-weight:700; border:none; border-radius:14px;
    background:var(--verde); color:#fff; margin-bottom:10px; cursor:pointer;}
  .btn:active{background:var(--verde-chiaro);}
  .btn:disabled{opacity:.45;}
  .btn.secondary{background:#e9efec; color:var(--verde-testo);}
  .btn.ghost{background:transparent; color:var(--verde-testo); border:1.5px solid var(--verde); padding:12px;}
  .btn.danger{background:#fbe9e7; color:var(--rosso);}
  .btn.big{padding:18px; font-size:17px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  .chip{padding:14px 6px; font-size:14px; font-weight:600; text-align:center; border-radius:12px;
    background:#eef2f0; color:var(--testo); border:1.5px solid transparent;}
  .chip.selected{background:var(--verde); color:#fff; border-color:var(--verde);}
  .chip.small{padding:10px 4px; font-size:13px;}
  .toggle2{display:flex; border-radius:12px; overflow:hidden; border:1.5px solid var(--verde);}
  .toggle2 button{flex:1; padding:14px; border:none; background:#fff; color:var(--verde-testo); font-weight:700; font-size:15px;}
  .toggle2 button.on{background:var(--verde); color:#fff;}
  .hint{font-size:12px; color:var(--grigio); margin-top:-4px; margin-bottom:10px; line-height:1.45;}
  .hint.tight{margin-top:0;}
  .listitem{display:flex; justify-content:space-between; align-items:center; padding:14px 4px; border-bottom:1px solid var(--bordo);}
  .listitem:last-child{border-bottom:none;}
  .listitem .meta{font-size:12px; color:var(--grigio);}
  .badge{font-size:11px; font-weight:700; padding:3px 8px; border-radius:8px; background:#e9efec; color:var(--verde-testo);}
  .badge.warn{background:#fff4cc; color:var(--ambra);}
  .badge.bozza{background:#fde8e8; color:var(--rosso);}
  .badge.ok{background:#e2f2e8; color:var(--dv-good);}
  .holeprog{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;}
  .holeprog .n{font-size:32px; font-weight:800; color:var(--verde-testo); line-height:1;}
  .holeprog .par{font-size:13px; color:var(--grigio); text-align:right; line-height:1.5;}
  .shot{font-size:12.5px; padding:9px 10px; background:#eef2f0; border-radius:10px; margin-bottom:6px;
    display:flex; justify-content:space-between; gap:8px; align-items:center;}
  .shot .sgv{font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .shot.putt{background:#e6f0ea;}
  .empty{text-align:center; color:var(--grigio); padding:30px 10px; font-size:14px;}
  .installtip{font-size:12.5px; color:var(--grigio); background:#eef2f0; border-radius:12px; padding:12px; margin-bottom:14px; line-height:1.5;}
  .filters{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;}
  .filters .full{grid-column:1 / -1;}
  .filters select{padding:10px 8px; font-size:14px;}
  .filters label{font-size:11px;}
  .kpigrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .kpi{background:var(--card); border:1px solid var(--bordo); border-radius:14px; padding:12px;}
  .kpi .lab{font-size:11px; color:var(--grigio); text-transform:uppercase; letter-spacing:.03em; margin-bottom:5px; line-height:1.3; min-height:26px;}
  .kpi .v{font-size:25px; font-weight:800; color:var(--testo); line-height:1.1;}
  .kpi .u{font-size:12px; font-weight:600; color:var(--grigio);}
  .kpi .sub{font-size:11px; color:var(--grigio); margin-top:3px; line-height:1.3;}
  .legend{display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--grigio); margin-bottom:10px;}
  .legend .it{display:flex; align-items:center; gap:5px;}
  .sw{width:10px; height:10px; border-radius:3px; display:inline-block; flex:none;}
  .dvrow{display:grid; grid-template-columns:84px 1fr 44px; align-items:center; gap:8px; margin-bottom:7px;}
  .dvrow .d{font-size:11.5px; color:var(--grigio);}
  .dvtrack{position:relative; height:20px; background:var(--dv-track); border-radius:5px;}
  .dvtrack .zero{position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--bordo);}
  .dvbar{position:absolute; top:2px; bottom:2px; border-radius:4px; min-width:3px;}
  .dvrow .n{font-size:12.5px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums;}
  .stblock{margin-bottom:13px;}
  .stbhead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;}
  .stbhead .d{font-size:12.5px; color:var(--grigio);}
  .stbhead .n{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stcap{font-size:11px; color:var(--grigio); margin-top:4px; line-height:1.4;}
  .strack{display:flex; height:20px; border-radius:5px; overflow:hidden; background:var(--dv-track);}
  .sseg{height:100%; min-width:0;}
  .sseg + .sseg{margin-left:2px;}
  .hbrow{display:grid; grid-template-columns:76px 1fr 30px; align-items:center; gap:8px; margin-bottom:7px;}
  /* la colonna del valore portava "62.1% (87)" in 36 px e sfondava di 6:
     difetto ereditato dalla ver09, preso dalla prova sugli sfondamenti.     */
  .hbrow.wide{grid-template-columns:104px 1fr 48px;}
  .hbrow .l{font-size:12px; color:var(--grigio);}
  .hbrow.wide .l{font-size:11.5px; white-space:nowrap;}
  .hbtrack{height:15px; background:var(--dv-track); border-radius:4px; overflow:hidden;}
  .hbfill{height:100%; background:var(--dv-blue); border-radius:4px;}
  .hbrow .n{font-size:12px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums;}
  table.stat{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.stat th, table.stat td{padding:7px 5px; border-bottom:1px solid var(--bordo); text-align:left;}
  table.stat tr:last-child td{border-bottom:none;}
  table.stat th{font-size:10px; color:var(--grigio); text-transform:uppercase; letter-spacing:.02em; font-weight:700;}
  table.stat td.n, table.stat th.n{text-align:right; font-variant-numeric:tabular-nums;}
  table.stat td.dim{color:var(--grigio);}
  .pos{color:var(--dv-good);} .neg{color:var(--dv-red);}
  .tabbar{position:sticky; top:0; z-index:15; display:grid; grid-template-columns:repeat(4,1fr);
    gap:4px; background:var(--bg); padding:8px 0 10px 0; margin-bottom:2px;}
  .tabbar button{padding:11px 2px; font-size:11.5px; font-weight:700; border:1.5px solid var(--bordo);
    border-radius:11px; background:var(--card); color:var(--grigio); line-height:1.2;}
  .tabbar button.on{background:var(--verde); color:#fff; border-color:var(--verde);}
  /* v10: sette schede non stanno in una griglia da quattro; la barra scorre. */
  .tabbar.sette{display:flex; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  .tabbar.sette::-webkit-scrollbar{display:none;}
  .tabbar.sette button{flex:0 0 auto; padding:11px 13px; white-space:nowrap;}
  .pager{display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; transition:height .18s ease;}
  .pager::-webkit-scrollbar{display:none;}
  .pane{flex:0 0 100%; scroll-snap-align:start; align-self:flex-start; padding-bottom:4px;}
  .chart{width:100%; height:auto; display:block; overflow:visible;}
  .chart .lin{fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round;}
  .chart .pt{stroke:var(--card); stroke-width:2;}
  .chart .zero{stroke:var(--baseline,#c3c2b7); stroke-width:1;}
  .chart .band{opacity:.15;}
  .chart text{font-size:9px; fill:var(--grigio); font-family:inherit;}
  .chart text.val{font-size:10px; font-weight:700; fill:var(--testo);}
  .smgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .smbox{border:1px solid var(--bordo); border-radius:11px; padding:8px 6px 4px 6px;}
  .smbox .t{font-size:11px; color:var(--grigio); font-weight:700; text-transform:uppercase;
    letter-spacing:.02em; margin:0 0 2px 4px;}
  .rngrow{display:grid; grid-template-columns:70px 1fr 62px; align-items:center; gap:8px; margin-bottom:8px;}
  .rngrow .l{font-size:12px; color:var(--grigio);}
  .rngtrack{position:relative; height:16px;}
  .rngline{position:absolute; top:7px; height:3px; border-radius:2px; background:var(--dv-track);}
  .rngspan{position:absolute; top:6px; height:5px; border-radius:3px; background:var(--dv-blue); opacity:.35;}
  .rngdot{position:absolute; top:3px; width:10px; height:10px; border-radius:50%;
    background:var(--dv-blue); border:2px solid var(--card); margin-left:-5px;}
  .rngrow .n{font-size:11.5px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums;}
  .metodo{font-size:12px; line-height:1.55; color:var(--grigio);}
  .metodo b{color:var(--testo);}
  .syncline{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:11px 12px;
    border-radius:12px; background:#eef2f0; margin-bottom:14px; line-height:1.4; cursor:pointer;}
  .syncline .pallino{width:9px; height:9px; border-radius:50%; flex:none;}
  .syncline .frecc{margin-left:auto; color:var(--grigio); font-size:16px; flex:none;}
  .metodo code{font-size:11px; background:#eef2f0; padding:1px 4px; border-radius:4px;}

  /* ---- griglia a nove settori ---- */
  .esitowrap{margin:10px 0 4px 0;}
  /* ═══ v12 — componenti del handoff di design ═══════════════════════════ */
  /* KPI a celle contigue: gap 1px su sfondo bordo, cosi' le divisorie sono il gap */
  .kpin{display:grid; gap:1px; background:var(--bordo); border:1px solid var(--bordo);
    border-radius:14px; overflow:hidden; margin-bottom:16px;}
  .kpin.tre{grid-template-columns:repeat(3,1fr);}
  .kpin.quattro{grid-template-columns:repeat(4,1fr);}
  .kpin .c{background:var(--card); padding:12px 8px; text-align:center;}
  .kpin .lab{font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--grigio); margin-bottom:3px;}
  .kpin .v{font-size:19px; font-weight:700; letter-spacing:-0.01em; font-variant-numeric:tabular-nums;}
  .kpin.quattro .v{font-size:17px;}
  .kpin .sub{font-size:10.5px; color:var(--grigio); margin-top:2px;}
  /* card hero */
  .hero{background:var(--card); border:1px solid var(--bordo); border-radius:14px; padding:18px; margin-bottom:10px;}
  .hero .lab{font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--grigio);}
  .hero .riga{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-top:8px;}
  .hero .big{font-size:40px; font-weight:700; line-height:1; letter-spacing:-0.03em; font-variant-numeric:tabular-nums;}
  .hero .sub{font-size:12px; color:var(--grigio); margin-top:6px;}
  /* striscia filtri */
  .filtri{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin-bottom:10px; padding-bottom:2px;}
  .filtri::-webkit-scrollbar{display:none;}
  .filtro{display:flex; align-items:center; gap:5px; padding:7px 11px; border:1px solid var(--bordo);
    border-radius:9px; background:var(--surf-bar); flex:0 0 auto; font-family:inherit; color:var(--testo);}
  .filtro .fl{font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--grigio);}
  .filtro .fv{font-size:12px; font-weight:600;}
  .filtro .fc{font-size:9px; color:var(--grigio);}
  /* pannello */
  .pnl{background:var(--card); border:1px solid var(--bordo); border-radius:14px; padding:18px 16px; margin-bottom:12px;}
  .pnl > .t{font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--grigio);}
  .pnl .vd{font-size:15px; font-weight:600; line-height:1.4; letter-spacing:-0.01em; margin-top:10px;}
  .pnl .nt{font-size:11.5px; color:var(--grigio); line-height:1.5; margin-top:6px;}
  .pnl .ch{font-size:11px; color:var(--grigio); line-height:1.5; margin-top:12px; padding-top:10px; border-top:1px solid var(--sep);}
  .tgl{background:none; border:none; font-family:inherit; font-size:12px; font-weight:600;
    color:var(--link); padding:8px 0 2px 0; cursor:pointer; display:block;}
  /* scorecard */
  .scrow{display:flex; gap:3px; margin-bottom:4px;}
  .sccell{flex:1; min-width:0; padding:6px 0 5px 0; border-radius:7px; text-align:center;}
  .sccell .b{font-size:8px; opacity:.7; display:block;}
  .sccell .c{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums;}
  .sctot{width:36px; flex-shrink:0; padding:6px 0 5px 0; border-radius:7px; text-align:center;
    background:var(--surf-bar); color:var(--testo); overflow:hidden;}
  /* senza display:block "out" e il totale finivano sulla stessa riga e la cella
     sfondava di 13 px: e' il difetto che la prova sugli sfondamenti ora prende. */
  .sctot .b{font-size:8px; opacity:.7; display:block;}
  .sctot .c{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums;}
  /* griglia dei nove settori, in lettura */
  .setgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:4px;}
  .setcell{padding:11px 4px; border-radius:9px; text-align:center;}
  .setcell .p{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums;}
  .setcell .l{font-size:8.5px; opacity:.75; display:block; margin-top:1px;}
  /* dot plot dei bastoni */
  .dotrow{display:grid; grid-template-columns:56px 1fr 52px; align-items:center; gap:8px; margin-bottom:9px;}
  .dotrow .l{font-size:11px; color:var(--grigio); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dottrack{position:relative; height:12px;}
  .dotrow .n{font-size:11.5px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums;}
  /* heatmap */
  .heatrow{display:grid; grid-template-columns:80px 1fr; align-items:center; gap:8px; margin-bottom:4px;}
  .heatrow .l{font-size:10.5px; color:var(--grigio); white-space:nowrap;}
  .heatcells{display:flex; gap:2px;}
  /* bullet */
  .bulrow{margin-bottom:12px;}
  .bultrack{position:relative; height:8px; background:var(--dv-track); border-radius:4px; margin-top:5px;}
  /* calendario */
  .calrow{display:flex; gap:4px;}
  .calcell{flex:1; padding:9px 4px; border-radius:9px; text-align:center;}
  .calcell .m{font-size:9px; opacity:.8;}
  .calcell .v{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums;}
  .calcell .s{font-size:8.5px; opacity:.8;}
  /* consigli numerati */
  .advrow{display:flex; gap:10px; padding:11px 0; border-top:1px solid var(--sep);}
  .advrow:first-child{border-top:none;}
  .advrow .num{font-size:11px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--verde-testo); width:14px; flex-shrink:0;}
  .advrow .tt{font-size:13.5px; font-weight:600;}
  .advrow .bd{font-size:12px; color:var(--grigio); line-height:1.5; margin-top:3px;}
  /* barre di copertura */
  .covrow{padding:11px 0; border-top:1px solid var(--sep);}
  .covrow:first-child{border-top:none;}
  .covtrack{height:6px; background:var(--dv-track); border-radius:3px; margin-top:6px; overflow:hidden;}
  /* colonne per buca */
  .holecols{display:flex; gap:2px; height:104px; align-items:stretch;}
  .holecol{flex:1; position:relative;}
  /* legenda a quadratini */
  .leg2{display:flex; flex-wrap:wrap; gap:12px; margin-top:8px;}
  .leg2 .it{display:flex; align-items:center; gap:5px; font-size:10px; color:var(--grigio);}
  .leg2 .sw{width:9px; height:9px; border-radius:2px; display:inline-block;}
  /* riga valori sotto un grafico al tocco */
  .grafrow{display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:8px; padding-top:8px; border-top:1px solid var(--sep);}
  .grafrow .gl{font-size:11.5px; color:var(--grigio);}
  .grafrow .gv{font-size:14px; font-weight:700; font-variant-numeric:tabular-nums;}
  .esitogrid{display:grid; grid-template-columns:repeat(3,1fr); gap:5px; max-width:250px; margin:0 auto;}
  .esitocell{aspect-ratio:1.35/1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:10px; background:#eef2f0; border:1.5px solid transparent; font-size:10.5px;
    color:var(--grigio); font-weight:600; line-height:1.15; text-align:center; padding:2px;}
  .esitocell.selected{background:var(--verde); color:#fff; border-color:var(--verde);}
  .esitocell.centro{background:#dbe9e1; color:var(--verde-testo);}
  .esitocell.centro.selected{background:var(--verde); color:#fff;}
  .esitocell .fl{font-size:15px; line-height:1;}
  .esitolab{display:flex; justify-content:space-between; max-width:250px; margin:5px auto 0 auto;
    font-size:10px; color:var(--grigio);}
  .esitobadge{display:inline-block; font-size:10px; font-weight:700; padding:2px 6px; border-radius:6px;
    background:#e9efec; color:var(--verde-testo); margin-left:6px; vertical-align:1px;}

  /* ---- avvisi di plausibilita ---- */
  .avvisi{margin:10px 0;}
  .avviso{display:flex; gap:9px; align-items:flex-start; font-size:12.5px; line-height:1.45;
    padding:10px 12px; border-radius:11px; margin-bottom:7px; background:#fdf7e3; color:var(--ambra);
    border:1px solid #f0e2b0;}
  .avviso.bloccante{background:#fbeceb; color:var(--rosso); border-color:#f0c8c4;}
  .avviso b{color:inherit;}
  .avviso .ic{flex:none; font-weight:800; font-size:13px; line-height:1.35;}
  @media (prefers-color-scheme: dark){
    .avviso{background:#33301c; border-color:#4d472a;}
    .avviso.bloccante{background:#3a1f1d; border-color:#5a2f2c;}
  }

  /* ---- schermata putting ---- */
  .puttbar{display:flex; align-items:center; gap:10px; background:#e2efe8; border-radius:12px;
    padding:11px 13px; margin-bottom:12px; font-size:13px;}
  .puttbar .big{font-size:22px; font-weight:800; color:var(--verde-testo); line-height:1;}
  .puttbar .lab{font-size:11px; color:var(--grigio); text-transform:uppercase; letter-spacing:.04em;}
  .distchips{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px;}
  .distchips .chip{padding:11px 2px; font-size:13.5px;}
  .puttflag{font-size:12px; color:var(--verde-testo); font-weight:700; background:#e2efe8;
    border-radius:9px; padding:8px 11px; margin-bottom:10px;}
  @media (prefers-color-scheme: dark){
    .puttbar{background:#1e2f26;} .puttflag{background:#1e2f26;} .shot.putt{background:#1e2b23;}
    .esitocell{background:var(--surf2);} .esitocell.centro{background:var(--wash); color:var(--verde-testo);}
  }
  @media (prefers-color-scheme: dark){
    input[type=text], input[type=date], input[type=number], input[type=password], select, textarea{
      background:var(--surf2); color:#fff; border-color:#3a3a37;}
    .chip{background:var(--surf2); color:#fff;}
    .btn.secondary{background:var(--wash); color:var(--verde-testo);}
    .btn.danger{background:#3a1f1d; color:#ff8a80;}
    .toggle2 button{background:#1a1a19; color:var(--verde-testo);}
    .badge{background:var(--wash); color:var(--verde-testo);}
    .badge.warn{background:#3a3218; color:#e0b53a;}
    .badge.bozza{background:#3a1f1d; color:#ff8a80;}
    .badge.ok{background:#16321f; color:#4ecf92;}
    .shot{background:var(--surf2);}
    .installtip{background:var(--surf2);}
    .syncline{background:var(--surf2);}
    .metodo code{background:var(--surf2);}
  }

  /* ── v8: layout generale e restituzione ───────────────────────── */
  main{padding-bottom:86px;}
  /* v12 — barra inferiore del handoff: quattro voci pari, icone SVG stroke 2px,
     etichetta 10.5/600, voce attiva in verde e inattive in grigio tenue. */
  .bottombar{flex:0 0 auto; z-index:30; display:grid; grid-template-columns:repeat(4,1fr);
    background:var(--surf-bar); border-top:1px solid var(--bordo);
    padding:9px 4px calc(26px + var(--safe-bottom)) 4px;}
  .bb{text-align:center; font-size:10.5px; font-weight:600; color:var(--tenue);
    padding:2px 0; border:none; background:transparent; font-family:inherit; line-height:1.3;}
  .bb .ic{display:block; margin:0 auto 3px auto; height:17px;}
  .bb .ic svg{display:block; margin:0 auto;}
  .bb.on{color:var(--verde-testo);}
  .fchip{display:inline-flex; align-items:center; gap:7px; border:1.5px solid var(--bordo);
    background:var(--card); color:var(--testo); border-radius:22px; padding:9px 13px;
    font-size:12.5px; font-weight:600; margin-bottom:10px; font-family:inherit; max-width:100%;}
  .fchip .pencil{color:var(--verde-testo); font-weight:800; white-space:nowrap;}
  .strip4{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px;}
  .s4{background:var(--card); border:1px solid var(--bordo); border-radius:11px; padding:8px 4px; text-align:center;}
  .s4 .lab{font-size:11px; color:var(--grigio); text-transform:uppercase; letter-spacing:.02em; margin-bottom:2px;}
  .s4 .v{font-size:17px; font-weight:800; color:var(--testo); line-height:1.1;}
  .s4 .d{font-size:11px; font-weight:700; margin-top:1px;}
  .s4 .d.up{color:var(--dv-good);} .s4 .d.dn{color:var(--rosso);} .s4 .d.eq{color:var(--grigio); font-weight:400;}
  .verd{font-size:15px; font-weight:700; line-height:1.4; margin-bottom:4px; color:var(--testo);}
  .verd .pm{font-weight:400; color:var(--grigio); font-size:12.5px;}
  .legg{font-size:11px; color:var(--grigio); margin-bottom:10px;}
  .legg b{color:var(--dv-blue); letter-spacing:1.5px; font-weight:700;}
  details.numeri{margin-top:10px;}
  details.numeri summary{font-size:12.5px; color:var(--verde-testo); font-weight:700; cursor:pointer;
    list-style:none; -webkit-user-select:none; user-select:none; padding:6px 0;}
  details.numeri summary::before{content:'\25B8\00a0';}
  details.numeri[open] summary::before{content:'\25BE\00a0';}
  table.stat td.n, table.stat th.n{font-variant-numeric:tabular-nums;}
  .kpi .delta{font-size:11px; font-weight:700; margin-top:3px;}
  .kpi .delta.up{color:var(--dv-good);} .kpi .delta.dn{color:var(--rosso);}
  .kpi .rif{font-size:11px; color:var(--grigio); margin-top:2px;}
  .syncquiet{font-size:11px; color:var(--grigio); text-align:center; padding:10px 4px 2px;}
  .callout{position:absolute; background:var(--testo); color:var(--card); font-size:11.5px; font-weight:600;
    padding:5px 9px; border-radius:8px; pointer-events:none; transform:translate(-50%,-130%); white-space:nowrap; z-index:5;}
  .chartwrap{position:relative;}
  @media (prefers-color-scheme: dark){ .card{box-shadow:none;} }

/* Definizione operativa di "Recupero": un test verificabile, non un aggettivo.
   Serve a stabilizzare l'unica categoria di lie che richiede un giudizio, e che

const LIE_AIUTO = {

};

/* ==========================================================
   ESITO DEL COLPO — griglia a nove settori
   ==========================================================
   La distanza dalla buca e' una grandezza RADIALE e non segnata: la differenza
   fra due raggi consecutivi misura l'avanzamento verso la buca, non la distanza
   percorsa dalla palla. Ogni palla che finisce oltre la bandiera o di lato veniva
   quindi registrata come piu' corta di quanto e'.
   Il settore, combinato col raggio gia' registrato, ricostruisce la posizione e
   permette di separare componente longitudinale e componente laterale.
   Convenzione: sl = segno longitudinale (-1 corto, 0 pin high, +1 lungo)
                sx = segno laterale      (-1 sinistra, 0 centro,  +1 destra)      */
const ESITI = [
  {k:'LS', sl:+1, sx:-1, n:'Lunga<br>sinistra'},  {k:'L', sl:+1, sx:0, n:'Lunga'},   {k:'LD', sl:+1, sx:+1, n:'Lunga<br>destra'},
  {k:'S',  sl:0,  sx:-1, n:'Sinistra'},           {k:'P', sl:0,  sx:0, n:'In linea'},{k:'D',  sl:0,  sx:+1, n:'Destra'},
  {k:'CS', sl:-1, sx:-1, n:'Corta<br>sinistra'},  {k:'C', sl:-1, sx:0, n:'Corta'},   {k:'CD', sl:-1, sx:+1, n:'Corta<br>destra'}
];
const ESITO_MAP = {}; ESITI.forEach(e=>ESITO_MAP[e.k]=e);
const ESITO_NOME = {LS:'lunga sinistra', L:'lunga', LD:'lunga destra', S:'sinistra', P:'in linea',
  D:'destra', CS:'corta sinistra', C:'corta', CD:'corta destra'};
/* v9 — la stessa griglia a nove caselle descrive anche la POSIZIONE DELLA BANDIERA
   sul green: stessa geometria, stessi segni, quindi lo short-side si calcola
   confrontando due chiavi dello stesso alfabeto. Cambia solo il vocabolario:
   "lunga" diventa "dietro", "corta" diventa "davanti".
   Arccos registra la posizione della bandiera ("Set the Pin"), come ShotLink e
   Golfmetrics; Shot Scope, 18Birdies e Clippd no. E' l'unico campo di raccolta in
   cui un prodotto commerciale era piu' ricco di questo archivio.               */
const PIN_ETI = {LS:'Dietro<br>sinistra', L:'Dietro', LD:'Dietro<br>destra',
  S:'Sinistra', P:'Centro', D:'Destra',
  CS:'Davanti<br>sinistra', C:'Davanti', CD:'Davanti<br>destra'};
const PIN_NOME = {LS:'dietro a sinistra', L:'dietro', LD:'dietro a destra',
  S:'a sinistra', P:'al centro', D:'a destra',
  CS:'davanti a sinistra', C:'davanti', CD:'davanti a destra'};
let PIN_APERTO = false;
/* Oltre questa distanza dalla buca il settore non si chiede: l'errore geometrico
   della vecchia formula e' di secondo ordine e trascurabile (un drive di 250 m
   che finisce 20 m fuori linea sbaglia di 2 metri). */
const ESITO_SOGLIA_M = 40;

/* v9 — SOGLIA DI RACCOLTA, distinta dalla soglia GEOMETRICA qui sopra.
   I 40 metri sono il limite entro cui la scomposizione a 45 gradi del raggio
   residuo produce componenti attendibili, e restano il solo limite usato da
   percorsaColpo. Ma erano tarati sul problema sbagliato per il PATTERN DI
   ERRORE: l'approccio che finisce a 45 m dalla buca e' il colpo che costa il
   punteggio, ed e' esattamente quello di cui non si sapeva se era corto, lungo
   o di lato. Per il golfista di medio handicap meno dell'8% degli swing produce
   oltre il 35% dei colpi persi (Broadie, Golfmetrics, Science and Golf V 2008):
   il sottoinsieme peggiore era l'unico senza direzione.
   Da qui la separazione: il settore si CHIEDE su ogni colpo giocato verso il
   green (partenza entro questa soglia, escluso il colpo dal tee dei par 4 e 5,
   che ha il proprio campo latoTee) e si USA geometricamente solo entro
   ESITO_SOGLIA_M. Usare il settore per la magnitudine oltre i 40 m peggiorerebbe
   le distanze per bastone, quindi non si fa.
   COSTO MISURATO, non stimato: su 14 giri di collaudo con 1.103 colpi la regola
   nuova aggiunge 8 richieste, cioe' 0,57 colpi per giro. Sono pochissimi colpi, e
   sono esattamente i peggiori: nel collaudo tutti approcci da 105-178 m finiti fra
   40 e 53 m dalla buca. Il rapporto fra valore e attrito e' quindi molto piu'
   favorevole di quanto sembrasse a priori. */
const ESITO_CHIEDI_M_DEFAULT = 200;
let _ESITO_CHIEDI_M = ESITO_CHIEDI_M_DEFAULT;
let _BASE_CORTO = false;

/* Un colpo e' "giocato verso il green" se parte entro la soglia di raccolta e non
   e' il colpo dal tee di un par 4/5. */
function colpoVersoGreen(c, i, par){
  if(!c || c.lie==='green') return false;
  if(i===0 && (par||4)>=4) return false;
  return (typeof c.distM==='number') && c.distM>0 && c.distM<=_ESITO_CHIEDI_M;
}
/* REGOLA UNICA di richiesta del settore, usata da tutti e quattro i punti
   dell'app che prima ne tenevano una copia: la scheda del colpo, il salvataggio
   della buca, i controlli di fine giro e la schermata Qualita' del dato.
   Quattro copie della stessa condizione erano quattro occasioni di divergere. */
function serveEsito(colpi, i, par){
  const c=colpi[i], nx=colpi[i+1];
  if(!c || !nx || c.penalita) return false;
  if(c.lie==='green') return true;                          // putt non imbucato
  if(nx.lie==='green') return true;                         // palla arrivata in green
  if(nx.distM>0 && nx.distM<=ESITO_SOGLIA_M) return true;   // regola storica
  return colpoVersoGreen(c, i, par) && nx.distM>0;          // v9: colpo verso il green
}
/* Regola storica, conservata per il confronto in Qualita' del dato: senza questo
   la copertura dei giri vecchi crollerebbe da sola e sembrerebbe un dato perso. */
function serveEsitoStorico(colpi, i){
  const c=colpi[i], nx=colpi[i+1];
  if(!c || !nx || c.penalita) return false;
  return c.lie==='green' || nx.lie==='green' || (nx.distM>0 && nx.distM<=ESITO_SOGLIA_M);
}

/* Decomposizione: dal settore e dal raggio residuo alle due componenti.
   Se il settore ha entrambi i segni non nulli, il raggio si ripartisce sulle
   due direzioni; e' un'approssimazione a 45 gradi, sufficiente per la dispersione. */
function scomponiEsito(kEsito, raggio){
  const e = ESITO_MAP[kEsito];
  if(!e || !(raggio>0)) return null;
  const diag = (e.sl!==0 && e.sx!==0);
  const q = diag ? raggio/Math.SQRT2 : raggio;
  return {lungo: e.sl*q, lato: e.sx*q};
}

const TOUR_PUTT = {1:1.001,2:1.01,3:1.05,4:1.14,5:1.24,6:1.34,7:1.43,8:1.50,9:1.56,10:1.61,
  15:1.78,20:1.87,30:1.98,40:2.06,50:2.14,60:2.21,90:2.36};
const SCRATCH_MAKE = {1:0.99,1.5:0.98,4.5:0.76,7.5:0.49,10.5:0.34,15:0.19,21:0.12,27:0.07,
  35:0.04,50:0.02,60:0.015,90:0.01};
const K_SCRATCH = 1.1478;

function interp(table, x){
  const keys = Object.keys(table).map(Number).sort((a,b)=>a-b);
  if(x <= keys[0]) return table[keys[0]];
  if(x >= keys[keys.length-1]) return table[keys[keys.length-1]];
  for(let i=0;i<keys.length-1;i++){
    if(x >= keys[i] && x <= keys[i+1]){
      const t=(x-keys[i])/(keys[i+1]-keys[i]);
      return table[keys[i]] + t*(table[keys[i+1]]-table[keys[i]]);
    }
  }
  return table[keys[keys.length-1]];
}
function scratchPutt(ft){
  if(ft<=0) return 0;
  const p3 = ft<=14 ? 0 : 0.00636*(ft-14);
  return Math.max(1.0, 2 - interp(SCRATCH_MAKE, ft) + p3);
}
function longExtrap(tbl, yd){
  if(yd>=10) return interp(tbl, yd);
  return 2.0 + (tbl[10]-2.0)*(yd/10);
}

/* ══ v9 — BASELINE DEL GIOCO CORTO SOTTO LE 10 YARD ═══════════════════════
   Broadie non pubblica colpi attesi sotto le 10 yard fuori dal green, e nessuna
   altra fonte lo fa: verificato. Fino alla v8 quella zona era coperta da
   longExtrap, una RETTA fra 2,00 colpi a distanza zero e il valore pubblicato a
   10 yd. I due estremi sono difendibili; la retta in mezzo no, perche' la curva
   vera e' concava — il leave cresce con la distanza del chip molto meno che in
   proporzione ai colpi attesi.
   Ricostruzione: un chip da distanza d lascia un leave proporzionale, leave = k*d,
   e da li' si putta. Quindi   attesi(d) = 1 + puttAttesiTour(k*d).
   Due vincoli, uno per estremo:
     - a d -> 0 il valore tende a 2,00 (un colpo piu' un putt): stesso limite di prima;
     - a d = 10 yd riproduce ESATTAMENTE il dato pubblicato, perche' k e' calibrato
       proprio la' invertendo la tabella dei putt attesi del Tour.
   k risultante: fairway 14,7% della distanza (leave 4,40 ft a 10 yd), rough 20,0%
   (6,00 ft), sabbia 23,3% (7,00 ft).
   LIMITE DICHIARATO: vale solo sotto le 10 yard. Esteso a 20 e 30 yd sovrastima
   fra 0,09 e 0,22 colpi contro il dato pubblicato — ed e' esattamente il motivo
   per cui e' confinato dove nessun dato esiste. Il RECUPERO e' escluso: 3,45 colpi
   attesi a 10 yd non sono compatibili con "un colpo piu' i putt", perche'
   descrivono un colpo che spesso non raggiunge il green.
   L'interruttore e' SPENTO per difetto: accendendolo cambia la ripartizione fra
   approcci e gioco corto, e quella e' una decisione da prendere guardando i numeri,
   non un aggiornamento da subire. Il pannello in Impostazioni li mostra.
   Proprieta' verificata in collaudo: il TOTALE dello strokes gained del giro non
   cambia (la somma e' telescopica), cambiano solo le quote di categoria. Cambia
   anche l'approccio, non solo il gioco corto, perche' lo SG guarda anche il punto
   di ARRIVO e un approccio che finisce appena fuori dal green atterra dentro la
   zona ricostruita.                                                            */
function invPuttTour(target){
  let lo=0, hi=90;
  for(let i=0;i<60;i++){ const m=(lo+hi)/2; if(interp(TOUR_PUTT,m)<target) lo=m; else hi=m; }
  return (lo+hi)/2;                      // piedi
}
const CORTO_K={};
['fairway','rough','sabbia'].forEach(l=>{
  const a10=TOUR_LONG[l][10];            // colpi attesi a 10 yd: dato pubblicato
  CORTO_K[l]= invPuttTour(a10-1)/30;     // 10 yd = 30 ft, quindi frazione della distanza
});
function attesiCortoTour(lie, yd){
  const k=CORTO_K[lie];
  if(k===undefined || !(yd>0)) return null;
  return 1 + interp(TOUR_PUTT, k*yd*3);  // yd -> ft
}
function colpiAttesi(lie, distM, baseline){
  if(distM<=0) return 0;
  if(lie==='green'){
    const ft = distM*M_TO_FT;
    return baseline==='scratch' ? scratchPutt(ft) : interp(TOUR_PUTT, ft);
  }
  const yd = distM*M_TO_YD;
  let tbl;
  if(lie==='tee') tbl = yd>=100 ? TOUR_LONG.tee : TOUR_LONG.fairway;
  else tbl = TOUR_LONG[lie] || TOUR_LONG.fairway;
  // v9: sotto le 10 yard, se l'interruttore e' acceso, la ricostruzione prende il
  // posto della retta. Spento per difetto: i numeri restano quelli della v8.
  const ric = (_BASE_CORTO && yd<10 && lie!=='tee') ? attesiCortoTour(lie, yd) : null;
  const tour = (ric!==null) ? ric : longExtrap(tbl, yd);
  return baseline==='scratch' ? 2 + K_SCRATCH*(tour-2) : tour;
}
function categoriaColpo(lie, distM, par){
  if(lie==='green') return 'putting';
  if(lie==='tee' && par>=4) return 'tee';
  if(distM*M_TO_YD <= 30) return 'corto';
  return 'approccio';
}

/* ==========================================================
   STORAGE
   ==========================================================
   Archiviazione a strati:
   1. memoria      — tutte le viste leggono da qui, in modo sincrono
   2. localStorage — scrittura immediata, sopravvive alla chiusura dell'app
   3. IndexedDB    — copia piu' capiente e resistente, scritta con 400 ms di ritardo
   4. snapshot     — le ultime 8 versioni complete dell'archivio
   Nessuno di questi strati protegge dalla perdita del telefono: per quello
   serve il backup su file (scheda "Backup e ripristino"). */
const SCHEMA_VERSION = 9;
const CHIAVI = ['hcp_archivio_v3','hcp_bastoni_v2','hcp_giri','hcp_giri_archiviati','hcp_bozza_v3',
  'hcp_meta','hcp_impostazioni','hcp_sync','hcp_giri_cancellati','hcp_sessioni'];
let _mem = {}, _idb = null, _idbTimer = null, _idbPending = {};

const IMPOSTAZIONI_DEFAULT = {
  misura:'bandiera',        // bandiera | centro | misto
  slope:'compensato',       // compensato | reale — il telemetro corregge il dislivello?
  tipoDefault:'Gara Federale',
  controlli:true,           // avvisi di plausibilita' attivi
  esitoAttivo:true,         // griglia a nove settori attiva
  annotatoDefault:true,     // ultimo valore scelto per "carta annotata in campo"
  esitoChiediM:200,         // v9: soglia di RACCOLTA del settore (colpi verso il green)
  baseCorto:false           // v9: baseline ricostruita del gioco corto sotto le 10 yd
};

function idbOpen(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error('IndexedDB non disponibile'));
    const rq = indexedDB.open('hcpstat', 1);
    rq.onupgradeneeded = ()=>{ const db=rq.result; if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); };
    rq.onsuccess = ()=>res(rq.result);
    rq.onerror = ()=>rej(rq.error);
  });
}
function idbGet(db,k){
  return new Promise(res=>{ try{ const r=db.transaction('kv','readonly').objectStore('kv').get(k);
    r.onsuccess=()=>res(r.result); r.onerror=()=>res(undefined); }catch(e){ res(undefined); } });
}
function idbPut(db,k,v){
  return new Promise(res=>{ try{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k);
    t.oncomplete=()=>res(true); t.onerror=()=>res(false); }catch(e){ res(false); } });
}
function idbFlush(){
  if(!_idb) return;
  const da = _idbPending; _idbPending = {};
  Object.keys(da).forEach(k=>idbPut(_idb, k, da[k]));
}
const LS = {
  get(k,d){ return (k in _mem && _mem[k]!==undefined && _mem[k]!==null) ? _mem[k] : (k in _mem ? _mem[k] : d); },
  set(k,v){
    _mem[k]=v;
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ /* quota piena: resta IndexedDB */ }
    _idbPending[k]=v;
    clearTimeout(_idbTimer); _idbTimer=setTimeout(idbFlush, 400);
  }
};

async function snapshotSalva(etichetta){
  if(!_idb) return;
  try{
    const snaps = (await idbGet(_idb,'snapshots')) || [];
    snaps.push({ts:Date.now(), etichetta:etichetta||null, giri:_mem['hcp_giri']||[]});
    while(snaps.length>8) snaps.shift();
    await idbPut(_idb,'snapshots',snaps);
  }catch(e){}
}
async function snapshotElenco(){
  if(!_idb) return [];
  try{ return (await idbGet(_idb,'snapshots'))||[]; }catch(e){ return []; }
}

async function initStore(){
  // 1. localStorage
  CHIAVI.forEach(k=>{ try{ const v=localStorage.getItem(k); if(v!=null) _mem[k]=JSON.parse(v); }catch(e){} });
  // 2. IndexedDB: vince se contiene piu' giri (localStorage puo' essere stato sfoltito da iOS)
  try{
    _idb = await idbOpen();
    for(const k of CHIAVI){
      const v = await idbGet(_idb,k);
      if(v===undefined) continue;
      if(k==='hcp_giri'){
        const nLoc=(_mem[k]||[]).length, nIdb=(v||[]).length;
        if(nIdb>nLoc) _mem[k]=v;
      } else if(!(k in _mem)) _mem[k]=v;
    }
  }catch(e){ _idb=null; }
  // 3. valori di partenza
  if(!_mem['hcp_archivio_v3']) _mem['hcp_archivio_v3']=ARCHIVIO_DEFAULT;
  if(!_mem['hcp_bastoni_v2'])  _mem['hcp_bastoni_v2']=BASTONI_DEFAULT;
  if(!Array.isArray(_mem['hcp_giri'])) _mem['hcp_giri']=[];
  if(!_mem['hcp_impostazioni']) _mem['hcp_impostazioni']={};
  _mem['hcp_impostazioni'] = Object.assign({}, IMPOSTAZIONI_DEFAULT, _mem['hcp_impostazioni']);
  if(!Array.isArray(_mem['hcp_giri_cancellati'])) _mem['hcp_giri_cancellati']=[];
  if(!Array.isArray(_mem['hcp_sessioni'])) _mem['hcp_sessioni']=[];
  if(!_mem['hcp_sync'] || typeof _mem['hcp_sync']!=='object') _mem['hcp_sync']={};
  if(!_mem['hcp_sync'].giri || typeof _mem['hcp_sync'].giri!=='object') _mem['hcp_sync'].giri={};
  if(!_mem['hcp_sync'].repo) _mem['hcp_sync'].repo='golf-dati';
  const meta = _mem['hcp_meta'] || {schema:0, ultimoBackup:null, avvisoLegacy:0};
  if(!Array.isArray(_mem['hcp_giri_archiviati'])) _mem['hcp_giri_archiviati']=[];

  // 4. migrazioni di schema.
  // Regola ferrea: prima di toccare qualunque cosa si salva una copia completa,
  // e nessuna migrazione elimina dati — al massimo li mette da parte.
  if((meta.schema||0) < SCHEMA_VERSION && (_mem['hcp_giri']||[]).length){
    await snapshotSalva('prima dell’aggiornamento a v'+SCHEMA_VERSION);
  }
  if((meta.schema||0) < 4){
    const vecchi=_mem['hcp_giri'].filter(g=>!(g.buche && g.buche[0] && Array.isArray(g.buche[0].colpi)));
    if(vecchi.length){
      _mem['hcp_giri_archiviati']=_mem['hcp_giri_archiviati'].concat(vecchi);
      _mem['hcp_giri']=_mem['hcp_giri'].filter(g=>g.buche && g.buche[0] && Array.isArray(g.buche[0].colpi));
      meta.rimossiLegacy=(meta.rimossiLegacy||0)+vecchi.length;
    }
    meta.schema=4;
  }
  if((meta.schema||0) < 5){
    // archivio campi rifatto sulle carte ufficiali GES Golf (tutti i tee, CR e Slope)
    _mem['hcp_archivio_v3']=ARCHIVIO_DEFAULT;
    meta.archivioRifatto=1;
    meta.schema=5;
  }
  if((meta.schema||0) < 7){
    // v7 — riunisce le due migrazioni che in passato portavano tutte e due il numero 6:
    //   a) l'UNIONE dell'archivio campi con i 103 percorsi italiani (regola permanente 8)
    //   b) l'aggiunta puramente ADDITIVA dei campi dati introdotti dall'analisi
    // Erano state pubblicate su rami diversi con lo stesso numero di schema: un
    // dispositivo che aveva gia' ricevuto la prima saltava per sempre la seconda.
    // Portando il numero a 7 ripartono entrambe, e sono entrambe idempotenti.

    // a) archivio campi: si UNISCE, non si sostituisce. Un campo che esiste solo
    //    dentro questo telefono (arrivato da un backup, o aggiunto a mano) resta.
    const esistente = _mem['hcp_archivio_v3'] || {};
    const unito = {};
    Object.keys(ARCHIVIO_DEFAULT).forEach(k=>{ unito[k]=ARCHIVIO_DEFAULT[k]; });
    let conservati=0;
    Object.keys(esistente).forEach(k=>{ if(!(k in unito)){ unito[k]=esistente[k]; conservati++; } });
    _mem['hcp_archivio_v3']=unito;
    meta.campiTotali=Object.keys(unito).length;
    meta.campiConservati=conservati;

    // b) campi dati: nessun colpo esistente viene modificato, si riempiono i vuoti.
    //    Dove l'esito manca, le statistiche per bastone ricadono sulla vecchia
    //    formula e la schermata Qualita' del dato dice quanti giri sono.
    (_mem['hcp_giri']||[]).forEach(g=>{
      if(g.condizioni===undefined) g.condizioni=null;
      if(g.gara===undefined) g.gara=null;
      (g.buche||[]).forEach(b=>{
        if(b.completata===undefined) b.completata=true;
        (b.colpi||[]).forEach(c=>{
          if(c.esito===undefined) c.esito=null;
          if(c.penalita && c.penTipo===undefined) c.penTipo='altro';
        });
      });
    });
    meta.migrazioneV6=meta.migrazioneV6||Date.now();
    meta.migrazioneV7=Date.now();
    meta.schema=7;
  }
  if((meta.schema||0) < 8){
    // v8 — puramente additiva: due campi nuovi, nessun dato esistente modificato.
    //   annotato (giro): il giro e' stato compilato da una carta annotata in campo?
    //   latoTee (colpo dal tee dei par 4/5): sinistra / centro / destra, facoltativo.
    (_mem['hcp_giri']||[]).forEach(g=>{
      if(g.annotato===undefined) g.annotato=null;
      (g.buche||[]).forEach(b=>{
        const c0=(b.colpi||[])[0];
        if(c0 && c0.lie==='tee' && c0.latoTee===undefined) c0.latoTee=null;
      });
    });
    meta.migrazioneV8=Date.now();
    meta.schema=8;          // MAI la costante: portandola a 9, un dispositivo in
                            // arrivo da v7 avrebbe saltato per sempre il blocco v9.
                            // E' l'errore gia' commesso una volta col numero 6.
  }
  if((meta.schema||0) < 9){
    // v9 — puramente additiva: tre campi nuovi, nessun dato esistente modificato,
    // nessun colpo spostato, nessun valore ricalcolato.
    //   posizionePin (buca): dove era la bandiera sul green, griglia 3x3, facoltativa
    //   ostacolo (colpo di gioco corto): c'era qualcosa da superare? si / no
    //   lieCorto (colpo di gioco corto): pelato / normale / soffice
    (_mem['hcp_giri']||[]).forEach(g=>{
      (g.buche||[]).forEach(b=>{
        if(b.posizionePin===undefined) b.posizionePin=null;
        (b.colpi||[]).forEach(c=>{
          if(c.ostacolo===undefined) c.ostacolo=null;
          if(c.lieCorto===undefined) c.lieCorto=null;
        });
      });
    });
    meta.migrazioneV9=Date.now();
    meta.schema=9;
  }
  _mem['hcp_meta']=meta;
  // 5. riscrivi tutto su entrambi gli strati
  impCacheSync();
  CHIAVI.forEach(k=>{ if(k in _mem) LS.set(k,_mem[k]); });
  idbFlush();
  // 6. chiedi a iOS di non sfrattare i dati
  try{ if(navigator.storage && navigator.storage.persist){
    const gia = await navigator.storage.persisted();
    if(!gia) await navigator.storage.persist();
  } }catch(e){}
}

function IMP(){ return Object.assign({}, IMPOSTAZIONI_DEFAULT, LS.get('hcp_impostazioni',{})||{}); }
function IMPset(patch){ LS.set('hcp_impostazioni', Object.assign(IMP(), patch)); impCacheSync(); }
/* Le due impostazioni v9 vengono lette dentro cicli su decine di migliaia di
   colpi: si tengono in due variabili, sincronizzate all'avvio e a ogni scrittura,
   invece di ricostruire l'oggetto impostazioni a ogni chiamata. */
function impCacheSync(){
  const i=IMP();
  const v=i.esitoChiediM;
  _ESITO_CHIEDI_M = (typeof v==='number' && v>=ESITO_SOGLIA_M && v<=400) ? v : ESITO_CHIEDI_M_DEFAULT;
  _BASE_CORTO = !!i.baseCorto;
}

/* Le entita' HTML si compongono a runtime da codici carattere.

const _A = String.fromCharCode(38), _P = String.fromCharCode(59);

function esc(s){ return String(s===null||s===undefined?'':s).replace(/[&<>"']/g, c=>ENT[c]); }

function media(a){ return a.length ? a.reduce((s,x)=>s+x,0)/a.length : 0; }
function scartoTipo(a){
  if(a.length<2) return null;
  const m=media(a);
  return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1));
}
/* Giri necessari per distinguere una differenza delta fra due periodi,
   potenza 80%, alfa 0,05 bilaterale: n = 2*(1,96+0,8416)^2*sigma^2/delta^2 */
function giriNecessari(sigma, delta){
  if(!(sigma>0) || !(delta>0)) return null;
  return Math.ceil(15.6978 * sigma*sigma / (delta*delta));
}
/* ==========================================================
   DISTANZA PERCORSA — la correzione del difetto di misura
   ==========================================================
   Vecchia formula: distM(i) - distM(i+1). E' l'AVANZAMENTO verso la buca, non la
   distanza percorsa: la distanza dalla buca e' radiale e non segnata, quindi ogni
   palla che finisce oltre la bandiera o di lato risultava piu' corta di quanto e'.
   Nuova formula: se il colpo ha un settore di esito registrato, il raggio residuo
   viene scomposto e la componente longitudinale si SOMMA quando la palla e' lunga.
   Restituisce anche la componente laterale, che prima non esisteva.            */
function percorsaColpo(colpi, i){
  const c = colpi[i]; if(!c) return null;
  const nx = colpi[i+1] || null;
  const fine = nx ? nx.distM : 0;          // 0 = palla in buca
  if(c.lie==='green') return null;         // i putt non entrano nelle distanze per bastone
  if(!nx){                                 // colpo imbucato: percorso = distanza di partenza
    return {d:c.distM, lat:0, esatta:true};
  }
  /* v9: la scomposizione si applica solo entro la soglia GEOMETRICA. Il settore
     ora si raccoglie anche oltre — sui colpi verso il green che mancano di molto —
     ma a 60 m un'ipotesi di 45 gradi vale 42 m per componente: darebbe il segno
     giusto con una magnitudine inventata e PEGGIOREREBBE le distanze per bastone
     invece di migliorarle. Oltre la soglia il settore serve al pattern di errore,
     non alla misura. Su tutti i dati raccolti fino alla v8 questa guardia non
     cambia nulla: la' il settore esisteva solo entro i 40 m. */
  if(c.esito && fine<=ESITO_SOGLIA_M){
    const s = scomponiEsito(c.esito, fine);
    if(s) return {d:c.distM + s.lungo, lat:Math.abs(s.lato), esatta:true};
  }
  // Nessun settore. Oltre la soglia l'errore geometrico e' di secondo ordine e
  // trascurabile; sotto la soglia il valore e' l'avanzamento e va marcato come tale.
  const d = c.distM - fine;
  return {d:d, lat:null, esatta: fine > ESITO_SOGLIA_M};
}

/* ==========================================================
   CONTROLLI LOGICI SULL'INSERIMENTO
   ==========================================================
   Ventiquattro controlli. Nessuno rallenta il caso normale: gli avvisi compaiono solo
   quando qualcosa non torna, e si accettano con un tocco. I blocchi riguardano
   i soli casi impossibili.
   Livelli:  'blocco' = non si puo' salvare cosi'
             'avviso' = si puo' salvare confermando                            */

function statoBastoniPerControlli(){
  // Intervallo storico delle distanze percorse per bastone, dai giri salvati.
  // Serve ai test 12 e 13. Si usa solo da 5 colpi in su.
  const m={};
  LS.get('hcp_giri',[]).forEach(g=>(g.buche||[]).forEach(b=>{
    const colpi=b.colpi; if(!Array.isArray(colpi)) return;
    colpi.forEach((c,i)=>{
      if(!c.bastone || c.lie==='green') return;
      const p=percorsaColpo(colpi,i);
      if(!p || !(p.d>0)) return;
      (m[c.bastone]=m[c.bastone]||[]).push(p.d);
    });
  }));
  const out={};
  Object.keys(m).forEach(k=>{
    const d=m[k].slice().sort((a,b)=>a-b);
    if(d.length<5) return;
    const q=f=>d[Math.min(d.length-1, Math.floor(f*(d.length-1)))];
    out[k]={n:d.length, p10:q(0.10), p90:q(0.90), min:d[0], max:d[d.length-1], media:media(d)};
  });
  return out;
}
let _BAST_CACHE=null;
function bastCache(){ if(!_BAST_CACHE) _BAST_CACHE=statoBastoniPerControlli(); return _BAST_CACHE; }
function bastCacheReset(){ _BAST_CACHE=null; }

/* --- controlli sul singolo colpo che si sta per aggiungere --- */
function controlliColpo(o){
  // o = {lie, distM, bastone, buca, indiceColpo, colpi, par, distanzaBuca}
  const A=[], add=(liv,txt)=>A.push({liv:liv, txt:txt});
  const prec = o.colpi[o.colpi.length-1] || null;
  const primo = o.colpi.length===0;
  const putt  = o.lie==='green';

  // 1. lie scelto
  if(!o.lie){ add('blocco','Scegli dove si trova la palla.'); return A; }
  // 2. distanza valida
  if(o.distM===null || o.distM===undefined || isNaN(o.distM)){
    add('blocco','Inserisci la distanza dalla buca in metri.'); return A; }
  // 3. distanza zero
  if(o.distM<=0){
    add('blocco','La distanza deve essere maggiore di zero. Se la palla e’ in buca usa il pulsante "Palla in buca".');
    return A; }
  // 4. bastone scelto (sul green e’ automatico)
  if(!putt && !o.bastone){ add('blocco','Scegli il bastone.'); return A; }
  // 5. distanza fuori scala
  if(!putt && o.distM>700) add('blocco','Settecento metri da una buca non e’ una distanza possibile. Controlla il numero.');
  if(putt && o.distM>90) add('blocco','Novanta metri di putt non e’ una distanza possibile. Controlla il numero.');

  if(!IMP().controlli) return A.filter(x=>x.liv==='blocco');

  // 6. putt lunghissimo: probabile errore di unita’ (15 al posto di 1,5)
  if(putt && o.distM>25)
    add('avviso','Un putt da '+o.distM.toFixed(1)+' m e’ possibile ma raro. Se volevi scrivere '+(o.distM/10).toFixed(1)+' m, correggi ora: un putt imbucato da 15 m vale quasi un colpo intero di strokes gained in piu’ rispetto a uno da 1,5 m.');
  // 7. colpo pieno da distanza da putt
  if(!putt && o.distM<2 && o.lie!=='sabbia')
    add('avviso','Meno di due metri dalla buca fuori dal green. Se la palla e’ sul green scegli il lie "Green".');
  // 8. il primo colpo dovrebbe partire dal tee
  if(primo && o.lie!=='tee')
    add('avviso','Primo colpo della buca con lie "'+LIE_NOME[o.lie]+'" invece di "Tee". Se hai gia’ giocato un colpo che non hai registrato, aggiungilo prima.');
  // 9. primo colpo: distanza incoerente con la carta del campo
  if(primo && o.distanzaBuca && o.lie==='tee'){
    const sc = Math.abs(o.distM-o.distanzaBuca)/o.distanzaBuca;
    if(sc>0.25) add('avviso','La carta indica '+o.distanzaBuca+' m per questa buca e tu hai inserito '+o.distM+' m: '+Math.round(sc*100)+'% di scarto. Tee avanzato o bandiera molto diversa? Se e’ un errore, correggi.');
  }
  // 10. si riparte dal tee senza che il colpo precedente fosse OB
  if(!primo && o.lie==='tee' && !(prec && prec.penalita))
    add('avviso','Stai ripartendo dal tee senza aver segnato una penalita’ sul colpo precedente. Se era fuori limite o palla persa, torna indietro e segnala.');
  // 11. la palla si e’ allontanata dalla buca senza una ragione registrata
  if(prec && !putt && o.distM > prec.distM + 0.5 && !prec.penalita && prec.lie!=='green' && o.lie!=='recupero')
    add('avviso','La palla e’ piu’ lontana dalla buca di prima ('+prec.distM+' m poi '+o.distM+' m) senza penalita’ segnata. Succede da un colpo di recupero o dopo un drop: se e’ uno di quei casi va bene, altrimenti controlla.');
  // 11b. sul green la palla non si allontana quasi mai: e’ il modo tipico in cui
  //      un errore di virgola (15 al posto di 1,5) entra nell’archivio.
  if(putt && prec && prec.lie==='green' && o.distM > prec.distM && !prec.penalita)
    add('avviso','Questo putt parte da piu’ lontano ('+o.distM+' m) di quello precedente ('+prec.distM+' m). Su un green succede solo su forti pendenze. Se hai scritto '+o.distM+' al posto di '+(o.distM/10).toFixed(1)+', correggi ora.');
  // 12. bastone incoerente con la distanza da coprire
  if(!putt && o.bastone){
    const b=bastCache()[o.bastone];
    if(b && b.n>=5){
      if(o.distM > b.p90*1.6)
        add('avviso','Col '+o.bastone+' i tuoi colpi arrivano di norma fino a circa '+Math.round(b.p90)+' m, e qui ne mancano '+Math.round(o.distM)+'. Bastone giusto?');
      if(o.distM < b.p10*0.45 && o.lie!=='recupero' && o.lie!=='sabbia')
        add('avviso','Col '+o.bastone+' i tuoi colpi partono di norma da almeno '+Math.round(b.p10)+' m, e qui ne restano '+Math.round(o.distM)+'. Bastone giusto?');
    }
  }
  // 12b. distanza percorsa dal colpo PRECEDENTE, che si conosce solo adesso:
  //      il raggio appena inserito la determina. E’ il controllo che intercetta
  //      l’errore di virgola sugli approcci (15 al posto di 1,5 metri di residuo).
  if(prec && prec.bastone && prec.lie!=='green' && o.distM>0){
    const bb=bastCache()[prec.bastone];
    if(bb && bb.n>=8){
      const perc = prec.distM - o.distM;   // stima prudente, senza settore
      if(perc>0 && perc < bb.p10*0.45)
        add('avviso','Col '+prec.bastone+' il colpo precedente risulterebbe di soli '+Math.round(perc)+' m, contro un minimo abituale di circa '+Math.round(bb.p10)+'. O la distanza appena inserita e’ sbagliata, o quel colpo non e’ andato come al solito.');
      if(perc > bb.p90*1.45)
        add('avviso','Col '+prec.bastone+' il colpo precedente risulterebbe di '+Math.round(perc)+' m, contro un massimo abituale di circa '+Math.round(bb.p90)+'. Di norma significa che fra i due c’e’ un colpo che non hai registrato.');
    }
  }
  // 13. driver su un par 3
  if(o.par===3 && o.bastone==='Driver' && primo)
    add('avviso','Driver dal tee di un par 3. Se il par della buca e’ sbagliato, correggilo in cima alla schermata.');
  // 14. putter fuori dal green su distanza lunga
  if(!putt && o.bastone==='Putter' && o.distM>25)
    add('avviso','Putter a '+Math.round(o.distM)+' m dalla buca fuori dal green. Se la palla e’ sul green scegli il lie "Green".');
  // 15. troppi putt sulla stessa buca
  if(putt){
    const np=o.colpi.filter(c=>c.lie==='green').length;
    if(np>=5) add('avviso','Questo sarebbe il putt numero '+(np+1)+' su questa buca. Se hai inserito un putt di troppo, annulla l’ultimo colpo.');
  }
  // 16. buca fuori controllo
  if(o.colpi.length >= o.par+6)
    add('avviso','Sei al colpo '+(o.colpi.length+1)+' su un par '+o.par+'. Se stai ricostruendo la buca a memoria, controlla la sequenza.');
  return A;
}

/* --- controlli alla chiusura della buca --- */
function controlliBuca(b, colpi){
  const A=[], add=(liv,txt)=>A.push({liv:liv, txt:txt});
  if(!colpi.length){ add('blocco','Non hai registrato nessun colpo su questa buca.'); return A; }
  if(!IMP().controlli) return A;
  const pen=colpi.reduce((s,c)=>s+(c.penalita?1:0),0);
  const tot=colpi.length+pen;
  const np=colpi.filter(c=>c.lie==='green').length;
  const ultimo=colpi[colpi.length-1];
  // 17. risultato eccezionale: conferma esplicita
  if(tot===1) add('avviso','Buca in un colpo su un par '+b.par+'. Complimenti, ma confermalo: e’ il tipo di dato che vale la pena verificare.');
  else if(b.par>=5 && tot<=2) add('avviso','Due colpi su un par '+b.par+'. Confermi?');
  else if(tot >= b.par+6) add('avviso',tot+' colpi su un par '+b.par+'. Se e’ andata cosi’ va bene, ma controlla di non aver contato due volte.');
  // 18. imbucato da lontano fuori dal green
  if(ultimo && ultimo.lie!=='green' && ultimo.distM>50)
    add('avviso','Ultimo colpo imbucato da '+Math.round(ultimo.distM)+' m fuori dal green. Confermi?');
  if(np===0 && ultimo && ultimo.lie!=='green')
    add('avviso','Buca chiusa senza nessun putt: hai imbucato da fuori. Confermi?');
  return A;
}

/* --- controlli alla chiusura del giro, compresa la riconciliazione --- */
function controlliGiro(g){
  const A=[], add=(liv,txt)=>A.push({liv:liv, txt:txt});
  const nB=(g.buche||[]).length;
  const parTot=(g.buche||[]).reduce((s,b)=>s+(b.par||0),0);
  let score=0, colpiTot=0, conEsito=0, daEsito=0;
  (g.buche||[]).forEach(b=>{
    const c=b.colpi||[];
    score += c.length + c.reduce((s,x)=>s+(x.penalita?1:0),0);
    c.forEach((x,i)=>{
      colpiTot++;
      if(serveEsito(c, i, b.par)){ daEsito++; if(x.esito) conEsito++; }
    });
  });
  // 19. punteggio fuori da un intervallo plausibile
  if(score < parTot-8) add('avviso','Punteggio totale '+score+' su un par '+parTot+'. E’ un risultato eccezionale: confermalo prima di salvare.');
  if(score > parTot+40) add('avviso','Punteggio totale '+score+' su un par '+parTot+'. Se e’ corretto va bene, ma controlla che non ci siano colpi contati due volte.');
  // 20. buche non completate
  const incompl=(g.buche||[]).filter(b=>!(b.colpi||[]).length).length;
  if(incompl) add('avviso',incompl+' buche non hanno nessun colpo registrato. Entreranno nel giro come buche vuote.');
  // 21. copertura della griglia di esito
  if(IMP().esitoAttivo && daEsito>=6 && conEsito/daEsito < 0.5)
    add('avviso','Solo '+conEsito+' colpi su '+daEsito+' hanno il settore di esito. Le distanze per bastone di questo giro useranno in parte la vecchia formula, che sottostima.');
  // 22. condizioni non registrate
  if(!g.condizioni) add('avviso','Non hai registrato le condizioni del giro. Sono tre tocchi e servono a non confondere la forma col meteo quando confronterai i periodi.');
  // 23. AUTODIAGNOSI DEL MOTORE. Attenzione a cosa prova e cosa NON prova.
  //     L’identita’ "strokes gained + punteggio = giro atteso" e’ vera per
  //     costruzione su qualunque sequenza concatenata, perche’ la somma degli SG
  //     e’ telescopica: se togli un colpo dal mezzo, la catena si richiude e
  //     l’identita’ continua a valere. Quindi NON rileva i colpi dimenticati.
  //     Verifica il motore di calcolo, non la completezza dei dati.
  const R=riconcilia(g);
  if(R && !R.ok)
    add('avviso','Autodiagnosi del motore non superata: strokes gained ('+R.sg.toFixed(2)+') piu’ punteggio ('+R.score+') fa '+R.somma.toFixed(2)+', mentre il giro atteso e’ '+R.atteso.toFixed(2)+'. Scarto di '+R.scarto.toFixed(2)+' colpi. Non e’ un problema dei tuoi dati: e’ un difetto del calcolo, da segnalare.');
  // 24. INTEGRITA’ DELLA SEQUENZA — questo si’ intercetta i colpi mancanti.
  const I=controlloIntegrita(g);
  if(I.length)
    add('avviso',I.length+(I.length===1?' buca ha':' buche hanno')+' una sequenza sospetta: '+
      I.slice(0,3).map(x=>'buca '+x.buca+' ('+x.motivo+')').join('; ')+
      (I.length>3?' e altre':'')+'. Controlla che non manchi un colpo.');
  return A;
}

/* ==========================================================
   INTEGRITA’ DELLA SEQUENZA
   ==========================================================
   Il rilevatore vero dei colpi dimenticati. Non usa la riconciliazione — che e’
   un’identita’ e non puo’ accorgersi di niente — ma cerca discontinuita’ nella
   catena delle posizioni: salti di distanza che nessun bastone spiega, palle che
   si allontanano senza penalita’, buche con troppi colpi.                      */
const PERCORSA_MAX_M = 330;   // nessun bastone porta oltre, nemmeno in discesa col vento
function controlloIntegrita(g){
  const out=[];
  const B=bastCache();
  (g.buche||[]).forEach((b,bi)=>{
    const colpi=b.colpi||[]; if(!colpi.length) return;
    const motivi=[];
    colpi.forEach((c,i)=>{
      const nx=colpi[i+1];
      if(c.lie==='green') {
        if(nx && nx.lie==='green' && nx.distM > c.distM && !c.penalita)
          motivi.push('un putt si allontana dalla buca');
        return;
      }
      const p=percorsaColpo(colpi,i);
      if(!p || !(p.d>0)) return;
      if(p.d > PERCORSA_MAX_M) motivi.push('un colpo di '+Math.round(p.d)+' m');
      const bb=B[c.bastone];
      if(bb && bb.n>=8 && p.d > bb.p90*1.45)
        motivi.push(c.bastone+' da '+Math.round(p.d)+' m contro un massimo abituale di '+Math.round(bb.p90));
      if(nx && nx.distM > c.distM + 0.5 && !c.penalita && nx.lie!=='recupero' && c.lie!=='green')
        motivi.push('la palla si allontana senza penalita’');
    });
    const pen=colpi.reduce((s,c)=>s+(c.penalita?1:0),0);
    if(colpi.length+pen > b.par+7) motivi.push((colpi.length+pen)+' colpi su un par '+b.par);
    if(motivi.length) out.push({buca:bi+1, motivo:motivi[0], tutti:motivi});
  });
  return out;
}

/* Autodiagnosi del motore: somma degli SG + punteggio = giro atteso.
   E’ un’identita’ algebrica, quindi vale sempre se il calcolo e’ giusto.
   Serve a scoprire un difetto del motore, NON un colpo dimenticato. */
function riconcilia(g, baseline){
  baseline = baseline || 'tour';
  if(!(g.buche && g.buche[0] && Array.isArray(g.buche[0].colpi))) return null;
  let sg=0, score=0, atteso=0;
  for(const b of g.buche){
    const colpi=b.colpi||[]; if(!colpi.length) return null;
    const pen=colpi.reduce((s,c)=>s+(c.penalita?1:0),0);
    score += colpi.length+pen;
    atteso += colpiAttesi(colpi[0].lie, colpi[0].distM, baseline);
    colpi.forEach((c,i)=>{
      const nx=colpi[i+1]||null;
      const e0=colpiAttesi(c.lie,c.distM,baseline);
      const e1=nx?colpiAttesi(nx.lie,nx.distM,baseline):0;
      sg += e0-e1-1-(c.penalita?1:0);
    });
  }
  const somma=sg+score, scarto=Math.abs(somma-atteso);
  return {sg:sg, score:score, atteso:atteso, somma:somma, scarto:scarto, ok: scarto<0.01};
}

/* Rende un elenco di avvisi come blocco visivo, e restituisce true se si puo’ proseguire. */
function bloccoAvvisi(lista){
  if(!lista || !lista.length) return null;
  const w=el('<div class="avvisi"></div>');
  lista.forEach(a=>{
    w.appendChild(el('<div class="avviso'+(a.liv==='blocco'?' bloccante':'')+'"><span class="ic">'+
      (a.liv==='blocco'?'!':'?')+'</span><span>'+esc(a.txt)+'</span></div>'));
  });
  return w;
}
function haBlocchi(lista){ return (lista||[]).some(a=>a.liv==='blocco'); }
function testoConferma(lista){
  const av=(lista||[]).filter(a=>a.liv!=='blocco');
  if(!av.length) return null;
  return av.map((a,i)=>(av.length>1?(i+1)+'. ':'')+a.txt).join('\n\n')+'\n\nConfermi comunque?';
}
/* ==========================================================
   ANALISI GIRO
   ========================================================== */
function formatoCompleto(g){ return !!(g.buche && g.buche[0] && Array.isArray(g.buche[0].colpi)); }

function analizzaGiro(g, baseline){
  baseline = baseline || 'tour';
  if(!formatoCompleto(g)) return analizzaGiroLegacy(g);
  let score=0,par=0,putt=0,pen=0,gir=0,scrOpp=0,scrOk=0,attesoTot=0;
  const sgCat = {tee:0, approccio:0, corto:0, putting:0};
  const nCat  = {tee:0, approccio:0, corto:0, putting:0};
  const buche = g.buche.map((b,i)=>{
    const colpi = b.colpi||[];
    const penB = colpi.reduce((s,c)=>s+(c.penalita?1:0),0);
    const nPutt = colpi.filter(c=>c.lie==='green').length;
    const sc = colpi.length + penB;
    const perGreen = colpi.length - nPutt + penB;
    const girHit = colpi.length>0 && perGreen <= (b.par-2);
    let sgB = 0;
    if(colpi.length) attesoTot += colpiAttesi(colpi[0].lie, colpi[0].distM, baseline);
    const dettaglio = colpi.map((c,ci)=>{
      const next = colpi[ci+1] || null;
      const e0 = colpiAttesi(c.lie, c.distM, baseline);
      const e1 = next ? colpiAttesi(next.lie, next.distM, baseline) : 0;
      const sg = e0 - e1 - 1 - (c.penalita?1:0);
      const cat = categoriaColpo(c.lie, c.distM, b.par);
      sgCat[cat]+=sg; nCat[cat]++; sgB+=sg;
      return {...c, sg, cat, e0, e1};
    });
    score+=sc; par+=b.par; putt+=nPutt; pen+=penB;
    if(girHit){ gir++; } else { scrOpp++; if(sc<=b.par) scrOk++; }
    return {buca:i+1, par:b.par, distanza:b.distanza, score:sc, putt:nPutt, girHit,
            diff:sc-b.par, sg:sgB, colpi:dettaglio};
  });
  const sgTot = sgCat.tee+sgCat.approccio+sgCat.corto+sgCat.putting;
  return {...g, completo:true, calc:{score,par,putt,pen,gir,scrOpp,scrOk,nBuche:buche.length,
          sgCat, nCat, sgTot, atteso:attesoTot}, bucheCalc:buche};
}

// Giri registrati con la versione precedente dell'app: niente strokes gained
function analizzaGiroLegacy(g){
  let score=0,par=0,putt=0,corto=0,lunghi=0,pen=0,gir=0,scrOpp=0,scrOk=0;
  const buche=(g.buche||[]).map((b,i)=>{
    const p=(b.colpiLunghi||[]).filter(c=>c.penalita).length;
    const perGreen=(b.colpiLunghi||[]).length+(b.colpiCorto||0)+p;
    const sc=(b.totaleColpi!=null&&b.totaleColpi>0)?b.totaleColpi:(perGreen+(b.putt||0));
    const girHit=perGreen<=(b.par-2);
    score+=sc; par+=b.par; putt+=(b.putt||0); corto+=(b.colpiCorto||0);
    lunghi+=(b.colpiLunghi||[]).length; pen+=p;
    if(girHit) gir++; else { scrOpp++; if(sc<=b.par) scrOk++; }
    return {buca:i+1,par:b.par,score:sc,putt:(b.putt||0),girHit,diff:sc-b.par,sg:null,colpi:[]};
  });
  return {...g, completo:false, calc:{score,par,putt,pen,gir,scrOpp,scrOk,nBuche:buche.length,
          sgCat:null,nCat:null,sgTot:null,atteso:null}, bucheCalc:buche};
}

/* ==========================================================
   BASTONI — distanza percorsa e dispersione bidimensionale
   ==========================================================
   Usa percorsaColpo, che somma la componente longitudinale quando la palla e'
   lunga invece di sottrarla sempre. Separa i colpi con settore registrato (dato
   esatto) da quelli senza (avanzamento verso la buca, sottostimato). */
function statBastoni(giri){
  const m={};
  giri.forEach(g=>(g.buche||[]).forEach(b=>{
    const colpi = b.colpi || null;
    if(!colpi) return;
    colpi.forEach((c,ci)=>{
      const k=c.bastone; if(!k) return;
      if(!m[k]) m[k]={bastone:k,usi:0,dist:[],lat:[],esatti:0,stimati:0};
      m[k].usi++;
      if(c.lie==='green') return;
      const p=percorsaColpo(colpi,ci);
      if(!p || !(p.d>0)) return;
      m[k].dist.push(p.d);
      if(p.esatta) m[k].esatti++; else m[k].stimati++;
      if(p.lat!==null && p.lat!==undefined) m[k].lat.push(p.lat);
    });
  }));
  return Object.values(m).map(x=>{
    const d=x.dist.slice().sort((a,b)=>a-b);
    const q=f=> d.length? d[Math.min(d.length-1, Math.floor(f*(d.length-1)))] : null;
    const mu = d.length? media(d) : 0;
    const sd = d.length>=3 ? scartoTipo(d) : null;
    const latSd = x.lat.length>=5 ? scartoTipo(x.lat) : null;
    const latMed = x.lat.length>=5 ? media(x.lat) : null;
    const totMis = x.esatti+x.stimati;
    return {bastone:x.bastone, usi:x.usi, nMis:totMis,
      distMedia: d.length?Math.round(mu):null,
      disp: sd!==null?Math.round(sd):null,
      p10: d.length>=5?Math.round(q(0.10)):null, p90: d.length>=5?Math.round(q(0.90)):null,
      /* v10: la distanza DI LAVORO, non la media. Arccos usa il 70esimo percentile
         e lo chiama "Smart Distance": per SCEGLIERE il bastone la media e' il numero
         sbagliato, perche' la tirano giu' i colpi mal colpiti. */
      p70: d.length>=5?Math.round(q(0.70)):null,
      dMin: d.length?Math.round(d[0]):null, dMax: d.length?Math.round(d[d.length-1]):null,
      latMedia: latMed!==null?Math.round(latMed):null, latDisp: latSd!==null?Math.round(latSd):null,
      nLat: x.lat.length,
      esatti:x.esatti, stimati:x.stimati,
      copertura: totMis? x.esatti/totMis : 0};
  }).sort((a,b)=>b.usi-a.usi);
}

/* Distribuzione dei settori di esito: dove finiscono le palle, per bastone o in totale. */
function statEsiti(giri, filtroBastone){
  const c={}; ESITI.forEach(e=>c[e.k]=0);
  let tot=0;
  giri.forEach(g=>(g.buche||[]).forEach(b=>{
    (b.colpi||[]).forEach(x=>{
      if(!x.esito) return;
      if(filtroBastone && x.bastone!==filtroBastone) return;
      if(filtroBastone==='__putt__' && x.lie!=='green') return;
      c[x.esito]=(c[x.esito]||0)+1; tot++;
    });
  }));
  return {conte:c, tot:tot};
}
function statEsitiPutt(giri){
  const c={}; ESITI.forEach(e=>c[e.k]=0);
  let tot=0;
  giri.forEach(g=>(g.buche||[]).forEach(b=>{
    (b.colpi||[]).forEach(x=>{
      if(!x.esito || x.lie!=='green') return;
      c[x.esito]=(c[x.esito]||0)+1; tot++;
    });
  }));
  return {conte:c, tot:tot};
}

/* ==========================================================
   QUOTA DI VARIANZA — sostituisce il pannello "cosa cambia nei giri buoni"
   ==========================================================
   Quel pannello divideva i giri PER PUNTEGGIO e poi confrontava le categorie che
   compongono il punteggio: condizionamento sulla variabile dipendente. La differenza
   fra le due meta' e' identicamente uguale alla differenza dei punteggi, e si
   ripartisce secondo la varianza di ciascuna categoria, non secondo la sua
   importanza. Vinceva sempre la categoria piu' rumorosa, di norma il putting.
   Qui si calcola invece la quota di variabilita' del risultato che passa da ogni
   reparto: Cov(SG_categoria, SG_totale) / Var(SG_totale). Le quattro quote sommano
   a uno per identita' algebrica, e non promettono causalita'.                     */
function statQuotaVarianza(completi){
  const N=completi.length;
  if(N<6) return null;
  const cats=['tee','approccio','corto','putting'];
  const T=completi.map(g=>g.calc.sgTot);
  const mT=media(T);
  const varT=T.reduce((s,x)=>s+(x-mT)*(x-mT),0)/(N-1);
  if(!(varT>0)) return null;
  const out={};
  cats.forEach(c=>{
    const X=completi.map(g=>g.calc.sgCat[c]);
    const mX=media(X);
    let cov=0; for(let i=0;i<N;i++) cov+=(X[i]-mX)*(T[i]-mT);
    cov/=(N-1);
    out[c]={quota:cov/varT, sd:Math.sqrt(X.reduce((s,x)=>s+(x-mX)*(x-mX),0)/(N-1)), media:mX};
  });
  return {n:N, varT:varT, sdT:Math.sqrt(varT), quote:out, cats:cats};
}

/* Confronto per periodo: prima meta' dei giri contro seconda meta', diviso PER DATA.
   Il criterio di divisione non dipende dal risultato, quindi non c'e' artefatto. */
function statPeriodi(completi){
  if(completi.length<8) return null;
  const ord=completi.slice(); // gia' ordinati per data
  const k=Math.floor(ord.length/2);
  const A=ord.slice(0,k), B=ord.slice(ord.length-k);
  const cats=['tee','approccio','corto','putting'];
  const out={};
  cats.forEach(c=>{
    const a=A.map(g=>g.calc.sgCat[c]), b=B.map(g=>g.calc.sgCat[c]);
    const sdA=scartoTipo(a), sdB=scartoTipo(b);
    const sdPool=(sdA!==null&&sdB!==null)?Math.sqrt((sdA*sdA+sdB*sdB)/2):null;
    const se=sdPool!==null?sdPool*Math.sqrt(2/k):null;
    const d=media(b)-media(a);
    out[c]={prima:media(a), dopo:media(b), delta:d, se:se,
            leggibile: se!==null && Math.abs(d)>2*se,
            servono: sdPool!==null?giriNecessari(sdPool, Math.max(0.25,Math.abs(d))):null};
  });
  const at=A.map(g=>g.calc.sgTot), bt=B.map(g=>g.calc.sgTot);
  return {k:k, cats:cats, per:out, totPrima:media(at), totDopo:media(bt),
          daA:A[0]?A[0].data:null, aA:A[k-1]?A[k-1].data:null,
          daB:B[0]?B[0].data:null, aB:B[k-1]?B[k-1].data:null};
}

/* ==========================================================
   BUCHE — con contrazione verso la media generale
   ==========================================================
   Ordinare per media grezza e troncare in cima seleziona le buche piu' RUMOROSE,
   non le piu' difficili: con pochi giri, un doppio bogey isolato scala la classifica.
   La contrazione pesa la media della buca con la media generale, con peso crescente
   nel numero di osservazioni.                                                    */
function statPerBuca(A){
  const m={};
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    if(!m[b.buca]) m[b.buca]={buca:b.buca,par:b.par,vals:[]};
    m[b.buca].vals.push(b.diff);
  }));
  const tutte=Object.values(m);
  if(!tutte.length) return [];
  const tuttiVal=tutte.flatMap(x=>x.vals);
  const mGen=media(tuttiVal);
  const sdW=scartoTipo(tuttiVal)||1;             // variabilita' entro buca
  const medie=tutte.map(x=>media(x.vals));
  const sdB=scartoTipo(medie);                   // variabilita' fra buche
  // peso della contrazione: quante osservazioni "valgono" la media generale
  let k = (sdB && sdB>0.05) ? (sdW*sdW)/(sdB*sdB) : 40;
  if(!isFinite(k) || k<1) k=1; if(k>60) k=60;
  return tutte.map(x=>{
    const n=x.vals.length, mu=media(x.vals);
    const contr=(n*mu + k*mGen)/(n+k);
    const se=n>=2 ? (scartoTipo(x.vals)||sdW)/Math.sqrt(n) : sdW;
    return {...x, n:n, diffMedia:mu, contratta:contr, se:se, k:k, mGen:mGen};
  }).sort((a,b)=>b.contratta-a.contratta);
}

function statDaTee(completi){
  const m={};
  completi.forEach(g=>g.bucheCalc.forEach(b=>{
    if(b.par<4 || b.colpi.length<2 || b.colpi[0].lie!=='tee') return;
    const l=b.colpi[1].lie;
    if(!m[l]) m[l]={lie:l,n:0,sopraPar:0,gir:0,sg:0,vals:[]};
    m[l].n++; m[l].sopraPar+=b.diff; if(b.girHit)m[l].gir++; m[l].sg+=b.sg; m[l].vals.push(b.diff);
  }));
  return Object.values(m).map(x=>({...x, media:x.sopraPar/x.n, girPct:100*x.gir/x.n, sgB:x.sg/x.n,
    se:x.vals.length>=2?(scartoTipo(x.vals)||0)/Math.sqrt(x.vals.length):null}))
    .sort((a,b)=>b.n-a.n);
}
function statPerPar(A){
  const m={};
  A.forEach(g=>g.bucheCalc.forEach(b=>{
    if(!m[b.par]) m[b.par]={par:b.par,n:0,sopraPar:0,gir:0,putt:0,vals:[]};
    m[b.par].n++; m[b.par].sopraPar+=b.diff; if(b.girHit)m[b.par].gir++; m[b.par].putt+=b.putt;
    m[b.par].vals.push(b.diff);
  }));
  return Object.values(m).sort((a,b)=>a.par-b.par)
    .map(x=>({...x, media:x.sopraPar/x.n, girPct:100*x.gir/x.n, puttB:x.putt/x.n,
      se:x.vals.length>=2?(scartoTipo(x.vals)||0)/Math.sqrt(x.vals.length):null}));
}

/* Sei blocchi da tre buche. Due correzioni rispetto alla versione precedente:
   1. la metrica principale e' lo STROKES GAINED, non i colpi sopra il par: lo SG
      e' gia' corretto per la difficolta' della buca, i colpi sopra il par no, e
      confrontare blocchi non appaiati per par e stroke index mescola "quando nel
      giro" con "quali buche";
   2. il confronto fra il blocco migliore e il peggiore e' APPAIATO per giro, e la
      soglia del commento e' due errori standard calcolati sui dati, non una
      costante scritta nel codice. */
function statBlocchi(A){
  const perGiro=[];
  A.forEach(g=>{
    // solo giri completi da 18 buche: la metrica del pannello e' lo strokes gained,
    // che i giri di formato vecchio non hanno.
    if(!g.completo || g.calc.nBuche<18) return;
    const b=[0,1,2,3,4,5].map(()=>({n:0,sopraPar:0,gir:0,putt:0,sg:0,haSg:true}));
    g.bucheCalc.forEach(h=>{
      const k=Math.floor((h.buca-1)/3); if(k<0||k>5) return;
      b[k].n++; b[k].sopraPar+=h.diff; if(h.girHit)b[k].gir++; b[k].putt+=h.putt;
      if(h.sg!==null) b[k].sg+=h.sg; else b[k].haSg=false;
    });
    perGiro.push(b);
  });
  const nGiri=perGiro.length;
  if(!nGiri) return {nGiri:0, blocchi:[], confronto:null};
  const nomi=['1–3','4–6','7–9','10–12','13–15','16–18'];
  const blocchi=[0,1,2,3,4,5].map(i=>{
    const sgV=perGiro.map(x=>x[i].sg), parV=perGiro.map(x=>x[i].sopraPar);
    const n=perGiro.reduce((s,x)=>s+x[i].n,0);
    return {i:i, nome:nomi[i], n:n, nGiri:nGiri,
      sgGiro:media(sgV), sgSd:scartoTipo(sgV), sgSe:nGiri>=2?(scartoTipo(sgV)||0)/Math.sqrt(nGiri):null,
      parGiro:media(parV),
      girPct:100*perGiro.reduce((s,x)=>s+x[i].gir,0)/n,
      puttB:perGiro.reduce((s,x)=>s+x[i].putt,0)/n};
  });
  // confronto appaiato fra il blocco migliore e il peggiore, sullo SG
  const ord=blocchi.slice().sort((x,y)=>x.sgGiro-y.sgGiro);
  const peggio=ord[0], meglio=ord[ord.length-1];
  let confronto=null;
  if(nGiri>=3){
    const dif=perGiro.map(x=>x[meglio.i].sg - x[peggio.i].sg);
    const sd=scartoTipo(dif), se=sd!==null?sd/Math.sqrt(nGiri):null;
    const d=media(dif);
    confronto={peggio:peggio, meglio:meglio, delta:d, se:se,
      leggibile: se!==null && se>0 && Math.abs(d) > 2*se,
      servono: sd!==null?giriNecessari(sd, Math.max(0.3,Math.abs(d))):null};
  }
  return {nGiri:nGiri, blocchi:blocchi, confronto:confronto};
}

/* Prima nove contro seconda nove. Confronto APPAIATO: le due meta' sono osservate
   nello stesso giro, quindi correlate; la differenza per giro ha un errore standard
   piu' piccolo di quello che si otterrebbe trattandole come campioni indipendenti. */
function statNove(A){
  const dif=[], p1=[], p2=[];
  const t=[{nome:'Prima nove',n:0,sopraPar:0,gir:0,putt:0,sg:0},
           {nome:'Seconda nove',n:0,sopraPar:0,gir:0,putt:0,sg:0}];
  A.forEach(g=>{
    if(g.calc.nBuche<18) return;
    let a=0,b=0,na=0,nb=0;
